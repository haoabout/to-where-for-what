<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程</title>
<style>
/* ═══════════════════════════════════════════════ 设计令牌
   两套配色写在一处。light-dark() 按「已采用的 color-scheme」取值，
   于是「跟随系统 / 强制浅色 / 强制深色」三态只要改 color-scheme 一个属性，
   不用把整块令牌抄三遍（抄三遍的写法迟早会漏掉其中一处）。
   默认值仍由系统偏好决定 —— 即使 JS 没跑起来，配色也是对的，不会闪一下。 */
:root{
  color-scheme:light dark;

  --paper:light-dark(#faf8f4,#16130f);
  --paper-2:light-dark(#f2eee7,#1d1915);
  --card:light-dark(#fffefc,#211c17);
  /* --ink-3 承载了全站的 11.5–12.5px 小字（.hint/.facts/.sub/.caveat…）。
     原来浅色 #918879 在 --paper-2 上只有 3.03:1、深色 #877d6d 在 --card 上 4.17
     —— 最小的字配最低的对比，两个不利因素叠在一起。
     现在浅色三档 5.16/5.43/4.73，深色三档 5.23/4.77/4.93。 */
  --ink:light-dark(#1f1b16,#ece6dc);
  --ink-2:light-dark(#5c544a,#b3a999);
  --ink-3:light-dark(#726859,#918776);
  --line:light-dark(#e3ddd2,#332c24);
  --line-2:light-dark(#d0c8ba,#443b31);
  --accent:light-dark(#b5442a,#e0765a);
  --accent-soft:light-dark(#f6e7e2,#3a221c);
  --ok:light-dark(#2f6b4f,#7fbd9c);
  --ok-soft:light-dark(#e6f0ea,#1c2b23);
  --warn:light-dark(#9a6414,#d9a95c);
  --warn-soft:light-dark(#fbf0dc,#2e2617);
  --danger:light-dark(#a8322b,#e08079);
  --danger-soft:light-dark(#fae9e7,#33201e);
  --mute:light-dark(#8d8577,#7d7466);

  /* 填色控件上的前景。背景走令牌会跟着主题翻、前景写死 #fff 不会 ——
     深色下「想去」选中态曾经是白字压 #7fbd9c，2.17:1。凡是把某个语义色
     当背景用的地方，前景一律取这里对应的 --on-*。
     修好之后：--on-ok 8.52、--on-warn 8.62、--on-accent 6.09。 */
  --on-accent:light-dark(#fff,#16130f);
  --on-ok:light-dark(#fff,#16130f);
  --on-warn:light-dark(#fff,#16130f);
  --on-ink:var(--paper);
  /* --on-day 刻意不翻。日程色是一套两种主题通用的值（见 DAY_COLORS），
     底色两边一样，压在上面的字自然也该一样。 */
  --on-day:#fff;
  /* 住宿圆点。它没有「第几天」，所以用中性色和日程色区分开。
     地图上的那一枚不走这里 —— 它坐在底图上，跟着底图明暗翻（见 MAP_INK）。 */
  --lodging:light-dark(#4A4A4A,#8b8272);

  --serif:Georgia,"Songti SC","Hiragino Mincho ProN","Noto Serif CJK SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
  /* light-dark() 只接色值，接不了整条阴影，所以把两层的颜色各自拆成令牌 */
  --sh-1:light-dark(rgba(31,27,22,.05),rgba(0,0,0,.3));
  --sh-2:light-dark(rgba(31,27,22,.05),rgba(0,0,0,.25));
  --shadow:0 1px 2px var(--sh-1),0 4px 14px var(--sh-2);
}
/* 用户在右上角明确选了某一套时，只改 color-scheme —— 上面所有 light-dark()
   会一起跟过去，包括表单控件和滚动条这些浏览器自己画的部件。 */
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

/* 老浏览器的地板。自定义属性没法参与层叠回退 —— 它的值在解析期永远合法，
   要到 var() 取用时才失效，那时整套令牌会一起塌掉，页面变成没有样式的黑字白底。
   这比少一层毛玻璃严重得多，而这个页面是要发给同行的人的，浏览器不由我们决定。
   所以留一份浅色兜底；只有不支持 light-dark() 的浏览器会读到它，
   真漂移了也只是老浏览器上的颜色略旧，不影响功能。
   （light-dark() 的门槛：Chrome 123 / Safari 17.5 / Firefox 120。） */
@supports not (color: light-dark(#000,#fff)){
  :root{
    --paper:#faf8f4; --paper-2:#f2eee7; --card:#fffefc;
    --ink:#1f1b16; --ink-2:#5c544a; --ink-3:#726859;
    --line:#e3ddd2; --line-2:#d0c8ba;
    --accent:#b5442a; --accent-soft:#f6e7e2;
    --ok:#2f6b4f; --ok-soft:#e6f0ea;
    --warn:#9a6414; --warn-soft:#fbf0dc;
    --danger:#a8322b; --danger-soft:#fae9e7;
    --mute:#8d8577;
    --on-accent:#fff; --on-ok:#fff; --on-warn:#fff;
    --lodging:#4A4A4A;
    --sh-1:rgba(31,27,22,.05); --sh-2:rgba(31,27,22,.05);
  }
  .theme-btn{display:none}          /* 切了也没用，不如不给 */
}
*{box-sizing:border-box}
/* 任何显式 display 规则都会压过 [hidden] 的浏览器默认样式。
   .tabs{display:flex} 就让 standalone 模式下的 hidden 完全失效，
   页面仍显示着指向已删除视图的 tab。这一条必须放在所有布局规则之前。 */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:15px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* 「看起来不像按钮的按钮」。
   这些位置（景点名、清单条目、日程条目、日期标题、圆点）本来是 span/div 加
   cursor:pointer —— 视觉没问题，但键盘完全够不着：实测 47 个景点在地图视图里
   一个可聚焦元素都没有，也就没有任何键盘路径能把地点排进某一天。
   改成 <button> 是最小的修法：事件全部走 closest() 委托，一行 JS 都不用动。
   这条只负责把浏览器的按钮默认外观清干净，让它们长回原来的样子。 */
.bare{
  background:none;border:0;padding:0;margin:0;
  font:inherit;color:inherit;text-align:left;
  -webkit-appearance:none;appearance:none;
}

/* ═══════════════════════════════════════════════ 头部 */
.top{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{
  font:400 25px/1.2 var(--serif);margin:0;letter-spacing:.2px;
}
.brand .sub{color:var(--ink-3);font-size:13px}
.brand .sub b{color:var(--ink-2);font-weight:600}
.stale{
  background:var(--warn-soft);color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  padding:1px 8px;border-radius:20px;font-size:11.5px;
}

/* 主题开关。三态循环：跟随系统 → 浅色 → 深色 → 跟随系统。
   图标画的是「当前是哪一套」，可访问名同时说明按下去会变成什么 ——
   循环按钮最容易出的问题就是不说下一步。 */
.theme-btn{
  margin-left:auto;align-self:center;flex:none;
  width:32px;height:32px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:var(--ink-2);transition:.15s;
}
.theme-btn:hover{border-color:var(--line-2);color:var(--ink);background:var(--paper-2)}
/* 窄屏：副标题会折成两行，按 DOM 顺序排的话开关被挤到第三行，页头白白高一截
   （实测 375px 下 173 → 194px，占掉视口的 24%）。让开关跟标题同行、副标题
   整行下沉，页头反而比加开关之前还矮。 */
@media (max-width:640px){
  .brand{gap:8px 12px}
  .theme-btn{order:1}
  .brand .sub{order:2;flex-basis:100%}
}
.theme-btn svg{display:block}
/* 「跟随系统」用同一个圆的左右半边表示两套配色，不另画第三种符号 */
.theme-btn .half{fill:currentColor;stroke:none}

.tabs{display:flex;gap:2px;margin-top:12px;align-items:center}
.tab-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
/* 窄屏时这一组从标签栏挪到地图视图里（见 layoutMapActions）。
   留在标签栏的话，两个导出按钮会把三个标签挤成竖排断字：
   实测 375px 下「景点清单」断成两行、「地图」断成「地/图」，标签栏 68px 高。 */
.map-actions-slot:empty{display:none}
.map-actions-slot .tab-actions{margin-left:0;margin-bottom:12px}
.tab-actions .hint{font-size:11.5px;color:var(--ink-3)}
.btn.sm{padding:5px 11px;font-size:12.5px}
@media (max-width:760px){ .tab-actions .hint{display:none} }
.tab{
  background:none;border:0;border-bottom:2px solid transparent;white-space:nowrap;
  padding:9px 15px 11px;color:var(--ink-3);font-size:14px;font-weight:500;
  display:flex;align-items:center;gap:7px;transition:color .15s;
}
.tab:hover:not(:disabled){color:var(--ink-2)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab:disabled{color:var(--line-2);cursor:not-allowed}
.tab .n{
  font:600 10.5px/1 var(--mono);background:var(--paper-2);color:var(--ink-3);
  padding:3px 6px;border-radius:20px;border:1px solid var(--line);
}
.tab[aria-selected=true] .n{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ═══════════════════════════════════════════════ 进度 */

/* 视图①工具栏右侧的小计数。清单页是做选择的地方，实时看到四类各多少
   最有用；地图视图那边则直接挂在筛选按钮上。 */
.tally{display:flex;gap:11px;font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.tally span{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-yes{background:var(--ok)} .d-maybe{background:var(--warn)} .d-no{background:var(--line-2)} .d-none{background:var(--line-2);opacity:.45}

/* ═══════════════════════════════════════════════ 主体 */
main{max-width:1180px;margin:0 auto;padding:20px 20px 130px}
/* 地图视图是一屏工作台，不该滚。底部只需让开固定的操作栏，
   不需要清单视图那 130px（那是留给最后一张卡片的呼吸位）。 */
main.tight{padding-bottom:var(--ab-h,64px)}
.view[hidden]{display:none}

/* 工具栏 */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search{
  flex:1;min-width:190px;padding:8px 13px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);color:var(--ink);font-size:14px;
}
.search::placeholder{color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:8px 13px;font-size:13px;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--paper-2);color:var(--ink);font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:5px 12px;border-radius:20px;font-size:12.5px;transition:.15s;
}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{opacity:.55;font-size:11px;margin-left:3px}

/* 分组 */
.group{margin-bottom:34px}
.group-h{
  display:flex;align-items:baseline;gap:10px;
  padding-bottom:9px;margin-bottom:15px;border-bottom:1px solid var(--line);
}
.group-h h2{font:600 15px/1 var(--sans);margin:0;letter-spacing:.3px}
.group-h .meta{font-size:12px;color:var(--ink-3);margin-left:auto;font-family:var(--mono)}

/* ═══════════════════════════════════════════════ 卡片 */
.cards{display:grid;gap:13px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s,opacity .2s;
}
.card:hover{border-color:var(--line-2)}
.card[data-choice=no]{opacity:.5}
.card[data-choice=no]:hover{opacity:.82}
/* 选择状态由三态按钮和圆点表达，不再加彩色左边框：
   同一件事说三遍是冗余，而 3px 彩色侧边条又是最容易辨认的模板化特征。 */

.card-in{display:flex;gap:15px;padding:14px}
.thumb{
  width:112px;height:88px;flex:none;border-radius:7px;overflow:hidden;
  background:var(--paper-2);position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.empty::after{
  content:attr(data-ch);position:absolute;inset:0;display:grid;place-items:center;
  font:400 25px var(--serif);color:var(--line-2);
}
.body{flex:1;min-width:0}
.hd{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.nm{font:500 17px/1.35 var(--serif);cursor:pointer;letter-spacing:.2px;display:block}
.nm:hover{color:var(--accent)}
.loc{font-size:12.5px;color:var(--ink-3);align-self:center}
.tier{
  font:700 10.5px/1 var(--mono);padding:3.5px 6px;border-radius:4px;align-self:center;
  border:1px solid transparent;letter-spacing:.5px;
}
.t-S{background:var(--accent);color:var(--on-accent)} .t-A{background:var(--accent-soft);color:var(--accent)}
.t-B{background:var(--paper-2);color:var(--ink-2);border-color:var(--line)}
.t-C{background:transparent;color:var(--ink-3);border-color:var(--line)}
.stars{color:var(--accent);font-size:12px;letter-spacing:1px;align-self:center}
.stars i{color:var(--line-2);font-style:normal}

.pitch{color:var(--ink-2);font-size:13.5px;margin:6px 0 0}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-3)}
.facts span{display:flex;align-items:center;gap:4px;white-space:nowrap}

.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.flag{
  font-size:11.5px;padding:3px 9px;border-radius:5px;display:flex;align-items:center;gap:4px;
  border:1px solid transparent;
}
.f-danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 22%,transparent)}
.f-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.f-info{background:var(--paper-2);color:var(--ink-3);border-color:var(--line)}
.f-unverified{
  background:repeating-linear-gradient(-45deg,var(--warn-soft),var(--warn-soft) 5px,transparent 5px,transparent 10px);
  color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);font-weight:600;
}
/* 核实被拦截的景点：卡片内有完整的 .verify-box 说明，顶部筛选条还有
   「⚠ 待你确认」把它们一次性挑出来 —— 那比一条边框更好用，所以边框去掉。 */
.verify-box{
  margin-top:10px;padding:9px 12px;border-radius:7px;font-size:12.5px;line-height:1.6;
  background:var(--warn-soft);border:1px dashed color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink-2);
}
.verify-box b{color:var(--warn)}
.verify-box ul{margin:6px 0 0;padding-left:18px}
.verify-box li{margin:2px 0}

/* 三态 */
.pick{display:flex;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content}
.pick button{
  background:var(--card);border:0;border-right:1px solid var(--line);
  padding:6px 15px;font-size:12.5px;color:var(--ink-3);transition:.12s;
}
.pick button:last-child{border-right:0}
.pick button:hover{background:var(--paper-2);color:var(--ink-2)}
.pick button[aria-pressed=true]{font-weight:600}
.pick button.y[aria-pressed=true]{background:var(--ok);color:var(--on-ok)}
.pick button.m[aria-pressed=true]{background:var(--warn);color:var(--on-warn)}
.pick button.n[aria-pressed=true]{background:var(--ink-3);color:var(--paper)}
.why{font-size:12px;color:var(--ink-3);margin-top:7px;font-style:italic}

/* 折叠的打卡点 */
.spots{margin:11px 0 0;padding:9px 0 0;border-top:1px dashed var(--line);}
.spots-h{font-size:11.5px;color:var(--ink-3);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.spot{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;flex-wrap:wrap}
.spot .sn{cursor:pointer;font-weight:500}
.spot .sn:focus-visible{outline-offset:1px}
.spot .sn:hover{color:var(--accent)}
.spot .sd{color:var(--ink-3);font-size:11.5px}
.spot .pick{margin:0 0 0 auto;transform:scale(.88);transform-origin:right center}

/* ═══════════════════════════════════════════════ 底部操作条 */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-top:1px solid var(--line);
}
/* 本地服务下这一栏只是个状态行，不该占掉一条按钮那么高的地方。
   有按钮时（file://）自然被按钮撑开，没按钮时就是一行小字。 */
.actionbar-in{
  max-width:1180px;margin:0 auto;padding:5px 20px;min-height:30px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.actionbar-in .btn{padding:5px 13px;font-size:12.5px}
/* 状态文字占满剩余宽度，把折叠区和「手动保存…」一起推到最右。
   展开时按钮就落在同一行里，栏高不变——放在链接右边会换行，高度翻倍。 */
.actionbar-in .hint{margin-left:0;text-align:left;flex:1 1 auto}
.more-box{display:flex;gap:8px}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:500;transition:.15s;
}
.btn:hover{border-color:var(--line-2);background:var(--paper-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.87;background:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--ink-3);margin-left:auto;text-align:right;max-width:52ch}
/* 自动保存失败是用户唯一会丢数据的时刻，不能和普通说明长得一样 */
.hint.bad{color:var(--danger);font-weight:500}

/* ═══════════════════════════════════════════════ 弹窗 */
dialog{
  border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
  padding:0;max-width:660px;width:calc(100vw - 34px);max-height:86vh;box-shadow:0 24px 70px rgba(0,0,0,.28);
}
dialog::backdrop{background:rgba(20,16,12,.5);backdrop-filter:blur(3px)}
.dlg-h{
  position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
  padding:17px 20px 13px;display:flex;align-items:flex-start;gap:12px;z-index:2;
}
.dlg-h h3{font:500 21px/1.3 var(--serif);margin:0;flex:1}
.dlg-h .x{
  background:none;border:0;font-size:22px;color:var(--ink-3);line-height:1;border-radius:6px;
  width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;
}
.dlg-h .x:hover{background:var(--paper-2);color:var(--ink)}
.dlg-b{padding:17px 20px 22px;overflow-y:auto}
.dlg-b h4{font:600 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);margin:20px 0 8px}
.dlg-b h4:first-child{margin-top:0}
.dlg-b p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.dlg-img{width:100%;border-radius:9px;margin-bottom:14px;display:block}
.credit{font-size:11px;color:var(--ink-3);margin:-9px 0 15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 15px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink-2)}
.srcs{list-style:none;padding:0;margin:0;font-size:13.5px}
.srcs li{margin-bottom:5px}
.srcs a{word-break:break-all}

.reasons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.reasons button{
  border:1px solid var(--line);background:var(--card);padding:6px 13px;
  border-radius:20px;font-size:13px;color:var(--ink-2);
}
.reasons button:hover,.reasons button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  color:var(--ink);padding:9px 11px;font:14px var(--sans);resize:vertical;min-height:66px;
}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap;align-items:center}
/* 排程按钮推到左边：它和右边那组「想去/待定/不想去」是两件事 */
.btn.sched{margin-right:auto}
pre.code{
  background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
  padding:12px;font:12.5px/1.7 var(--mono);white-space:pre-wrap;word-break:break-all;margin:0 0 12px;
}

/* ═══════════════════════════════════════════════ 地图视图 */
/* 地图视图突破正文的 1180px 上限。那个宽度是为行长可读性设的——
   清单和攻略是要逐行读的文字，太宽反而难读；地图不是文字，越宽越好用。
   排程模式加了一栏之后尤其明显：不放宽的话地图会从 794px 掉到 668px。
   用 margin-left 负值撑开而不是 transform，后者会改变绝对定位的包含块。 */
#view-map{
  --vw:min(1640px, calc(100vw - 40px));
  width:var(--vw);margin-left:calc(50% - var(--vw) / 2);
}

/* 筛选模式两栏，排程模式三栏：清单 | 日程 | 地图。
   清单与日程相邻，从池子拖进某一天是一次约 260px 的横移；
   把地图夹在中间的话这个距离会变成约 1160px，鼠标要划过整张地图，触屏基本没法用。 */
.map-wrap{display:grid;grid-template-columns:232px 212px 1fr;gap:14px;
  height:var(--map-h,calc(100dvh - 260px));min-height:460px}

.day-col{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;
}
.day-col .dc-head{
  position:sticky;top:0;z-index:2;background:var(--paper-2);
  padding:7px 10px;border-bottom:1px solid var(--line);
  font:600 11px/1 var(--sans);color:var(--ink-3);letter-spacing:.6px;
  display:flex;align-items:center;gap:6px;
}
.day-col .dc-head .sp{margin-left:auto;font-weight:400;letter-spacing:0}
.lnk{
  background:none;border:0;color:var(--ink-3);font-size:11px;padding:2px 6px;border-radius:4px;letter-spacing:0;
  min-height:24px;min-width:24px;display:inline-flex;align-items:center;justify-content:center;
}
.lnk:hover{background:var(--line);color:var(--ink-2)}

/* 日期胶囊：长线行程用，平铺到第三天就开始无限滚动 */
.caps{display:flex;flex-wrap:wrap;gap:4px;padding:8px 9px;border-bottom:1px solid var(--line)}
.caps button{
  border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);
  padding:3px 8px;border-radius:6px;font:600 11.5px/1.5 var(--mono);
  display:flex;align-items:center;gap:4px;min-height:24px;
}
/* 计数要有自己的底色，否则「D1」加「7」会被连读成「第 17 天」 */
.caps button .c{
  font-weight:600;font-size:9.5px;line-height:13px;min-width:13px;text-align:center;
  padding:0 3px;border-radius:7px;background:var(--line);color:var(--ink-3);
}
.caps button[aria-pressed=true]{color:var(--on-day)}
.caps button[aria-pressed=true] .c{background:color-mix(in srgb,var(--on-day) 26%,transparent);color:var(--on-day)}

/* 每一天：标题栏 + 条目。点标题栏把它设为「当前天」 */
.dbox{border-bottom:1px solid var(--line)}
.dbox:last-child{border-bottom:0}
.dhead{
  display:flex;align-items:center;gap:7px;padding:8px 10px;
  background:var(--paper-2);transition:background .12s;
}
/* 标题栏整条是「把这天设为当前天」的按钮；删除那一天是另一件事，
   所以它是兄弟节点而不是嵌在里面（按钮不能嵌按钮）。 */
.dh-btn{
  flex:1;min-width:0;display:flex;align-items:center;gap:7px;cursor:pointer;position:relative;
}
.dh-btn::after{content:"";position:absolute;inset:-8px 0}   /* 吃掉 .dhead 的上下内边距 */
.dhead:hover{background:var(--line)}
.dbox.cur .dhead{background:color-mix(in srgb,var(--ink) 12%,var(--paper-2))}
.dhead .swatch{width:9px;height:9px;border-radius:50%;flex:none}
.dhead b{font:600 12.5px/1 var(--sans);color:var(--ink)}
.dhead .sub{margin-left:auto;font-size:10.5px;color:var(--ink-3)}
.dlist{padding:3px 0;min-height:34px}

/* 日程栏的条目只有一行：序号 + 名称。四五个点就要占满这一列，不能再多 */
.ditem{
  display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;
  font:500 12.5px/1.4 var(--sans);color:var(--ink-2);transition:background .12s;
}
.ditem:hover,.ditem.on{background:var(--paper-2)}
.ditem .n{
  flex:none;min-width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font:700 9.5px/1 var(--mono);color:var(--on-day);
}
/* 名字用 .dnm 而不是 .nm —— 全局已有一个 .nm{font:500 17px/1.35 var(--serif)}
   是视图①的卡片标题。直接命中元素的规则永远压过从父元素继承来的字体，
   跟特异性无关，所以撞上之后 .ditem 里设的 12.5px sans 完全不起作用。 */
.ditem .dnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit;flex:1;min-width:0;
  display:block;cursor:pointer;position:relative}
/* 只往上下撑命中区，不往左右 —— 右边紧挨着 ↑↓× 三个按钮，横向撑开会互相盖住。
   行高本来就有 5px 上下内边距是死区，正好收进来，排版一点不动。 */
.ditem .dnm::after{content:"";position:absolute;inset:-5px 0}
/* ↑↓× 平时藏起来（212px 的栏放不下三个常驻按钮），hover 才浮出。
   触屏没有 hover，那里常驻显示。 */
.ditem .dops{display:flex;gap:1px;flex:none;opacity:0;transition:opacity .12s}
.ditem:hover .dops,.ditem:focus-within .dops{opacity:1}
@media (hover:none){ .ditem .dops{opacity:1} }
/* 视觉尺寸保持 17px —— 212px 宽的日程栏放不下更大的按钮，而这一栏的
   密度本身就是设计的一部分。用伪元素把命中区撑到 25px，只影响指头，不影响排版。
   WCAG 2.2 的 2.5.8 要 24×24。 */
.dop{
  background:none;border:0;color:var(--ink-3);width:17px;height:17px;
  border-radius:4px;display:grid;place-items:center;padding:0;position:relative;
}
.dop::after{content:"";position:absolute;inset:-4px}
.dop:hover{background:var(--line);color:var(--ink)}
.dop:disabled{opacity:.25;cursor:default}
.dop:disabled:hover{background:none;color:var(--ink-3)}

/* 从清单栏拖进日程时，被拖的是完整的两行卡片，落在一行密度的日程栏里很突兀。
   一旦进入 .dlist 就按日程条目的样子渲染 —— 纯 CSS，不碰拖拽逻辑，
   ghost 和落点预览会一起变对。 */
.dlist .mi{
  display:flex;align-items:center;gap:7px;padding:5px 10px;
  border-bottom:0;background:none;
}
.dlist .mi .pin{margin-top:0}
.dlist .mi .t{display:flex;align-items:center;min-width:0;flex:1}
.dlist .mi .t b{
  font:500 12.5px/1.4 var(--sans);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dlist .mi .t .sub{display:none}   /* 日程栏一行放不下元信息，详情走 dialog */

/* 拖拽中的样子 */
.ditem.drag-ghost{opacity:.35}
.ditem.drag-chosen{background:var(--line)}
.mi.drag-ghost{opacity:.35}
.dlist.drag-over{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.ditem.lod .dnm{color:var(--ink-3)}
.dempty{padding:11px;font-size:11.5px;line-height:1.7;color:var(--ink-3);text-align:center}
.dempty b{color:var(--ink-2);font-weight:600}
.addmenu{
  padding:5px;border-bottom:1px solid var(--line);background:var(--paper-2);
  display:flex;flex-direction:column;gap:3px;
}
.addmenu button{
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;font-size:11.5px;color:var(--ink-2);text-align:left;
}
.addmenu button:hover{border-color:var(--line-2);color:var(--ink)}
.dhead .d-del-day{opacity:0;margin-left:4px}
.dhead:hover .d-del-day{opacity:1}
@media (hover:none){ .dhead .d-del-day{opacity:1} }
.map-side{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  display:flex;flex-direction:column;min-height:0;
}
.map-side>#map-list{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
/* 选择筛选并进清单栏顶部：它筛的就是下面这份列表，放在页面工具栏里等于把
   控件和它作用的对象拆开了。 */
.ms-head{
  padding:7px;border-bottom:1px solid var(--line);background:var(--paper-2);
  border-radius:var(--r) var(--r) 0 0;
}
.ms-head .seg{width:100%}
.ms-head .seg button{flex:1;padding:5px 2px;font-size:11px;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:3px}
.ms-head .seg button .c{
  font:600 9.5px/13px var(--mono);min-width:13px;padding:0 3px;border-radius:7px;
  background:var(--line);color:var(--ink-3);
}
.ms-head .seg button[aria-pressed=true] .c{background:rgba(255,255,255,.24);color:inherit}
/* 这些规则刻意不写成 `.map-side .mi` —— SortableJS 会把 .mi 搬出清单栏
   （拖进日程列表、触屏下还会挂到 <body> 上做浮层）。一旦按容器限定作用域，
   节点一离开容器整条规则就失效：实测圆点丢掉 17px 尺寸后按默认 15px 字体
   撑到 25px 高，元信息还冒出了浏览器默认的删除线。
   组件的样式跟着组件走，不跟着它此刻待在哪儿走。 */
.mi{
  display:flex;gap:9px;align-items:flex-start;padding:9px 12px;
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;
}
.mi:hover{background:var(--paper-2)}
.mi.on{background:var(--accent-soft)}
/* 与日程栏的序号圆圈同尺寸：两栏并排显示同一批地点，大小不一会显得是两套东西 */
/* 与日程栏的序号圆圈同尺寸：两栏并排显示同一批地点，大小不一会显得是两套东西。
   它同时是个按钮 —— 点圆点＝把这个地点放进/移出「当前天」，点卡片其余部分＝看详情。
   状态控件和内容区分开，比再加一个 + 按钮省地方，也更符合「圆点就是状态」的直觉。 */
.mi .pin{
  width:17px;height:17px;border-radius:50%;flex:none;margin-top:2px;
  display:grid;place-items:center;font:700 9.5px/1 var(--mono);color:var(--on-day);
  cursor:pointer;transition:transform .12s;position:relative;
}
/* 同上：圆点必须小（它要和日程栏的序号圈一样大），但它是这个视图里
   最常按的控件，命中区撑到 27px。往右只吃掉 .mi 那 9px 间隙的一半。 */
.mi .pin::after{content:"";position:absolute;inset:-5px}
.mi .pin:hover{transform:scale(1.22)}
.mi .t{flex:1;min-width:0;display:block;cursor:pointer;position:relative}
.mi .t::after{content:"";position:absolute;inset:-9px -12px -9px 0}  /* 补满 .mi 的内边距 */
/* 严格两行：名称一行、元信息一行。原来把整段票价文案铺进来，
   一个条目能占五六行，三栏布局下这一列只有 ~230px，根本放不下。 */
/* 清单栏与日程栏的条目必须同字体同字号 —— 它们并排显示同一批地点，
   字号不一致会让人以为是两种不同的东西。统一按小的来。 */
.mi .t b{
  display:block;font:500 12.5px/1.4 var(--sans);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mi .t .sub{
  display:flex;align-items:center;gap:5px;margin-top:2px;
  font-size:11.5px;color:var(--ink-3);
  overflow:hidden;white-space:nowrap;
}
.mi .t .sub em{font-style:normal;flex:none}
.mi .t .sub .w{
  flex:none;padding:0 5px;border-radius:4px;font-size:10.5px;line-height:15px;
  background:var(--warn-soft);color:var(--warn);
}
.mi.on{background:var(--paper-2)}
.map-side .grp{
  position:sticky;top:0;background:var(--paper-2);padding:6px 12px;
  font:600 11px/1 var(--sans);color:var(--ink-3);letter-spacing:.6px;
  border-bottom:1px solid var(--line);z-index:1;
}
.map-main{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper-2)}
#map-canvas{position:absolute;inset:0}
.map-bar{
  position:absolute;top:10px;left:10px;right:10px;z-index:20;
  display:flex;gap:7px;flex-wrap:wrap;pointer-events:none;
}
.map-bar>*{pointer-events:auto}
.mgroup{
  display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);box-shadow:var(--shadow);
}
.mgroup button{
  background:none;border:0;border-right:1px solid var(--line);
  padding:6px 11px;font-size:12px;color:var(--ink-3);white-space:nowrap;
}
.mgroup button:last-child{border-right:0}
.mgroup button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:600}
.mgroup button:disabled{opacity:.38;cursor:not-allowed}
/* 图例默认只显示线号色块（两行就够），点一下才展开全名。
   12 条线的完整列表要 210×340px，占掉地图 14% 的面积，而且正好压在
   左上角的点位上 —— 常驻显示是不合适的。 */
#map-legend{
  position:absolute;top:52px;left:10px;z-index:20;max-width:212px;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  box-shadow:var(--shadow);font-size:11.5px;line-height:1.5;
}
/* 展开/收起是一个按钮：整块图例可点，但可点的那块得是键盘够得着的东西。
   线路名列表留在按钮外面 —— 它自己会滚动，而在按钮里滚动很别扭。 */
.lg-toggle{display:block;width:100%;cursor:pointer}
#map-legend .lg-chips{display:flex;flex-wrap:wrap;gap:4px}
#map-legend .lg-ref{
  min-width:16px;text-align:center;font-weight:700;font-size:10.5px;line-height:16px;
  color:#fff;border-radius:3px;padding:0 4px;text-shadow:0 0 2px rgba(0,0,0,.45);
}
#map-legend .lg-list{display:none;margin-top:6px;max-height:min(40vh,300px);overflow:auto}
#map-legend.open .lg-list{display:block}
#map-legend.open .lg-chips{display:none}
#map-legend .lg-row{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
#map-legend .lg-row+.lg-row{margin-top:3px}
#map-legend .lg-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#map-legend .lg-foot{margin-top:6px;padding-top:5px;border-top:1px solid var(--line);color:var(--ink-3);font-size:10.5px}
#map-legend .lg-hint{color:var(--ink-3);font-size:10px;margin-top:5px}
.map-note{
  position:absolute;left:10px;bottom:10px;right:10px;z-index:20;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11.5px;
  color:var(--ink-2);box-shadow:var(--shadow);display:none;
}
.map-note.on{display:block}
.map-note b{color:var(--danger)}
/* MapLibre 自带控件（缩放按钮）默认 z-index:2，marker 最高到 6，会盖住它 */
.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right,
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{z-index:20}
.attrib{
  position:absolute;right:8px;bottom:8px;z-index:18;font-size:10px;color:var(--ink-3);
  background:color-mix(in srgb,var(--paper) 78%,transparent);padding:2px 7px;border-radius:4px;
}
.attrib a{color:inherit}

/* 地图 marker（HTML 元素，可承载中文名与序号）
   注意：不要在这里设 position 或 transform —— MapLibre 会给 marker 元素加
   .maplibregl-marker（position:absolute）并用 inline transform 定位。
   我们插手任何一个，marker 都会脱离地图坐标系。静态兜底图另有自己的定位规则。 */
.mk{cursor:pointer}
/* 尺寸、填充、描边、数字全部由 styleDot() 内联设置 —— 双层编码要在
   一个地方决定完，散到 CSS 里就会出现「改了 JS 忘了改 .no:not(.placed)」。
   这里只留与状态无关的形状和过渡。 */
.mk i{
  display:grid;place-items:center;border-radius:50%;
  font:700 11px/1 var(--mono);color:var(--on-day);font-style:normal;
  /* 只过渡 transform。尺寸随「是否已排入」变化，是一次数据驱动的离散跳变，
     不需要补间；而 47 个绝对定位的 marker 同时做 width/height 过渡会在每次
     refresh 时引发成片的布局重算。 */
  transition:transform .14s;
}
.mk:hover i,.mk.on i,.mk.hi i{transform:scale(1.28)}
.mk.on::after,.mk.hi::after{
  content:attr(data-nm);position:absolute;left:15px;top:-7px;white-space:nowrap;
  background:var(--ink);color:var(--paper);font-size:11px;padding:3px 8px;border-radius:5px;
}

/* 静态兜底：所有瓦片源都挂了时，至少还能看清相对位置 */
.static-map{position:absolute;inset:0;background:var(--paper-2)}
.static-map .sm-grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:52px 52px}
/* 静态兜底图里的定位由我们自己负责（用 left/top 百分比 + 居中位移），
   这是唯一该给 .mk 设 position/transform 的地方 */
.static-map .mk{position:absolute;transform:translate(-50%,-50%)}

/* 窄屏降级。没做抽屉：抽屉会把两栏藏进隐藏状态，而排程时你恰恰要同时看见
   池子、日程和地图。改成往下堆，地图始终留足高度。 */
@media (max-width:1180px){
  .map-wrap{grid-template-columns:1fr 1fr;grid-template-rows:minmax(180px,34vh) 1fr;height:auto}
  .map-wrap .map-main{grid-column:1 / -1;height:min(56vh,540px)}
}
@media (max-width:860px){

<!-- SortableJS 1.15.7（MIT）由 build.py 内联注入。见 assets/vendor/README.md -->
<script>/*__SORTABLE__*/</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   数据由 build.py 注入。内联而非 fetch()，因为 file:// 下 fetch 会被 CORS 拦死。
   ═══════════════════════════════════════════════════════════════════ */
const DATA       = /*__TRIP_DATA__*/null;
const ROUTE_HTML = /*__ROUTE_HTML__*/null;
const TRANSIT    = /*__TRANSIT__*/null;
const BUILT_AT   = /*__BUILT_AT__*/null;
const STANDALONE = __STANDALONE__;

const TRIP   = DATA.trip || {};
const PLACES = DATA.places || [];
const CATS   = DATA.categories || [];
const CATMAP = Object.fromEntries(CATS.map(c => [c.id, c.label || c.id]));

/* ═══════════════════════════════════════════════════════════════════
   排程索引

   itinerary 里只存「顺序即数组顺序」，序号和天色都在这里现算。
   不把 day/seq 写回 place —— 两处存同一件事必然打架（删一个点就要
   重排所有 seq）。契约见 references/data-schema.md。
   ═══════════════════════════════════════════════════════════════════ */
const ITIN = DATA.itinerary || [];
const BY_ID = Object.fromEntries(PLACES.map(p => [p.id, p]));
const isLodging = p => !!p && p.kind === "lodging";

/* 必须避开绿（想去）/琥珀（待定）/灰（不想去），否则填充与描边同色系。
   亮度还要同时满足三件事，窗口很窄（相对亮度 L 落在 0.150–0.178）：
     · 白色序号数字压得住          → L ≤ 0.179（白字 4.5:1）
     · 深色主题的卡片上认得出       → L ≥ 0.144（对 --card 3:1，WCAG 1.4.11）
     · 浅色主题的卡片上认得出       → L ≤ 0.30
   原来的六个色只按第一条挑，深色下 #5D4037 对卡片只有 1.81:1、#C2185B 2.88
   —— 而「这是第几天」全靠这个颜色编码，看不见就等于信息丢了。
   现在保留原来的六个色相，只把亮度归一到 L≈0.162，实测四项全过（最低 3.38）。
   一套值通吃两种主题，是为了守住「地图与侧栏显示同一份数据、规则必须一致」。 */
const DAY_COLORS = ["#597481", "#2A6DD8", "#8E55C4", "#0E7C7D", "#D81B65", "#936657"];
const dayColor = n => DAY_COLORS[((n % DAY_COLORS.length) + DAY_COLORS.length) % DAY_COLORS.length];

let SCHED = new Map();          // placeId -> [{ n, seq, note }]，按出现先后
function buildSched(){
  SCHED = new Map();
  for(const day of ITIN){
    let seq = 0;
    for(const ent of (day.places || [])){
      const p = BY_ID[ent && ent.id];
      if(!p) continue;
      // 住宿不参与编号，景点才是 1、2、3 连续的
      const lod = isLodging(p);
      if(!lod) seq++;
      const arr = SCHED.get(ent.id) || [];
      arr.push({ n: day.n, seq: lod ? null : seq, note: ent.note || "" });
      SCHED.set(ent.id, arr);
    }
  }
}
buildSched();

const schedOf = id => SCHED.get(id) || [];
const daysOf  = id => [...new Set(schedOf(id).map(s => s.n))].sort((a, b) => a - b);
const firstSeq = id => (schedOf(id).find(s => s.seq != null) || {}).seq ?? null;

/* 草稿新不新，判据是「文件里那份日程被改过没有」——不是构建时间。
   构建时间每 build 一次就变，而 AI 完全可能只是补了个开放时间就重跑一次；
   拿它当判据，用户排了半小时的日程会在那次无关的 rebuild 后静默消失。 */
const itinSig = a => JSON.stringify((a || []).map(d =>
  [d.n, d.date || "", (d.places || []).map(e => (e && e.id) || "")]));
const FILE_SIG = itinSig(DATA.itinerary);   // 本次加载时文件里那份，全程不变
let  SAVED_SIG = null;                      // 最近一次**真的写进文件**的那份

/* 能力检测：保存能力取决于浏览器引擎，与 file:// / http:// 无关。
   实测 file:// 下 showSaveFilePicker 同样可用；真正不支持的是 Firefox / Safari。 */
const CAN_WRITE = typeof window.showSaveFilePicker === "function";
const LS_KEY = `tp:${TRIP.destination || "trip"}:${TRIP.generated_at || ""}`;

/* ↑ ↓ × 这类小图标一律用 SVG，不用字符。实测三个字形在同一个 17px 盒子里
   宽度就不一样（↑↓ 9.5px、× 7.7px），箭头在多数字体里还偏上 —— 视觉重量
   不一致，而且随系统字体变。SVG 的几何是固定的。 */
const stroke = (d, n = 11, extra = "") =>
  `<svg viewBox="0 0 16 16" width="${n}" height="${n}" fill="none" `
  + `stroke="currentColor" stroke-width="1.7" stroke-linecap="round" `
  + `stroke-linejoin="round" aria-hidden="true" style="display:block">${extra}<path d="${d}"/></svg>`;

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* pitch / detail 里 AI 常自然地写 **重点**。先完整转义再还原这一种标记，
   既不丢强调也不引入 XSS——顺序反过来就危险了。 */
const rich = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const richP = s => rich(s).split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g, "<br>")}</p>`).join("");

let fileHandle = null;
const ui = { group:"area", scope:"all", q:"", cats:new Set(), tags:new Set(), unv:false };

/* ─────────────────────────────────────────────── 行程日期 */
const WD = ["一","二","三","四","五","六","日"];

/* 本地日期格式化。绝不能用 toISOString()——它转 UTC，
   在东八区会把 09-13 输出成 09-12，用户会以为错误的那天闭馆。 */
const isoLocal = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function tripDays(){
  const d = TRIP.dates || {};
  if(!d.start || !d.end) return [];
  const out = [], s = new Date(d.start + "T00:00:00"), e = new Date(d.end + "T00:00:00");
  if(isNaN(s) || isNaN(e) || e < s) return [];
  for(let c = new Date(s); c <= e; c.setDate(c.getDate()+1)){
    out.push({ date:new Date(c), iso:isoLocal(c), wd:((c.getDay()+6)%7)+1 });
  }
  return out;
}
const DAYS = tripDays();

/* ─────────────────────────────────────────────── 警示计算
   这是清单视图的核心价值：让用户在点「想去」之前就看到问题，
   而不是筛完一轮才发现那天根本不开门。 */
function flags(p){
  const out = [];
  if(p.status && p.status !== "open"){
    const label = { renovating:"修缮中", seasonal_closed:"季节性关闭", permanently_closed:"已永久关闭" }[p.status] || p.status;
    out.push({ cls:"f-danger", txt:label + (p.status_note ? "：" + p.status_note : "") });
  }
  const cd = p.closed_days || [];
  if(cd.length && DAYS.length){
    const hit = DAYS.filter(d => cd.includes(d.wd));
    if(hit.length === DAYS.length){
      out.push({ cls:"f-danger", txt:"行程期间全程闭馆" });
    }else if(hit.length){
      out.push({ cls:"f-warn", txt:hit.map(d => `${d.iso.slice(5)}(周${WD[d.wd-1]})闭馆`).join("、") });
    }
  }else if(cd.length){
    out.push({ cls:"f-info", txt:"周" + cd.map(d => WD[d-1]).join("、") + "闭馆" });
  }
  if(p.booking === "required") out.push({ cls:"f-warn", txt:"必须预约才能进" });
  else if(p.booking === "recommended") out.push({ cls:"f-info", txt:"建议预约" });
  // 核实被拦截：必须显眼，否则用户会把未核实的信息当成已核实的
  const v = p.verify;
  if(v && v.state && v.state !== "verified"){
    out.push({ cls:"f-unverified",
      txt: v.state === "blocked" ? "官方信息未能核实" : "信息仅部分核实" });
  }
  return out;
}

function verifyBox(p){
  const v = p.verify;
  if(!v || !v.state || v.state === "verified") return "";
  return `<div class="verify-box">
    <b>${v.state === "blocked" ? "这个地点的官方信息没能查到" : "这个地点只核实了一部分信息"}</b><br>
    ${rich(v.note || "")}
    ${(v.check || []).length ? `<ul>${v.check.map(x => `<li>需自行确认：${esc(x)}</li>`).join("")}</ul>` : ""}
    <div style="margin-top:6px">查到之后告诉 AI，它会补进数据里。</div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   明暗主题

   三态而不是两态：原来的行为就是「跟随系统」，很多人（尤其设了日落自动
   切换的）想要的正是它，直接换成二选一等于把这个能力拿掉。所以循环是
   跟随系统 → 浅色 → 深色 → 跟随系统，默认停在跟随系统。

   CSS 那边只认 :root[data-theme]，没有这个属性就落回 color-scheme:light dark
   —— 也就是说 JS 挂了或者 localStorage 不可用，配色照样是对的。
   ═══════════════════════════════════════════════════════════════════ */
const DARK_MQ = matchMedia("(prefers-color-scheme: dark)");
const THEMES = ["auto", "light", "dark"];
const THEME_TXT = { auto:"跟随系统", light:"浅色", dark:"深色" };
const THEME_ICON = {
  // 太阳：一圈短射线
  light: stroke("M8 2.6V1M8 15v-1.6M13.2 8H15M1 8h1.8M11.8 4.2 12.9 3.1M3.1 12.9l1.1-1.1"
              + "M11.8 11.8l1.1 1.1M3.1 3.1l1.1 1.1", 15,
              '<circle cx="8" cy="8" r="3.1"/>'),
  // 月亮：同一个圆被咬掉一口，和太阳共用半径，视觉重量才一致
  dark:  stroke("M13 9.6A5.6 5.6 0 1 1 6.4 3a4.4 4.4 0 0 0 6.6 6.6Z", 15),
  // 跟随系统：一个圆，左半浅右半深
  auto:  stroke("", 15,
              '<circle cx="8" cy="8" r="5.4"/>'
              + '<path class="half" d="M8 2.6a5.4 5.4 0 0 1 0 10.8Z"/>'),
};

function themePref(){
  try{
    const v = localStorage.getItem(LS_KEY + ":theme");
    return THEMES.includes(v) ? v : "auto";
  }catch(e){ return "auto"; }
}
const themeIsDark = () => {
  const p = themePref();
  return p === "auto" ? DARK_MQ.matches : p === "dark";
};

function applyTheme(pref, persist = true){
  const root = document.documentElement;
  if(pref === "auto") root.removeAttribute("data-theme");
  else root.dataset.theme = pref;
  if(persist){ try{ localStorage.setItem(LS_KEY + ":theme", pref); }catch(e){} }

  const btn = $("#theme");
  if(btn){
    const next = THEMES[(THEMES.indexOf(pref) + 1) % THEMES.length];
    btn.innerHTML = THEME_ICON[pref];
    btn.title = `配色：${THEME_TXT[pref]}（点击切换到${THEME_TXT[next]}）`;
    btn.setAttribute("aria-label", btn.title);
  }
  // 底图不是 CSS 管得到的东西，得单独通知
  window.dispatchEvent(new CustomEvent("themechange", { detail:{ dark:themeIsDark() } }));
}

function initTheme(){
  applyTheme(themePref());
  $("#theme").addEventListener("click", () => {
    const cur = themePref();
    applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
  });
  // 停在「跟随系统」时，系统切换要当场生效
  DARK_MQ.addEventListener?.("change", () => {
    if(themePref() === "auto") applyTheme("auto");
  });
  /* 同一份行程开了两个标签页（--serve 下很常见）：在 A 里换了配色，
     B 的 localStorage 变了但按钮不会自己重画，图标和标签就会跟实际状态对不上。
     storage 事件只在别的标签页触发，所以这里不会打转；persist=false 是因为
     值本来就是别人写进去的，不用再写一遍。 */
  addEventListener("storage", e => {
    if(e.key === LS_KEY + ":theme") applyTheme(themePref(), false);
  });
}

/* ─────────────────────────────────────────────── 渲染辅助 */
/* 当地语言名要带 lang。整页 lang 是正文语言（zh-CN），而 name_local 是日文 ——
   不标的话中文读屏会用普通话念日文汉字，CJK 字体栈也会给「図書館」这类
   日中字形有别的字挑简体形。而这个页面存在的意义，恰恰是让你认出路牌上的那几个字。
   语言从数据里来（trip.local_language），不写死某一国。 */
const LOCAL_LANG = (TRIP.local_language && TRIP.local_language !== TRIP.output_language)
  ? TRIP.local_language : "";
const langAttr = LOCAL_LANG ? ` lang="${esc(LOCAL_LANG)}"` : "";
const SCALE_TXT = { spot:"打卡点 5-15 分钟", "30min":"约 30 分钟", "1-2h":"1-2 小时",
                    "2-3h":"2-3 小时", "half-day":"半天", "full-day":"一整天" };
const stars = n => "★".repeat(n||0) + `<i>${"★".repeat(Math.max(0,5-(n||0)))}</i>`;

function thumb(p){
  const im = (p.images || [])[0];
  if(!im || !im.url) return `<div class="thumb empty" data-ch="${esc((p.name||"?")[0])}"></div>`;
  return `<div class="thumb"><img src="${esc(im.url)}" alt="${esc(p.name)}" loading="lazy"
    onerror="this.parentNode.className='thumb empty';this.parentNode.dataset.ch='${esc((p.name||'?')[0])}';this.remove()"></div>`;
}

function pickHTML(p){
  const c = p.choice;
  return `<div class="pick" data-id="${esc(p.id)}">
    <button class="y" data-v="yes"   aria-pressed="${c==="yes"}">想去</button>
    <button class="m" data-v="maybe" aria-pressed="${c==="maybe"}">待定</button>
    <button class="n" data-v="no"    aria-pressed="${c==="no"}">不想去</button>
  </div>`;
}

function cardHTML(p, children){
  const fl = flags(p);
  const loc = p.name_local && p.name_local !== p.name ? `<span class="loc"${langAttr}>${esc(p.name_local)}</span>` : "";
  const unv = p.verify && p.verify.state && p.verify.state !== "verified" ? ` data-verify="${esc(p.verify.state)}"` : "";
  return `<article class="card" data-id="${esc(p.id)}" data-choice="${esc(p.choice||"")}"${unv}>
    <div class="card-in">
      ${thumb(p)}
      <div class="body">
        <div class="hd">
          <button class="bare nm" type="button" data-detail="${esc(p.id)}">${esc(p.name)}</button>${loc}
          <span class="tier t-${esc(p.tier)}">${esc(p.tier)}</span>
          <span class="stars" title="出片指数 ${p.photo_index||0}/5">${stars(p.photo_index)}</span>
        </div>
        <p class="pitch">${rich(p.pitch)}</p>
        <div class="facts">
          <span>◷ ${esc(SCALE_TXT[p.scale] || p.scale)}</span>
          <span>◎ ${esc(p.ticket)}</span>
          <span>${p.indoor ? "▢ 室内" : "△ 户外"}</span>
          ${p.night ? "<span>☾ 适合夜间</span>" : ""}
          <span>${esc(CATMAP[p.category] || p.category)}</span>
        </div>
        ${fl.length ? `<div class="flags">${fl.map(f=>`<span class="flag ${f.cls}">${esc(f.txt)}</span>`).join("")}</div>` : ""}
        ${verifyBox(p)}
        ${pickHTML(p)}
        <div class="why"${p.choice === "no" && p.choice_reason ? "" : " hidden"}>不去的理由：<span class="why-t">${esc(p.choice_reason || "")}</span></div>
        ${children.length ? spotsHTML(children) : ""}
      </div>
    </div>
  </article>`;
}

/* 打卡点折叠在主景点下面：既不淹没主景点，也不会漏掉顺路的小机位 */
function spotsHTML(kids){
  return `<div class="spots">
    <div class="spots-h">顺路打卡点 · ${kids.length} 个</div>
    ${kids.map(k => `<div class="spot" data-id="${esc(k.id)}">
      <button class="bare sn" type="button" data-detail="${esc(k.id)}">${esc(k.name)}</button>
      <span class="sd">${rich(k.pitch)}</span>
      ${pickHTML(k)}
    </div>`).join("")}
  </div>`;
}

/* ─────────────────────────────────────────────── 过滤与分组 */
function visible(){
  const q = ui.q.trim().toLowerCase();
  return PLACES.filter(p => {
    if(ui.scope === "todo" && p.choice) return false;
    if(ui.unv && !(p.verify && p.verify.state && p.verify.state !== "verified")) return false;
    if(ui.cats.size && !ui.cats.has(p.category)) return false;
    if(ui.tags.size && !(p.tags||[]).some(t => ui.tags.has(t))) return false;
    if(q){
      const hay = [p.name,p.name_local,p.name_en,p.pitch,p.detail,p.area,(p.tags||[]).join(" ")]
        .filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

const TIER_ORDER = { S:0, A:1, B:2, C:3 };

function render(){
  const vis = visible();
  const visIds = new Set(vis.map(p => p.id));
  const kidsOf = {};
  const tops = [];

  for(const p of vis){
    if(p.scale === "spot" && p.parent_id && visIds.has(p.parent_id)){
      (kidsOf[p.parent_id] = kidsOf[p.parent_id] || []).push(p);
    }else{
      tops.push(p);
    }
  }

  const groups = new Map();
  for(const p of tops){
    const key = ui.group === "area" ? (p.area || "其他") : `${p.tier} 级`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }

  const keys = [...groups.keys()].sort((a,b) => {
    // 推荐度必须按 S→A→B→C 排，不能用字母序（那会把 S 排到最后）
    if(ui.group === "tier") return (TIER_ORDER[a[0]] ?? 9) - (TIER_ORDER[b[0]] ?? 9);
    return groups.get(b).length - groups.get(a).length || a.localeCompare(b);
  });

  const box = $("#groups");
  if(!vis.length){
    box.innerHTML = `<div class="empty-state"><div class="big">没有符合条件的景点</div>
      <div>调整一下搜索或筛选条件</div></div>`;
  }else{
    box.innerHTML = keys.map(k => {
      const list = groups.get(k).sort((a,b) =>
        (TIER_ORDER[a.tier]??9) - (TIER_ORDER[b.tier]??9) ||
        (b.photo_index||0) - (a.photo_index||0));
      const kidCount = list.reduce((n,p) => n + (kidsOf[p.id]||[]).length, 0);
      return `<section class="group">
        <div class="group-h">
          <h2>${esc(k)}</h2>
          <span class="meta">${list.length} 个${kidCount ? ` + ${kidCount} 打卡点` : ""}</span>
        </div>
        <div class="cards">${list.map(p => cardHTML(p, kidsOf[p.id]||[])).join("")}</div>
      </section>`;
    }).join("");
  }
  updateProgress();
  // 清单里改了选择，地图上的 marker 颜色要立刻跟着变——
  // 这正是三视图合一的意义：中间不需要 AI 重新生成页面。
  if(window.MAP) MAP.refresh();
}

function renderChips(){
  const counts = {};
  for(const p of PLACES) counts[p.category] = (counts[p.category]||0) + 1;
  const tagCount = {};
  for(const p of PLACES) for(const t of p.tags||[]) tagCount[t] = (tagCount[t]||0)+1;
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const nUnv = PLACES.filter(p => p.verify && p.verify.state && p.verify.state !== "verified").length;
  $("#chips").innerHTML =
    (nUnv ? `<button class="chip" data-unv="1" aria-pressed="false" title="官方信息没能查到的地点，需要你自己确认">⚠ 待你确认<span class="c">${nUnv}</span></button>` : "")
    + CATS.filter(c => counts[c.id]).map(c =>
      `<button class="chip" data-cat="${esc(c.id)}" aria-pressed="false">${esc(c.label)}<span class="c">${counts[c.id]}</span></button>`).join("")
    + topTags.map(([t,n]) =>
      `<button class="chip" data-tag="${esc(t)}" aria-pressed="false">#${esc(t)}<span class="c">${n}</span></button>`).join("");
}

/* 原来是页头一条横跨全宽的进度条 + 图例。它只在做选择时有意义，却常驻在
   每个视图顶上占掉一行。改成把同一组数字挂到「筛选按钮」本身 ——
   数字和它筛出来的那一类在同一个控件上，不用再对照图例。 */
function updateProgress(){
  const n = { yes:0, maybe:0, no:0, none:0 };
  // 住宿不算进这四类——它不是候选景点，算进去只会让「未表态」虚高一个
  for(const p of PLACES){
    if(p.kind === "lodging") continue;
    n[p.choice || "none"]++;
  }
  for(const b of $$(".mfil")){
    const c = b.querySelector(".c");
    if(c) c.textContent = n[b.dataset.c] ?? 0;
  }
  const t = $("#tally");
  if(t) t.innerHTML =
    `<span><i class="dot d-yes"></i>${n.yes}</span>
     <span><i class="dot d-maybe"></i>${n.maybe}</span>
     <span><i class="dot d-no"></i>${n.no}</span>
     <span><i class="dot d-none"></i>${n.none}</span>`;
  $("#n-list").textContent = PLACES.length;
}

/* ─────────────────────────────────────────────── 选择与暂存 */
/* 就地同步一个地点在页面上的所有表态痕迹。
   一个地点可能出现两次：主卡片一处，作为别人的顺路打卡点又一处，
   两处的三态按钮都要跟着变，所以按 [data-id] 全量取而不是只改点中的那一组。 */
function syncChoice(p){
  const sel = `[data-id="${CSS.escape(p.id)}"]`;
  for(const card of $$(`.card${sel}`)) card.dataset.choice = p.choice || "";
  for(const g of $$(`.pick${sel}`)){
    for(const b of g.querySelectorAll("button"))
      b.setAttribute("aria-pressed", String(p.choice === b.dataset.v));
  }
  for(const card of $$(`.card${sel}`)){
    const why = card.querySelector(".why");
    if(!why) continue;
    const show = p.choice === "no" && !!p.choice_reason;
    why.hidden = !show;
    const t = why.querySelector(".why-t");
    if(t) t.textContent = p.choice_reason || "";
  }
}

function setChoice(id, v, reason){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  p.choice = (p.choice === v) ? null : v;
  p.choice_reason = (p.choice === "no") ? (reason || p.choice_reason || "") : "";
  saveLocal();
  scheduleAuto();
  // 「未表态」筛选下，表完态这张卡就该从列表里消失 —— 那是结构变化，只能整体重画。
  // 其余情况一律就地改：整体 innerHTML 重建会把刚按下的那个按钮从 DOM 里摘掉，
  // 焦点掉回 <body>。实测表第 40 个景点时，键盘用户要从文档顶部重新 Tab 约 200 次。
  if(ui.scope === "todo"){ render(); return; }
  syncChoice(p);
  updateProgress();
  if(window.MAP) MAP.refresh();
}

function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(
      PLACES.filter(p => p.choice).map(p => [p.id, p.choice, p.choice_reason || ""])));
    // 排半小时的天，刷新一下没了会很崩溃。连同两个指纹一起存 —— 见 loadItin。
    localStorage.setItem(LS_KEY + ":itin",
      JSON.stringify({ sig: FILE_SIG, savedSig: SAVED_SIG, itinerary: DATA.itinerary || [] }));
  }catch(e){ /* 隐私模式下 localStorage 不可用，忽略 */ }
}

/* 草稿和文件谁新？只有一种情况该丢掉草稿：**文件里的日程被别人改了**。
   两个指纹合起来正好覆盖四种情形：

     文件没动过                  → sig 命中，草稿更新，恢复          ✓
     用户存过盘、AI 又 rebuild 过 → savedSig 命中（文件就是我们写的），恢复 ✓
     存到了别处 / 没放回去        → sig 仍然命中（文件确实没变），恢复    ✓
     AI 重写了 itinerary          → 两个都不命中，文件更新，丢掉草稿    ✓

   只比"文件里有没有 itinerary"是不够的：用户在浏览器里排完，文件里还留着
   AI 早先写的那版，一刷新就把半小时的工作盖掉了。 */
function loadItin(){
  try{
    const raw = localStorage.getItem(LS_KEY + ":itin");
    if(!raw) return 0;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.itinerary)) return 0;
    if(d.sig !== FILE_SIG && d.savedSig !== FILE_SIG) return 0;
    SAVED_SIG = d.savedSig ?? null;
    // 必须让 DATA.itinerary 和 ITIN 始终是**同一个数组**。
    // 写成 DATA.itinerary = d.itinerary 会让两者分叉：日内改动因为共享
    // day 对象还能同步，但「增加一天」这种改数组本身的操作就只进其中一个，
    // 保存时写回去的天数会和界面上看到的对不上。
    DATA.itinerary = ITIN;
    ITIN.length = 0;
    d.itinerary.forEach(x => ITIN.push(x));
    buildSched();
    return ITIN.reduce((n, day) => n + (day.places || []).length, 0);
  }catch(e){ return 0; }
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return 0;
    const map = new Map(JSON.parse(raw).map(([id,c,r]) => [id,[c,r]]));
    let n = 0;
    for(const p of PLACES){
      const hit = map.get(p.id);
      // 文件里已有选择时以文件为准：AI 刚写回的结果比浏览器缓存新
      if(hit && !p.choice){ p.choice = hit[0]; p.choice_reason = hit[1]; n++; }
    }
    return n;
  }catch(e){ return 0; }
}

/* ─────────────────────────────────────────────── 详情弹窗 */
function openDetail(id){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  const im = (p.images||[])[0];
  const fl = flags(p);
  const kv = [
    ["开放时间", p.hours],
    ["最后入场", p.last_entry],
    ["闭馆", p.closed],
    ["门票", p.ticket],
    ["预约", { required:"必须预约才能进入", recommended:"可现场前往，但建议预约", none:"无需预约" }[p.booking]],
    ["建议时长", p.duration_min ? `约 ${p.duration_min} 分钟` : ""],
    ["所属区域", p.area],
    ["出片指数", p.photo_index ? `${p.photo_index}/5` : ""],
  ].filter(([,v]) => v);

  $("#dlg-inner").innerHTML = `
    <div class="dlg-h">
      <h3>${esc(p.name)}${p.name_local && p.name_local!==p.name ? ` <span class="loc"${langAttr}>${esc(p.name_local)}</span>` : ""}</h3>
      <button class="x" data-close aria-label="关闭">&times;</button>
    </div>
    <div class="dlg-b">
      ${im && im.url ? `<img class="dlg-img" src="${esc(im.url)}" alt="${esc(p.name)}" onerror="this.remove()">
        ${im.credit ? `<div class="credit">${esc(im.credit)}</div>` : ""}` : ""}
      ${fl.length ? `<div class="flags" style="margin-bottom:14px">${fl.map(f=>`<span class="flag ${f.cls}">${esc(f.txt)}</span>`).join("")}</div>` : ""}
      ${verifyBox(p)}
      ${richP(p.detail || p.pitch)}
      ${p.photo_note ? `<h4>拍摄建议</h4>${richP(p.photo_note)}` : ""}
      <h4>实用信息</h4>
      <dl class="kv">${kv.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${p.booking_url ? `<h4>预约</h4><ul class="srcs"><li><a href="${esc(p.booking_url)}" target="_blank" rel="noopener">${esc(p.booking_url)}</a></li></ul>` : ""}
      <h4>信息来源</h4>
      <ul class="srcs">${(p.sources||[]).map(s =>
        `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></li>`).join("") || "<li>—</li>"}</ul>
      <div class="dlg-f">${schedBtn(p)}${pickHTML(p)}</div>
    </div>`;
  $("#dlg").showModal();
}

/* 点地图 marker 改成弹这个窗之后，地图那一侧就没有排程入口了。
   补在这里：看清楚是什么，当场就能决定排不排，不用再回清单里找一遍。 */
function schedBtn(p){
  const n = MAP.curDay();
  if(n == null || isLodging(p)) return "";
  const inDay = schedOf(p.id).some(s => s.n === n);
  return `<button class="btn sched" data-sched="${esc(p.id)}">${
    inDay ? `从第 ${n} 天移出` : `加进第 ${n} 天`}</button>`;
}

/* ─────────────────────────────────────────────── 不去的理由 */
const QUICK = ["太远了","人太多","不感兴趣","时间不够","门票太贵","去过了","那天不开门","和别处重复"];
function askReason(id){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  let picked = "";
  $("#rdlg-inner").innerHTML = `
    <div class="dlg-h"><h3>为什么不去${esc(p.name)}？</h3>
      <button class="x" data-rclose aria-label="关闭">&times;</button></div>
    <div class="dlg-b">
      <p style="font-size:13px">记下理由，之后回看清单时能快速判断要不要把它捡回来。可以跳过。</p>
      <div class="reasons">${QUICK.map(r => `<button data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
      <textarea id="rtext" placeholder="或者自己写…"></textarea>
      <div class="dlg-f">
        <button class="btn" data-rskip>跳过</button>
        <button class="btn primary" data-rok>确定</button>
      </div>
    </div>`;
  const dlg = $("#rdlg");
  dlg.showModal();
  $("#rdlg-inner").onclick = e => {
    const b = e.target.closest("button");
    if(!b) return;
    if(b.dataset.r !== undefined){
      picked = b.dataset.r;
      $$("#rdlg-inner .reasons button").forEach(x => x.setAttribute("aria-pressed", x === b));
      $("#rtext").value = picked;
    }
    if(b.hasAttribute("data-rok"))   { setChoice(id,"no",$("#rtext").value.trim()); dlg.close(); }
    if(b.hasAttribute("data-rskip")) { setChoice(id,"no",""); dlg.close(); }
    if(b.hasAttribute("data-rclose")) dlg.close();
  };
}

/* ─────────────────────────────────────────────── 导出 */
function payload(){
  const out = JSON.parse(JSON.stringify(DATA));
  const cm = new Map(PLACES.map(p => [p.id, p]));
  for(const p of out.places){
    const cur = cm.get(p.id);
    p.choice = cur ? cur.choice ?? null : null;
    p.choice_reason = cur ? cur.choice_reason || "" : "";
  }
  return JSON.stringify(out, null, 2);
}

/* 短码是最后一条兜底路（Firefox/Safari 三条写文件的路都断时）。
   日程必须一起编进来——只回传选择的话，用户排的天会静默消失，
   而且贴回去的人和读它的 AI 都不会发现少了东西。 */
/* 回传给本地服务的只有页面拥有的三个字段，不是整份文档。

   一来页面内存里那份 DATA 是构建那一刻的快照，整份写回去会把 AI 之后
   补的坐标、配图统统抹掉（服务端也做了合并，这里是第二道）。
   二来 sendBeacon 的上限是 64KB，整份 122KB 会**返回 false 而不是抛错**——
   实测过，关页那一刻的改动就那样静默没了。压到 ~2KB 才发得出去。
   三来自动保存每几秒一次，没必要每次搬 122KB。

   choice 为 null 的也要带上：清空表态同样是一次改动，漏掉就回退不了。 */
function patch(){
  return JSON.stringify({
    patch: 1,
    choices: PLACES.map(p => [p.id, p.choice || null, p.choice_reason || ""]),
    itinerary: DATA.itinerary || [],
  });
}

function shortCode(){
  const g = v => PLACES.filter(p => p.choice === v);
  const L = [`#travel-planner v1 · ${TRIP.destination || ""} · ${isoLocal(new Date())}`];
  const yes = g("yes"), maybe = g("maybe"), no = g("no");
  if(yes.length)   L.push("+ " + yes.map(p => p.id).join(" "));
  if(maybe.length) L.push("? " + maybe.map(p => p.id).join(" "));
  if(no.length)    L.push("- " + no.map(p => p.id + (p.choice_reason ? `(${p.choice_reason})` : "")).join(" "));
  const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
  let items = 0;
  for(const d of days){
    items += d.places.length;
    L.push(`D${d.n} ${d.date || "-"} ` + d.places
      .map(e => e.id + (e.note ? `(${e.note})` : "")).join(" "));
  }
  L.push(`# 想去 ${yes.length} · 待定 ${maybe.length} · 不想去 ${no.length} · 未表态 ${PLACES.length-yes.length-maybe.length-no.length}`
    + (days.length ? ` · 日程 ${days.length} 天共 ${items} 项（D 行按顺序，即当天路线）` : " · 尚未排日程"));
  return L.join("\n");
}

/* ── 自动保存 ─────────────────────────────────────────────────
   页面是编辑器，不是表单：改了就落盘，不该让用户记得去点一个按钮。
   只在本地服务下开——file:// 的文件选择框必须由用户手势触发，
   拿不到 handle 就没法程序化写，那种情况下按钮仍是唯一的路。

   两个节奏拆开：places.json 3 秒去抖（AI 读的真相，越新越好，125KB），
   trip.html 由服务端延到 12 秒空闲才重建（只服务于双击/分享，晚点无所谓）。 */
const SERVED = location.protocol === "http:" || location.protocol === "https:";
const SAVE_LABEL = SERVED ? "立即保存" : "保存选择和日程";
let autoTimer = null, autoBusy = false, autoDirty = false;

function scheduleAuto(){
  if(!SERVED || STANDALONE) return;
  autoDirty = true;
  // 去抖这三秒里什么都没在进行，不报「有未保存的改动」——那个说法既否定了
  // 旁边「会自动写回」的承诺，又为一个转瞬即逝的中间态制造焦虑。
  // 保持上一条「已保存 · HH:MM」，真出问题时 err 会盖掉它。
  clearTimeout(autoTimer);
  autoTimer = setTimeout(runAuto, 3000);
}

async function runAuto(){
  if(!autoDirty || autoBusy) return;
  autoBusy = true;
  setSaveState("saving");
  try{
    const r = await saveViaServer(false);
    if(r){ autoDirty = false; markSaved(); setSaveState("ok"); }
    else  { setSaveState("err"); revealSaveBtn(); }
  }finally{ autoBusy = false; }
}

/* 关标签页那一刻还没到 3 秒去抖的，fetch 会被连同页面一起掐掉。
   sendBeacon 是唯一能在卸载时可靠发出的请求。 */
function flushOnExit(){
  if(!SERVED || STANDALONE || !autoDirty) return;
  try{
    // 返回 false 就是没发出去（超限/被拦），那时绝不能把 dirty 清掉
    if(navigator.sendBeacon("/__save__?now=1",
        new Blob([patch()], { type:"application/json" }))) autoDirty = false;
  }catch(e){ /* 发不出去也只能认了，localStorage 里还有一份 */ }
}
addEventListener("pagehide", flushOnExit);
// iOS Safari 上 pagehide 不总是触发，切到后台时补一次
addEventListener("visibilitychange", () => { if(document.hidden) flushOnExit(); });

/* 本地服务下这三个按钮一个都用不到——改动会自动写回，`file://` 才需要它们。
   把「立即保存」也收进「手动保存…」：留在外面等于常驻提示用户去做一件
   系统已经替他做了的事，反而让人怀疑到底存没存。用的是同一个 #save 节点，
   不是复制一份，省得标签和禁用状态两处不同步。 */
function layoutActionbar(){
  const box = $("#more-box"), save = $("#save"), more = $("#more");
  if(SERVED){
    save.classList.remove("primary");
    box.prepend(save);
  }
  more.onclick = () => setMoreOpen(box.hidden);
}

function setMoreOpen(open){
  const box = $("#more-box"), more = $("#more");
  if(!box || !more) return;
  box.hidden = !open;
  more.setAttribute("aria-expanded", String(open));
}

/* 自动保存失败时把按钮直接露出来。提示里教用户「点『手动保存…』→『立即保存』」
   是在描述路径——正确做法是把要点的东西摆到他面前。 */
function revealSaveBtn(){
  if(!SERVED) return;
  setMoreOpen(true);
  const save = $("#save");
  if(save) save.classList.add("primary");
}

/* 自动保存失败必须看得见：服务被停掉、端口被占，
   否则用户会以为一直在存，其实改动只躺在 localStorage 里。 */
function setSaveState(kind){
  const el = $("#hint");
  if(!el) return;
  if(!SERVED){
    el.className = "hint";
    el.textContent = "以本地文件方式打开，改动不会自动保存。点「" + SAVE_LABEL + "」写回 places.json"
      + (BUILT_AT ? ` 页面数据生成于 ${BUILT_AT}。` : "");
    return;
  }
  const t = new Date().toTimeString().slice(0, 5);
  el.className = "hint" + (kind === "err" ? " bad" : "");
  el.textContent =
    kind === "saving" ? "保存中…" :
    kind === "err"    ? `自动保存失败。改动只在这个浏览器里，点「${SAVE_LABEL}」重试` :
    kind === "ok"     ? `已保存 · ${t}` :
                        "改动自动写回 places.json，不用手动保存";
}

/* 保存有三条路，按可靠性排序，任何一条失败都自动往下走——
   绝不能让用户点了保存却卡在一个报错提示上，筛了半天的结果没法带走。

   实测（Claude 内置浏览器）：
     · showSaveFilePicker 函数存在，但 createWritable 抛 NotAllowedError
     · navigator.clipboard.writeText 抛 NotAllowedError
   也就是说「函数存在」完全不能证明「能用」，必须真的试一次才知道。 */
async function saveViaServer(now){
  if(!SERVED) return null;
  try{
    const r = await fetch("/__save__" + (now ? "?now=1" : ""), {
      method:"POST", headers:{ "Content-Type":"application/json" }, body:patch(),
    });
    const j = await r.json().catch(() => ({}));
    return j && j.ok ? j : null;
  }catch(e){ return null; }
}

async function saveViaPicker(){
  if(typeof window.showSaveFilePicker !== "function") return null;
  try{
    if(!fileHandle){
      fileHandle = await window.showSaveFilePicker({
        suggestedName:"places.json",
        types:[{ description:"行程数据", accept:{ "application/json":[".json"] } }],
      });
    }
    if(fileHandle.queryPermission){
      let st = await fileHandle.queryPermission({ mode:"readwrite" });
      if(st === "prompt" && fileHandle.requestPermission)
        st = await fileHandle.requestPermission({ mode:"readwrite" });
      if(st !== "granted") return null;
    }
    const w = await fileHandle.createWritable();
    await w.write(payload());
    await w.close();
    return { name: fileHandle.name };
  }catch(e){
    if(e.name === "AbortError") return "abort";   // 用户主动取消，不要再降级
    fileHandle = null;
    return null;
  }
}

/* 写进文件之后必须记下这份日程的指纹：否则 AI 之后重跑一次 build，
   loadItin 会认为文件变了而丢掉草稿——丢掉的其实是用户自己刚存的那份。 */
function markSaved(){
  SAVED_SIG = itinSig(DATA.itinerary);
  saveLocal();
  // 出错时强调过的按钮，存成功了就撤掉强调（折叠区不替用户收起来，那太突兀）
  if(SERVED) $("#save").classList.remove("primary");
}

function savedMsg(where){
  const done = PLACES.filter(p => p.choice).length;
  const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
  const items = days.reduce((a, d) => a + d.places.length, 0);
  return `已保存到 ${where}：${done} 个已表态`
    + (days.length ? ` · ${days.length} 天共 ${items} 项日程` : "，日程还没排")
    + "，可以让 AI 写攻略了";
}

async function doSave(){
  const btn = $("#save");
  clearTimeout(autoTimer);            // 手动保存后不该再来一次自动的
  btn.disabled = true; btn.textContent = "保存中…";
  try{
    const srv = await saveViaServer(true);
    if(srv){
      autoDirty = false;
      markSaved();
      setSaveState("ok");
      // 页面本身是构建产物：不重新 build，双击打开或分享出去的 trip.html
      // 还停在上一次构建的状态，和刚写回的 places.json 对不上。
      toast(savedMsg("places.json") + (srv.rebuilt ? "。页面也已同步重建" : ""));
      return;
    }
    const pick = await saveViaPicker();
    if(pick === "abort") return;
    if(pick){
      markSaved();
      toast(savedMsg(pick.name));
      return;
    }
    // 两条直写路都不通——直接下载，并说清楚为什么
    if(SERVED) setSaveState("err");
    download(true);
  }finally{
    btn.disabled = false; btn.textContent = SAVE_LABEL;
  }
}

function download(isFallback){
  const b = new Blob([payload()], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "places.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(isFallback
    ? "这个浏览器不允许直接写文件，已改为下载。选择和日程都在里面，把 places.json 放回行程目录覆盖原文件即可"
    : "已下载 places.json（含选择和日程），把它放回行程目录覆盖原文件");
  if(isFallback) setTimeout(showCode, 900);   // 下载也可能被拦，再给一条兜底
}

function showCode(){
  const code = shortCode();
  $("#dlg-inner").innerHTML = `
    <div class="dlg-h"><h3>把这段贴回对话</h3><button class="x" data-close aria-label="关闭">&times;</button></div>
    <div class="dlg-b">
      <p style="font-size:13px">Firefox 和 Safari 不允许网页直接写文件。
      把下面这段复制给 AI，它能还原你的选择和日程。</p>
      <pre class="code" id="code">${esc(code)}</pre>
      <div class="dlg-f">
        <button class="btn" data-close>关闭</button>
        <button class="btn primary" id="cp">复制</button>
      </div>
    </div>`;
  $("#dlg").showModal();
  $("#cp").onclick = async () => {
    // 实测内置浏览器 navigator.clipboard 抛 NotAllowedError，必须有选中兜底
    try{ await navigator.clipboard.writeText(code); toast("已复制"); }
    catch(e){
      const r = document.createRange(); r.selectNode($("#code"));
      getSelection().removeAllRanges(); getSelection().addRange(r);
      toast("这个浏览器不允许自动复制，已帮你选中，按 ⌘C / Ctrl+C");
    }
  };
}

let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 3200);
}

/* ═══════════════════════════════════════════════════════════════════
   地图视图

   底图分层与降级链（每一级都实测过）：
     ① 简约  OpenFreeMap positron。默认——底图要让位给点位和连线，
             graybeard 的路网/路牌/注记密度会把几十个 marker 淹掉
     ② 标准  graybeard style + OSM 官方 Shortbread 矢量瓦片。
             信息更全，同时充当矢量源的备份：另一家运营、另一套 schema，
             不会跟 ① 一起挂。file:// 下也能出图（OSM 矢量端点不要 Referer）
     ③ 光栅  OSM 官方光栅，仅 http 下解锁 —— file:// 不发 Referer，
             OSM 会返回一张写着「Access blocked」的图片，
             且 HTTP 状态码是 200，onerror 抓不到
     ④ 无 WebGL → Leaflet + CARTO 光栅
     ⑤ 全挂 → 静态散点图，至少还能看清相对位置

   为什么默认是 ①（实测依据）：
     · OSM 官方矢量瓦片**不要 Referer**，file:// 下同样返回 200 ——
       而官方光栅那套会被挡。双击打开也有一个像样的底图。
     · OFM 的 park 源图层实测是空的（大阪城/中之岛/万博全是 0 个要素），
       绿地只能从 landcover.grass 绕；OSM Shortbread 的 land 层直接带
       park/garden/forest/grass 分类。
     · 官方运营，不是单人维护的捐赠项目。
     · 全球覆盖抽查 9 城（含拉萨、雷克雅未克）全部有数据。

   ①③ 都是 OSM 官方，②是 OpenFreeMap；两个矢量源 schema 不同、运营方不同，
   不会一起挂。
   ═══════════════════════════════════════════════════════════════════ */
const MAP = (() => {
  const MAPLIBRE_JS  = "https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js";
  const MAPLIBRE_CSS = "https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css";
  const LEAFLET_JS   = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  const LEAFLET_CSS  = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";

  /* graybeard 绑定的是 Shortbread **schema**，不是 VersaTiles 这家供应商。
     把 sources 指向 OSM 官方的 Shortbread 端点即可，其余 324 个图层一字不改。
     （反过来不成立：graybeard 与 positron 引用的 source-layer 零重叠，
       想让 graybeard 跑在 OpenFreeMap 上得把每个图层重写一遍。） */
  const GRAYBEARD  = "https://tiles.versatiles.org/assets/styles/graybeard/style.json";
  const OSM_VECTOR = "https://vector.openstreetmap.org/shortbread_v1/{z}/{x}/{y}.mvt";
  const OSM_ATTRIB = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
  // Leaflet 降级时用：CARTO 有 CORS、不要 Referer，file:// 下也能出图
  const CARTO_RASTER = ["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                        "https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"];
  let gbStyle = null;      // graybeard 的 style JSON 只抓一次，切回来不重复请求

  /* 深色主题下的底图。
     地图是视图②面积最大的一块，浅色底图嵌在近黑的页面里是一大块亮斑。
     OpenFreeMap 的 dark 与 positron 出自同一套 openmaptiles schema，
     图层 id 完全一致，所以上色补丁、隐藏规则、POI 层全都不用动，只换 URL。
     另外两个底图没有深色版：graybeard 是固定 style，光栅瓦片更是烤死的图片。
     所以「底图是不是深的」不能问主题，只能问当前用的是哪张底图 —— 见 MI。

     跟的是 themeIsDark()（解析后的主题）而不是系统偏好：用户在右上角把
     配色钉死成浅色时，界面翻了地图也得跟着翻，否则又是一块对不上的亮斑。 */
  const ofmStyle = dark =>
    "https://tiles.openfreemap.org/styles/" + (dark ? "dark" : "positron");

  const BASEMAPS = [
    { id:"ofm", label:"简约", kind:"vector", schema:"openmaptiles",
      style:ofmStyle(themeIsDark()),
      dark:themeIsDark(),
      attrib:'OpenFreeMap © OpenMapTiles Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' },
    { id:"gb", label:"标准", kind:"vector", schema:"shortbread",
      style:() => (gbStyle ||= fetch(GRAYBEARD, { cache:"force-cache" })
        .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(s => {
          const src = s.sources["versatiles-shortbread"];
          src.tiles = [OSM_VECTOR];
          src.maxzoom = 14;      // 与 vector.openstreetmap.org 的 tilejson 一致
          src.attribution = "";
          return s;
        })
        .catch(e => { gbStyle = null; throw e; })),   // 失败不要缓存，下次还能重试
      attrib: OSM_ATTRIB + ' · 矢量瓦片 <a href="https://vector.openstreetmap.org/" target="_blank" rel="noopener">vector.openstreetmap.org</a> · Style: VersaTiles graybeard' },
    { id:"osm", label:"光栅", kind:"raster", httpOnly:true,
      tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
      attrib: OSM_ATTRIB },
  ];

  /* ---------- 画在底图上的墨色 ----------
     （marker 空心、白描边、地铁站点与注记的光晕…）
     原来一律写死浅色，理由是「三个底图全是浅色」—— 这条前提现在只对
     两个底图成立了。所以把它们收进一处，跟着当前底图翻，而不是跟着主题翻：
     深色主题下手动切回「光栅」，底图还是浅的，这些墨色就也得跟着回来。 */
  const MAP_INK = {
    light:{ hollow:"#fff", ring:"#fff", halo:"#fff",
            lodging:"#4A4A4A", onLodging:"#fff",
            station:"#fff", stationEdge:"#5b5b5b", stationLabel:"#4a4a4a",
            poi:"#6b6257", poiHalo:"rgba(255,255,255,.9)",
            water:"rgb(190,221,243)", grass:"rgb(211,228,186)", wood:"rgb(186,214,180)" },
    // 注意是「按角色翻」而不是「按颜色翻」。空心点在浅色底图上是白的，
    // 因为白＝底图上最不起眼的那一档，说的是「还没排」；深色底图上最不起眼的
    // 是近黑，翻成浅色反而会让未排入的点比排好的还抢眼，主次正好反过来。
    // 车站圆点同理：真正的图形是描边，填充要退到底图里去。
    dark: { hollow:"#1b1815", ring:"#14110e", halo:"#14110e",
            lodging:"#d8d2c6", onLodging:"#14110e",
            station:"#14110e", stationEdge:"#cfc7b8", stationLabel:"#cfc7b8",
            poi:"#b0a695", poiHalo:"rgba(12,10,8,.9)",
            water:"rgb(28,46,66)", grass:"rgb(38,50,34)", wood:"rgb(34,52,38)" },
  };
  /* 刻意算出来而不是存一份。存的话每个改 st.base 的地方都得记得同步，
     而 init() 的降级路径就直接写 st.base = "gb"，不走 switchBase ——
     实测漏过一次：主题切成浅色后首次进地图，底图是浅的、墨色还是深的那套。
     引擎降级到 Leaflet 时用的是 CARTO 浅色光栅，永远算浅底。
     静态兜底图画在 --paper-2 上，那是界面表面，跟着「简约」底图的明暗即可。 */
  const baseIsDark = () => {
    if(st.engine === "leaflet") return false;
    const b = BASEMAPS.find(x => x.id === st.base);
    return !!(b && b.dark);
  };
  const MI = () => MAP_INK[baseIsDark() ? "dark" : "light"];

  /* ---------- 水体与绿地上色 ----------
     两套 style 都把水和绿地画成了灰（graybeard 是 colorful 把饱和度压成 0，
     色相其实还留着；positron 本来就是浅灰）。这里只把这两类还原成彩色，
     道路建筑注记一律保持灰 —— 让画面里的彩色只剩三样：
     点位、地铁线、水与绿地。

     shortbread 的值写死不跟着翻：graybeard 只有浅色一版，这几条永远画在浅底上。 */
  const SB_WATER = "rgb(190,221,243)";
  const tintFor = schema => schema === "shortbread" ? {
      "water-ocean":SB_WATER, "water-area":SB_WATER, "water-area-river":SB_WATER,
      "water-area-small":SB_WATER, "water-river":SB_WATER, "water-canal":SB_WATER,
      "water-stream":SB_WATER, "water-ditch":SB_WATER, "water-dam":SB_WATER,
      "land-park":"rgb(217,217,165)", "land-garden":"rgb(217,217,165)",
      "land-vegetation":"rgb(217,217,165)", "land-forest":"rgb(150,196,124)",
      "land-grass":"rgb(216,232,200)", "land-leisure":"rgb(231,237,222)",
      "land-wetland":"rgb(211,230,219)",
    } : schema === "openmaptiles" ? {
      "water":MI().water, "waterway":MI().water, "landcover_wood":MI().wood,
    } : {};

  /* 底图上要藏掉的图层。
     道路编号盾牌是白底黑字的数字方块——而我们的日程序号是白字圆点。
     两种数字挤在一张图上，第一眼分不出哪个是「今天第几站」。
     底图的职责是让人认出位置，认出之后要读的是我们画上去的东西。 */
  const HIDE = {
    openmaptiles: ["highway-shield-non-us", "highway-shield-us-interstate", "road_shield_us"],
    shortbread:   ["label-motorway-shield"],
  };

  function applyHide(map, schema){
    for(const id of HIDE[schema] || []){
      if(map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none");
    }
  }

  /* POI 层。两套 style 情况完全不同：
       简约（positron）一个 POI 图层都没有，但瓦片里有三万多个 POI 要素
                        —— 数据在，只是没画，得自己加一层
       标准（graybeard）自带 poi-amenity / poi-shop / poi-tourism 等 9 层，
                        只要开关可见性
     默认关：POI 密度是逐城市变的，大阪市中心开着就糊成一片。
     不做类别白名单——交给 MapLibre 的标注避让去稀释，缩小时自然只剩几个。 */
  const POI_LAYER = "x-poi";
  const GB_POI = ["poi-amenity", "poi-leisure", "poi-tourism", "poi-shop",
                  "poi-man_made", "poi-historic", "poi-emergency", "poi-office"];

  /* 全开是没用的：实测道顿堀 z16 一屏 90 个标注，其中便利店（ファミリーマート
     ×7、ローソン ×4）和连锁店占了大半，真正的 attraction 只有 4 个，
     自家的序号点反而被挤掉。所以按类别分组，默认只开对排行程有用的三组。
     class 取值来自 OpenMapTiles 的 poi 图层；没列到的归「其他」。 */
  const POI_GROUPS = [
    { id:"sight", label:"景点·文化", on:true,
      cls:["attraction","museum","art_gallery","artwork","monument","castle",
           "viewpoint","zoo","aquarium","theme_park","information","historic"] },
    { id:"worship", label:"寺庙神社", on:true,
      cls:["place_of_worship","cemetery"] },
    { id:"transit", label:"车站·出入口", on:true,
      cls:["railway","bus","subway","entrance","ferry_terminal","aerialway","harbor"] },
    { id:"park", label:"公园·休闲", on:false,
      cls:["park","playground","stadium","swimming","golf","picnic_site","campsite"] },
    { id:"food", label:"餐饮", on:false,
      cls:["restaurant","fast_food","cafe","bar","beer","pub","ice_cream"] },
    { id:"shop", label:"购物", on:false,
      cls:["shop","clothing_store","alcohol_shop","grocery","department_store","bakery"] },
    { id:"stay", label:"住宿", on:false, cls:["lodging"] },
    { id:"life", label:"生活服务", on:false,
      cls:["pharmacy","hospital","police","post","atm","bank","toilets","parking",
           "laundry","fire_station","school","college","library","town_hall"] },
  ];
  const poiClasses = () => POI_GROUPS.filter(g => g.on).flatMap(g => g.cls);

  function addPoi(map, schema){
    if(schema !== "openmaptiles" || map.getLayer(POI_LAYER)) return;
    if(!map.getSource("openmaptiles")) return;
    map.addLayer({
      id: POI_LAYER, type:"symbol", source:"openmaptiles", "source-layer":"poi",
      minzoom: 14,
      filter: poiFilter(),
      layout:{
        "text-field": ["get", "name"],
        "text-font": pickFont(map, false),   // 已经是数组，别再包一层
        "text-size": 10.5,
        "text-anchor": "top",
        "text-offset": [0, 0.45],
        "text-max-width": 7,
        // rank 小的更重要，让它先占位置；剩下的被避让自然吃掉
        "symbol-sort-key": ["coalesce", ["get", "rank"], 99],
        "text-optional": false,
        visibility: "none",
      },
      paint:{ "text-color":MI().poi, "text-halo-color":MI().poiHalo, "text-halo-width":1.1 },
    });
  }

  const poiFilter = () =>
    ["all", ["has", "name"], ["in", ["get", "class"], ["literal", poiClasses()]]];

  /* 没有界面开关：分类固定为 POI_GROUPS 里 on:true 的那几组。
     曾经做过一个分类面板，占掉地图右上角一大块，而这几组是否合适
     并不是每次用图都要改的事——真要调就改上面那张表。

     graybeard 那 9 层是按 OSM 大类切的（poi-shop / poi-tourism…），和
     OpenMapTiles 的 class 值对不上，没法共用过滤器——那边只能整体开或关。 */
  function applyPoi(){
    if(st.engine !== "maplibre" || !st.map) return;
    const on = poiClasses().length > 0;
    const ids = schemaOf(st.base) === "openmaptiles" ? [POI_LAYER] : GB_POI;
    for(const id of ids){
      if(st.map.getLayer(id)) st.map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
    }
    if(st.map.getLayer(POI_LAYER)) st.map.setFilter(POI_LAYER, poiFilter());
  }

  function applyTint(map, schema){
    for(const [id, color] of Object.entries(tintFor(schema))){
      const l = map.getLayer(id);
      if(l) map.setPaintProperty(id, l.type === "line" ? "line-color" : "fill-color", color);
    }
    if(schema !== "openmaptiles") return;
    // positron 根本没有画 grass 的图层，而大阪城那张瓦片里有 200 个 grass 要素。
    // 补一层，插在 water 下面免得盖住河道。
    if(!map.getLayer("x-grass") && map.getLayer("water")){
      map.addLayer({
        id:"x-grass", type:"fill", source:"openmaptiles", "source-layer":"landcover",
        filter:["in", ["get","class"], ["literal",["grass","farmland","wetland"]]],
        paint:{ "fill-color":MI().grass,
                "fill-opacity":["interpolate",["linear"],["zoom"], 9,0, 12,1] },
      }, "water");
    }
    // landcover_wood 原本 z10 才出现，缩小时绿地整片消失
    if(map.getLayer("landcover_wood")){
      map.setPaintProperty("landcover_wood","fill-opacity",
        ["interpolate",["linear"],["zoom"], 6,0, 9,1]);
    }
  }

  const st = { ready:false, engine:null, map:null, markers:new Map(),
               base:"ofm", transit:false, focus:null, show:new Set(["yes","maybe","none","no"]),
               curDay:null, flat:null, addOpen:false, legendOpen:false };

  const geo = p => p && p.coord && typeof p.coord.lon === "number" && typeof p.coord.lat === "number";
  const pts = () => PLACES.filter(geo);
  const kind = p => p.choice || "none";

  /* 住宿不参与「想去 / 待定 / 不想去」的筛选。
     那三个词是对**候选景点**的取舍，而酒店是行程的锚点，不是候选项 ——
     没人会「待定」自己已经订好的酒店。原来它 choice=null 就掉进「未表态」桶里，
     语义上是错的，而且会让计数虚高。改成常显、且不计入任何一类。 */
  const shown = p => isLodging(p) || st.show.has(kind(p));
  const COLOR = { yes:"var(--ok)", maybe:"var(--warn)", no:"var(--ink-3)", none:"var(--accent)" };

  function center(){
    const l = pts();
    if(!l.length) return { lon:0, lat:0 };
    return { lon:l.reduce((s,p)=>s+p.coord.lon,0)/l.length,
             lat:l.reduce((s,p)=>s+p.coord.lat,0)/l.length };
  }

  /* ---------- 资源加载 ---------- */
  const loaded = new Set();
  function inject(tag, attrs){
    const key = attrs.src || attrs.href;
    if(loaded.has(key)) return Promise.resolve();
    return new Promise((res, rej) => {
      const el = document.createElement(tag);
      Object.assign(el, attrs);
      el.onload  = () => { loaded.add(key); res(); };
      el.onerror = () => rej(new Error("加载失败：" + key));
      document.head.appendChild(el);
    });
  }
  const loadJS  = src  => inject("script", { src });
  const loadCSS = href => inject("link", { rel:"stylesheet", href });

  function hasWebGL(){
    try{
      const c = document.createElement("canvas");
      return !!(c.getContext("webgl2") || c.getContext("webgl"));
    }catch(e){ return false; }
  }

  /* 行程中心点落在哪张瓦片上 —— 探测底图可用性时用它取一张「必定有内容」的瓦片，
     取空白海面的瓦片会让「几 KB 算正常」的判断失去意义。 */
  function centerTile(z){
    const c = center();
    const rad = c.lat * Math.PI / 180;
    return {
      z,
      x: Math.floor((c.lon + 180) / 360 * 2 ** z),
      y: Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * 2 ** z),
    };
  }

  /* ---------- OSM 封禁瓦片探测 ----------
     封禁响应是一张 256×256 的 PNG，内容是「Access blocked 403」，
     大小约 6987 字节，HTTP 状态码却是 200。
     只看状态码或 onerror 永远发现不了，必须看字节数。 */
  async function osmUsable(){
    if(!location.protocol.startsWith("http")) return false;
    const { z, x, y } = centerTile(12);
    try{
      const r = await fetch(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`, { cache:"no-store" });
      if(!r.ok) return false;
      const b = await r.blob();
      return b.size > 12000;   // 真实城市瓦片通常 20-50KB，封禁瓦片约 7KB
    }catch(e){ return false; }
  }


  function note(html){
    const n = $("#map-note");
    n.innerHTML = html || "";
    n.classList.toggle("on", !!html);
  }

  /* ---------- 底图切换按钮 ----------
     OSM 探测是异步的。必须在探测回来后重新检查 st.degraded，
     否则会把降级模式下刚禁用的按钮又启用回去（实测踩过）。 */
  function paintBaseButtons(){
    $("#basemaps").innerHTML = BASEMAPS.map(b =>
      `<button data-base="${b.id}" aria-pressed="${b.id === st.base}">${b.label}</button>`).join("");
  }

  function lockBaseButtons(reason){
    $$("#basemaps button").forEach(b => {
      b.disabled = true;
      b.title = reason;
      b.setAttribute("aria-pressed", b.dataset.base === st.base);
    });
  }

  const PROBES = {
    osm: {
      test: osmUsable,
      offline: "本地文件打开时浏览器不发送 Referer，OSM 官方瓦片会返回一张写着「Access blocked」的图片（HTTP 状态码仍是 200）。用 build.py --serve 以 http 打开即可解锁。",
      ok:   "OpenStreetMap 官方底图",
      fail: "探测到 OSM 返回封禁瓦片（约 7KB 的「Access blocked」图），已停用",
    },
  };

  async function probe(id){
    const sel = `#basemaps [data-base="${id}"]`;
    const btn = document.querySelector(sel);
    const cfg = PROBES[id];
    if(!btn || !cfg) return;
    if(!location.protocol.startsWith("http")){
      btn.disabled = true; btn.title = cfg.offline; return;
    }
    btn.disabled = true;
    btn.title = "正在探测是否可用…";
    const ok = await cfg.test();
    if(st.degraded) return;                       // 降级后不要复活按钮
    const b2 = document.querySelector(sel);       // 探测期间按钮可能已被重绘
    if(!b2) return;
    b2.disabled = !ok;
    b2.title = ok ? cfg.ok : cfg.fail;
  }

  /* ---------- 瓦片持续失败的监听 ----------
     实测教训：startMapLibre 里的 once("error") 只覆盖启动阶段，之后切底图
     或叠加图层再失败，错误就只剩 console 里的 AJAXError，页面上完全没反应——
     按钮亮着、图层也加上了，就是不出图，用户只会觉得「点了没用」。 */
  const deadBases = new Set();
  function watchTiles(){
    let hits = 0, watching = st.base, timer = null;
    st.map.on("error", ev => {
      const msg = String((ev && ev.error && ev.error.message) || (ev && ev.message) || "");
      if(!/AJAX|Failed to fetch|NetworkError|Load failed/i.test(msg)) return;
      if(watching !== st.base){ watching = st.base; hits = 0; }
      if(deadBases.has(watching)) return;
      hits++;
      clearTimeout(timer);
      timer = setTimeout(() => { hits = 0; }, 8000);   // 偶发的单张失败不算数
      if(hits < 5) return;

      deadBases.add(watching);
      const b = BASEMAPS.find(x => x.id === watching);
      const btn = document.querySelector(`#basemaps [data-base="${watching}"]`);
      if(btn){ btn.disabled = true; btn.title = "瓦片持续加载失败，已停用：" + msg; }
      note(`<b>「${b ? b.label : watching}」底图的瓦片加载失败</b>，已自动切回标准底图。`
         + `控制台原始错误：<code>${esc(msg)}</code>`);
      if(watching !== "gb") switchBase("gb");
    });
  }

  /* ---------- 样式构造 ----------
     异步：graybeard 的 style 要先抓下来、把 sources 改指 OSM 官方端点再交给
     MapLibre。其余两个是常量，await 一个非 Promise 也没有代价。 */
  async function styleFor(id){
    const b = BASEMAPS.find(x => x.id === id) || BASEMAPS[0];
    if(b.kind === "vector") return typeof b.style === "function" ? await b.style() : b.style;
    // 光栅 style 也要给 glyphs —— 底图本身不需要（图片里已经有字了），
    // 但地铁层的线号和站名是我们自己画的 symbol 图层，缺了字体服务
