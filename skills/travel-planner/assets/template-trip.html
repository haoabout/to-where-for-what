<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程</title>
<style>
/* ═══════════════════════════════════════════════ 设计令牌 */
:root{
  --paper:#faf8f4; --paper-2:#f2eee7; --card:#fffefc;
  --ink:#1f1b16; --ink-2:#5c544a; --ink-3:#918879;
  --line:#e3ddd2; --line-2:#d0c8ba;
  --accent:#b5442a; --accent-soft:#f6e7e2;
  --ok:#2f6b4f; --ok-soft:#e6f0ea;
  --warn:#9a6414; --warn-soft:#fbf0dc;
  --danger:#a8322b; --danger-soft:#fae9e7;
  --mute:#8d8577;
  --serif:Georgia,"Songti SC","Hiragino Mincho ProN","Noto Serif CJK SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(31,27,22,.05),0 4px 14px rgba(31,27,22,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#16130f; --paper-2:#1d1915; --card:#211c17;
    --ink:#ece6dc; --ink-2:#b3a999; --ink-3:#877d6d;
    --line:#332c24; --line-2:#443b31;
    --accent:#e0765a; --accent-soft:#3a221c;
    --ok:#7fbd9c; --ok-soft:#1c2b23;
    --warn:#d9a95c; --warn-soft:#2e2617;
    --danger:#e08079; --danger-soft:#33201e;
    --mute:#7d7466;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
/* 任何显式 display 规则都会压过 [hidden] 的浏览器默认样式。
   .tabs{display:flex} 就让 standalone 模式下的 hidden 完全失效，
   页面仍显示着指向已删除视图的 tab。这一条必须放在所有布局规则之前。 */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:15px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ═══════════════════════════════════════════════ 头部 */
.top{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{
  font:400 25px/1.2 var(--serif);margin:0;letter-spacing:.2px;
}
.brand .sub{color:var(--ink-3);font-size:13px}
.brand .sub b{color:var(--ink-2);font-weight:600}
.stale{
  background:var(--warn-soft);color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  padding:1px 8px;border-radius:20px;font-size:11.5px;
}

.tabs{display:flex;gap:2px;margin-top:12px;align-items:center}
.tab-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.tab-actions .hint{font-size:11.5px;color:var(--ink-3)}
.btn.sm{padding:5px 11px;font-size:12.5px}
@media (max-width:760px){ .tab-actions .hint{display:none} }
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 15px 11px;color:var(--ink-3);font-size:14px;font-weight:500;
  display:flex;align-items:center;gap:7px;transition:color .15s;
}
.tab:hover:not(:disabled){color:var(--ink-2)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab:disabled{color:var(--line-2);cursor:not-allowed}
.tab .n{
  font:600 10.5px/1 var(--mono);background:var(--paper-2);color:var(--ink-3);
  padding:3px 6px;border-radius:20px;border:1px solid var(--line);
}
.tab[aria-selected=true] .n{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ═══════════════════════════════════════════════ 进度 */

/* 视图①工具栏右侧的小计数。清单页是做选择的地方，实时看到四类各多少
   最有用；地图视图那边则直接挂在筛选按钮上。 */
.tally{display:flex;gap:11px;font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.tally span{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-yes{background:var(--ok)} .d-maybe{background:var(--warn)} .d-no{background:var(--line-2)} .d-none{background:var(--line-2);opacity:.45}

/* ═══════════════════════════════════════════════ 主体 */
main{max-width:1180px;margin:0 auto;padding:20px 20px 130px}
.view[hidden]{display:none}

/* 工具栏 */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search{
  flex:1;min-width:190px;padding:8px 13px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);color:var(--ink);font-size:14px;
}
.search::placeholder{color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:8px 13px;font-size:13px;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--paper-2);color:var(--ink);font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:5px 12px;border-radius:20px;font-size:12.5px;transition:.15s;
}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{opacity:.55;font-size:11px;margin-left:3px}

/* 分组 */
.group{margin-bottom:34px}
.group-h{
  display:flex;align-items:baseline;gap:10px;
  padding-bottom:9px;margin-bottom:15px;border-bottom:1px solid var(--line);
}
.group-h h2{font:600 15px/1 var(--sans);margin:0;letter-spacing:.3px}
.group-h .meta{font-size:12px;color:var(--ink-3);margin-left:auto;font-family:var(--mono)}

/* ═══════════════════════════════════════════════ 卡片 */
.cards{display:grid;gap:13px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s,opacity .2s;
}
.card:hover{border-color:var(--line-2)}
.card[data-choice=no]{opacity:.5}
.card[data-choice=no]:hover{opacity:.82}
/* 选择状态由三态按钮和圆点表达，不再加彩色左边框：
   同一件事说三遍是冗余，而 3px 彩色侧边条又是最容易辨认的模板化特征。 */

.card-in{display:flex;gap:15px;padding:14px}
.thumb{
  width:112px;height:88px;flex:none;border-radius:7px;overflow:hidden;
  background:var(--paper-2);position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.empty::after{
  content:attr(data-ch);position:absolute;inset:0;display:grid;place-items:center;
  font:400 25px var(--serif);color:var(--line-2);
}
.body{flex:1;min-width:0}
.hd{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.nm{font:500 17px/1.35 var(--serif);cursor:pointer;letter-spacing:.2px}
.nm:hover{color:var(--accent)}
.loc{font-size:12.5px;color:var(--ink-3);align-self:center}
.tier{
  font:700 10.5px/1 var(--mono);padding:3.5px 6px;border-radius:4px;align-self:center;
  border:1px solid transparent;letter-spacing:.5px;
}
.t-S{background:var(--accent);color:#fff} .t-A{background:var(--accent-soft);color:var(--accent)}
.t-B{background:var(--paper-2);color:var(--ink-2);border-color:var(--line)}
.t-C{background:transparent;color:var(--ink-3);border-color:var(--line)}
.stars{color:var(--accent);font-size:12px;letter-spacing:1px;align-self:center}
.stars i{color:var(--line-2);font-style:normal}

.pitch{color:var(--ink-2);font-size:13.5px;margin:6px 0 0}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-3)}
.facts span{display:flex;align-items:center;gap:4px;white-space:nowrap}

.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.flag{
  font-size:11.5px;padding:3px 9px;border-radius:5px;display:flex;align-items:center;gap:4px;
  border:1px solid transparent;
}
.f-danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 22%,transparent)}
.f-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.f-info{background:var(--paper-2);color:var(--ink-3);border-color:var(--line)}
.f-unverified{
  background:repeating-linear-gradient(-45deg,var(--warn-soft),var(--warn-soft) 5px,transparent 5px,transparent 10px);
  color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);font-weight:600;
}
/* 核实被拦截的景点：卡片内有完整的 .verify-box 说明，顶部筛选条还有
   「⚠ 待你确认」把它们一次性挑出来 —— 那比一条边框更好用，所以边框去掉。 */
.verify-box{
  margin-top:10px;padding:9px 12px;border-radius:7px;font-size:12.5px;line-height:1.6;
  background:var(--warn-soft);border:1px dashed color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink-2);
}
.verify-box b{color:var(--warn)}
.verify-box ul{margin:6px 0 0;padding-left:18px}
.verify-box li{margin:2px 0}

/* 三态 */
.pick{display:flex;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content}
.pick button{
  background:var(--card);border:0;border-right:1px solid var(--line);
  padding:6px 15px;font-size:12.5px;color:var(--ink-3);transition:.12s;
}
.pick button:last-child{border-right:0}
.pick button:hover{background:var(--paper-2);color:var(--ink-2)}
.pick button[aria-pressed=true]{font-weight:600}
.pick button.y[aria-pressed=true]{background:var(--ok);color:#fff}
.pick button.m[aria-pressed=true]{background:var(--warn);color:#fff}
.pick button.n[aria-pressed=true]{background:var(--ink-3);color:var(--paper)}
.why{font-size:12px;color:var(--ink-3);margin-top:7px;font-style:italic}

/* 折叠的打卡点 */
.spots{margin:11px 0 0;padding:9px 0 0;border-top:1px dashed var(--line);}
.spots-h{font-size:11.5px;color:var(--ink-3);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.spot{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;flex-wrap:wrap}
.spot .sn{cursor:pointer;font-weight:500}
.spot .sn:hover{color:var(--accent)}
.spot .sd{color:var(--ink-3);font-size:11.5px}
.spot .pick{margin:0 0 0 auto;transform:scale(.88);transform-origin:right center}

/* ═══════════════════════════════════════════════ 底部操作条 */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-top:1px solid var(--line);
}
.actionbar-in{
  max-width:1180px;margin:0 auto;padding:11px 20px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:500;transition:.15s;
}
.btn:hover{border-color:var(--line-2);background:var(--paper-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.87;background:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--ink-3);margin-left:auto;text-align:right;max-width:52ch}

/* ═══════════════════════════════════════════════ 弹窗 */
dialog{
  border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
  padding:0;max-width:660px;width:calc(100vw - 34px);max-height:86vh;box-shadow:0 24px 70px rgba(0,0,0,.28);
}
dialog::backdrop{background:rgba(20,16,12,.5);backdrop-filter:blur(3px)}
.dlg-h{
  position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
  padding:17px 20px 13px;display:flex;align-items:flex-start;gap:12px;z-index:2;
}
.dlg-h h3{font:500 21px/1.3 var(--serif);margin:0;flex:1}
.dlg-h .x{background:none;border:0;font-size:22px;color:var(--ink-3);line-height:1;padding:2px 6px;border-radius:6px}
.dlg-h .x:hover{background:var(--paper-2);color:var(--ink)}
.dlg-b{padding:17px 20px 22px;overflow-y:auto}
.dlg-b h4{font:600 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);margin:20px 0 8px}
.dlg-b h4:first-child{margin-top:0}
.dlg-b p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.dlg-img{width:100%;border-radius:9px;margin-bottom:14px;display:block}
.credit{font-size:11px;color:var(--ink-3);margin:-9px 0 15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 15px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink-2)}
.srcs{list-style:none;padding:0;margin:0;font-size:13.5px}
.srcs li{margin-bottom:5px}
.srcs a{word-break:break-all}

.reasons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.reasons button{
  border:1px solid var(--line);background:var(--card);padding:6px 13px;
  border-radius:20px;font-size:13px;color:var(--ink-2);
}
.reasons button:hover,.reasons button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  color:var(--ink);padding:9px 11px;font:14px var(--sans);resize:vertical;min-height:66px;
}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;margin-top:15px}
pre.code{
  background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
  padding:12px;font:12.5px/1.7 var(--mono);white-space:pre-wrap;word-break:break-all;margin:0 0 12px;
}

/* ═══════════════════════════════════════════════ 地图视图 */
/* 地图视图突破正文的 1180px 上限。那个宽度是为行长可读性设的——
   清单和攻略是要逐行读的文字，太宽反而难读；地图不是文字，越宽越好用。
   排程模式加了一栏之后尤其明显：不放宽的话地图会从 794px 掉到 668px。
   用 margin-left 负值撑开而不是 transform，后者会改变绝对定位的包含块。 */
#view-map{
  --vw:min(1640px, calc(100vw - 40px));
  width:var(--vw);margin-left:calc(50% - var(--vw) / 2);
}

/* 筛选模式两栏，排程模式三栏：清单 | 日程 | 地图。
   清单与日程相邻，从池子拖进某一天是一次约 260px 的横移；
   把地图夹在中间的话这个距离会变成约 1160px，鼠标要划过整张地图，触屏基本没法用。 */
.map-wrap{display:grid;grid-template-columns:232px 212px 1fr;gap:14px;
  height:calc(100vh - 210px);min-height:460px}

.day-col{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;
}
.day-col .dc-head{
  position:sticky;top:0;z-index:2;background:var(--paper-2);
  padding:7px 10px;border-bottom:1px solid var(--line);
  font:600 11px/1 var(--sans);color:var(--ink-3);letter-spacing:.6px;
  display:flex;align-items:center;gap:6px;
}
.day-col .dc-head .sp{margin-left:auto;font-weight:400;letter-spacing:0}
.lnk{background:none;border:0;color:var(--ink-3);font-size:11px;padding:2px 4px;border-radius:4px;letter-spacing:0}
.lnk:hover{background:var(--line);color:var(--ink-2)}

/* 日期胶囊：长线行程用，平铺到第三天就开始无限滚动 */
.caps{display:flex;flex-wrap:wrap;gap:4px;padding:8px 9px;border-bottom:1px solid var(--line)}
.caps button{
  border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);
  padding:3px 8px;border-radius:6px;font:600 11.5px/1.5 var(--mono);
  display:flex;align-items:center;gap:4px;
}
/* 计数要有自己的底色，否则「D1」加「7」会被连读成「第 17 天」 */
.caps button .c{
  font-weight:600;font-size:9.5px;line-height:13px;min-width:13px;text-align:center;
  padding:0 3px;border-radius:7px;background:var(--line);color:var(--ink-3);
}
.caps button[aria-pressed=true]{color:var(--paper)}
.caps button[aria-pressed=true] .c{background:rgba(255,255,255,.28);color:#fff}

/* 每一天：标题栏 + 条目。点标题栏把它设为「当前天」 */
.dbox{border-bottom:1px solid var(--line)}
.dbox:last-child{border-bottom:0}
.dhead{
  display:flex;align-items:center;gap:7px;padding:8px 10px;cursor:pointer;
  background:var(--paper-2);transition:background .12s;
}
.dhead:hover{background:var(--line)}
.dbox.cur .dhead{background:color-mix(in srgb,var(--ink) 12%,var(--paper-2))}
.dhead .swatch{width:9px;height:9px;border-radius:50%;flex:none}
.dhead b{font:600 12.5px/1 var(--sans);color:var(--ink)}
.dhead s{margin-left:auto;text-decoration:none;font-size:10.5px;color:var(--ink-3)}
.dlist{padding:3px 0;min-height:34px}

/* 日程栏的条目只有一行：序号 + 名称。四五个点就要占满这一列，不能再多 */
.ditem{
  display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;
  font:500 12.5px/1.4 var(--sans);color:var(--ink-2);transition:background .12s;
}
.ditem:hover,.ditem.on{background:var(--paper-2)}
.ditem .n{
  flex:none;min-width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font:700 9.5px/1 var(--mono);color:#fff;
}
/* 名字用 .dnm 而不是 .nm —— 全局已有一个 .nm{font:500 17px/1.35 var(--serif)}
   是视图①的卡片标题。直接命中元素的规则永远压过从父元素继承来的字体，
   跟特异性无关，所以撞上之后 .ditem 里设的 12.5px sans 完全不起作用。 */
.ditem .dnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit}
.ditem.lod .dnm{color:var(--ink-3)}
.dempty{padding:9px 11px;font-size:11.5px;color:var(--ink-3)}
.map-side{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  display:flex;flex-direction:column;min-height:0;
}
.map-side>#map-list{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
/* 选择筛选并进清单栏顶部：它筛的就是下面这份列表，放在页面工具栏里等于把
   控件和它作用的对象拆开了。 */
.ms-head{
  padding:7px;border-bottom:1px solid var(--line);background:var(--paper-2);
  border-radius:var(--r) var(--r) 0 0;
}
.ms-head .seg{width:100%}
.ms-head .seg button{flex:1;padding:5px 2px;font-size:11px;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:3px}
.ms-head .seg button .c{
  font:600 9.5px/13px var(--mono);min-width:13px;padding:0 3px;border-radius:7px;
  background:var(--line);color:var(--ink-3);
}
.ms-head .seg button[aria-pressed=true] .c{background:rgba(255,255,255,.24);color:inherit}
.map-side .mi{
  display:flex;gap:9px;align-items:flex-start;padding:9px 12px;
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;
}
.map-side .mi:hover{background:var(--paper-2)}
.map-side .mi.on{background:var(--accent-soft)}
/* 与日程栏的序号圆圈同尺寸：两栏并排显示同一批地点，大小不一会显得是两套东西 */
.map-side .mi .pin{
  width:17px;height:17px;border-radius:50%;flex:none;margin-top:2px;
  display:grid;place-items:center;font:700 9.5px/1 var(--mono);color:#fff;
}
.map-side .mi .t{flex:1;min-width:0}
/* 严格两行：名称一行、元信息一行。原来把整段票价文案铺进来，
   一个条目能占五六行，三栏布局下这一列只有 ~230px，根本放不下。 */
/* 清单栏与日程栏的条目必须同字体同字号 —— 它们并排显示同一批地点，
   字号不一致会让人以为是两种不同的东西。统一按小的来。 */
.map-side .mi .t b{
  display:block;font:500 12.5px/1.4 var(--sans);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.map-side .mi .t s{
  display:flex;align-items:center;gap:5px;margin-top:2px;
  font-size:11.5px;color:var(--ink-3);text-decoration:none;
  overflow:hidden;white-space:nowrap;
}
.map-side .mi .t s em{font-style:normal;flex:none}
.map-side .mi .t s .w{
  flex:none;padding:0 5px;border-radius:4px;font-size:10.5px;line-height:15px;
  background:var(--warn-soft);color:var(--warn);
}
.map-side .mi.on{background:var(--paper-2)}
.map-side .grp{
  position:sticky;top:0;background:var(--paper-2);padding:6px 12px;
  font:600 11px/1 var(--sans);color:var(--ink-3);letter-spacing:.6px;
  border-bottom:1px solid var(--line);z-index:1;
}
.map-main{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper-2)}
#map-canvas{position:absolute;inset:0}
.map-bar{
  position:absolute;top:10px;left:10px;right:10px;z-index:5;
  display:flex;gap:7px;flex-wrap:wrap;pointer-events:none;
}
.map-bar>*{pointer-events:auto}
.mgroup{
  display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);box-shadow:var(--shadow);
}
.mgroup button{
  background:none;border:0;border-right:1px solid var(--line);
  padding:6px 11px;font-size:12px;color:var(--ink-3);white-space:nowrap;
}
.mgroup button:last-child{border-right:0}
.mgroup button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:600}
.mgroup button:disabled{opacity:.38;cursor:not-allowed}
/* 图例默认只显示线号色块（两行就够），点一下才展开全名。
   12 条线的完整列表要 210×340px，占掉地图 14% 的面积，而且正好压在
   左上角的点位上 —— 常驻显示是不合适的。 */
#map-legend{
  position:absolute;top:52px;left:10px;z-index:5;max-width:212px;cursor:pointer;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  box-shadow:var(--shadow);font-size:11.5px;line-height:1.5;
}
#map-legend .lg-chips{display:flex;flex-wrap:wrap;gap:4px}
#map-legend .lg-ref{
  min-width:16px;text-align:center;font-weight:700;font-size:10.5px;line-height:16px;
  color:#fff;border-radius:3px;padding:0 4px;text-shadow:0 0 2px rgba(0,0,0,.45);
}
#map-legend .lg-list{display:none;margin-top:6px;max-height:min(40vh,300px);overflow:auto}
#map-legend.open .lg-list{display:block}
#map-legend.open .lg-chips{display:none}
#map-legend .lg-row{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
#map-legend .lg-row+.lg-row{margin-top:3px}
#map-legend .lg-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#map-legend .lg-foot{margin-top:6px;padding-top:5px;border-top:1px solid var(--line);color:var(--ink-3);font-size:10.5px}
#map-legend .lg-hint{color:var(--ink-3);font-size:10px;margin-top:5px}
.map-note{
  position:absolute;left:10px;bottom:10px;right:10px;z-index:5;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11.5px;
  color:var(--ink-2);box-shadow:var(--shadow);display:none;
}
.map-note.on{display:block}
.map-note b{color:var(--danger)}
.attrib{
  position:absolute;right:8px;bottom:8px;z-index:4;font-size:10px;color:var(--ink-3);
  background:color-mix(in srgb,var(--paper) 78%,transparent);padding:2px 7px;border-radius:4px;
}
.attrib a{color:inherit}

/* 地图 marker（HTML 元素，可承载中文名与序号）
   注意：不要在这里设 position 或 transform —— MapLibre 会给 marker 元素加
   .maplibregl-marker（position:absolute）并用 inline transform 定位。
   我们插手任何一个，marker 都会脱离地图坐标系。静态兜底图另有自己的定位规则。 */
.mk{cursor:pointer}
/* 尺寸、填充、描边、数字全部由 styleDot() 内联设置 —— 双层编码要在
   一个地方决定完，散到 CSS 里就会出现「改了 JS 忘了改 .no:not(.placed)」。
   这里只留与状态无关的形状和过渡。 */
.mk i{
  display:grid;place-items:center;border-radius:50%;
  font:700 11px/1 var(--mono);color:#fff;font-style:normal;
  /* 只过渡 transform。尺寸随「是否已排入」变化，是一次数据驱动的离散跳变，
     不需要补间；而 47 个绝对定位的 marker 同时做 width/height 过渡会在每次
     refresh 时引发成片的布局重算。 */
  transition:transform .14s;
}
.mk:hover i,.mk.on i,.mk.hi i{transform:scale(1.28)}
.mk.on::after,.mk.hi::after{
  content:attr(data-nm);position:absolute;left:15px;top:-7px;white-space:nowrap;
  background:var(--ink);color:var(--paper);font-size:11px;padding:3px 8px;border-radius:5px;
}

/* 静态兜底：所有瓦片源都挂了时，至少还能看清相对位置 */
.static-map{position:absolute;inset:0;background:var(--paper-2)}
.static-map .sm-grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:52px 52px}
/* 静态兜底图里的定位由我们自己负责（用 left/top 百分比 + 居中位移），
   这是唯一该给 .mk 设 position/transform 的地方 */
.static-map .mk{position:absolute;transform:translate(-50%,-50%)}

/* 窄屏降级。没做抽屉：抽屉会把两栏藏进隐藏状态，而排程时你恰恰要同时看见
   池子、日程和地图。改成往下堆，地图始终留足高度。 */
@media (max-width:1180px){
  .map-wrap{grid-template-columns:1fr 1fr;grid-template-rows:minmax(180px,34vh) 1fr;height:auto}
  .map-wrap .map-main{grid-column:1 / -1;height:min(56vh,540px)}
}
@media (max-width:860px){
  .map-wrap{grid-template-columns:1fr;grid-template-rows:none;height:auto}
  .map-side{max-height:250px}
  .day-col{max-height:260px}
  .map-wrap .map-main{height:440px}
}

/* ═══════════════════════════════════════════════ 攻略视图 */
.guide{max-width:800px;margin:0 auto}
.guide h1,.guide h2{font-family:var(--serif);font-weight:400;letter-spacing:.2px}
.guide h1{font-size:29px;margin:34px 0 14px}

}

.guide h4{font:600 13.5px/1.4 var(--sans);margin:19px 0 7px;color:var(--ink-2)}
.guide p{margin:0 0 13px;color:var(--ink-2);font-size:15px;line-height:1.78}
.guide ul,.guide ol{margin:0 0 15px;padding-left:23px;color:var(--ink-2)}

.guide blockquote{

/* 时间轴：对 route.md 里以时间开头的条目做渐进增强 */
.guide li.tl{list-style:none;position:relative;padding-left:16px;margin-bottom:11px}

/* 天气条 */
.wx{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.wx-d{

/* 费用 / 对照表 */
.sum{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:17px}

  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
}
.sum-h span{margin-left:auto;font-family:var(--mono);color:var(--ink-3);font-weight:400}
.ck{display:flex;align-items:center;gap:9px;padding:7px 13px;border-bottom:1px solid var(--line);font-size:13.5px}
.ck:last-child{border-bottom:0}
.ck .m{width:17px;flex:none;text-align:center}
.ck .n{flex:1;min-width:0}
.ck .n s{color:var(--ink-3);text-decoration:none;font-size:11.5px;margin-left:7px}

  display:flex;align-items:baseline;gap:10px;padding:11px 13px;
  background:var(--paper-2);border-top:1px solid var(--line);font-size:13.5px;
}

/* ═══════════════════════════════════════════════ 空态 / 提示 */
.empty-state{text-align:center;padding:66px 20px;color:var(--ink-3)}
.empty-state .big{font:400 21px var(--serif);color:var(--ink-2);margin-bottom:9px}
.toast{
  position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);padding:10px 19px;border-radius:9px;
  font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 26px rgba(0,0,0,.25);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .brand h1{font-size:21px}
  .card-in{flex-direction:column;gap:11px}
  .thumb{width:100%;height:150px}
  .hint{margin-left:0;text-align:left;max-width:none}

}
@media print{
  .top,.actionbar,.toolbar,.chips,.pick{display:none!important}
  .card{break-inside:avoid;box-shadow:none}

<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="title">行程</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-list"  aria-selected="true"  data-view="list">景点清单 <span class="n" id="n-list">0</span></button>
      <button class="tab" role="tab" id="tab-map"   aria-selected="false" data-view="map">地图</button>
      <button class="tab" role="tab" id="tab-guide" aria-selected="false" data-view="guide" disabled>攻略</button>
      <div class="tab-actions" id="map-actions" hidden>
        <button class="btn sm" id="exp-csv">导出 CSV</button>

</header>

<main>
  <!-- ══════════════ 视图① 景点清单 ══════════════ -->
  <section class="view" id="view-list">
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="搜索名称、亮点、标签…" autocomplete="off">
      <div class="seg" role="group" aria-label="分组方式">
        <button id="by-area" aria-pressed="true">按区域</button>
        <button id="by-tier" aria-pressed="false">按推荐度</button>
      </div>
      <div class="seg" role="group" aria-label="显示范围">
        <button id="f-all"  aria-pressed="true">全部</button>
        <button id="f-todo" aria-pressed="false">未表态</button>

  <!-- ══════════════ 视图② 地图 ══════════════ -->
  <section class="view" id="view-map" hidden>
    <div class="map-wrap" id="map-wrap">
      <div class="map-side">
        <div class="ms-head">
          <div class="seg" role="group" aria-label="显示哪些选择">
            <button class="mfil" data-c="yes"   aria-pressed="true">想去<span class="c">0</span></button>
            <button class="mfil" data-c="maybe" aria-pressed="true">待定<span class="c">0</span></button>
            <button class="mfil" data-c="none"  aria-pressed="true">未表态<span class="c">0</span></button>
            <button class="mfil" data-c="no"    aria-pressed="true">不想去<span class="c">0</span></button>
          </div>
        </div>
        <div id="map-list"></div>
      </div>
      <div class="day-col" id="day-col"></div>
      <div class="map-main">
        <div id="map-canvas"></div>
        <div class="map-bar">
          <div class="mgroup" id="basemaps"></div>
          <div class="mgroup" id="transit-group" hidden>
            <button id="transit-btn" aria-pressed="false">地铁</button>
          </div>
