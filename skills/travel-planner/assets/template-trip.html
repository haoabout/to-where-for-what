    // 会静默不出字：图层在、要素也被放置，就是一个字看不见。
    return {
      version:8,
      glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
      sources:{ base:{ type:"raster", tiles:b.tiles, tileSize:256,
                       maxzoom:b.maxZoom || 19, attribution:"" } },
      layers:[{ id:"base", type:"raster", source:"base" }],
    };
  }

  const schemaOf = id => (BASEMAPS.find(x => x.id === id) || {}).schema;

  function setAttrib(){
    const b = BASEMAPS.find(x => x.id === st.base);
    $("#attrib").innerHTML = b ? b.attrib
      : (st.engine === "leaflet" ? OSM_ATTRIB + " © CARTO" : "");
  }

  /* ═══════════════ 轨道交通叠加层 ═══════════════
     数据由 enrich.py --transit 从 OSM 抓好、build.py 内联进来，
     运行期零网络请求。这跟底图无关 —— 三个底图上都能开，file:// 也能用。

     为什么不用现成的地铁专题瓦片（试过 ÖPNVKarte，已放弃）：
       那是一整幅不透明光栅图，盖上去等于换底图；而且它按「交通方式」上色，
       八条地铁线全是同一个蓝，还混着大量公交线。
     自己画的好处：线路用 OSM 的 colour 标签，也就是官方色，一条一个颜色。 */
  const TRANSIT_SRC = "transit-lines", STATION_SRC = "transit-stations";
  const T_LAYERS = ["transit-line", "transit-line-label", "transit-station", "transit-station-label"];

  const hasTransit = () => !!(TRANSIT && (TRANSIT.lines?.features || []).length);

  /* 字体名必须从当前 style 里取，不能写死。
     实测：graybeard 的 glyphs 服务认的是 "noto_sans_bold"，positron 认的是
     "Noto Sans Bold" —— 写死任何一个，换到另一个底图时标注会一个都不出，
     而且 MapLibre 对缺失字体是静默失败，图层看着正常就是没字。 */
  function pickFont(map, bold){
    const fonts = [];
    for(const l of map.getStyle().layers){
      const f = (l.layout || {})["text-font"];
      if(Array.isArray(f)) for(const x of f) if(typeof x === "string" && !fonts.includes(x)) fonts.push(x);
    }
    const want = bold ? /bold/i : /regular|book|normal/i;
    return [fonts.find(f => want.test(f)) || fonts[0] || "Noto Sans Regular"];
  }

  function addTransit(){
    if(!hasTransit() || st.engine !== "maplibre" || !st.map) return;
    const m = st.map;
    const FONT_B = pickFont(m, true), FONT_R = pickFont(m, false);
    if(!m.getSource(TRANSIT_SRC)) m.addSource(TRANSIT_SRC, { type:"geojson", data:TRANSIT.lines });
    if(!m.getSource(STATION_SRC)) m.addSource(STATION_SRC, { type:"geojson", data:TRANSIT.stations || { type:"FeatureCollection", features:[] } });

    if(!m.getLayer("transit-line")) m.addLayer({
      id:"transit-line", type:"line", source:TRANSIT_SRC,
      layout:{ "line-cap":"round", "line-join":"round" },
      paint:{
        "line-color":["get","colour"],
        "line-width":["interpolate",["linear"],["zoom"], 9,1.6, 12,2.8, 15,4.6, 17,6.5],
        "line-opacity":0.9,
      },
    });
    // 线号沿线重复标注。symbol-placement:line 会让文字跟着线走，
    // 这正是纸质地铁图的读法：顺着一条颜色走，随时知道自己在哪条线上。
    if(!m.getLayer("transit-line-label")) m.addLayer({
      id:"transit-line-label", type:"symbol", source:TRANSIT_SRC, minzoom:11,
      layout:{
        "symbol-placement":"line", "symbol-spacing":190,
        "text-field":["get","ref"], "text-size":11, "text-font":FONT_B,
        "text-allow-overlap":false, "text-padding":3,
      },
      paint:{ "text-color":["get","colour"], "text-halo-color":MI().halo, "text-halo-width":1.8 },
    });
    if(!m.getLayer("transit-station")) m.addLayer({
      id:"transit-station", type:"circle", source:STATION_SRC, minzoom:12,
      paint:{
        "circle-radius":["interpolate",["linear"],["zoom"], 12,1.8, 15,3.4, 17,4.6],
        "circle-color":MI().station, "circle-stroke-color":MI().stationEdge, "circle-stroke-width":1.2,
      },
    });
    // 站名从 z13 起才出 —— 129 个站在缩小时会糊成一片
    if(!m.getLayer("transit-station-label")) m.addLayer({
      id:"transit-station-label", type:"symbol", source:STATION_SRC, minzoom:13,
      layout:{
        // 不能只用 coalesce —— 它把空字符串当有效值。数据可能是手工改过的，
        // 这里按「长度 > 0」判断，enrich.py 那边也已经不再写空串。
        "text-field":["case",
          [">", ["length", ["coalesce", ["get","name_zh"], ""]], 0], ["get","name_zh"],
          ["get","name"]],
        "text-size":["interpolate",["linear"],["zoom"], 13,9.5, 16,12],
        "text-font":FONT_R, "text-offset":[0,0.95],
        "text-anchor":"top", "text-optional":true, "text-padding":2,
      },
      paint:{ "text-color":MI().stationLabel, "text-halo-color":MI().halo, "text-halo-width":1.6 },
    });
    setTransitVisible(st.transit);
  }

  function setTransitVisible(on){
    st.transit = !!on;
    const btn = $("#transit-btn");
    if(btn) btn.setAttribute("aria-pressed", String(st.transit));
    $("#map-legend").hidden = !st.transit;
    if(st.engine !== "maplibre" || !st.map) return;
    for(const id of T_LAYERS){
      if(st.map.getLayer(id)) st.map.setLayoutProperty(id, "visibility", st.transit ? "visible" : "none");
    }
  }

  function paintLegend(){
    if(!hasTransit()) return;
    const feats = [...TRANSIT.lines.features].sort((a, b) =>
      String(a.properties.ref).localeCompare(String(b.properties.ref), "en"));
    const guessed = feats.filter(f => f.properties.guessed).length;
    const chip = p => `<span class="lg-ref" style="background:${esc(p.colour)}" `
                    + `title="${esc(p.name || p.ref)}">${esc(p.ref)}</span>`;
    $("#map-legend").innerHTML =
      `<button class="bare lg-toggle" type="button" aria-expanded="${st.legendOpen ? "true" : "false"}">`
    + `<span class="lg-chips">${feats.map(f => chip(f.properties)).join("")}</span>`
    + `<span class="lg-hint">点击${st.legendOpen ? "收起" : (feats.length > 0 ? "展开线路名" : "")}</span>`
    + `</button>`
    + `<div class="lg-list">`
    + feats.map(f => {
        const p = f.properties, nm = p.name || p.ref;
        return `<div class="lg-row">${chip(p)}<span class="lg-nm" title="${esc(nm)}">${esc(nm)}</span></div>`;
      }).join("")
    + (guessed
        ? `<div class="lg-foot">其中 ${guessed} 条 OSM 未标注官方配色，颜色为自动分配</div>`
        : `<div class="lg-foot">配色取自 OSM 的 colour 标签，即官方线路色</div>`)
    + `</div>`;
  }

  /* ═══════════════ 顺序线 ═══════════════
     把每天的点按数组顺序连起来，用当天的颜色。绕不绕路一眼可见 ——
     「中之岛 → 南港 → 梅田 → 天保山」这种来回折返在清单里看不出来，
     画成线立刻刺眼。这是「排完看一眼再调」的抓手。

     住宿也串进去：一天从酒店出发、回到酒店，那才是真实路线。
     缺坐标的点跳过（连过去会把线拉到 null 岛）。
     同一地点一天出现两次时线会折回它 —— 那是对的，本来就要回去。 */
  const ROUTE_SRC = "route-src";
  const R_LAYERS = ["route-line", "route-dir"];

  function routeData(){
    const feats = [];
    for(const d of ITIN){
      const pts = (d.places || [])
        .map(e => BY_ID[e && e.id])
        .filter(p => geo(p))
        .map(p => [p.coord.lon, p.coord.lat]);
      if(pts.length < 2) continue;      // 一个点连不成线
      const colour = dayColor(d.n);
      feats.push({ type:"Feature",
        properties:{ n:d.n, colour, arrow:arrowId(colour), cur:d.n === st.curDay ? 1 : 0 },
        geometry:{ type:"LineString", coordinates:pts } });
    }
    return { type:"FeatureCollection", features:feats };
  }

  function addRoute(){
    if(st.engine !== "maplibre" || !st.map) return;
    const m = st.map;
    // 图先注册，再建源和图层 —— 顺序反了的话首屏一个箭头都不会出
    let fresh = false;
    for(const d of ITIN) fresh = ensureArrow(m, dayColor(d.n)) || fresh;
    if(!m.getSource(ROUTE_SRC)) m.addSource(ROUTE_SRC, { type:"geojson", data:routeData() });

    if(!m.getLayer("route-line")) m.addLayer({
      id:"route-line", type:"line", source:ROUTE_SRC,
      layout:{ "line-cap":"round", "line-join":"round" },
      paint:{
        "line-color":["get","colour"],
        "line-width":["interpolate",["linear"],["zoom"], 10,2, 14,3.4, 17,4.6],
        // 非当前天压到 30%，否则多天同屏会成一团面条
        "line-opacity":["case",["==",["get","cur"],1], 0.85, 0.3],
        "line-dasharray":[2.4, 1.4],   // 虚线：和地铁的实线区分开，这是"我的路线"不是"轨道"
      },
    });

    // 方向箭头。只连线只能看出绕不绕，看不出先后 —— 而顺序正是这一步要定的东西。
    //
    // 用自己画的图标而不是「▶」字符：实测那个字形在我们用的 Noto Sans 字体集里
    // 根本不存在，MapLibre 静默不渲染，一个箭头都出不来（和当初 emoji 那个坑同源，
    // 都是依赖了不受控的字形）。canvas 现画则不依赖任何字体。
    if(!m.getLayer("route-dir")) m.addLayer({
      id:"route-dir", type:"symbol", source:ROUTE_SRC, minzoom:11,
      layout:{
        "symbol-placement":"line", "symbol-spacing":78,
        "icon-image":["get","arrow"],      // 每条线引用自己那张带天色的图
        "icon-size":1,
        "icon-allow-overlap":false, "icon-rotation-alignment":"map",
        "icon-keep-upright":false, "icon-padding":2,
      },
      paint:{ "icon-opacity":["case",["==",["get","cur"],1], 0.95, 0.3] },
    });
    if(fresh) relayoutArrows(m);
  }

  /* 箭头图标：canvas 画一个带白描边的三角，**每个天色各注册一张**。
     不用 SDF（SDF 能用 icon-color 上色，但它要真正的距离场，拿纯 alpha
     蒙版凑会在阈值处硬切、边缘很糙）。天色最多几种，逐色画一张更简单也更清楚。

     尺寸算过一次错：canvas 28px 配 pixelRatio:2 等于 14px 的图，
     再乘 icon-size 就是最终大小 —— 之前 24px/2×0.5 只有 6px，屏幕上几乎看不见。
     注意 setStyle 会清空已注册的图片，所以每次 addRoute 都要重新确认。 */
  const arrowId = colour => "route-arrow-" + colour.replace(/[^a-z0-9]/gi, "");

  /* 返回 true 表示这次真的新注册了图 —— 调用方据此决定要不要触发重排。 */
  function ensureArrow(m, colour){
    const id = arrowId(colour);
    if(m.hasImage && m.hasImage(id)) return false;
    const S = 28, c = document.createElement("canvas");
    c.width = c.height = S;
    const g = c.getContext("2d");
    g.beginPath();
    g.moveTo(S * 0.26, S * 0.14);
    g.lineTo(S * 0.82, S * 0.50);
    g.lineTo(S * 0.26, S * 0.86);
    g.closePath();
    g.lineJoin = "round";
    g.lineWidth = S * 0.22;
    g.strokeStyle = "rgba(255,255,255,.95)";   // 白描边，压在深色底图上也认得出
    g.stroke();
    g.fillStyle = colour;
    g.fill();
    try{ m.addImage(id, g.getImageData(0, 0, S, S), { pixelRatio:2 }); }
    catch(e){ console.warn("方向箭头注册失败:", e); return false; }
    return true;
  }

  /* addImage 之后，已经排好版的 symbol 不会自动重排 —— 实测图片注册得比图层
     布局晚一步，箭头一个都不出，直到重设一次 layout 属性才冒出来。
     所以：新注册了图就把 icon-image 原样重设一遍，逼它重排。 */
  function relayoutArrows(m){
    if(m.getLayer("route-dir")) m.setLayoutProperty("route-dir", "icon-image", ["get", "arrow"]);
  }

  function refreshRoute(){
    if(st.engine !== "maplibre" || !st.map) return;
    let fresh = false;
    for(const d of ITIN) fresh = ensureArrow(st.map, dayColor(d.n)) || fresh;   // 天数可能变
    const src = st.map.getSource(ROUTE_SRC);
    if(src && src.setData) src.setData(routeData());
    else addRoute();
    if(fresh) relayoutArrows(st.map);
  }

  /* ---------- marker ---------- */
  /* ---------- 点位的双层编码 ----------
     填充 = 哪一天，描边 = 想去/待定/不想去，数字 = 当天第几个。
     「空心 = 还没安排，实心 = 已经安排」这个心理模型不用教。

     不做 3 种选择 × N 天的完整叉乘：那是 12+ 种点状符号，超过人眼能
     可靠分辨的上限。让两层不对等——色相给天（唯一能"一眼成簇"的通道），
     选择退到描边。

     几何全部在 JS 里算，CSS 只管形状和过渡。否则 `.no:not(.placed)`
     这类组合会散落在两处，改一个忘一个。 */
  /* 住宿图标。emoji 在不同系统上字形、字重、基线都不一样，和旁边的序号数字
     对不齐；而且它无法继承颜色。统一用同一段 SVG，尺寸按用处传。 */
  const house = (n = 13) => `<svg viewBox="0 0 24 24" width="${n}" height="${n}" `
    + `fill="currentColor" aria-hidden="true" style="display:block">`
    + `<path d="M12 3 2 11h3v10h6v-6h2v6h6V11h3z"/></svg>`;

  const ICON = {
    up:   stroke("M8 12.5V4M4.2 7.8 8 4l3.8 3.8"),
    down: stroke("M8 3.5V12M4.2 8.2 8 12l3.8-3.8"),
    del:  stroke("M4.5 4.5l7 7M11.5 4.5l-7 7"),
  };

  /* 未排入的一律 14px。以前想去/待定用 22px，结果是「还没决定的」比
     「已经排进某天的」更抢眼——地图上真正要一眼找到的是今天要去的点。
     现在只有排进日程才放大，尺寸本身就成了「定了没有」的信号。 */
  /* 只用 1–6：marker 之间要分先后，但整体必须待在地图浮层（底图按钮、
     图例、缩放控件、版权）**下面**。第一版用了 60–500，结果序号点直接
     盖住了「店铺」按钮——marker 和那些浮层在同一个层叠上下文里。 */
  const Z = { placed: 6, lodging: 5, yes: 4, maybe: 3, none: 2, no: 1 };

  function dotSpec(p){
    const lod = isLodging(p);
    const days = daysOf(p.id);
    const placed = days.length > 0;
    const k = kind(p);
    return {
      lod, days, placed, k,
      // 已排入的放大到 26px：3px 描边要在这个尺寸上才分得出绿/琥珀/灰
      dim: lod ? 24 : placed ? 26 : 14,
      // 「不想去」且未排入时是个低调小点，3px 环会把它整个吃掉
      ring: (k === "no" && !placed && !lod) ? 1.5 : 3,
      // 市中心几十个点会叠在一起，谁压在最下面就等于不存在。
      // 排进日程的永远在最上，其余按 想去 > 待定 > 未表态 > 不想去。
      z: placed ? Z.placed : lod ? Z.lodging : (Z[k] ?? Z.none),
    };
  }

  function styleDot(el, p){
    const dot = el.querySelector("i");
    if(!dot) return;
    const s = dotSpec(p);

    dot.style.width = dot.style.height = s.dim + "px";
    dot.style.borderRadius = s.lod ? "7px" : "50%";
    // z-index 设在外层 marker 元素上——MapLibre 的 DOM marker 之间靠
    // 文档顺序叠放，不设的话谁先创建谁在下面，跟重要性毫无关系。
    el.style.zIndex = s.z;

    // 填充。
    // 未排入用白色而不是 var(--paper)：marker 画在地图上，而三个底图
    // 全是浅色；页面本身是深色主题，--paper 是 #16130f 近黑，拿它当
    // 「空心」会变成深色实心，跟想表达的意思正好相反。
    // 侧栏的小圆点是另一回事——它坐在深色卡片上，那里 --paper 才是对的。
    if(s.lod){
      dot.style.background = MI().lodging;
    }else if(!s.placed){
      dot.style.background = MI().hollow;
    }else if(s.days.length === 1){
      dot.style.background = dayColor(s.days[0]);
    }else{
      // 多天：扇形分色。marker 是 DOM 元素而非 canvas 符号，
      // conic-gradient 直接可用——这是 DOM marker 的实际优势。
      const step = 100 / s.days.length;
      dot.style.background = "conic-gradient("
        + s.days.map((n, i) => `${dayColor(n)} ${i * step}% ${(i + 1) * step}%`).join(",") + ")";
    }

    // 描边。已排入时在填充与选择色之间夹一圈白——没有它，
    // 深蓝填充配绿描边在复杂底图上会糊成一片。
    //
    // 住宿不套选择色：它没有「想去/待定/不想去」这个语义，
    // 而它又必然 choice=null，套上去就成了满地的「未表态」橙圈，纯属误导。
    const shadow = "0 1px 5px rgba(0,0,0,.34)";
    if(s.lod){
      dot.style.boxShadow = `0 0 0 2px ${MI().ring}, ${shadow}`;
    }else{
      const c = COLOR[s.k];
      dot.style.boxShadow = s.placed
        ? `0 0 0 1.5px ${MI().ring}, 0 0 0 ${1.5 + s.ring}px ${c}, ${shadow}`
        : `0 0 0 ${s.ring}px ${c}, ${shadow}`;
    }

    // 数字只在排进某一天之后才出现；住宿永不编号
    if(s.lod){
      dot.innerHTML = house(13);
      dot.style.color = MI().onLodging;
    }else{
      const seq = firstSeq(p.id);
      dot.textContent = seq == null ? "" : String(seq);
      dot.style.color = "var(--on-day)";
      dot.style.fontSize = (seq == null ? 0 : 11) + "px";
    }
  }

  function markerEl(p){
    const el = document.createElement("div");
    // 这里可以直接赋 className：元素刚创建、还没交给 MapLibre，
    // 它的 .maplibregl-marker 类是在 new Marker() 之后才加上的。
    // 但此后任何时候都只能用 classList 增删（见 paintMarker）。
    el.className = "mk " + kind(p);
    el.dataset.id = p.id;
    el.dataset.nm = p.name;
    el.innerHTML = "<i></i>";
    styleDot(el, p);
    /* 点地图图标＝看它是什么。曾经做成「放进/移出当前天」，实际用起来
       不对：地图上认出一个点靠的是位置，而位置认出来之后第一反应是
       「这是哪儿」，不是「把它排进今天」——后者是看清楚之后才做的决定。
       排程仍然走清单栏的圆点、拖拽，以及详情弹窗底部的按钮。 */
    el.onclick = e => { e.stopPropagation(); openDetail(p.id); };
    return el;
  }

  function addMarkers(){
    st.markers.forEach(m => m.remove && m.remove());
    st.markers.clear();
    pts().forEach((p, i) => {
      const el = markerEl(p);
      if(st.engine === "maplibre"){
        const m = new maplibregl.Marker({ element:el }).setLngLat([p.coord.lon, p.coord.lat]).addTo(st.map);
        st.markers.set(p.id, m);
      }else if(st.engine === "leaflet"){
        const m = L.marker([p.coord.lat, p.coord.lon],
          { icon: L.divIcon({ className:"", html:el.outerHTML, iconSize:[22,22] }) }).addTo(st.map);
        m.on("click", () => focus(p.id, true));
        st.markers.set(p.id, m);
      }
      applyVis(p, el);
    });
    if(st.engine === "static") renderStatic();
  }

  function applyVis(p, el){
    const on = shown(p);
    const node = st.engine === "maplibre" ? (st.markers.get(p.id)?.getElement?.() || el) : el;
    if(node) node.style.display = on ? "" : "none";
  }

  /* 只增删我们自己的类，绝不整体覆盖 className。
     踩过的坑：`el.className = "mk " + kind(p)` 会把 MapLibre 自己加的
     .maplibregl-marker（携带 position:absolute）一并冲掉，marker 随即落入
     正常文档流，位置被前面所有 marker 的高度累加推偏——实测最大偏差 828px，
     且缩放时 marker 与底图各走各的。表现为「点一下某个点，所有点突然全乱」。 */
  const MK_STATE = ["yes", "maybe", "no", "none"];

  function paintMarker(el, p){
    el.classList.remove(...MK_STATE, "on");
    el.classList.add(kind(p));
    if(st.focus === p.id) el.classList.add("on");
    styleDot(el, p);
    el.style.display = shown(p) ? "" : "none";
  }

  function refresh(){
    renderDays();
    if(!st.ready) return;
    pts().forEach(p => {
      const m = st.markers.get(p.id);
      const el = st.engine === "maplibre" ? m?.getElement?.() : null;
      if(el) paintMarker(el, p);
    });
    if(st.engine === "static") renderStatic();
    if(st.engine === "leaflet"){ addMarkers(); }
    renderSide();
  }

  /* 侧栏小圆点走和地图 marker 同一套语义：填充=天、描边=选择、数字=当天序号。
     两处显示同一份数据，规则不一致会让人以为是 bug。 */
  function pinStyle(p){
    const s = dotSpec(p);
    const bg = s.lod ? "var(--lodging)"
             : !s.placed ? "var(--paper)"
             : s.days.length === 1 ? dayColor(s.days[0])
             : "conic-gradient(" + s.days.map((n, i) => {
                 const step = 100 / s.days.length;
                 return `${dayColor(n)} ${i * step}% ${(i + 1) * step}%`;
               }).join(",") + ")";
    const ring = s.lod ? "0 0 0 1.5px var(--card)"
               : s.placed ? `0 0 0 1.5px var(--card),0 0 0 3.5px ${COLOR[s.k]}`
               : `0 0 0 2px ${COLOR[s.k]}`;
    return `background:${bg};box-shadow:${ring}`;
  }
  function pinText(p){
    if(isLodging(p)) return house(11);
    const seq = firstSeq(p.id);
    return seq == null ? "" : String(seq);
  }

  /* ═══════════════ 日程栏 ═══════════════
     天数少就平铺（可以直接往任意一天拖），多了就切日期胶囊只展开当前天。
     阈值取 5：日程栏高约 600–700px，一天四五个点占 200–260px，
     平铺到第三天就开始滚动，超过五天会退化成无限滚动列表。 */
  const FLAT_MAX = 5;
  const WD = ["日", "一", "二", "三", "四", "五", "六"];

  // 都在正午构造，避开时区把日期整体推前/推后一天
  const parseISO = v => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ""));
    return m ? new Date(+m[1], +m[2] - 1, +m[3], 12) : null;
  };
  const toISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`
                   + `-${String(d.getDate()).padStart(2, "0")}`;
  const shiftISO = (v, k) => {
    const d = parseISO(v);
    if(!d) return null;
    d.setDate(d.getDate() + k);
    return toISO(d);
  };

  /* 要建几天、每天什么日期，trip.dates 里已经有了 —— 让用户点一下按钮去
     生成一份我们已经知道的东西，纯粹是多一道手续。所以页面自动建，
     用户什么都不用做，切过来就是就绪的空容器。
     A 阶段的 AI 不该预填 itinerary，否则两处都在造同一份数据，迟早对不上。 */
  function autoItinerary(){
    if(ITIN.length) return false;
    const start = parseISO((TRIP.dates || {}).start);
    const end   = parseISO((TRIP.dates || {}).end);
    if(start && end && end >= start){
      let cur = start, n = 1;
      while(cur <= end && n <= 60){
        ITIN.push({ n, date:toISO(cur), label:`第 ${n} 天`, places:[] });
        cur = new Date(cur); cur.setDate(cur.getDate() + 1); n++;
      }
    }else{
      // 日期缺失或格式不对：退回按天数建，date 留空。
      // 那时闭馆校验做不了，但容器仍然可用。
      const k = Math.max(1, Math.min(30, parseInt(TRIP.days, 10) || 1));
      for(let n = 1; n <= k; n++) ITIN.push({ n, date:null, label:`第 ${n} 天`, places:[] });
    }
    DATA.itinerary = ITIN;
    buildSched();
    return true;
  }

  function addDay(where){
    if(where === "zero"){
      if(ITIN.some(d => d.n === 0)) return;
      const first = ITIN.find(d => d.date);
      ITIN.unshift({ n:0, date:first ? shiftISO(first.date, -1) : null,
                     label:"第 0 天（抵达当晚）", places:[] });
    }else{
      const maxN = ITIN.reduce((a, d) => Math.max(a, d.n), 0);
      const last = [...ITIN].reverse().find(d => d.date);
      ITIN.push({ n:maxN + 1, date:last ? shiftISO(last.date, 1) : null,
                  label:`第 ${maxN + 1} 天`, places:[] });
    }
    st.curDay = where === "zero" ? 0 : ITIN[ITIN.length - 1].n;
    commit();
  }

  function removeDay(n){
    const i = ITIN.findIndex(d => d.n === n);
    if(i < 0) return;
    if((ITIN[i].places || []).length){ toast("这一天还有地点，先清空再删。"); return; }
    ITIN.splice(i, 1);
    if(st.curDay === n) st.curDay = ITIN.length ? ITIN[0].n : null;
    commit();
  }

  const dayLabel = d => d.label || (d.n === 0 ? "第 0 天" : `第 ${d.n} 天`);
  // 住宿不计入「几个景点」——每天首尾都有它，算进去这个数字就没意义了
  const dayCount = d => (d.places || []).filter(e => !isLodging(BY_ID[e.id])).length;

  function dayDateTxt(d){
    if(!d.date) return "";
    const t = new Date(d.date + "T12:00:00");   // 正午构造，避开时区把日期推前一天
    return isNaN(t) ? d.date : `${d.date.slice(5)}(周${WD[t.getDay()]})`;
  }

  /* 空容器不该只说「还没放地点」—— 用户面对一个空框并不知道该怎么操作。
     而且当前天和非当前天要说不同的话：点圆点只会加进「当前天」，
     对非当前天说「点圆点」是错的。 */
  function emptyHint(d){
    return d.n === st.curDay
      ? `把左边的景点<b>拖进来</b><br>或点它左边的<b>圆点</b>`
      : `把左边的景点<b>拖进来</b><br>点标题可把这天设为当前天`;
  }

  function dayBox(d){
    let seq = 0;
    const rows = (d.places || []).map((e, i) => {
      const p = BY_ID[e && e.id];
      if(!p) return "";
      const lod = isLodging(p);
      if(!lod) seq++;
      const note = (e.note || "").trim();
      return `<div class="ditem${lod ? " lod" : ""}" data-card="${esc(p.id)}" data-day="${d.n}" data-i="${i}">
          <span class="n" style="background:${lod ? "var(--lodging)" : dayColor(d.n)}">${lod ? house(11) : seq}</span>
          <button class="bare dnm" type="button" title="${esc(p.name)}${note ? " — " + esc(note) : ""}">${esc(p.name)}</button>
          <span class="dops">
            <button class="dop" data-op="up"   title="上移" aria-label="上移">${ICON.up}</button>
            <button class="dop" data-op="down" title="下移" aria-label="下移">${ICON.down}</button>
            <button class="dop" data-op="del"  title="移出这一天" aria-label="移出">${ICON.del}</button>
          </span>
        </div>`;
    }).join("");
    return `<div class="dbox${d.n === st.curDay ? " cur" : ""}" data-day="${d.n}">
        <div class="dhead">
          <button class="bare dh-btn" type="button" aria-pressed="${d.n === st.curDay}"
            aria-label="${esc(dayLabel(d))}${d.date ? "，" + esc(dayDateTxt(d)) : ""}，${dayCount(d)} 个地点。设为当前天">
            <span class="swatch" style="background:${dayColor(d.n)}"></span>
            <b>${esc(dayLabel(d))}</b>
            <span class="sub">${esc(dayDateTxt(d))}${d.date ? " · " : ""}${dayCount(d)} 个</span>
          </button>
          ${(d.places || []).length ? "" :
            `<button class="dop d-del-day" data-delday="${d.n}" title="删除这一天" aria-label="删除这一天">${ICON.del}</button>`}
        </div>
        <div class="dlist">${rows || `<div class="dempty">${emptyHint(d)}</div>`}</div>
      </div>`;
  }

  /* ═══════════════ 拖拽 ═══════════════
     用 SortableJS（内联，见 assets/vendor/README.md）。自己写 Pointer Events
     要处理拖拽阈值、触屏 touch-action、占位符、命中测试、边缘自动滚动、
     Escape 取消、跨容器 clone —— 这几样正好是它现成给的。

     清单栏用 pull:"clone" + put:false：拖走后原卡留在池子里，这正是我们定的
     「不移除、只标灰」语义。放进日程栏的是副本，不是搬移。

     每次 renderDays() 都会重建 DOM，所以实例要跟着重建，否则绑在旧节点上。 */
  const sortables = [];
  function wireSortable(){
    while(sortables.length){ try{ sortables.pop().destroy(); }catch(e){} }
    if(typeof Sortable === "undefined") return;   // 没注入库时只剩 ↑↓ 按钮，功能不缺

    const common = {
      animation: 130,
      // 卡片同时要能点击（弹详情/归入），阈值太小会把点击误判成拖拽
      fallbackTolerance: 4,
      delayOnTouchOnly: true, delay: 140,
      scroll: true, scrollSensitivity: 60, scrollSpeed: 12,
      ghostClass: "drag-ghost", chosenClass: "drag-chosen", dragClass: "drag-active",
      filter: ".dop",           // ↑↓× 是按钮，不该拖起整行
      preventOnFilter: false,
    };

    // 清单栏 → 只出不进
    const pool = document.querySelector("#map-list");
    if(pool) sortables.push(new Sortable(pool, Object.assign({}, common, {
      group: { name: "trip", pull: "clone", put: false },
      sort: false,
      draggable: ".mi",
      onEnd(){ /* 落点由目标容器的 onAdd 处理 */ },
    })));

    // 每一天
    for(const list of document.querySelectorAll(".dlist")){
      sortables.push(new Sortable(list, Object.assign({}, common, {
        group: { name: "trip", pull: true, put: true },
        draggable: ".ditem",
        /* 两条都必须延到下一个 tick 再改数组。
           applyDrop → commit → renderDays 会把整栏 innerHTML 重建，
           而回调返回后 SortableJS 还要继续操作它刚搬过去的那个节点 ——
           在回调里同步重建 DOM，它就会去碰一批已经不存在的元素。
           这是"受控列表 + 拖拽库"的经典坑：库管 DOM，我们管数组，
           两边都想当真相来源，就得让库先收完尾。 */
        onAdd(evt){
          const toBox = evt.to.closest(".dbox"), fromBox = evt.from.closest(".dbox");
          if(!toBox) return;
          const toDay = +toBox.dataset.day;
          const fromDay = fromBox ? +fromBox.dataset.day : null;
          const { oldIndex, newIndex, item } = evt;
          const id = item.dataset.card;
          item.remove();          // 数组才是真相，先把库插进来的节点撤掉
          setTimeout(() => applyDrop({ fromDay, toDay, oldIndex, newIndex, id }), 0);
        },
        onUpdate(evt){
          const box = evt.to.closest(".dbox");
          if(!box) return;
          const dayN = +box.dataset.day;
          const { oldIndex, newIndex } = evt, id = evt.item.dataset.card;
          setTimeout(() => applyDrop({ fromDay: dayN, toDay: dayN, oldIndex, newIndex, id }), 0);
        },
      })));
    }
  }

  function renderDays(){
    const col = $("#day-col");
    if(!ITIN.length){
      // 正常流程里到不了这里（autoItinerary 会按 trip.dates 建好）。
      // 只有 dates 和 days 都缺时才会落到这个兜底。
      col.innerHTML = `<div class="dc-head">日程
          <button id="day-add" class="lnk" title="加一天" aria-label="加一天">+</button></div>`
        + (st.addOpen ? `<div class="addmenu"><button data-add="tail">＋ 加第一天</button></div>` : "")
        + `<div class="dempty">行程没有日期信息，无法自动分天。<br>点右上角 <b>+</b> 手动加。</div>`;
      return;
    }
    if(st.curDay == null || !ITIN.some(d => d.n === st.curDay)) st.curDay = ITIN[0].n;
    if(st.flat == null) st.flat = ITIN.length <= FLAT_MAX;

    const caps = st.flat ? "" : `<div class="caps">` + ITIN.map(d => {
      const cur = d.n === st.curDay;
      return `<button data-day="${d.n}" aria-pressed="${cur}"
        style="${cur ? `background:${dayColor(d.n)};border-color:${dayColor(d.n)}` : ""}"
        >D${d.n}<span class="c">${dayCount(d)}</span></button>`;
    }).join("") + `</div>`;

    col.innerHTML =
      `<div class="dc-head">日程<span class="sp">${ITIN.length} 天</span>
         <button id="day-mode" class="lnk">${st.flat ? "收起" : "平铺"}</button>
         <button id="day-add" class="lnk" title="加一天" aria-label="加一天">+</button></div>`
      + (st.addOpen ? `<div class="addmenu">`
          + (ITIN.some(d => d.n === 0) ? "" :
             `<button data-add="zero">＋ 第 0 天（抵达当晚）</button>`)
          + `<button data-add="tail">＋ 在末尾加一天</button></div>` : "")
      + caps
      + ITIN.filter(d => st.flat || d.n === st.curDay).map(dayBox).join("");
    wireSortable();
  }

  function setCurDay(n){
    st.curDay = n;
    renderDays();
    refreshRoute();   // 当前天决定哪条线是实的、哪些压到 30%
  }

  /* ═══════════════ 归入 / 移出 / 排序 ═══════════════
     改完统一走 commit()：重建索引 → 重画三处（日程栏、清单栏、marker）→ 暂存。
     少了任何一处，界面就会和数据对不上。 */
  function commit(){
    buildSched();     // 序号和天色都是现算的，数组一动就得重建
    refresh();        // 重画 marker + 清单栏 + 日程栏
    refreshRoute();   // 顺序变了，地图上的连线也要跟着变
    saveLocal();
    scheduleAuto();   // 3 秒没有新动作就写回 places.json
  }

  const curDayObj = () => ITIN.find(d => d.n === st.curDay) || null;

  /* 点清单栏的圆点：不在当前天就加进去，已在就移出（同一天出现多次时移出最后一次）。
     点卡片其余部分仍然是弹详情 —— 状态控件和内容区各管各的。 */
  /* 圆点是个开关，所以要能播报「按下了没有」和「按下会发生什么」。
     两者都跟着「当前天」变：同一个圆点，在第 1 天是「加入」，切到第 2 天
     可能就成了「移出」—— 标签写死成「排入日程」会是句假话。 */
  const inCurDay = id => {
    const d = curDayObj();
    return !!d && (d.places || []).some(e => e && e.id === id);
  };
  function pinLabel(p){
    const d = curDayObj();
    if(!d) return `${p.name}：还没有日程可排`;
    return `${inCurDay(p.id) ? "移出" : "加入"}${dayLabel(d)}：${p.name}`;
  }

  function toggleInCurDay(id){
    const d = curDayObj();
    if(!d){ toast("还没有日程。先建立分天，再往里放地点。"); return; }
    d.places = d.places || [];
    const at = d.places.map(e => e.id).lastIndexOf(id);
    if(at >= 0){
      d.places.splice(at, 1);
    }else{
      d.places.push({ id });
    }
    commit();
  }

  function dayItemOp(dayN, idx, op){
    const d = ITIN.find(x => x.n === dayN);
    if(!d || !Array.isArray(d.places) || !d.places[idx]) return;
    if(op === "del"){
      d.places.splice(idx, 1);
    }else{
      const to = idx + (op === "up" ? -1 : 1);
      if(to < 0 || to >= d.places.length) return;
      const [it] = d.places.splice(idx, 1);
      d.places.splice(to, 0, it);
    }
    commit();
  }

  /* SortableJS 的回调只给「第几个」，落回数组要自己搬。
     from/to 可能是不同的天，也可能是从清单栏拖过来的（那是 clone，没有源要删）。 */
  function applyDrop({ fromDay, toDay, oldIndex, newIndex, id }){
    const to = ITIN.find(d => d.n === toDay);
    if(!to) return;
    to.places = to.places || [];
    if(fromDay == null){                       // 来自清单栏：新增一项
      to.places.splice(newIndex, 0, { id });
    }else{
      const from = ITIN.find(d => d.n === fromDay);
      if(!from || !from.places || !from.places[oldIndex]) return;
      const [it] = from.places.splice(oldIndex, 1);
      to.places.splice(newIndex, 0, it);
    }
    commit();
  }

  /* ---------- 侧栏 ---------- */
  function renderSide(){
    const box = $("#map-list");
    const list = pts().filter(shown);
    const byArea = new Map();
    list.forEach(p => {
      const k = p.area || "其他";
      if(!byArea.has(k)) byArea.set(k, []);
      byArea.get(k).push(p);
    });
    box.innerHTML = [...byArea.entries()].map(([area, ps]) =>
      `<div class="grp">${esc(area)} · ${ps.length}</div>` + ps.map(p =>
        `<div class="mi${st.focus === p.id ? " on" : ""}" data-card="${esc(p.id)}">
           <button class="bare pin" type="button" style="${pinStyle(p)}"
             aria-pressed="${inCurDay(p.id)}" aria-label="${esc(pinLabel(p))}">${pinText(p)}</button>
           <button class="bare t" type="button"><b>${esc(p.name)}</b><span class="sub">${metaLine(p)}</span></button>
         </div>`).join("")).join("") ||
      `<div class="empty-state" style="padding:34px 16px"><div>当前筛选下没有可显示的地点</div></div>`;
    wireSortable();
  }

  /* 元信息压到一行：时长 · 价格 · 最多一个警示。
     原来把整段 ticket 文案铺进来（"公共空间免费；行程期间在展的…一般 ¥3,000、
     高大生 ¥1,500、小中生 ¥500"），一个条目占五六行。完整信息在详情 dialog 里，
     这里只负责让人认出是哪个、以及有没有坑。 */
  /* ticket 是自由文本，压成一个短标签很容易变成谎话。踩过两次：
       「天守阁 ¥600（中学生以下免费）」——先匹配「免费」会写成免费，少算一张票
       「公共空间免费；特展一般 ¥3,000、高大生 ¥1,500」——先匹配金额会写成
         「¥3,000 起」，而这个馆的建筑本身是可以免费进的
     所以两者都要看，谁在前谁定调；两者都有就并列，让人知道「看情况」。 */
  const FREE_RE = /免费|免費|無料|无料|free/i;
  const AMT_RE = /[¥￥$€£]\s*[\d,]+/;

  function shortPrice(t){
    if(!t) return "";
    const s = String(t);
    const amt = s.match(AMT_RE), free = s.match(FREE_RE);
    if(amt && free){
      const many = (s.match(new RegExp(AMT_RE.source, "g")) || []).length > 1;
      return free.index < amt.index
        ? `免费 / ${amt[0].replace(/\s+/g, "")}${many ? "起" : ""}`
        : `${amt[0].replace(/\s+/g, "")}${many ? "起" : ""}`;
    }
    if(amt){
      const many = (s.match(new RegExp(AMT_RE.source, "g")) || []).length > 1;
      return amt[0].replace(/\s+/g, "") + (many ? "起" : "");
    }
    return free ? "免费" : "";
  }

  function warnOf(p){
    if(p.status === "permanently_closed") return "已关闭";
    if(p.status && p.status !== "open") return "非正常营业";
    if(p.verify && p.verify.state && p.verify.state !== "verified") return "待确认";
    if(p.booking === "required") return "须预约";
    // 排进了它闭馆的那天 —— 这是硬冲突，优先级高于上面的软提示
    for(const s of schedOf(p.id)){
      const day = ITIN.find(d => d.n === s.n);
      const wd = day && day.date ? new Date(day.date + "T12:00:00").getDay() || 7 : null;
      if(wd && Array.isArray(p.closed_days) && p.closed_days.includes(wd)) return "当天闭馆";
    }
    return "";
  }

  function metaLine(p){
    if(isLodging(p)) return `<em>住宿</em>`;
    const bits = [SCALE_TXT[p.scale] || p.scale, shortPrice(p.ticket)].filter(Boolean);
    const w = warnOf(p);
    return bits.map(x => `<em>${esc(x)}</em>`).join(" · ")
         + (w ? `<span class="w">${esc(w)}</span>` : "");
  }

  function focus(id, fromMap){
    st.focus = id;
    const p = PLACES.find(x => x.id === id);
    if(!p || !geo(p)) return;
    if(!fromMap && st.map){
      if(st.engine === "maplibre") st.map.flyTo({ center:[p.coord.lon, p.coord.lat], zoom:Math.max(st.map.getZoom(), 14), duration:620 });
      if(st.engine === "leaflet")  st.map.setView([p.coord.lat, p.coord.lon], Math.max(st.map.getZoom(), 15));
    }
    refresh();
    const item = document.querySelector(`.mi[data-card="${CSS.escape(id)}"]`);
    if(item && fromMap) item.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }

  /* ---------- 静态兜底 ---------- */
  function renderStatic(){
    const box = $("#map-canvas");
    const list = pts();
    if(!list.length){ box.innerHTML = ""; return; }
    const lons = list.map(p => p.coord.lon), lats = list.map(p => p.coord.lat);
    const x0 = Math.min(...lons), x1 = Math.max(...lons);
    const y0 = Math.min(...lats), y1 = Math.max(...lats);
    const sx = v => 8 + (x1 === x0 ? 50 : (v - x0) / (x1 - x0) * 84);
    const sy = v => 92 - (y1 === y0 ? 50 : (v - y0) / (y1 - y0) * 84);
    // 用真实元素而不是拼字符串，好让 styleDot 是唯一决定外观的地方 ——
    // 拼字符串就得把双层编码的逻辑再写一遍，两份必然走样。
    box.innerHTML = `<div class="static-map"><div class="sm-grid"></div></div>`;
    const wrap = box.querySelector(".static-map");
    for(const p of list){
      if(!shown(p)) continue;
      const el = markerEl(p);
      el.style.left = sx(p.coord.lon) + "%";
      el.style.top  = sy(p.coord.lat) + "%";
      el.dataset.goto = p.id;
      wrap.appendChild(el);
    }
  }

  /* ---------- 引擎启动 ---------- */
  async function startMapLibre(){
    await Promise.all([loadCSS(MAPLIBRE_CSS), loadJS(MAPLIBRE_JS)]);
    if(!window.maplibregl) throw new Error("MapLibre 未就绪");
    const c = center();
    st.map = new maplibregl.Map({
      container:"map-canvas", style:await styleFor(st.base),
      center:[c.lon, c.lat], zoom:11.5, attributionControl:false,
    });
    await new Promise((res, rej) => {
      // 矢量瓦片源都是免费无 SLA 的公共服务，慢的时候真的很慢。
      // 20 秒是实测取的折中：够宽容，又不至于让用户干等。
      //
      // 但这 20 秒只能算「页面可见」的那部分时间。后台标签页里浏览器会暂停
      // requestAnimationFrame，而 MapLibre 的 load 事件要等首次渲染完成 ——
      // 于是它永远不会触发。实测被这个误判过两次：瓦片源本身 2 秒就响应了，
      // 只因为标签页在后台，20 秒一到就降级成 Leaflet，用户切回来时看到的
      // 是一张已经降级、且底图按钮全部禁用的地图，而且无法恢复。
      let waited = 0, settled = false;
      const stop = () => { settled = true; clearInterval(tick); };
      const tick = setInterval(() => {
        if(document.hidden || settled) return;
        waited += 500;
        if(waited >= 20000){ stop(); rej(new Error("矢量底图 20 秒未加载完成")); }
      }, 500);
      st.map.once("load", () => { if(!settled){ stop(); res(); } });
      // 只有「网络形态的失败」才算底图不可用。
      //
      // 这里踩过两次坑。第一版对任何 map error 都 reject —— 一个与底图完全
      // 无关的异常（实测是别处一次 queryRenderedFeatures 查了不存在的图层）
      // 就被记成「标准底图不可用」，按钮永久禁用、还给用户看一条误导的提示。
      // 第二版按关键词过滤，却把 style 也写进了正则，而那条报错正好含
      // "in the map's style" —— 又匹配上了。
      //
      // 所以判据不看措辞，只看形态：要么带 HTTP 状态码（AJAXError），
      // 要么是明确的网络失败字样。单张瓦片的失败交给 watchTiles 在
      // 加载完成后处理，不在这里管。
      st.map.on("error", e => {
        if(settled) return;
        if(st.map.isStyleLoaded && st.map.isStyleLoaded()) return;   // 样式已就绪，不是它的问题
        const err = e && e.error;
        const msg = String((err && err.message) || (e && e.message) || "");
        const networkish = (err && typeof err.status === "number")
                        || /Failed to fetch|NetworkError|Load failed|ERR_/.test(msg);
        if(!networkish) return;
        stop(); rej(err || new Error("底图出错"));
      });
    });
    // 放在 await 之后：加载期间 st.engine 还不该是 maplibre，
    // 否则用户这时点底图按钮，操作的是一个可能马上要被拆掉的 map 实例。
    st.engine = "maplibre";
    applyTint(st.map, schemaOf(st.base));
    applyHide(st.map, schemaOf(st.base));
    addPoi(st.map, schemaOf(st.base));
    applyPoi();   // 标准那套自带 POI 层，默认全可见，得按分类收一收
    // 地铁层是加分项，出问题不该把整张底图拖下水 ——
    // 实测就发生过：addTransit 抛错，异常一路冒到 init 的 catch，
    // 于是标准底图被判定为「不可用」并禁用，用户看到的是莫名其妙的降级。
    try{ addTransit(); }
    catch(e){ console.warn("地铁层加载失败（不影响底图）:", e); st.transitBroken = String(e.message || e); }
    // 顺序线加在地铁层之后 → 画在它上面。这是用户自己的路线，比参考用的轨道图重要。
    try{ addRoute(); }catch(e){ console.warn("顺序线加载失败（不影响底图）:", e); }
    st.map.addControl(new maplibregl.NavigationControl({ showCompass:false }), "bottom-right");
    st.map.resize();          // 容器可能刚从 hidden 变可见，尺寸要重新量
    fitAll();
    st.fitted = true;
  }

  async function startLeaflet(){
    await Promise.all([loadCSS(LEAFLET_CSS), loadJS(LEAFLET_JS)]);
    if(!window.L) throw new Error("Leaflet 未就绪");
    const c = center();
    st.map = L.map("map-canvas", { attributionControl:false }).setView([c.lat, c.lon], 12);
    L.tileLayer(CARTO_RASTER[0], { maxZoom:19, referrerPolicy:"strict-origin-when-cross-origin" }).addTo(st.map);
    st.engine = "leaflet";
    st.base = null;           // CARTO 不在 BASEMAPS 里，只服务于降级路径
  }

  function fitAll(){
    const l = pts();
    if(!l.length || !st.map) return;
    const lons = l.map(p => p.coord.lon), lats = l.map(p => p.coord.lat);
    const b = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];
    if(st.engine === "maplibre"){
      st.map.fitBounds(b, { padding:{ top:66, bottom:46, left:46, right:46 }, duration:0, maxZoom:15 });
    }else if(st.engine === "leaflet"){
      st.map.fitBounds([[b[0][1], b[0][0]], [b[1][1], b[1][0]]], { padding:[40,40], maxZoom:15 });
    }
  }

  /* 每次切回地图视图都要 resize + refit。
     MapLibre 按构造时的容器尺寸计算相机，容器后来变了它不会自己纠正——
     实测：先在 1200 宽初始化、再拉到 1280，视野就偏了 0.7 个 zoom 级。
     隐藏状态下初始化（容器高度为 0）则更离谱。 */
  function onShow(){
    if(!st.map) return;
    st.map.resize();
    if(!st.fitted){ fitAll(); st.fitted = true; }
  }

  /* ResizeObserver 必须只在尺寸真的变了时才 resize。
     踩过的坑：重建侧栏 HTML 会让滚动条出现/消失，容器宽度变几像素就触发
     resize()，而 resize 会打断正在进行的相机动画——表现为「点侧栏地图不飞过去」，
     而且时有时无，极难定位。 */
  function watchResize(){
    const el = document.querySelector(".map-main");
    if(!el || !window.ResizeObserver) return;
    let last = `${el.clientWidth}x${el.clientHeight}`, t;
    new ResizeObserver(() => {
      const now = `${el.clientWidth}x${el.clientHeight}`;
      if(now === last) return;
      last = now;
      clearTimeout(t);
      t = setTimeout(() => { if(st.map && st.map.resize) st.map.resize(); }, 180);
    }).observe(el);
  }

  /* styleFor("gb") 要 fetch 一份 style JSON，是异步的。快速连点
     「标准 → 简约」时，graybeard 的 fetch 可能后返回，setStyle 就把
     positron 覆盖掉了 —— 按钮显示「简约」，地图却是「标准」。
     用一个自增令牌把过期的那次请求丢掉。 */
  let switchSeq = 0;
  async function switchBase(id){
    if(st.engine !== "maplibre" || id === st.base) return;
    const seq = ++switchSeq;
    st.base = id;
    $$("#basemaps button").forEach(b => b.setAttribute("aria-pressed", b.dataset.base === id));
    let style;
    try{
      style = await styleFor(id);
    }catch(e){
      if(seq !== switchSeq) return;
      note(`<b>「${(BASEMAPS.find(x => x.id === id) || {}).label || id}」底图加载失败</b>：${esc(e.message || e)}`);
      return;
    }
    if(seq !== switchSeq) return;        // 期间又点了别的，这次作废
    st.map.setStyle(style);
    st.map.once("styledata", () => {
      if(seq !== switchSeq) return;
      applyTint(st.map, schemaOf(id));   // setStyle 会整份换掉，上色补丁和地铁层都得重挂
      applyHide(st.map, schemaOf(id));
      addPoi(st.map, schemaOf(id));
      applyPoi();
      try{ addTransit(); }catch(e){ console.warn("地铁层重挂失败:", e); }
      try{ addRoute(); }catch(e){ console.warn("顺序线重挂失败:", e); }
      addMarkers();
      setAttrib();
    });
  }

  /* 主题变了（用户点了右上角，或者停在「跟随系统」而系统自己翻了）：
     CSS 当场就跟上了，底图不会 —— 它是 init 时按当时的主题选定的，
     不管就又回到「深色界面配浅色地图」。
     只在当前正用着「简约」时才重挂：手动切去标准/光栅是明确的选择，不该被覆盖。 */
  window.addEventListener("themechange", e => {
    const dark = e.detail.dark, ofm = BASEMAPS[0];
    if(ofm.dark === dark) return;
    ofm.style = ofmStyle(dark);
    ofm.dark = dark;
    if(st.engine !== "maplibre" || st.base !== ofm.id) return;
    st.base = null;                 // 绕开 switchBase 的「同一张底图就不动」
    switchBase(ofm.id);
  });

  /* ---------- 入口 ---------- */
  async function init(){
    if(st.ready) return;
    st.ready = true;

    if(!pts().length){
      $("#map-canvas").innerHTML = `<div class="empty-state"><div class="big">没有可定位的地点</div>
        <div>景点缺少 coord 字段</div></div>`;
      return;
    }

    paintBaseButtons();

    const problems = [];
    const webgl = hasWebGL();
    if(!webgl) problems.push("浏览器未启用 WebGL");

    try{
      if(!webgl) throw new Error("需要 WebGL");
      try{
        await startMapLibre();
      }catch(eGb){
        // 默认矢量源挂了不必直接跌到 Leaflet —— 还有第二个矢量源，
        // 而且它是另一家运营、另一套 schema，不会跟着一起挂。
        if(st.base === "ofm"){
          problems.push("简约底图不可用（" + (eGb.message || eGb) + "），已改用标准");
          if(st.map && st.map.remove){ try{ st.map.remove(); }catch(_){} }
          st.map = null;
          $("#map-canvas").innerHTML = "";
          st.base = "gb";
          $$("#basemaps button").forEach(b => b.setAttribute("aria-pressed", b.dataset.base === "gb"));
          const dead = document.querySelector('#basemaps [data-base="ofm"]');
          if(dead){ dead.disabled = true; dead.title = "该底图当前不可用：" + (eGb.message || eGb); }
          await startMapLibre();
          note(problems.join("；") + "。点位、联动、导出都不受影响。");
        }else throw eGb;
      }
      watchTiles();
      probe("osm");                     // 不 await：探测慢不该挡住地图显示
      if(hasTransit() && !st.transitBroken){
        $("#transit-group").hidden = false;
        paintLegend();
      }else if(st.transitBroken){
        note(`地铁层未能加载（${esc(st.transitBroken)}），其余功能不受影响。`);
      }
    }catch(e1){
      problems.push("矢量底图不可用（" + (e1.message || e1) + "）");
      try{
        if(st.map && st.map.remove) { try{ st.map.remove(); }catch(_){} }
        st.map = null;
        $("#map-canvas").innerHTML = "";
        await startLeaflet();
        st.degraded = true;
        fitAll(); st.fitted = true;
        note(`<b>已降级</b>：${problems.join("；")}。当前使用 Leaflet + CARTO 光栅底图，点位、联动、导出都不受影响，只是不能切底图。`);
        lockBaseButtons("降级模式下不可切换底图");
      }catch(e2){
        problems.push("光栅底图也不可用（" + (e2.message || e2) + "）");
        st.degraded = true;
        st.engine = "static";
        st.map = null;
        note(`<b>底图全部不可用</b>：${problems.join("；")}。下面是按经纬度换算的相对位置示意图——比例不准，但方位和聚集关系是对的，导出功能照常可用。`);
        lockBaseButtons("无可用底图");
      }
    }

    setAttrib();
    addMarkers();
    renderSide();
    renderDays();
    watchResize();
  }

  /* ---------- 导出 ---------- */
  function selected(){
    return pts().filter(shown);
  }
  function csvCell(v){
    const s = String(v ?? "").replace(/"/g, '""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  }
  function toCSV(){
    const rows = [["Name","Latitude","Longitude","Description","Category","Choice","URL"]];
    for(const p of selected()){
      rows.push([
        p.name_en || p.name, p.coord.lat, p.coord.lon,
        [p.name, p.name_local, p.pitch, p.hours && "开放 " + p.hours, p.ticket].filter(Boolean).join(" | "),
        CATMAP[p.category] || p.category,
        { yes:"想去", maybe:"待定", no:"不想去" }[p.choice] || "未表态",
        (p.sources || [])[0]?.url || "",
      ]);
    }
    return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\n");
  }
  function toKML(){
    const esc2 = s => String(s ?? "").replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
    return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>${esc2(TRIP.destination || "行程")}</name>
${selected().map(p => `<Placemark>
  <name>${esc2(p.name)}${p.name_local && p.name_local !== p.name ? "（" + esc2(p.name_local) + "）" : ""}</name>
  <description>${esc2([p.pitch, p.hours && "开放时间：" + p.hours, p.ticket && "门票：" + p.ticket,
                       p.closed && "闭馆：" + p.closed].filter(Boolean).join("\n"))}</description>
  <Point><coordinates>${p.coord.lon},${p.coord.lat},0</coordinates></Point>
</Placemark>`).join("\n")}
</Document></kml>`;
  }
  function save(text, name, mime){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type:mime }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast(`已导出 ${name}（${selected().length} 个地点）`);
  }

  /* ---------- hover 双向联动 ----------
     鼠标在清单条目上 → 地图对应图标放大并显示名字；
     鼠标在地图图标上 → 对应条目高亮。
     反向只高亮、不滚动 —— 列表跟着鼠标自动跳很晕。 */
  function hilite(id, on){
    const mk = st.markers.get(id);
    const el = mk && mk.getElement ? mk.getElement()
             : document.querySelector(`.static-map .mk[data-goto="${CSS.escape(id)}"]`);
    if(el) el.classList.toggle("hi", on);
    const item = document.querySelector(`.mi[data-card="${CSS.escape(id)}"]`);
    if(item) item.classList.toggle("on", on || st.focus === id);
  }

  for(const [evt, on] of [["mouseover", true], ["mouseout", false]]){
    document.addEventListener(evt, e => {
      const src = e.target.closest("[data-card]") || e.target.closest(".mk");
      if(!src) return;
      const id = src.dataset.card || src.dataset.id || src.dataset.goto;
      if(id) hilite(id, on);
    });
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", e => {
    // 圆点是状态控件：点它＝把这个地点放进/移出「当前天」。
    // 必须排在「点卡片弹详情」之前，否则永远走不到这里。
    const pin = e.target.closest(".map-side .mi .pin");
    if(pin){
      const row = pin.closest("[data-card]");
      if(row) toggleInCurDay(row.dataset.card);
      return;
    }
    // 删除整天。它复用了 .dop 的样式类，所以必须排在下面那个 .dop 分支之前 ——
    // 否则会被它先匹配到，而那个分支找不到 .ditem 就直接 return，把事件吃掉。
    const dd = e.target.closest("[data-delday]");
    if(dd){ removeDay(+dd.dataset.delday); return; }
    // 日程条目上的 ↑ ↓ ×
    const dop = e.target.closest(".dop");
    if(dop){
      const row = dop.closest(".ditem");
      if(row) dayItemOp(+row.dataset.day, +row.dataset.i, dop.dataset.op);
      return;
    }
    // 清单条目 → 弹详情。以前是把地图飞到该点，但 hover 已经能定位，
    // 而点开卡片想看的其实是「它到底是什么」。
    const card = e.target.closest("[data-card]");
    if(card){ openDetail(card.dataset.card); return; }
    // data-goto 只剩静态兜底图上的 marker 在用
    const go = e.target.closest("[data-goto]");
    if(go){ focus(go.dataset.goto, false); return; }
    const bm = e.target.closest("#basemaps button");
    if(bm && !bm.disabled){ switchBase(bm.dataset.base); return; }
    const tb = e.target.closest("#transit-btn");
    if(tb && !tb.disabled){ setTransitVisible(tb.getAttribute("aria-pressed") !== "true"); return; }
    const lg = e.target.closest("#map-legend");
    if(lg){
      const open = lg.classList.toggle("open");
      st.legendOpen = open;
      const btn = lg.querySelector(".lg-toggle");
      if(btn) btn.setAttribute("aria-expanded", String(open));
      const hint = lg.querySelector(".lg-hint");
      if(hint) hint.textContent = open ? "点击收起" : "点击展开线路名";
      return;
    }
    const dm = e.target.closest("#day-mode");
    if(dm){ st.flat = !st.flat; renderDays(); return; }
    const da = e.target.closest("#day-add");
    if(da){ st.addOpen = !st.addOpen; renderDays(); return; }
    const am = e.target.closest(".addmenu button");
    if(am){ st.addOpen = false; addDay(am.dataset.add); return; }
    if(st.addOpen && !e.target.closest(".addmenu")){ st.addOpen = false; renderDays(); }
    const cap = e.target.closest(".caps button");
    if(cap){ setCurDay(+cap.dataset.day); return; }
    const dh = e.target.closest(".dhead");
    if(dh && !e.target.closest("[data-delday]")){ setCurDay(+dh.parentElement.dataset.day); return; }
    const mf = e.target.closest(".mfil");
    if(mf){
      const on = mf.getAttribute("aria-pressed") === "true";
      mf.setAttribute("aria-pressed", !on);
      on ? st.show.delete(mf.dataset.c) : st.show.add(mf.dataset.c);
      refresh();
    }
  });

  return { init, refresh, onShow, fitAll, ensureDays:autoItinerary,
           curDay:() => st.curDay, toggleDay:toggleInCurDay,
           exportCSV:() => save(toCSV(), "places.csv", "text/csv;charset=utf-8"),
           exportKML:() => save(toKML(), "places.kml", "application/vnd.google-earth.kml+xml"),
           _st:st };
})();

window.MAP = MAP;
window.initMap = MAP.init;
$("#exp-csv").onclick = () => MAP.exportCSV();
$("#exp-kml").onclick = () => MAP.exportKML();

/* ═══════════════════════════════════════════════════════════════════
   攻略视图

   route.md 由 AI 撰写（正文、路线设计逻辑、逐日节点）；
   下面三块由页面自动生成，保证永远和数据一致：
     · 天气   —— 浏览器端实时拉 Open-Meteo，每次打开都是最新的
     · 费用   —— 按 itinerary 逐日汇总 ticket；日程为空时才退回按 choice 估
     · 对照表 —— 上半按 itinerary 逐日列，下半按 choice 列剩下的，
                 两者都直接读数据，不可能和清单、日程对不上
   ═══════════════════════════════════════════════════════════════════ */
const GUIDE = (() => {

  /* ---------- 天气 ----------
     Open-Meteo 免费、无需 key、支持跨域。
     ≤16 天用预报；超出预报范围则退回历史同期均值，并明确标注这不是预报。 */
  const WMO = {
    0:["☀️","晴"],1:["🌤","多云转晴"],2:["⛅","多云"],3:["☁️","阴"],
    45:["🌫","雾"],48:["🌫","雾凇"],
    51:["🌦","毛毛雨"],53:["🌦","小雨"],55:["🌧","中雨"],
    56:["🌧","冻雨"],57:["🌧","冻雨"],
    61:["🌦","小雨"],63:["🌧","中雨"],65:["🌧","大雨"],
    66:["🌧","冻雨"],67:["🌧","冻雨"],
    71:["🌨","小雪"],73:["🌨","中雪"],75:["❄️","大雪"],77:["🌨","雪粒"],
    80:["🌦","阵雨"],81:["🌧","强阵雨"],82:["⛈","暴雨"],
    85:["🌨","阵雪"],86:["❄️","强阵雪"],
    95:["⛈","雷雨"],96:["⛈","雷雨伴冰雹"],99:["⛈","强雷雨伴冰雹"],
  };
  const wmo = c => WMO[c] || ["·","—"];

  function anchor(){
    const b = (TRIP.bases || [])[0];
    if(b && b.coord && typeof b.coord.lon === "number") return b.coord;
    const l = pts0();
    if(l.length) return { lon:l.reduce((s,p)=>s+p.coord.lon,0)/l.length,
                          lat:l.reduce((s,p)=>s+p.coord.lat,0)/l.length };
    const bb = TRIP.bbox;
    return bb ? { lon:(bb[0]+bb[2])/2, lat:(bb[1]+bb[3])/2 } : null;
  }
  const pts0 = () => PLACES.filter(p => p.coord && typeof p.coord.lon === "number");

  async function fetchForecast(c, start, end){
    const u = new URL("https://api.open-meteo.com/v1/forecast");
    u.search = new URLSearchParams({
      latitude:c.lat, longitude:c.lon, timezone:TRIP.timezone || "auto",
      start_date:start, end_date:end,
      daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum",
    });
    const r = await fetch(u);
    if(!r.ok) throw new Error("预报接口返回 " + r.status);
    return r.json();
  }

  /* 超出预报范围：取过去 8 年同期的历史观测求平均。
     这是气候平均值，不是预报——必须在界面上说清楚，否则会误导用户。 */
  async function fetchNormals(c, days){
    const yr = new Date().getFullYear();
    const years = [];
    for(let y = yr - 8; y < yr; y++) years.push(y);
    const md = days.map(d => d.iso.slice(5));
    const out = md.map(() => ({ tmax:[], tmin:[], rain:[], wet:0, n:0 }));
    await Promise.all(years.map(async y => {
      const u = new URL("https://archive-api.open-meteo.com/v1/archive");
      u.search = new URLSearchParams({
        latitude:c.lat, longitude:c.lon, timezone:TRIP.timezone || "auto",
        start_date:`${y}-${md[0]}`, end_date:`${y}-${md[md.length-1]}`,
        daily:"temperature_2m_max,temperature_2m_min,precipitation_sum",
      });
      try{
        const r = await fetch(u);
        if(!r.ok) return;
        const j = await r.json();
        (j.daily?.time || []).forEach((t, i) => {
          const k = md.indexOf(t.slice(5));
          if(k < 0) return;
          const o = out[k];
          if(j.daily.temperature_2m_max[i] != null) o.tmax.push(j.daily.temperature_2m_max[i]);
          if(j.daily.temperature_2m_min[i] != null) o.tmin.push(j.daily.temperature_2m_min[i]);
          const p = j.daily.precipitation_sum[i];
          if(p != null){ o.rain.push(p); if(p >= 1) o.wet++; o.n++; }
        });
      }catch(e){ /* 单年失败不影响整体平均 */ }
    }));
    const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
    return out.map(o => ({
      tmax:avg(o.tmax), tmin:avg(o.tmin),
      wetRate:o.n ? Math.round(o.wet / o.n * 100) : null, samples:o.tmax.length,
    }));
  }

  function card(label, icon, desc, tmax, tmin, rainLine){
    const t = v => v == null ? "—" : Math.round(v);
    return `<div class="wx-d">
      <div class="d">${esc(label)}</div>
      <div class="ic" title="${esc(desc)}">${icon}</div>
      <div class="t">${t(tmax)}°<span class="sub"> / ${t(tmin)}°</span></div>
      <div class="r">${rainLine}</div>
    </div>`;
  }

  async function renderWeather(){
    const box = $("#wx-box");
    if(!DAYS.length){ box.innerHTML = ""; return; }
    const c = anchor();
    if(!c){ box.innerHTML = ""; return; }

    box.innerHTML = `<div class="wx-src">正在获取天气…</div>`;
    const today = new Date(); today.setHours(0,0,0,0);
    const lead = Math.round((DAYS[DAYS.length-1].date - today) / 864e5);

    try{
      if(lead <= 16 && DAYS[0].date >= new Date(today.getTime() - 864e5)){
        const j = await fetchForecast(c, DAYS[0].iso, DAYS[DAYS.length-1].iso);
        const d = j.daily || {};
        box.innerHTML = `<div class="wx">` + (d.time || []).map((t, i) => {
          const [ic, desc] = wmo(d.weather_code[i]);
          const pp = d.precipitation_probability_max?.[i];
          const ps = d.precipitation_sum?.[i];
          const rain = pp != null && pp >= 30
            ? `降水概率 <b>${pp}%</b>${ps ? ` · ${ps}mm` : ""}`
            : `降水概率 ${pp ?? "—"}%`;
          const wd = ((new Date(t + "T00:00:00").getDay() + 6) % 7) + 1;
          return card(`${t.slice(5)} 周${WD[wd-1]} · ${desc}`, ic, desc, d.temperature_2m_max[i], d.temperature_2m_min[i], rain);
        }).join("") + `</div>
        <div class="wx-src">实时预报 · Open-Meteo · 每次打开本页都会重新获取</div>`;
      }else{
        const n = await fetchNormals(c, DAYS);
        box.innerHTML = `<div class="wx">` + DAYS.map((d, i) => {
          const o = n[i] || {};
          const rain = o.wetRate == null ? "—"
            : `历史降雨日占比 <b>${o.wetRate}%</b>`;
          return card(`${d.iso.slice(5)} 周${WD[d.wd-1]} · 常年`, "📅", "历史同期均值",
                      o.tmax, o.tmin, rain);
        }).join("") + `</div>
        <div class="wx-src est">⚠ 出行日在 ${lead} 天后，超出 16 天预报范围。
          以上是<b>过去 8 年同期的历史平均</b>，只能说明大致气候，<b>不是预报</b>。
          临近出行请重新打开本页查看真实预报。</div>`;
      }
    }catch(e){
      box.innerHTML = `<div class="wx-src est">天气获取失败（${esc(e.message)}）。
        联网后重新打开本页即可重试。</div>`;
    }
  }

  /* ---------- 费用汇总 ----------
     ticket 是自由文本（"¥600"、"常设展 ¥1200 前后，特别展另计"、"免费"），
     无法可靠求和。因此：能解析的求和，解析不了的原样列出并明确标注，
     绝不假装算出了一个精确总额。 */
  /* 必须先找金额，再判断「免费」。
     反例：「天守阁 ¥600（中学生以下免费）」——先匹配「免费」会把 600 算成 0，
     合计直接少算一张票。金额出现过就以金额为准。 */
  function parseMoney(s){
    if(!s) return null;
    const m = String(s).match(/[¥￥$€£]\s*([\d,]+(?:\.\d+)?)|([\d,]+(?:\.\d+)?)\s*(?:日元|円|元|yen|JPY)/i);
    if(m){
      const v = parseFloat((m[1] || m[2]).replace(/,/g, ""));
      if(!isNaN(v)) return v;
    }
    if(/^[^0-9]*(免费|免費|free|無料|无料)[^0-9]*$/i.test(s.trim())) return 0;
    return null;
  }

  /* 费用按**日程**算，不是按 choice。
     用户排完之后，「实际要花的钱」是排进某一天的那些点——里面有不少是
     「待定」但真排上了的，而标了「想去」却没排进任何一天的（比如太远的那个），
     一分钱都不会花。按 choice 算会同时多算和少算。
     日程为空时（还没排）才退回按 choice=yes 估。 */
  function costRows(list, dayLabel){
    let sum = 0, parsed = 0;
    const unparsed = [];
    const rows = list.map(p => {
      const v = parseMoney(p.ticket);
      if(v == null) unparsed.push(p.name);
      else { sum += v; parsed++; }
      return `<div class="ck">
        <span class="m">${v === 0 ? "○" : v == null ? "?" : "●"}</span>
        <span class="n">${esc(p.name)}<span class="sub">${esc(p.ticket)}</span></span>
      </div>`;
    }).join("");
    return { html: (dayLabel ? `<div class="sum-d">${esc(dayLabel)}</div>` : "") + rows,
             sum, parsed, unparsed };
  }

  function renderCost(){
    const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
    // 同一个点排了两天（比如连着去两天的展）也只买一次票，按 id 去重
    const seen = new Set();
    const groups = [];
    for(const d of days){
      const list = [];
      for(const e of d.places){
        const p = BY_ID[e.id];
        if(!p || isLodging(p) || seen.has(p.id)) continue;
        seen.add(p.id);
        list.push(p);
      }
      if(list.length) groups.push([`第 ${d.n} 天${d.date ? " · " + d.date.slice(5) : ""}`, list]);
    }
    const byDay = groups.length > 0;
    if(!byDay){
      const going = PLACES.filter(p => p.choice === "yes" && !isLodging(p));
      if(!going.length) return "";
      groups.push([null, going]);
    }

    let sum = 0, parsed = 0, n = 0;
    const unparsed = [];
    const html = groups.map(([label, list]) => {
      const r = costRows(list, label);
      sum += r.sum; parsed += r.parsed; n += list.length;
      unparsed.push(...r.unparsed);
      return r.html;
    }).join("");
    const all = groups.flatMap(([, l]) => l);
    const cur = /[¥￥]|日元|円/.test(all.map(p => p.ticket).join("")) ? "¥" : "";
    return `<h2>费用汇总</h2>
      <div class="sum">
        <div class="sum-h">门票与入场费<span>${byDay ? `已排进日程的 ${n} 个地点` : `${n} 个「想去」的地点`}</span></div>
        ${html}
        <div class="cost-total">已解析 ${parsed} 项，合计约 <b>${cur}${sum.toLocaleString()}</b></div>
        ${byDay ? "" : `<div class="caveat">日程还没排，这里按「想去」的地点估算。排完之后会改成按每天实际要去的点计算。</div>`}
        ${unparsed.length ? `<div class="caveat">以下 ${unparsed.length} 项的票价是文字描述，未计入合计：${esc(unparsed.join("、"))}。
          特别展、体验项目、夜间加价通常另计，实际花费会高于此数。</div>`
          : `<div class="caveat">仅含门票，不含交通、餐饮与特别展加价。</div>`}
      </div>`;
  }

  /* ---------- 全景点对照表 ----------
     直接由 choice 生成，因此不可能与清单视图不一致。
     放弃的景点也全部列出——方便快速判断要不要捡回来。 */
  /* 对照表分两块：**排进日程的按天列**（这是真正要去的），
     剩下的按表态列。分开是因为这两块回答的是不同问题——
     前者是「那天走哪几个」，后者是「有没有漏掉什么」。 */
  function ckRow(p, mark, out, extra){
    // 住宿没有 scale，直接拼会留下一个孤零零的「·」
    const scale = SCALE_TXT[p.scale] || p.scale || (isLodging(p) ? "住宿" : "");
    return `<div class="ck${out ? " out" : ""}">
      <span class="m">${mark}</span>
      <span class="n">${esc(p.name)}<span class="sub">${esc(p.area)}${scale ? " · " + esc(scale) : ""}</span></span>
      ${extra || (p.choice_reason ? `<span class="why">${esc(p.choice_reason)}</span>` : "")}
    </div>`;
  }

  function renderChecklist(){
    const MARK = { yes:["✅","想去"], maybe:["🔸","待定"], no:["❌","放弃"], none:["⬜","未表态"] };
    const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
    const scheduled = new Set(days.flatMap(d => d.places.map(e => e.id)));

    let html = "";
    if(days.length){
      let items = 0;
      const blocks = days.map(d => {
        let seq = 0;
        const rows = d.places.map(e => {
          const p = BY_ID[e.id];
          if(!p) return "";
          items++;
          const lod = isLodging(p);
          if(!lod) seq++;
          return ckRow(p, lod ? "🏠" : seq,
            false, e.note ? `<span class="why">${esc(e.note)}</span>` : "");
        }).join("");
        return `<div class="sum-d">第 ${d.n} 天${d.date ? " · " + d.date.slice(5) : ""}
          <span>${d.places.length} 项</span></div>${rows}`;
      }).join("");
      html += `<div class="sum">
        <div class="sum-h">按天的行程<span>${days.length} 天 · ${items} 项</span></div>
        ${blocks}</div>`;
    }

    // 标了「想去」却没排进任何一天的——最容易被漏掉，单独提出来
    const missed = PLACES.filter(p => p.choice === "yes" && !isLodging(p) && !scheduled.has(p.id));
    if(days.length && missed.length){
      html += `<div class="sum">
        <div class="sum-h">想去，但没排进任何一天<span>${missed.length} 个</span></div>
        ${missed.map(p => ckRow(p, "⚠️")).join("")}
        <div class="caveat">要么加进某一天，要么改成「待定」——否则出发时才发现漏了。</div>
      </div>`;
    }

    const rest = PLACES.filter(p => !isLodging(p) && !scheduled.has(p.id) && !missed.includes(p));
    const by = {};
    rest.forEach(p => (by[p.choice || "none"] = by[p.choice || "none"] || []).push(p));
    const order = ["maybe", "none", "no"];
    if(rest.length){
      html += `<div class="sum">
        <div class="sum-h">${days.length ? "没排进日程的" : "全部候选"}
          <span>${order.map(k => `${MARK[k][1]} ${(by[k] || []).length}`).join(" · ")}</span></div>
        ${order.flatMap(k => (by[k] || []).map(p => ckRow(p, MARK[k][0], k === "no"))).join("")}
      </div>`;
    }

    return `<h2>全部景点对照表</h2>
      <p>${days.length ? "上半部分是你排好的每天行程，下半部分是没排进去的——放弃的也列在这里，方便回头判断要不要捡回来。"
                       : "包含所有候选地点，放弃的也列在这里，方便你回头判断要不要捡回来。"}</p>
      ${html}`;
  }

  /* ---------- 时间轴渐进增强 ----------
     route.md 里以「09:30 」或「09:30–11:00 」开头的列表项，
     自动变成带时间胶囊的时间轴。AI 不用记特殊语法，写自然的时间就行。 */
  function enhanceTimeline(root){
    root.querySelectorAll("li").forEach(li => {
      const m = li.textContent.match(/^\s*(\d{1,2}:\d{2}(?:\s*[–—~-]\s*\d{1,2}:\d{2})?)\s*(?:[·|｜]|\s)\s*/);
      if(!m) return;
      const html = li.innerHTML.replace(/^\s*\d{1,2}:\d{2}(?:\s*[–—~-]\s*\d{1,2}:\d{2})?\s*(?:[·|｜]|\s)\s*/, "");
      li.className = "tl";
      li.innerHTML = `<span class="t">${esc(m[1].replace(/\s+/g, ""))}</span>${html}`;
    });
  }

  function render(){
    const auto = $("#guide-auto");
    auto.innerHTML = renderCost() + renderChecklist();
    enhanceTimeline($("#guide-body"));
  }

  return { render, renderWeather, parseMoney };
})();

// 顶层 const 在普通 script 里不会挂到 window 上，而 switchView 判断的是 window.GUIDE。
// 必须显式赋值，否则攻略视图永远不会渲染。
window.GUIDE = GUIDE;

/* ─────────────────────────────────────────────── 视图切换 */
/* 地图视图的高度原来写死 calc(100vh - 210px)。那个常数对不上任何一种情况：
   实测桌面 1440×900 下真实开销是 250px（页头 100 + main 上下留白 20/130），
   页面因此多滚 40px，滚完三栏的列头正好被半透明页头盖住 20px。
   而页头本身是会变的 —— 375px 下副标题折行，它有 150px 高。
   常数注定错，所以量。 */
function layoutMap(){
  const top = $(".top"), bar = $(".actionbar"), main = document.querySelector("main");
  const topH = top && !top.hidden ? top.offsetHeight : 0;
  const barH = bar && !bar.hidden ? bar.offsetHeight : 0;
  document.documentElement.style.setProperty("--ab-h", (barH + 14) + "px");
  const h = innerHeight - topH - 20 - (barH + 14);
  document.documentElement.style.setProperty("--map-h", Math.max(360, Math.round(h)) + "px");
  const mapView = $("#view-map");            // standalone 模式下这个视图被整个移除了
  if(main) main.classList.toggle("tight", !!mapView && !mapView.hidden);
}

/* 窄屏把导出按钮从标签栏挪进地图视图。搬节点而不是渲染两份 ——
   两份就要处理 id 冲突，而 #exp-csv / #exp-kml 上挂的是直接的 onclick，
   搬家不影响它们。 */
const NARROW = matchMedia("(max-width: 760px)");
function layoutMapActions(){
  const act = $("#map-actions"), slot = $("#map-actions-slot"), tabs = $(".tabs");
  if(!act || !slot || !tabs) return;
  const to = NARROW.matches ? slot : tabs;
  if(act.parentElement !== to) to.appendChild(act);
}

function switchView(v){
  // roving tabindex：一组 tab 在 Tab 键序里只占一个位置，组内用 ←→ 走。
  // 三个都留 tabindex=0 的话，键盘用户要按三次 Tab 才能穿过标签栏。
  $$(".tab").forEach(t => {
    const on = t.dataset.view === v;
    t.setAttribute("aria-selected", on);
    t.tabIndex = on ? 0 : -1;
  });
  $$(".view").forEach(s => s.hidden = (s.id !== "view-" + v));
  // 导出按钮挪到了顶部标签栏，但它导的是地图视图里筛出来的那批点，
  // 所以只在地图视图出现。
  $("#map-actions").hidden = v !== "map";
  try{ localStorage.setItem(LS_KEY + ":view", v); }catch(e){}
  if(v === "map" && window.MAP){
    MAP.init();      // 懒加载：MapLibre 275KB，不该拖慢首屏
    MAP.onShow();    // 每次切回都 resize + 首次 refit
  }
  if(v === "guide" && window.GUIDE){
    GUIDE.render();                                  // 对照表要反映最新选择
    if(!switchView._wx){ switchView._wx = true; GUIDE.renderWeather(); }
  }
  layoutMapActions();
  layoutMap();
}

/* ─────────────────────────────────────────────── 启动 */
function boot(){
  document.title = `${TRIP.destination || "行程"} · 行程规划`;
  if(TRIP.output_language) document.documentElement.lang = TRIP.output_language;
  initTheme();
  $("#title").innerHTML = esc(TRIP.destination || "行程")
    + (TRIP.destination_local && TRIP.destination_local !== TRIP.destination
        ? `（<span${langAttr}>${esc(TRIP.destination_local)}</span>）` : "");

  const bits = [];
  if(TRIP.dates && TRIP.dates.start) bits.push(`<b>${TRIP.dates.start} → ${TRIP.dates.end}</b>`);
  if(TRIP.days)  bits.push(`${TRIP.days} 天`);
  if(TRIP.party) bits.push(esc(TRIP.party));
  if(TRIP.pace)  bits.push(esc(TRIP.pace));
  let sub = bits.join(" · ");
  const vd = TRIP.verified_at ? Math.round((Date.now() - new Date(TRIP.verified_at+"T00:00:00")) / 864e5) : null;
  if(vd !== null && vd > 30) sub += ` <span class="stale">数据核验于 ${vd} 天前，开放时间可能已变</span>`;
  $("#subtitle").innerHTML = sub;

  const restored = loadLocal();
  const restoredItin = loadItin();
  // 草稿里没有、文件里也没有时，按 trip.dates 自动建。放在 loadItin 之后，
  // 免得把用户排了一半的草稿覆盖成空容器。
  if(window.MAP) MAP.ensureDays();

  if(ROUTE_HTML){
    $("#guide-body").innerHTML = ROUTE_HTML;
    $("#tab-guide").disabled = false;
  }else{
    $("#guide-body").innerHTML = `<div class="empty-state">
      <div class="big">攻略还没生成</div>
      <div>先在清单里筛完景点，保存后告诉 AI，它会读回你的选择并设计路线。</div></div>`;
  }

  // 不再靠「函数是否存在」下结论——实测函数存在也可能写不了。
  // 只说会怎么尝试，真实结果等点击时告诉用户。
  // 本地服务下走自动保存，状态实时显示在这里；file:// 下说明按钮会怎么试。
  // 页面数据的时间戳也要露出来：这个文件分享出去后，对方看到的就是那一刻的
  // 快照，而不是你现在浏览器里的状态——不写明白，双方都会以为看的是同一份。
  setSaveState("init");
  $("#save").textContent = SAVE_LABEL;
  layoutActionbar();

  renderChips();
  render();

  if(STANDALONE){
    // 独立攻略页：只保留攻略，去掉筛选相关的一切，方便分享/部署
    document.querySelector(".tabs").hidden = true;
    document.querySelector(".actionbar").hidden = true;
    document.querySelector("#view-list").remove();
    document.querySelector("#view-map").remove();
    document.querySelector("main").style.paddingBottom = "60px";
    switchView("guide");
  }else{
    let v = "list";
    try{ v = localStorage.getItem(LS_KEY + ":view") || "list"; }catch(e){}
    if(v === "guide" && !ROUTE_HTML) v = "list";
    switchView(v);
  }

  const msg = [restored && `${restored} 个之前的选择`,
               restoredItin && `${restoredItin} 项日程安排`].filter(Boolean);
  if(msg.length) toast(`从浏览器缓存恢复了 ${msg.join("、")}`);

  layoutMapActions();
  layoutMap();
}

// 页头高度随宽度变（副标题折行），操作栏高度随「手动保存…」展开变，两者都得重量
addEventListener("resize", layoutMap);
NARROW.addEventListener?.("change", () => { layoutMapActions(); layoutMap(); });

/* ─────────────────────────────────────────────── 事件 */
document.addEventListener("click", e => {
  const detail = e.target.closest("[data-detail]");
  if(detail){ openDetail(detail.dataset.detail); return; }

  const sb = e.target.closest("[data-sched]");
  if(sb){
    MAP.toggleDay(sb.dataset.sched);
    openDetail(sb.dataset.sched);   // 重画按钮：加进去了就该变成「移出」
    return;
  }

  const pick = e.target.closest(".pick button");
  if(pick){
    const id = pick.closest(".pick").dataset.id;
    const v  = pick.dataset.v;
    const p  = PLACES.find(x => x.id === id);
    if(v === "no" && p && p.choice !== "no"){ $("#dlg").close(); askReason(id); }
    else setChoice(id, v);
    return;
  }

  if(e.target.closest("[data-close]")) $("#dlg").close();

  const chip = e.target.closest(".chip");
  if(chip){
    const on = chip.getAttribute("aria-pressed") === "true";
    chip.setAttribute("aria-pressed", !on);
    if(chip.dataset.unv){ ui.unv = !on; render(); return; }
    const set = chip.dataset.cat ? ui.cats : ui.tags;
    const key = chip.dataset.cat || chip.dataset.tag;
    on ? set.delete(key) : set.add(key);
    render();
    return;
  }

  const tab = e.target.closest(".tab");
  if(tab && !tab.disabled){ switchView(tab.dataset.view); return; }
});

$("#q").addEventListener("input", e => { ui.q = e.target.value; render(); });
$("#by-area").onclick = () => { ui.group="area"; $("#by-area").setAttribute("aria-pressed",true); $("#by-tier").setAttribute("aria-pressed",false); render(); };
$("#by-tier").onclick = () => { ui.group="tier"; $("#by-tier").setAttribute("aria-pressed",true); $("#by-area").setAttribute("aria-pressed",false); render(); };
$("#f-all").onclick   = () => { ui.scope="all";  $("#f-all").setAttribute("aria-pressed",true);  $("#f-todo").setAttribute("aria-pressed",false); render(); };
$("#f-todo").onclick  = () => { ui.scope="todo"; $("#f-todo").setAttribute("aria-pressed",true); $("#f-all").setAttribute("aria-pressed",false); render(); };
$("#save").onclick     = doSave;
$("#download").onclick = () => download(false);
$("#copy").onclick     = showCode;

document.addEventListener("keydown", e => {
  if(e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ e.preventDefault(); $("#q").focus(); }

  // 标签栏内的 ←→ / Home / End。WAI-ARIA 的 tab 模式要求方向键切换，
  // 禁用的「攻略」跳过 —— 它不可聚焦，停在上面就成了死胡同。
  const tab = e.target.closest?.(".tab");
  if(tab && ["ArrowLeft","ArrowRight","Home","End"].includes(e.key)){
    const tabs = $$(".tab").filter(t => !t.disabled);
    if(!tabs.length) return;
    e.preventDefault();
    const i = tabs.indexOf(tab);
    const to = e.key === "Home" ? 0
             : e.key === "End"  ? tabs.length - 1
             : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    switchView(tabs[to].dataset.view);
    tabs[to].focus();
  }
});

boot();
</script>
