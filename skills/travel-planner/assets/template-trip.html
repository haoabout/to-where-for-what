<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   数据由 build.py 注入。内联而非 fetch()，因为 file:// 下 fetch 会被 CORS 拦死。
   ═══════════════════════════════════════════════════════════════════ */
const DATA       = /*__TRIP_DATA__*/null;
const ROUTE_HTML = /*__ROUTE_HTML__*/null;
const TRANSIT    = /*__TRANSIT__*/null;
const BUILT_AT   = /*__BUILT_AT__*/null;
const STANDALONE = __STANDALONE__;

const TRIP   = DATA.trip || {};
const PLACES = DATA.places || [];
const CATS   = DATA.categories || [];
const CATMAP = Object.fromEntries(CATS.map(c => [c.id, c.label || c.id]));

/* ═══════════════════════════════════════════════════════════════════
   排程索引

   itinerary 里只存「顺序即数组顺序」，序号和天色都在这里现算。
   不把 day/seq 写回 place —— 两处存同一件事必然打架（删一个点就要
   重排所有 seq）。契约见 references/data-schema.md。
   ═══════════════════════════════════════════════════════════════════ */
const ITIN = DATA.itinerary || [];
const BY_ID = Object.fromEntries(PLACES.map(p => [p.id, p]));
const isLodging = p => !!p && p.kind === "lodging";

// 必须避开绿（想去）/琥珀（待定）/灰（不想去），否则填充与描边同色系；
// 又要足够深，白色序号数字压得住。
const DAY_COLORS = ["#546E7A", "#2E6FD9", "#7B3FB5", "#0F8A8A", "#C2185B", "#5D4037"];
const dayColor = n => DAY_COLORS[((n % DAY_COLORS.length) + DAY_COLORS.length) % DAY_COLORS.length];

let SCHED = new Map();          // placeId -> [{ n, seq, note }]，按出现先后
function buildSched(){
  SCHED = new Map();
  for(const day of ITIN){
    let seq = 0;
    for(const ent of (day.places || [])){
      const p = BY_ID[ent && ent.id];
      if(!p) continue;
      // 住宿不参与编号，景点才是 1、2、3 连续的
      const lod = isLodging(p);
      if(!lod) seq++;
      const arr = SCHED.get(ent.id) || [];
      arr.push({ n: day.n, seq: lod ? null : seq, note: ent.note || "" });
      SCHED.set(ent.id, arr);
    }
  }
}
buildSched();

const schedOf = id => SCHED.get(id) || [];
const daysOf  = id => [...new Set(schedOf(id).map(s => s.n))].sort((a, b) => a - b);
const firstSeq = id => (schedOf(id).find(s => s.seq != null) || {}).seq ?? null;

/* 能力检测：保存能力取决于浏览器引擎，与 file:// / http:// 无关。
   实测 file:// 下 showSaveFilePicker 同样可用；真正不支持的是 Firefox / Safari。 */
const CAN_WRITE = typeof window.showSaveFilePicker === "function";
const LS_KEY = `tp:${TRIP.destination || "trip"}:${TRIP.generated_at || ""}`;

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* pitch / detail 里 AI 常自然地写 **重点**。先完整转义再还原这一种标记，
   既不丢强调也不引入 XSS——顺序反过来就危险了。 */
const rich = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const richP = s => rich(s).split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g, "<br>")}</p>`).join("");

let fileHandle = null;
const ui = { group:"area", scope:"all", q:"", cats:new Set(), tags:new Set(), unv:false };

/* ─────────────────────────────────────────────── 行程日期 */
const WD = ["一","二","三","四","五","六","日"];

/* 本地日期格式化。绝不能用 toISOString()——它转 UTC，
   在东八区会把 09-13 输出成 09-12，用户会以为错误的那天闭馆。 */
const isoLocal = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function tripDays(){
  const d = TRIP.dates || {};
  if(!d.start || !d.end) return [];
  const out = [], s = new Date(d.start + "T00:00:00"), e = new Date(d.end + "T00:00:00");
  if(isNaN(s) || isNaN(e) || e < s) return [];
  for(let c = new Date(s); c <= e; c.setDate(c.getDate()+1)){
    out.push({ date:new Date(c), iso:isoLocal(c), wd:((c.getDay()+6)%7)+1 });
  }
  return out;
}
const DAYS = tripDays();

/* ─────────────────────────────────────────────── 警示计算
   这是清单视图的核心价值：让用户在点「想去」之前就看到问题，
   而不是筛完一轮才发现那天根本不开门。 */
function flags(p){
  const out = [];
  if(p.status && p.status !== "open"){
    const label = { renovating:"修缮中", seasonal_closed:"季节性关闭", permanently_closed:"已永久关闭" }[p.status] || p.status;
    out.push({ cls:"f-danger", txt:label + (p.status_note ? "：" + p.status_note : "") });
  }
  const cd = p.closed_days || [];
  if(cd.length && DAYS.length){
    const hit = DAYS.filter(d => cd.includes(d.wd));
    if(hit.length === DAYS.length){
      out.push({ cls:"f-danger", txt:"行程期间全程闭馆" });
    }else if(hit.length){
      out.push({ cls:"f-warn", txt:hit.map(d => `${d.iso.slice(5)}(周${WD[d.wd-1]})闭馆`).join("、") });
    }
  }else if(cd.length){
    out.push({ cls:"f-info", txt:"周" + cd.map(d => WD[d-1]).join("、") + "闭馆" });
  }
  if(p.booking === "required") out.push({ cls:"f-warn", txt:"必须预约才能进" });
  else if(p.booking === "recommended") out.push({ cls:"f-info", txt:"建议预约" });
  // 核实被拦截：必须显眼，否则用户会把未核实的信息当成已核实的
  const v = p.verify;
  if(v && v.state && v.state !== "verified"){
    out.push({ cls:"f-unverified",
      txt: v.state === "blocked" ? "官方信息未能核实" : "信息仅部分核实" });
  }
  return out;
}

function verifyBox(p){
  const v = p.verify;
  if(!v || !v.state || v.state === "verified") return "";
  return `<div class="verify-box">
    <b>${v.state === "blocked" ? "这个地点的官方信息没能查到" : "这个地点只核实了一部分信息"}</b><br>
    ${rich(v.note || "")}
    ${(v.check || []).length ? `<ul>${v.check.map(x => `<li>需自行确认：${esc(x)}</li>`).join("")}</ul>` : ""}
    <div style="margin-top:6px">查到之后告诉 AI，它会补进数据里。</div>
  </div>`;
}

/* ─────────────────────────────────────────────── 渲染辅助 */
const SCALE_TXT = { spot:"打卡点 5-15 分钟", "30min":"约 30 分钟", "1-2h":"1-2 小时",
                    "2-3h":"2-3 小时", "half-day":"半天", "full-day":"一整天" };
const stars = n => "★".repeat(n||0) + `<i>${"★".repeat(Math.max(0,5-(n||0)))}</i>`;

function thumb(p){
  const im = (p.images || [])[0];
  if(!im || !im.url) return `<div class="thumb empty" data-ch="${esc((p.name||"?")[0])}"></div>`;
  return `<div class="thumb"><img src="${esc(im.url)}" alt="${esc(p.name)}" loading="lazy"
    onerror="this.parentNode.className='thumb empty';this.parentNode.dataset.ch='${esc((p.name||'?')[0])}';this.remove()"></div>`;
}

function pickHTML(p){
  const c = p.choice;
  return `<div class="pick" data-id="${esc(p.id)}">
    <button class="y" data-v="yes"   aria-pressed="${c==="yes"}">想去</button>
    <button class="m" data-v="maybe" aria-pressed="${c==="maybe"}">待定</button>
    <button class="n" data-v="no"    aria-pressed="${c==="no"}">不想去</button>
  </div>`;
}

function cardHTML(p, children){
  const fl = flags(p);
  const loc = p.name_local && p.name_local !== p.name ? `<span class="loc">${esc(p.name_local)}</span>` : "";
  const unv = p.verify && p.verify.state && p.verify.state !== "verified" ? ` data-verify="${esc(p.verify.state)}"` : "";
  return `<article class="card" data-id="${esc(p.id)}" data-choice="${esc(p.choice||"")}"${unv}>
    <div class="card-in">
      ${thumb(p)}
      <div class="body">
        <div class="hd">
          <span class="nm" data-detail="${esc(p.id)}">${esc(p.name)}</span>${loc}
          <span class="tier t-${esc(p.tier)}">${esc(p.tier)}</span>
          <span class="stars" title="出片指数 ${p.photo_index||0}/5">${stars(p.photo_index)}</span>
        </div>
        <p class="pitch">${rich(p.pitch)}</p>
        <div class="facts">
          <span>◷ ${esc(SCALE_TXT[p.scale] || p.scale)}</span>
          <span>◎ ${esc(p.ticket)}</span>
          <span>${p.indoor ? "▢ 室内" : "△ 户外"}</span>
          ${p.night ? "<span>☾ 适合夜间</span>" : ""}
          <span>${esc(CATMAP[p.category] || p.category)}</span>
        </div>
        ${fl.length ? `<div class="flags">${fl.map(f=>`<span class="flag ${f.cls}">${esc(f.txt)}</span>`).join("")}</div>` : ""}
        ${verifyBox(p)}
        ${pickHTML(p)}
        ${p.choice === "no" && p.choice_reason ? `<div class="why">不去的理由：${esc(p.choice_reason)}</div>` : ""}
        ${children.length ? spotsHTML(children) : ""}
      </div>
    </div>
  </article>`;
}

/* 打卡点折叠在主景点下面：既不淹没主景点，也不会漏掉顺路的小机位 */
function spotsHTML(kids){
  return `<div class="spots">
    <div class="spots-h">顺路打卡点 · ${kids.length} 个</div>
    ${kids.map(k => `<div class="spot" data-id="${esc(k.id)}">
      <span class="sn" data-detail="${esc(k.id)}">${esc(k.name)}</span>
      <span class="sd">${rich(k.pitch)}</span>
      ${pickHTML(k)}
    </div>`).join("")}
  </div>`;
}

/* ─────────────────────────────────────────────── 过滤与分组 */
function visible(){
  const q = ui.q.trim().toLowerCase();
  return PLACES.filter(p => {
    if(ui.scope === "todo" && p.choice) return false;
    if(ui.unv && !(p.verify && p.verify.state && p.verify.state !== "verified")) return false;
    if(ui.cats.size && !ui.cats.has(p.category)) return false;
    if(ui.tags.size && !(p.tags||[]).some(t => ui.tags.has(t))) return false;
    if(q){
      const hay = [p.name,p.name_local,p.name_en,p.pitch,p.detail,p.area,(p.tags||[]).join(" ")]
        .filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

const TIER_ORDER = { S:0, A:1, B:2, C:3 };

function render(){
  const vis = visible();
  const visIds = new Set(vis.map(p => p.id));
  const kidsOf = {};
  const tops = [];

  for(const p of vis){
    if(p.scale === "spot" && p.parent_id && visIds.has(p.parent_id)){
      (kidsOf[p.parent_id] = kidsOf[p.parent_id] || []).push(p);
    }else{
      tops.push(p);
    }
  }

  const groups = new Map();
  for(const p of tops){
    const key = ui.group === "area" ? (p.area || "其他") : `${p.tier} 级`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }

  const keys = [...groups.keys()].sort((a,b) => {
    // 推荐度必须按 S→A→B→C 排，不能用字母序（那会把 S 排到最后）
    if(ui.group === "tier") return (TIER_ORDER[a[0]] ?? 9) - (TIER_ORDER[b[0]] ?? 9);
    return groups.get(b).length - groups.get(a).length || a.localeCompare(b);
  });

  const box = $("#groups");
  if(!vis.length){
    box.innerHTML = `<div class="empty-state"><div class="big">没有符合条件的景点</div>
      <div>调整一下搜索或筛选条件</div></div>`;
  }else{
    box.innerHTML = keys.map(k => {
      const list = groups.get(k).sort((a,b) =>
        (TIER_ORDER[a.tier]??9) - (TIER_ORDER[b.tier]??9) ||
        (b.photo_index||0) - (a.photo_index||0));
      const kidCount = list.reduce((n,p) => n + (kidsOf[p.id]||[]).length, 0);
      return `<section class="group">
        <div class="group-h">
          <h2>${esc(k)}</h2>
          <span class="meta">${list.length} 个${kidCount ? ` + ${kidCount} 打卡点` : ""}</span>
        </div>
        <div class="cards">${list.map(p => cardHTML(p, kidsOf[p.id]||[])).join("")}</div>
      </section>`;
    }).join("");
  }
  updateProgress();
  // 清单里改了选择，地图上的 marker 颜色要立刻跟着变——
  // 这正是三视图合一的意义：中间不需要 AI 重新生成页面。
  if(window.MAP) MAP.refresh();
}

function renderChips(){
  const counts = {};
  for(const p of PLACES) counts[p.category] = (counts[p.category]||0) + 1;
  const tagCount = {};
  for(const p of PLACES) for(const t of p.tags||[]) tagCount[t] = (tagCount[t]||0)+1;
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const nUnv = PLACES.filter(p => p.verify && p.verify.state && p.verify.state !== "verified").length;
  $("#chips").innerHTML =
    (nUnv ? `<button class="chip" data-unv="1" aria-pressed="false" title="官方信息没能查到的地点，需要你自己确认">⚠ 待你确认<span class="c">${nUnv}</span></button>` : "")
    + CATS.filter(c => counts[c.id]).map(c =>
      `<button class="chip" data-cat="${esc(c.id)}" aria-pressed="false">${esc(c.label)}<span class="c">${counts[c.id]}</span></button>`).join("")
    + topTags.map(([t,n]) =>
      `<button class="chip" data-tag="${esc(t)}" aria-pressed="false">#${esc(t)}<span class="c">${n}</span></button>`).join("");
}

/* 原来是页头一条横跨全宽的进度条 + 图例。它只在做选择时有意义，却常驻在
   每个视图顶上占掉一行。改成把同一组数字挂到「筛选按钮」本身 ——
   数字和它筛出来的那一类在同一个控件上，不用再对照图例。 */
function updateProgress(){
  const n = { yes:0, maybe:0, no:0, none:0 };
  for(const p of PLACES) n[p.choice || "none"]++;
  for(const b of $$(".mfil")){
    const c = b.querySelector(".c");
    if(c) c.textContent = n[b.dataset.c] ?? 0;
  }
  const t = $("#tally");
  if(t) t.innerHTML =
    `<span><i class="dot d-yes"></i>${n.yes}</span>
     <span><i class="dot d-maybe"></i>${n.maybe}</span>
     <span><i class="dot d-no"></i>${n.no}</span>
     <span><i class="dot d-none"></i>${n.none}</span>`;
  $("#n-list").textContent = PLACES.length;
}

/* ─────────────────────────────────────────────── 选择与暂存 */
function setChoice(id, v, reason){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  p.choice = (p.choice === v) ? null : v;
  p.choice_reason = (p.choice === "no") ? (reason || p.choice_reason || "") : "";
  saveLocal();
  render();
}

function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(
      PLACES.filter(p => p.choice).map(p => [p.id, p.choice, p.choice_reason || ""])));
  }catch(e){ /* 隐私模式下 localStorage 不可用，忽略 */ }
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return 0;
    const map = new Map(JSON.parse(raw).map(([id,c,r]) => [id,[c,r]]));
    let n = 0;
    for(const p of PLACES){
      const hit = map.get(p.id);
      // 文件里已有选择时以文件为准：AI 刚写回的结果比浏览器缓存新
      if(hit && !p.choice){ p.choice = hit[0]; p.choice_reason = hit[1]; n++; }
    }
    return n;
  }catch(e){ return 0; }
}

/* ─────────────────────────────────────────────── 详情弹窗 */
function openDetail(id){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  const im = (p.images||[])[0];
  const fl = flags(p);
  const kv = [
    ["开放时间", p.hours],
    ["最后入场", p.last_entry],
    ["闭馆", p.closed],
    ["门票", p.ticket],
    ["预约", { required:"必须预约才能进入", recommended:"可现场前往，但建议预约", none:"无需预约" }[p.booking]],
    ["建议时长", p.duration_min ? `约 ${p.duration_min} 分钟` : ""],
    ["所属区域", p.area],
    ["出片指数", p.photo_index ? `${p.photo_index}/5` : ""],
  ].filter(([,v]) => v);

  $("#dlg-inner").innerHTML = `
    <div class="dlg-h">
      <h3>${esc(p.name)}${p.name_local && p.name_local!==p.name ? ` <span class="loc">${esc(p.name_local)}</span>` : ""}</h3>
      <button class="x" data-close aria-label="关闭">&times;</button>
    </div>
    <div class="dlg-b">
      ${im && im.url ? `<img class="dlg-img" src="${esc(im.url)}" alt="${esc(p.name)}" onerror="this.remove()">
        ${im.credit ? `<div class="credit">${esc(im.credit)}</div>` : ""}` : ""}
      ${fl.length ? `<div class="flags" style="margin-bottom:14px">${fl.map(f=>`<span class="flag ${f.cls}">${esc(f.txt)}</span>`).join("")}</div>` : ""}
      ${verifyBox(p)}
      ${richP(p.detail || p.pitch)}
      ${p.photo_note ? `<h4>拍摄建议</h4>${richP(p.photo_note)}` : ""}
      <h4>实用信息</h4>
      <dl class="kv">${kv.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${p.booking_url ? `<h4>预约</h4><ul class="srcs"><li><a href="${esc(p.booking_url)}" target="_blank" rel="noopener">${esc(p.booking_url)}</a></li></ul>` : ""}
      <h4>信息来源</h4>
      <ul class="srcs">${(p.sources||[]).map(s =>
        `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></li>`).join("") || "<li>—</li>"}</ul>
      <div class="dlg-f">${pickHTML(p)}</div>
    </div>`;
  $("#dlg").showModal();
}

/* ─────────────────────────────────────────────── 不去的理由 */
const QUICK = ["太远了","人太多","不感兴趣","时间不够","门票太贵","去过了","那天不开门","和别处重复"];
function askReason(id){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  let picked = "";
  $("#rdlg-inner").innerHTML = `
    <div class="dlg-h"><h3>为什么不去${esc(p.name)}？</h3>
      <button class="x" data-rclose aria-label="关闭">&times;</button></div>
    <div class="dlg-b">
      <p style="font-size:13px">记下理由，之后回看清单时能快速判断要不要把它捡回来。可以跳过。</p>
      <div class="reasons">${QUICK.map(r => `<button data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
      <textarea id="rtext" placeholder="或者自己写…"></textarea>
      <div class="dlg-f">
        <button class="btn" data-rskip>跳过</button>
        <button class="btn primary" data-rok>确定</button>
      </div>
    </div>`;
  const dlg = $("#rdlg");
  dlg.showModal();
  $("#rdlg-inner").onclick = e => {
    const b = e.target.closest("button");
    if(!b) return;
    if(b.dataset.r !== undefined){
      picked = b.dataset.r;
      $$("#rdlg-inner .reasons button").forEach(x => x.setAttribute("aria-pressed", x === b));
      $("#rtext").value = picked;
    }
    if(b.hasAttribute("data-rok"))   { setChoice(id,"no",$("#rtext").value.trim()); dlg.close(); }
    if(b.hasAttribute("data-rskip")) { setChoice(id,"no",""); dlg.close(); }
    if(b.hasAttribute("data-rclose")) dlg.close();
  };
}

/* ─────────────────────────────────────────────── 导出 */
function payload(){
  const out = JSON.parse(JSON.stringify(DATA));
  const cm = new Map(PLACES.map(p => [p.id, p]));
  for(const p of out.places){
    const cur = cm.get(p.id);
    p.choice = cur ? cur.choice ?? null : null;
    p.choice_reason = cur ? cur.choice_reason || "" : "";
  }
  return JSON.stringify(out, null, 2);
}

function shortCode(){
  const g = v => PLACES.filter(p => p.choice === v);
  const L = [`#travel-planner v1 · ${TRIP.destination || ""} · ${isoLocal(new Date())}`];
  const yes = g("yes"), maybe = g("maybe"), no = g("no");
  if(yes.length)   L.push("+ " + yes.map(p => p.id).join(" "));
  if(maybe.length) L.push("? " + maybe.map(p => p.id).join(" "));
  if(no.length)    L.push("- " + no.map(p => p.id + (p.choice_reason ? `(${p.choice_reason})` : "")).join(" "));
  L.push(`# 想去 ${yes.length} · 待定 ${maybe.length} · 不想去 ${no.length} · 未表态 ${PLACES.length-yes.length-maybe.length-no.length}`);
  return L.join("\n");
}

/* 保存有三条路，按可靠性排序，任何一条失败都自动往下走——
   绝不能让用户点了保存却卡在一个报错提示上，筛了半天的结果没法带走。

   实测（Claude 内置浏览器）：
     · showSaveFilePicker 函数存在，但 createWritable 抛 NotAllowedError
     · navigator.clipboard.writeText 抛 NotAllowedError
   也就是说「函数存在」完全不能证明「能用」，必须真的试一次才知道。 */
async function saveViaServer(){
  if(location.protocol !== "http:" && location.protocol !== "https:") return null;
  try{
    const r = await fetch("/__save__", {
      method:"POST", headers:{ "Content-Type":"application/json" }, body:payload(),
    });
    const j = await r.json().catch(() => ({}));
    return j && j.ok ? j : null;
  }catch(e){ return null; }
}

async function saveViaPicker(){
  if(typeof window.showSaveFilePicker !== "function") return null;
  try{
    if(!fileHandle){
      fileHandle = await window.showSaveFilePicker({
        suggestedName:"places.json",
        types:[{ description:"行程数据", accept:{ "application/json":[".json"] } }],
      });
    }
    if(fileHandle.queryPermission){
      let st = await fileHandle.queryPermission({ mode:"readwrite" });
      if(st === "prompt" && fileHandle.requestPermission)
        st = await fileHandle.requestPermission({ mode:"readwrite" });
      if(st !== "granted") return null;
    }
    const w = await fileHandle.createWritable();
    await w.write(payload());
    await w.close();
    return { name: fileHandle.name };
  }catch(e){
    if(e.name === "AbortError") return "abort";   // 用户主动取消，不要再降级
    fileHandle = null;
    return null;
  }
}

async function doSave(){
  const btn = $("#save");
  btn.disabled = true; btn.textContent = "保存中…";
  try{
    const srv = await saveViaServer();
    if(srv){
      toast(`已写回 places.json（${srv.chosen} 个已表态），可以让 AI 继续设计路线了`);
      return;
    }
    const pick = await saveViaPicker();
    if(pick === "abort") return;
    if(pick){
      toast("已保存到 " + pick.name + "，可以让 AI 继续设计路线了");
      return;
    }
    // 两条直写路都不通——直接下载，并说清楚为什么
    download(true);
  }finally{
    btn.disabled = false; btn.textContent = "保存筛选结果";
  }
}

function download(isFallback){
  const b = new Blob([payload()], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "places.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(isFallback
    ? "这个浏览器不允许直接写文件，已改为下载。把 places.json 放回行程目录覆盖原文件即可"
    : "已下载 places.json，把它放回行程目录覆盖原文件");
  if(isFallback) setTimeout(showCode, 900);   // 下载也可能被拦，再给一条兜底
}

function showCode(){
  const code = shortCode();
  $("#dlg-inner").innerHTML = `
    <div class="dlg-h"><h3>把这段贴回对话</h3><button class="x" data-close aria-label="关闭">&times;</button></div>
    <div class="dlg-b">
      <p style="font-size:13px">你的浏览器不支持直接写文件（Firefox / Safari 都不支持）。
      复制下面这段发给 AI，效果一样。</p>
      <pre class="code" id="code">${esc(code)}</pre>
      <div class="dlg-f">
        <button class="btn" data-close>关闭</button>
        <button class="btn primary" id="cp">复制</button>
      </div>
    </div>`;
  $("#dlg").showModal();
  $("#cp").onclick = async () => {
    // 实测内置浏览器 navigator.clipboard 抛 NotAllowedError，必须有选中兜底
    try{ await navigator.clipboard.writeText(code); toast("已复制"); }
    catch(e){
      const r = document.createRange(); r.selectNode($("#code"));
      getSelection().removeAllRanges(); getSelection().addRange(r);
      toast("这个浏览器不允许自动复制，已帮你选中，按 ⌘C / Ctrl+C");
    }
  };
}

let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 3200);
}

/* ═══════════════════════════════════════════════════════════════════
   地图视图

   底图分层与降级链（每一级都实测过）：
     ① 标准  graybeard style + OSM 官方 Shortbread 矢量瓦片。默认
     ② 简约  OpenFreeMap positron。另一种观感，同时充当矢量源的备份
     ③ 光栅  OSM 官方光栅，仅 http 下解锁 —— file:// 不发 Referer，
             OSM 会返回一张写着「Access blocked」的图片，
             且 HTTP 状态码是 200，onerror 抓不到
     ④ 无 WebGL → Leaflet + CARTO 光栅
     ⑤ 全挂 → 静态散点图，至少还能看清相对位置

   为什么默认是 ①（实测依据）：
     · OSM 官方矢量瓦片**不要 Referer**，file:// 下同样返回 200 ——
       而官方光栅那套会被挡。双击打开也有一个像样的底图。
     · OFM 的 park 源图层实测是空的（大阪城/中之岛/万博全是 0 个要素），
       绿地只能从 landcover.grass 绕；OSM Shortbread 的 land 层直接带
       park/garden/forest/grass 分类。
     · 官方运营，不是单人维护的捐赠项目。
     · 全球覆盖抽查 9 城（含拉萨、雷克雅未克）全部有数据。

   ①③ 都是 OSM 官方，②是 OpenFreeMap；两个矢量源 schema 不同、运营方不同，
   不会一起挂。
   ═══════════════════════════════════════════════════════════════════ */
const MAP = (() => {
  const MAPLIBRE_JS  = "https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js";
  const MAPLIBRE_CSS = "https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css";
  const LEAFLET_JS   = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  const LEAFLET_CSS  = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";

  /* graybeard 绑定的是 Shortbread **schema**，不是 VersaTiles 这家供应商。
     把 sources 指向 OSM 官方的 Shortbread 端点即可，其余 324 个图层一字不改。
     （反过来不成立：graybeard 与 positron 引用的 source-layer 零重叠，
       想让 graybeard 跑在 OpenFreeMap 上得把每个图层重写一遍。） */
  const GRAYBEARD  = "https://tiles.versatiles.org/assets/styles/graybeard/style.json";
  const OSM_VECTOR = "https://vector.openstreetmap.org/shortbread_v1/{z}/{x}/{y}.mvt";
  const OSM_ATTRIB = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
  // Leaflet 降级时用：CARTO 有 CORS、不要 Referer，file:// 下也能出图
  const CARTO_RASTER = ["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                        "https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"];
  let gbStyle = null;      // graybeard 的 style JSON 只抓一次，切回来不重复请求

  const BASEMAPS = [
    { id:"gb", label:"标准", kind:"vector", schema:"shortbread",
      style:() => (gbStyle ||= fetch(GRAYBEARD, { cache:"force-cache" })
        .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(s => {
          const src = s.sources["versatiles-shortbread"];
          src.tiles = [OSM_VECTOR];
          src.maxzoom = 14;      // 与 vector.openstreetmap.org 的 tilejson 一致
          src.attribution = "";
          return s;
        })
        .catch(e => { gbStyle = null; throw e; })),   // 失败不要缓存，下次还能重试
      attrib: OSM_ATTRIB + ' · 矢量瓦片 <a href="https://vector.openstreetmap.org/" target="_blank" rel="noopener">vector.openstreetmap.org</a> · Style: VersaTiles graybeard' },
    { id:"ofm", label:"简约", kind:"vector", schema:"openmaptiles",
      style:"https://tiles.openfreemap.org/styles/positron",
      attrib:'OpenFreeMap © OpenMapTiles Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' },
    { id:"osm", label:"光栅", kind:"raster", httpOnly:true,
      tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
      attrib: OSM_ATTRIB },
  ];

  /* ---------- 水体与绿地上色 ----------
     两套 style 都把水和绿地画成了灰（graybeard 是 colorful 把饱和度压成 0，
     色相其实还留着；positron 本来就是浅灰）。这里只把这两类还原成彩色，
     道路建筑注记一律保持灰 —— 让画面里的彩色只剩三样：
     点位、地铁线、水与绿地。 */
  const WATER = "rgb(190,221,243)";
  const TINT = {
    shortbread: {
      "water-ocean":WATER, "water-area":WATER, "water-area-river":WATER,
      "water-area-small":WATER, "water-river":WATER, "water-canal":WATER,
      "water-stream":WATER, "water-ditch":WATER, "water-dam":WATER,
      "land-park":"rgb(217,217,165)", "land-garden":"rgb(217,217,165)",
      "land-vegetation":"rgb(217,217,165)", "land-forest":"rgb(150,196,124)",
      "land-grass":"rgb(216,232,200)", "land-leisure":"rgb(231,237,222)",
      "land-wetland":"rgb(211,230,219)",
    },
    openmaptiles: { "water":WATER, "waterway":WATER, "landcover_wood":"rgb(186,214,180)" },
  };

  function applyTint(map, schema){
    for(const [id, color] of Object.entries(TINT[schema] || {})){
      const l = map.getLayer(id);
      if(l) map.setPaintProperty(id, l.type === "line" ? "line-color" : "fill-color", color);
    }
    if(schema !== "openmaptiles") return;
    // positron 根本没有画 grass 的图层，而大阪城那张瓦片里有 200 个 grass 要素。
    // 补一层，插在 water 下面免得盖住河道。
    if(!map.getLayer("x-grass") && map.getLayer("water")){
      map.addLayer({
        id:"x-grass", type:"fill", source:"openmaptiles", "source-layer":"landcover",
        filter:["in", ["get","class"], ["literal",["grass","farmland","wetland"]]],
        paint:{ "fill-color":"rgb(211,228,186)",
                "fill-opacity":["interpolate",["linear"],["zoom"], 9,0, 12,1] },
      }, "water");
    }
    // landcover_wood 原本 z10 才出现，缩小时绿地整片消失
    if(map.getLayer("landcover_wood")){
      map.setPaintProperty("landcover_wood","fill-opacity",
        ["interpolate",["linear"],["zoom"], 6,0, 9,1]);
    }
  }

  const st = { ready:false, engine:null, map:null, markers:new Map(),
               base:"gb", transit:false, focus:null, show:new Set(["yes","maybe","none","no"]),
               curDay:null, flat:null };

  const geo = p => p && p.coord && typeof p.coord.lon === "number" && typeof p.coord.lat === "number";
  const pts = () => PLACES.filter(geo);
  const kind = p => p.choice || "none";
  const COLOR = { yes:"var(--ok)", maybe:"var(--warn)", no:"var(--ink-3)", none:"var(--accent)" };

  function center(){
    const l = pts();
    if(!l.length) return { lon:0, lat:0 };
    return { lon:l.reduce((s,p)=>s+p.coord.lon,0)/l.length,
             lat:l.reduce((s,p)=>s+p.coord.lat,0)/l.length };
  }

  /* ---------- 资源加载 ---------- */
  const loaded = new Set();
  function inject(tag, attrs){
    const key = attrs.src || attrs.href;
    if(loaded.has(key)) return Promise.resolve();
    return new Promise((res, rej) => {
      const el = document.createElement(tag);
      Object.assign(el, attrs);
      el.onload  = () => { loaded.add(key); res(); };
      el.onerror = () => rej(new Error("加载失败：" + key));
      document.head.appendChild(el);
    });
  }
  const loadJS  = src  => inject("script", { src });
  const loadCSS = href => inject("link", { rel:"stylesheet", href });

  function hasWebGL(){
    try{
      const c = document.createElement("canvas");
      return !!(c.getContext("webgl2") || c.getContext("webgl"));
    }catch(e){ return false; }
  }

  /* 行程中心点落在哪张瓦片上 —— 探测底图可用性时用它取一张「必定有内容」的瓦片，
     取空白海面的瓦片会让「几 KB 算正常」的判断失去意义。 */
  function centerTile(z){
    const c = center();
    const rad = c.lat * Math.PI / 180;
    return {
      z,
      x: Math.floor((c.lon + 180) / 360 * 2 ** z),
      y: Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * 2 ** z),
    };
  }

  /* ---------- OSM 封禁瓦片探测 ----------
     封禁响应是一张 256×256 的 PNG，内容是「Access blocked 403」，
     大小约 6987 字节，HTTP 状态码却是 200。
     只看状态码或 onerror 永远发现不了，必须看字节数。 */
  async function osmUsable(){
    if(!location.protocol.startsWith("http")) return false;
    const { z, x, y } = centerTile(12);
    try{
      const r = await fetch(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`, { cache:"no-store" });
      if(!r.ok) return false;
      const b = await r.blob();
      return b.size > 12000;   // 真实城市瓦片通常 20-50KB，封禁瓦片约 7KB
    }catch(e){ return false; }
  }


  function note(html){
    const n = $("#map-note");
    n.innerHTML = html || "";
    n.classList.toggle("on", !!html);
  }

  /* ---------- 底图切换按钮 ----------
     OSM 探测是异步的。必须在探测回来后重新检查 st.degraded，
     否则会把降级模式下刚禁用的按钮又启用回去（实测踩过）。 */
  function paintBaseButtons(){
    $("#basemaps").innerHTML = BASEMAPS.map(b =>
      `<button data-base="${b.id}" aria-pressed="${b.id === st.base}">${b.label}</button>`).join("");
  }

  function lockBaseButtons(reason){
    $$("#basemaps button").forEach(b => {
      b.disabled = true;
      b.title = reason;
      b.setAttribute("aria-pressed", b.dataset.base === st.base);
    });
  }

  const PROBES = {
    osm: {
      test: osmUsable,
      offline: "本地文件打开时浏览器不发送 Referer，OSM 官方瓦片会返回一张写着「Access blocked」的图片（HTTP 状态码仍是 200）。用 build.py --serve 以 http 打开即可解锁。",
      ok:   "OpenStreetMap 官方底图",
      fail: "探测到 OSM 返回封禁瓦片（约 7KB 的「Access blocked」图），已停用",
    },
  };

  async function probe(id){
    const sel = `#basemaps [data-base="${id}"]`;
    const btn = document.querySelector(sel);
    const cfg = PROBES[id];
    if(!btn || !cfg) return;
    if(!location.protocol.startsWith("http")){
      btn.disabled = true; btn.title = cfg.offline; return;
    }
    btn.disabled = true;
    btn.title = "正在探测是否可用…";
    const ok = await cfg.test();
    if(st.degraded) return;                       // 降级后不要复活按钮
    const b2 = document.querySelector(sel);       // 探测期间按钮可能已被重绘
    if(!b2) return;
    b2.disabled = !ok;
    b2.title = ok ? cfg.ok : cfg.fail;
  }

  /* ---------- 瓦片持续失败的监听 ----------
     实测教训：startMapLibre 里的 once("error") 只覆盖启动阶段，之后切底图
     或叠加图层再失败，错误就只剩 console 里的 AJAXError，页面上完全没反应——
     按钮亮着、图层也加上了，就是不出图，用户只会觉得「点了没用」。 */
  const deadBases = new Set();
  function watchTiles(){
    let hits = 0, watching = st.base, timer = null;
    st.map.on("error", ev => {
      const msg = String((ev && ev.error && ev.error.message) || (ev && ev.message) || "");
      if(!/AJAX|Failed to fetch|NetworkError|Load failed/i.test(msg)) return;
      if(watching !== st.base){ watching = st.base; hits = 0; }
      if(deadBases.has(watching)) return;
      hits++;
      clearTimeout(timer);
      timer = setTimeout(() => { hits = 0; }, 8000);   // 偶发的单张失败不算数
      if(hits < 5) return;

      deadBases.add(watching);
      const b = BASEMAPS.find(x => x.id === watching);
      const btn = document.querySelector(`#basemaps [data-base="${watching}"]`);
      if(btn){ btn.disabled = true; btn.title = "瓦片持续加载失败，已停用：" + msg; }
      note(`<b>「${b ? b.label : watching}」底图的瓦片加载失败</b>，已自动切回标准底图。`
         + `控制台原始错误：<code>${esc(msg)}</code>`);
      if(watching !== "gb") switchBase("gb");
    });
  }

  /* ---------- 样式构造 ----------
     异步：graybeard 的 style 要先抓下来、把 sources 改指 OSM 官方端点再交给
     MapLibre。其余两个是常量，await 一个非 Promise 也没有代价。 */
  async function styleFor(id){
    const b = BASEMAPS.find(x => x.id === id) || BASEMAPS[0];
    if(b.kind === "vector") return typeof b.style === "function" ? await b.style() : b.style;
    // 光栅 style 也要给 glyphs —— 底图本身不需要（图片里已经有字了），
    // 但地铁层的线号和站名是我们自己画的 symbol 图层，缺了字体服务
    // 会静默不出字：图层在、要素也被放置，就是一个字看不见。
    return {
      version:8,
      glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
      sources:{ base:{ type:"raster", tiles:b.tiles, tileSize:256,
                       maxzoom:b.maxZoom || 19, attribution:"" } },
      layers:[{ id:"base", type:"raster", source:"base" }],
    };
  }

  const schemaOf = id => (BASEMAPS.find(x => x.id === id) || {}).schema;

  function setAttrib(){
    const b = BASEMAPS.find(x => x.id === st.base);
    $("#attrib").innerHTML = b ? b.attrib
      : (st.engine === "leaflet" ? OSM_ATTRIB + " © CARTO" : "");
  }

  /* ═══════════════ 轨道交通叠加层 ═══════════════
     数据由 enrich.py --transit 从 OSM 抓好、build.py 内联进来，
     运行期零网络请求。这跟底图无关 —— 三个底图上都能开，file:// 也能用。

     为什么不用现成的地铁专题瓦片（试过 ÖPNVKarte，已放弃）：
       那是一整幅不透明光栅图，盖上去等于换底图；而且它按「交通方式」上色，
       八条地铁线全是同一个蓝，还混着大量公交线。
     自己画的好处：线路用 OSM 的 colour 标签，也就是官方色，一条一个颜色。 */
  const TRANSIT_SRC = "transit-lines", STATION_SRC = "transit-stations";
  const T_LAYERS = ["transit-line", "transit-line-label", "transit-station", "transit-station-label"];

  const hasTransit = () => !!(TRANSIT && (TRANSIT.lines?.features || []).length);

  /* 字体名必须从当前 style 里取，不能写死。
     实测：graybeard 的 glyphs 服务认的是 "noto_sans_bold"，positron 认的是
     "Noto Sans Bold" —— 写死任何一个，换到另一个底图时标注会一个都不出，
     而且 MapLibre 对缺失字体是静默失败，图层看着正常就是没字。 */
  function pickFont(map, bold){
    const fonts = [];
    for(const l of map.getStyle().layers){
      const f = (l.layout || {})["text-font"];
      if(Array.isArray(f)) for(const x of f) if(typeof x === "string" && !fonts.includes(x)) fonts.push(x);
    }
    const want = bold ? /bold/i : /regular|book|normal/i;
    return [fonts.find(f => want.test(f)) || fonts[0] || "Noto Sans Regular"];
  }

  function addTransit(){
    if(!hasTransit() || st.engine !== "maplibre" || !st.map) return;
    const m = st.map;
    const FONT_B = pickFont(m, true), FONT_R = pickFont(m, false);
    if(!m.getSource(TRANSIT_SRC)) m.addSource(TRANSIT_SRC, { type:"geojson", data:TRANSIT.lines });
    if(!m.getSource(STATION_SRC)) m.addSource(STATION_SRC, { type:"geojson", data:TRANSIT.stations || { type:"FeatureCollection", features:[] } });

    if(!m.getLayer("transit-line")) m.addLayer({
      id:"transit-line", type:"line", source:TRANSIT_SRC,
      layout:{ "line-cap":"round", "line-join":"round" },
      paint:{
        "line-color":["get","colour"],
        "line-width":["interpolate",["linear"],["zoom"], 9,1.6, 12,2.8, 15,4.6, 17,6.5],
        "line-opacity":0.9,
      },
    });
    // 线号沿线重复标注。symbol-placement:line 会让文字跟着线走，
    // 这正是纸质地铁图的读法：顺着一条颜色走，随时知道自己在哪条线上。
    if(!m.getLayer("transit-line-label")) m.addLayer({
      id:"transit-line-label", type:"symbol", source:TRANSIT_SRC, minzoom:11,
      layout:{
        "symbol-placement":"line", "symbol-spacing":190,
        "text-field":["get","ref"], "text-size":11, "text-font":FONT_B,
        "text-allow-overlap":false, "text-padding":3,
      },
      paint:{ "text-color":["get","colour"], "text-halo-color":"#fff", "text-halo-width":1.8 },
    });
    if(!m.getLayer("transit-station")) m.addLayer({
      id:"transit-station", type:"circle", source:STATION_SRC, minzoom:12,
      paint:{
        "circle-radius":["interpolate",["linear"],["zoom"], 12,1.8, 15,3.4, 17,4.6],
        "circle-color":"#fff", "circle-stroke-color":"#5b5b5b", "circle-stroke-width":1.2,
      },
    });
    // 站名从 z13 起才出 —— 129 个站在缩小时会糊成一片
    if(!m.getLayer("transit-station-label")) m.addLayer({
      id:"transit-station-label", type:"symbol", source:STATION_SRC, minzoom:13,
      layout:{
        // 不能只用 coalesce —— 它把空字符串当有效值。数据可能是手工改过的，
        // 这里按「长度 > 0」判断，enrich.py 那边也已经不再写空串。
        "text-field":["case",
          [">", ["length", ["coalesce", ["get","name_zh"], ""]], 0], ["get","name_zh"],
          ["get","name"]],
        "text-size":["interpolate",["linear"],["zoom"], 13,9.5, 16,12],
        "text-font":FONT_R, "text-offset":[0,0.95],
        "text-anchor":"top", "text-optional":true, "text-padding":2,
      },
      paint:{ "text-color":"#4a4a4a", "text-halo-color":"#fff", "text-halo-width":1.6 },
    });
    setTransitVisible(st.transit);
  }

  function setTransitVisible(on){
    st.transit = !!on;
    const btn = $("#transit-btn");
    if(btn) btn.setAttribute("aria-pressed", String(st.transit));
    $("#map-legend").hidden = !st.transit;
    if(st.engine !== "maplibre" || !st.map) return;
    for(const id of T_LAYERS){
      if(st.map.getLayer(id)) st.map.setLayoutProperty(id, "visibility", st.transit ? "visible" : "none");
    }
  }

  function paintLegend(){
    if(!hasTransit()) return;
    const feats = [...TRANSIT.lines.features].sort((a, b) =>
      String(a.properties.ref).localeCompare(String(b.properties.ref), "en"));
    const guessed = feats.filter(f => f.properties.guessed).length;
    const chip = p => `<span class="lg-ref" style="background:${esc(p.colour)}" `
                    + `title="${esc(p.name || p.ref)}">${esc(p.ref)}</span>`;
    $("#map-legend").innerHTML =
      `<div class="lg-chips">${feats.map(f => chip(f.properties)).join("")}</div>`
    + `<div class="lg-list">`
    + feats.map(f => {
        const p = f.properties, nm = p.name || p.ref;
        return `<div class="lg-row">${chip(p)}<span class="lg-nm" title="${esc(nm)}">${esc(nm)}</span></div>`;
      }).join("")
    + (guessed
        ? `<div class="lg-foot">其中 ${guessed} 条 OSM 未标注官方配色，颜色为自动分配</div>`
        : `<div class="lg-foot">配色取自 OSM 的 colour 标签，即官方线路色</div>`)
    + `</div><div class="lg-hint">点击${feats.length > 0 ? "展开线路名" : ""}</div>`;
  }

  /* ---------- marker ---------- */
  /* ---------- 点位的双层编码 ----------
     填充 = 哪一天，描边 = 想去/待定/不想去，数字 = 当天第几个。
     「空心 = 还没安排，实心 = 已经安排」这个心理模型不用教。

     不做 3 种选择 × N 天的完整叉乘：那是 12+ 种点状符号，超过人眼能
     可靠分辨的上限。让两层不对等——色相给天（唯一能"一眼成簇"的通道），
     选择退到描边。

     几何全部在 JS 里算，CSS 只管形状和过渡。否则 `.no:not(.placed)`
     这类组合会散落在两处，改一个忘一个。 */
  /* 住宿图标。emoji 在不同系统上字形、字重、基线都不一样，和旁边的序号数字
     对不齐；而且它无法继承颜色。统一用同一段 SVG，尺寸按用处传。 */
  const house = (n = 13) => `<svg viewBox="0 0 24 24" width="${n}" height="${n}" `
    + `fill="currentColor" aria-hidden="true" style="display:block">`
    + `<path d="M12 3 2 11h3v10h6v-6h2v6h6V11h3z"/></svg>`;

  function dotSpec(p){
    const lod = isLodging(p);
    const days = daysOf(p.id);
    const placed = days.length > 0;
    const k = kind(p);
    return {
      lod, days, placed, k,
      // 已排入的放大到 26px：3px 描边要在这个尺寸上才分得出绿/琥珀/灰
      dim: lod ? 24 : placed ? 26 : (k === "no" ? 14 : 22),
      // 「不想去」且未排入时是个低调小点，3px 环会把它整个吃掉
      ring: (k === "no" && !placed && !lod) ? 1.5 : 3,
    };
  }

  function styleDot(el, p){
    const dot = el.querySelector("i");
    if(!dot) return;
    const s = dotSpec(p);

    dot.style.width = dot.style.height = s.dim + "px";
    dot.style.borderRadius = s.lod ? "7px" : "50%";

    // 填充。
    // 未排入用白色而不是 var(--paper)：marker 画在地图上，而三个底图
    // 全是浅色；页面本身是深色主题，--paper 是 #16130f 近黑，拿它当
    // 「空心」会变成深色实心，跟想表达的意思正好相反。
    // 侧栏的小圆点是另一回事——它坐在深色卡片上，那里 --paper 才是对的。
    if(s.lod){
      dot.style.background = "#4A4A4A";
    }else if(!s.placed){
      dot.style.background = "#fff";
    }else if(s.days.length === 1){
      dot.style.background = dayColor(s.days[0]);
    }else{
      // 多天：扇形分色。marker 是 DOM 元素而非 canvas 符号，
      // conic-gradient 直接可用——这是 DOM marker 的实际优势。
      const step = 100 / s.days.length;
      dot.style.background = "conic-gradient("
        + s.days.map((n, i) => `${dayColor(n)} ${i * step}% ${(i + 1) * step}%`).join(",") + ")";
    }

    // 描边。已排入时在填充与选择色之间夹一圈白——没有它，
    // 深蓝填充配绿描边在复杂底图上会糊成一片。
    //
    // 住宿不套选择色：它没有「想去/待定/不想去」这个语义，
    // 而它又必然 choice=null，套上去就成了满地的「未表态」橙圈，纯属误导。
    const shadow = "0 1px 5px rgba(0,0,0,.34)";
    if(s.lod){
      dot.style.boxShadow = `0 0 0 2px var(--card), ${shadow}`;
    }else{
      const c = COLOR[s.k];
      dot.style.boxShadow = s.placed
        ? `0 0 0 1.5px #fff, 0 0 0 ${1.5 + s.ring}px ${c}, ${shadow}`
        : `0 0 0 ${s.ring}px ${c}, ${shadow}`;
    }

    // 数字只在排进某一天之后才出现；住宿永不编号
    if(s.lod){
      dot.innerHTML = house(13);
      dot.style.color = "#fff";
    }else{
      const seq = firstSeq(p.id);
      dot.textContent = seq == null ? "" : String(seq);
      dot.style.color = "#fff";
      dot.style.fontSize = (seq == null ? 0 : 11) + "px";
    }
  }

  function markerEl(p){
    const el = document.createElement("div");
    // 这里可以直接赋 className：元素刚创建、还没交给 MapLibre，
    // 它的 .maplibregl-marker 类是在 new Marker() 之后才加上的。
    // 但此后任何时候都只能用 classList 增删（见 paintMarker）。
    el.className = "mk " + kind(p);
    el.dataset.id = p.id;
    el.dataset.nm = p.name;
    el.innerHTML = "<i></i>";
    styleDot(el, p);
    el.onclick = e => { e.stopPropagation(); focus(p.id, true); };
    return el;
  }

  function addMarkers(){
    st.markers.forEach(m => m.remove && m.remove());
    st.markers.clear();
    pts().forEach((p, i) => {
      const el = markerEl(p);
      if(st.engine === "maplibre"){
        const m = new maplibregl.Marker({ element:el }).setLngLat([p.coord.lon, p.coord.lat]).addTo(st.map);
        st.markers.set(p.id, m);
      }else if(st.engine === "leaflet"){
        const m = L.marker([p.coord.lat, p.coord.lon],
          { icon: L.divIcon({ className:"", html:el.outerHTML, iconSize:[22,22] }) }).addTo(st.map);
        m.on("click", () => focus(p.id, true));
        st.markers.set(p.id, m);
      }
      applyVis(p, el);
    });
    if(st.engine === "static") renderStatic();
  }

  function applyVis(p, el){
    const on = st.show.has(kind(p));
    const node = st.engine === "maplibre" ? (st.markers.get(p.id)?.getElement?.() || el) : el;
    if(node) node.style.display = on ? "" : "none";
  }

  /* 只增删我们自己的类，绝不整体覆盖 className。
     踩过的坑：`el.className = "mk " + kind(p)` 会把 MapLibre 自己加的
     .maplibregl-marker（携带 position:absolute）一并冲掉，marker 随即落入
     正常文档流，位置被前面所有 marker 的高度累加推偏——实测最大偏差 828px，
     且缩放时 marker 与底图各走各的。表现为「点一下某个点，所有点突然全乱」。 */
  const MK_STATE = ["yes", "maybe", "no", "none"];

  function paintMarker(el, p){
    el.classList.remove(...MK_STATE, "on");
    el.classList.add(kind(p));
    if(st.focus === p.id) el.classList.add("on");
    styleDot(el, p);
    el.style.display = st.show.has(kind(p)) ? "" : "none";
  }

  function refresh(){
    renderDays();
    if(!st.ready) return;
    pts().forEach(p => {
      const m = st.markers.get(p.id);
      const el = st.engine === "maplibre" ? m?.getElement?.() : null;
      if(el) paintMarker(el, p);
    });
    if(st.engine === "static") renderStatic();
    if(st.engine === "leaflet"){ addMarkers(); }
    renderSide();
  }

  /* 侧栏小圆点走和地图 marker 同一套语义：填充=天、描边=选择、数字=当天序号。
     两处显示同一份数据，规则不一致会让人以为是 bug。 */
  function pinStyle(p){
    const s = dotSpec(p);
    const bg = s.lod ? "#4A4A4A"
             : !s.placed ? "var(--paper)"
             : s.days.length === 1 ? dayColor(s.days[0])
             : "conic-gradient(" + s.days.map((n, i) => {
                 const step = 100 / s.days.length;
                 return `${dayColor(n)} ${i * step}% ${(i + 1) * step}%`;
               }).join(",") + ")";
    const ring = s.lod ? "0 0 0 1.5px var(--card)"
               : s.placed ? `0 0 0 1.5px var(--card),0 0 0 3.5px ${COLOR[s.k]}`
               : `0 0 0 2px ${COLOR[s.k]}`;
    return `background:${bg};box-shadow:${ring}`;
  }
  function pinText(p){
    if(isLodging(p)) return house(11);
    const seq = firstSeq(p.id);
    return seq == null ? "" : String(seq);
  }

  /* ═══════════════ 日程栏 ═══════════════
     天数少就平铺（可以直接往任意一天拖），多了就切日期胶囊只展开当前天。
     阈值取 5：日程栏高约 600–700px，一天四五个点占 200–260px，
     平铺到第三天就开始滚动，超过五天会退化成无限滚动列表。 */
  const FLAT_MAX = 5;
  const WD = ["日", "一", "二", "三", "四", "五", "六"];

  const dayLabel = d => d.label || (d.n === 0 ? "第 0 天" : `第 ${d.n} 天`);
  // 住宿不计入「几个景点」——每天首尾都有它，算进去这个数字就没意义了
  const dayCount = d => (d.places || []).filter(e => !isLodging(BY_ID[e.id])).length;

  function dayDateTxt(d){
    if(!d.date) return "";
    const t = new Date(d.date + "T12:00:00");   // 正午构造，避开时区把日期推前一天
    return isNaN(t) ? d.date : `${d.date.slice(5)}(周${WD[t.getDay()]})`;
  }

  function dayBox(d){
    let seq = 0;
    const rows = (d.places || []).map((e, i) => {
      const p = BY_ID[e && e.id];
      if(!p) return "";
      const lod = isLodging(p);
      if(!lod) seq++;
      return `<div class="ditem${lod ? " lod" : ""}" data-card="${esc(p.id)}" data-day="${d.n}" data-i="${i}">
          <span class="n" style="background:${lod ? "#4A4A4A" : dayColor(d.n)}">${lod ? house(11) : seq}</span>
          <span class="dnm" title="${esc(p.name)}">${esc(p.name)}</span>
        </div>`;
    }).join("");
    return `<div class="dbox${d.n === st.curDay ? " cur" : ""}" data-day="${d.n}">
        <div class="dhead">
          <span class="swatch" style="background:${dayColor(d.n)}"></span>
          <b>${esc(dayLabel(d))}</b>
          <s>${esc(dayDateTxt(d))}${d.date ? " · " : ""}${dayCount(d)} 个</s>
        </div>
        <div class="dlist">${rows || `<div class="dempty">还没放地点</div>`}</div>
      </div>`;
  }

  function renderDays(){
    const col = $("#day-col");
    if(!ITIN.length){
      col.innerHTML = `<div class="dc-head">日程</div>
        <div class="dempty">还没有分天。告诉 AI「按 ${TRIP.days || "N"} 天建日程」即可。</div>`;
      return;
    }
    if(st.curDay == null || !ITIN.some(d => d.n === st.curDay)) st.curDay = ITIN[0].n;
    if(st.flat == null) st.flat = ITIN.length <= FLAT_MAX;

    const caps = st.flat ? "" : `<div class="caps">` + ITIN.map(d => {
      const cur = d.n === st.curDay;
      return `<button data-day="${d.n}" aria-pressed="${cur}"
        style="${cur ? `background:${dayColor(d.n)};border-color:${dayColor(d.n)}` : ""}"
        >D${d.n}<span class="c">${dayCount(d)}</span></button>`;
    }).join("") + `</div>`;

    col.innerHTML =
      `<div class="dc-head">日程<span class="sp">${ITIN.length} 天</span>
         <button id="day-mode" class="lnk">${st.flat ? "收起" : "平铺"}</button></div>`
      + caps
      + ITIN.filter(d => st.flat || d.n === st.curDay).map(dayBox).join("");
  }

  function setCurDay(n){
    st.curDay = n;
    renderDays();
  }

  /* ---------- 侧栏 ---------- */
  function renderSide(){
    const box = $("#map-list");
    const list = pts().filter(p => st.show.has(kind(p)));
    const byArea = new Map();
    list.forEach(p => {
      const k = p.area || "其他";
      if(!byArea.has(k)) byArea.set(k, []);
      byArea.get(k).push(p);
    });
    box.innerHTML = [...byArea.entries()].map(([area, ps]) =>
      `<div class="grp">${esc(area)} · ${ps.length}</div>` + ps.map(p =>
        `<div class="mi${st.focus === p.id ? " on" : ""}" data-card="${esc(p.id)}">
           <span class="pin" style="${pinStyle(p)}">${pinText(p)}</span>
           <span class="t"><b>${esc(p.name)}</b><s>${metaLine(p)}</s></span>
         </div>`).join("")).join("") ||
      `<div class="empty-state" style="padding:34px 16px"><div>当前筛选下没有可显示的地点</div></div>`;
  }

  /* 元信息压到一行：时长 · 价格 · 最多一个警示。
     原来把整段 ticket 文案铺进来（"公共空间免费；行程期间在展的…一般 ¥3,000、
     高大生 ¥1,500、小中生 ¥500"），一个条目占五六行。完整信息在详情 dialog 里，
     这里只负责让人认出是哪个、以及有没有坑。 */
  /* ticket 是自由文本，压成一个短标签很容易变成谎话。踩过两次：
       「天守阁 ¥600（中学生以下免费）」——先匹配「免费」会写成免费，少算一张票
       「公共空间免费；特展一般 ¥3,000、高大生 ¥1,500」——先匹配金额会写成
         「¥3,000 起」，而这个馆的建筑本身是可以免费进的
     所以两者都要看，谁在前谁定调；两者都有就并列，让人知道「看情况」。 */
  const FREE_RE = /免费|免費|無料|无料|free/i;
  const AMT_RE = /[¥￥$€£]\s*[\d,]+/;

  function shortPrice(t){
    if(!t) return "";
    const s = String(t);
    const amt = s.match(AMT_RE), free = s.match(FREE_RE);
    if(amt && free){
      const many = (s.match(new RegExp(AMT_RE.source, "g")) || []).length > 1;
      return free.index < amt.index
        ? `免费 / ${amt[0].replace(/\s+/g, "")}${many ? "起" : ""}`
        : `${amt[0].replace(/\s+/g, "")}${many ? "起" : ""}`;
    }
    if(amt){
      const many = (s.match(new RegExp(AMT_RE.source, "g")) || []).length > 1;
      return amt[0].replace(/\s+/g, "") + (many ? "起" : "");
    }
    return free ? "免费" : "";
  }

  function warnOf(p){
    if(p.status === "permanently_closed") return "已关闭";
    if(p.status && p.status !== "open") return "非正常营业";
    if(p.verify && p.verify.state && p.verify.state !== "verified") return "待确认";
    if(p.booking === "required") return "须预约";
    // 排进了它闭馆的那天 —— 这是硬冲突，优先级高于上面的软提示
    for(const s of schedOf(p.id)){
      const day = ITIN.find(d => d.n === s.n);
      const wd = day && day.date ? new Date(day.date + "T12:00:00").getDay() || 7 : null;
      if(wd && Array.isArray(p.closed_days) && p.closed_days.includes(wd)) return "当天闭馆";
    }
    return "";
  }

  function metaLine(p){
    if(isLodging(p)) return `<em>住宿</em>`;
    const bits = [SCALE_TXT[p.scale] || p.scale, shortPrice(p.ticket)].filter(Boolean);
    const w = warnOf(p);
    return bits.map(x => `<em>${esc(x)}</em>`).join(" · ")
         + (w ? `<span class="w">${esc(w)}</span>` : "");
  }

  function focus(id, fromMap){
    st.focus = id;
    const p = PLACES.find(x => x.id === id);
    if(!p || !geo(p)) return;
    if(!fromMap && st.map){
      if(st.engine === "maplibre") st.map.flyTo({ center:[p.coord.lon, p.coord.lat], zoom:Math.max(st.map.getZoom(), 14), duration:620 });
      if(st.engine === "leaflet")  st.map.setView([p.coord.lat, p.coord.lon], Math.max(st.map.getZoom(), 15));
    }
    refresh();
    const item = document.querySelector(`.mi[data-card="${CSS.escape(id)}"]`);
    if(item && fromMap) item.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }

  /* ---------- 静态兜底 ---------- */
  function renderStatic(){
    const box = $("#map-canvas");
    const list = pts();
    if(!list.length){ box.innerHTML = ""; return; }
    const lons = list.map(p => p.coord.lon), lats = list.map(p => p.coord.lat);
    const x0 = Math.min(...lons), x1 = Math.max(...lons);
    const y0 = Math.min(...lats), y1 = Math.max(...lats);
    const sx = v => 8 + (x1 === x0 ? 50 : (v - x0) / (x1 - x0) * 84);
    const sy = v => 92 - (y1 === y0 ? 50 : (v - y0) / (y1 - y0) * 84);
    // 用真实元素而不是拼字符串，好让 styleDot 是唯一决定外观的地方 ——
    // 拼字符串就得把双层编码的逻辑再写一遍，两份必然走样。
    box.innerHTML = `<div class="static-map"><div class="sm-grid"></div></div>`;
    const wrap = box.querySelector(".static-map");
    for(const p of list){
      if(!st.show.has(kind(p))) continue;
      const el = markerEl(p);
      el.style.left = sx(p.coord.lon) + "%";
      el.style.top  = sy(p.coord.lat) + "%";
      el.dataset.goto = p.id;
      wrap.appendChild(el);
    }
  }

  /* ---------- 引擎启动 ---------- */
  async function startMapLibre(){
    await Promise.all([loadCSS(MAPLIBRE_CSS), loadJS(MAPLIBRE_JS)]);
    if(!window.maplibregl) throw new Error("MapLibre 未就绪");
    const c = center();
    st.map = new maplibregl.Map({
      container:"map-canvas", style:await styleFor(st.base),
      center:[c.lon, c.lat], zoom:11.5, attributionControl:false,
    });
    await new Promise((res, rej) => {
      // 矢量瓦片源都是免费无 SLA 的公共服务，慢的时候真的很慢。
      // 20 秒是实测取的折中：够宽容，又不至于让用户干等。
      //
      // 但这 20 秒只能算「页面可见」的那部分时间。后台标签页里浏览器会暂停
      // requestAnimationFrame，而 MapLibre 的 load 事件要等首次渲染完成 ——
      // 于是它永远不会触发。实测被这个误判过两次：瓦片源本身 2 秒就响应了，
      // 只因为标签页在后台，20 秒一到就降级成 Leaflet，用户切回来时看到的
      // 是一张已经降级、且底图按钮全部禁用的地图，而且无法恢复。
      let waited = 0, settled = false;
      const stop = () => { settled = true; clearInterval(tick); };
      const tick = setInterval(() => {
        if(document.hidden || settled) return;
        waited += 500;
        if(waited >= 20000){ stop(); rej(new Error("矢量底图 20 秒未加载完成")); }
      }, 500);
      st.map.once("load", () => { if(!settled){ stop(); res(); } });
      // 只有「网络形态的失败」才算底图不可用。
      //
      // 这里踩过两次坑。第一版对任何 map error 都 reject —— 一个与底图完全
      // 无关的异常（实测是别处一次 queryRenderedFeatures 查了不存在的图层）
      // 就被记成「标准底图不可用」，按钮永久禁用、还给用户看一条误导的提示。
      // 第二版按关键词过滤，却把 style 也写进了正则，而那条报错正好含
      // "in the map's style" —— 又匹配上了。
      //
      // 所以判据不看措辞，只看形态：要么带 HTTP 状态码（AJAXError），
      // 要么是明确的网络失败字样。单张瓦片的失败交给 watchTiles 在
      // 加载完成后处理，不在这里管。
      st.map.on("error", e => {
        if(settled) return;
        if(st.map.isStyleLoaded && st.map.isStyleLoaded()) return;   // 样式已就绪，不是它的问题
        const err = e && e.error;
        const msg = String((err && err.message) || (e && e.message) || "");
        const networkish = (err && typeof err.status === "number")
                        || /Failed to fetch|NetworkError|Load failed|ERR_/.test(msg);
        if(!networkish) return;
        stop(); rej(err || new Error("底图出错"));
      });
    });
    // 放在 await 之后：加载期间 st.engine 还不该是 maplibre，
    // 否则用户这时点底图按钮，操作的是一个可能马上要被拆掉的 map 实例。
    st.engine = "maplibre";
    applyTint(st.map, schemaOf(st.base));
    // 地铁层是加分项，出问题不该把整张底图拖下水 ——
    // 实测就发生过：addTransit 抛错，异常一路冒到 init 的 catch，
    // 于是标准底图被判定为「不可用」并禁用，用户看到的是莫名其妙的降级。
    try{ addTransit(); }
    catch(e){ console.warn("地铁层加载失败（不影响底图）:", e); st.transitBroken = String(e.message || e); }
    st.map.addControl(new maplibregl.NavigationControl({ showCompass:false }), "bottom-right");
    st.map.resize();          // 容器可能刚从 hidden 变可见，尺寸要重新量
    fitAll();
    st.fitted = true;
  }

  async function startLeaflet(){
    await Promise.all([loadCSS(LEAFLET_CSS), loadJS(LEAFLET_JS)]);
    if(!window.L) throw new Error("Leaflet 未就绪");
    const c = center();
    st.map = L.map("map-canvas", { attributionControl:false }).setView([c.lat, c.lon], 12);
    L.tileLayer(CARTO_RASTER[0], { maxZoom:19, referrerPolicy:"strict-origin-when-cross-origin" }).addTo(st.map);
    st.engine = "leaflet";
    st.base = null;           // CARTO 不在 BASEMAPS 里，只服务于降级路径
  }

  function fitAll(){
    const l = pts();
    if(!l.length || !st.map) return;
    const lons = l.map(p => p.coord.lon), lats = l.map(p => p.coord.lat);
    const b = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];
    if(st.engine === "maplibre"){
      st.map.fitBounds(b, { padding:{ top:66, bottom:46, left:46, right:46 }, duration:0, maxZoom:15 });
    }else if(st.engine === "leaflet"){
      st.map.fitBounds([[b[0][1], b[0][0]], [b[1][1], b[1][0]]], { padding:[40,40], maxZoom:15 });
    }
  }

  /* 每次切回地图视图都要 resize + refit。
     MapLibre 按构造时的容器尺寸计算相机，容器后来变了它不会自己纠正——
     实测：先在 1200 宽初始化、再拉到 1280，视野就偏了 0.7 个 zoom 级。
     隐藏状态下初始化（容器高度为 0）则更离谱。 */
  function onShow(){
    if(!st.map) return;
    st.map.resize();
    if(!st.fitted){ fitAll(); st.fitted = true; }
  }

  /* ResizeObserver 必须只在尺寸真的变了时才 resize。
     踩过的坑：重建侧栏 HTML 会让滚动条出现/消失，容器宽度变几像素就触发
     resize()，而 resize 会打断正在进行的相机动画——表现为「点侧栏地图不飞过去」，
     而且时有时无，极难定位。 */
  function watchResize(){
    const el = document.querySelector(".map-main");
    if(!el || !window.ResizeObserver) return;
    let last = `${el.clientWidth}x${el.clientHeight}`, t;
    new ResizeObserver(() => {
      const now = `${el.clientWidth}x${el.clientHeight}`;
      if(now === last) return;
      last = now;
      clearTimeout(t);
      t = setTimeout(() => { if(st.map && st.map.resize) st.map.resize(); }, 180);
    }).observe(el);
  }

  /* styleFor("gb") 要 fetch 一份 style JSON，是异步的。快速连点
     「标准 → 简约」时，graybeard 的 fetch 可能后返回，setStyle 就把
     positron 覆盖掉了 —— 按钮显示「简约」，地图却是「标准」。
     用一个自增令牌把过期的那次请求丢掉。 */
  let switchSeq = 0;
  async function switchBase(id){
    if(st.engine !== "maplibre" || id === st.base) return;
    const seq = ++switchSeq;
    st.base = id;
    $$("#basemaps button").forEach(b => b.setAttribute("aria-pressed", b.dataset.base === id));
    let style;
    try{
      style = await styleFor(id);
    }catch(e){
      if(seq !== switchSeq) return;
      note(`<b>「${(BASEMAPS.find(x => x.id === id) || {}).label || id}」底图加载失败</b>：${esc(e.message || e)}`);
      return;
    }
    if(seq !== switchSeq) return;        // 期间又点了别的，这次作废
    st.map.setStyle(style);
    st.map.once("styledata", () => {
      if(seq !== switchSeq) return;
      applyTint(st.map, schemaOf(id));   // setStyle 会整份换掉，上色补丁和地铁层都得重挂
      try{ addTransit(); }catch(e){ console.warn("地铁层重挂失败:", e); }
      addMarkers();
      setAttrib();
    });
  }

  /* ---------- 入口 ---------- */
  async function init(){
    if(st.ready) return;
    st.ready = true;

    if(!pts().length){
      $("#map-canvas").innerHTML = `<div class="empty-state"><div class="big">没有可定位的地点</div>
        <div>景点缺少 coord 字段</div></div>`;
      return;
    }

    paintBaseButtons();

    const problems = [];
    const webgl = hasWebGL();
    if(!webgl) problems.push("浏览器未启用 WebGL");

    try{
      if(!webgl) throw new Error("需要 WebGL");
      try{
        await startMapLibre();
      }catch(eGb){
        // 默认矢量源挂了不必直接跌到 Leaflet —— 还有第二个矢量源，
        // 而且它是另一家运营、另一套 schema，不会跟着一起挂。
        if(st.base === "gb"){
          problems.push("标准底图不可用（" + (eGb.message || eGb) + "），已改用简约");
          if(st.map && st.map.remove){ try{ st.map.remove(); }catch(_){} }
          st.map = null;
          $("#map-canvas").innerHTML = "";
          st.base = "ofm";
          $$("#basemaps button").forEach(b => b.setAttribute("aria-pressed", b.dataset.base === "ofm"));
          const gbBtn = document.querySelector('#basemaps [data-base="gb"]');
          if(gbBtn){ gbBtn.disabled = true; gbBtn.title = "该底图当前不可用：" + (eGb.message || eGb); }
          await startMapLibre();
          note(problems.join("；") + "。点位、联动、导出都不受影响。");
        }else throw eGb;
      }
      watchTiles();
      probe("osm");                     // 不 await：探测慢不该挡住地图显示
      if(hasTransit() && !st.transitBroken){
        $("#transit-group").hidden = false;
        paintLegend();
      }else if(st.transitBroken){
        note(`地铁层未能加载（${esc(st.transitBroken)}），其余功能不受影响。`);
      }
    }catch(e1){
      problems.push("矢量底图不可用（" + (e1.message || e1) + "）");
      try{
        if(st.map && st.map.remove) { try{ st.map.remove(); }catch(_){} }
        st.map = null;
        $("#map-canvas").innerHTML = "";
        await startLeaflet();
        st.degraded = true;
        fitAll(); st.fitted = true;
        note(`<b>已降级</b>：${problems.join("；")}。当前使用 Leaflet + CARTO 光栅底图，点位、联动、导出都不受影响，只是不能切底图。`);
        lockBaseButtons("降级模式下不可切换底图");
      }catch(e2){
        problems.push("光栅底图也不可用（" + (e2.message || e2) + "）");
        st.degraded = true;
        st.engine = "static";
        st.map = null;
        note(`<b>底图全部不可用</b>：${problems.join("；")}。下面是按经纬度换算的相对位置示意图——比例不准，但方位和聚集关系是对的，导出功能照常可用。`);
        lockBaseButtons("无可用底图");
      }
    }

    setAttrib();
    addMarkers();
    renderSide();
    renderDays();
    watchResize();
  }

  /* ---------- 导出 ---------- */
  function selected(){
    return pts().filter(p => st.show.has(kind(p)));
  }
  function csvCell(v){
    const s = String(v ?? "").replace(/"/g, '""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  }
  function toCSV(){
    const rows = [["Name","Latitude","Longitude","Description","Category","Choice","URL"]];
    for(const p of selected()){
      rows.push([
        p.name_en || p.name, p.coord.lat, p.coord.lon,
        [p.name, p.name_local, p.pitch, p.hours && "开放 " + p.hours, p.ticket].filter(Boolean).join(" | "),
        CATMAP[p.category] || p.category,
        { yes:"想去", maybe:"待定", no:"不想去" }[p.choice] || "未表态",
        (p.sources || [])[0]?.url || "",
      ]);
    }
    return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\n");
  }
  function toKML(){
    const esc2 = s => String(s ?? "").replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
    return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
<name>${esc2(TRIP.destination || "行程")}</name>
${selected().map(p => `<Placemark>
  <name>${esc2(p.name)}${p.name_local && p.name_local !== p.name ? "（" + esc2(p.name_local) + "）" : ""}</name>
  <description>${esc2([p.pitch, p.hours && "开放时间：" + p.hours, p.ticket && "门票：" + p.ticket,
                       p.closed && "闭馆：" + p.closed].filter(Boolean).join("\n"))}</description>
  <Point><coordinates>${p.coord.lon},${p.coord.lat},0</coordinates></Point>
</Placemark>`).join("\n")}
</Document></kml>`;
  }
  function save(text, name, mime){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type:mime }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast(`已导出 ${name}（${selected().length} 个地点）`);
  }

  /* ---------- hover 双向联动 ----------
     鼠标在清单条目上 → 地图对应图标放大并显示名字；
     鼠标在地图图标上 → 对应条目高亮。
     反向只高亮、不滚动 —— 列表跟着鼠标自动跳很晕。 */
  function hilite(id, on){
    const mk = st.markers.get(id);
    const el = mk && mk.getElement ? mk.getElement()
             : document.querySelector(`.static-map .mk[data-goto="${CSS.escape(id)}"]`);
    if(el) el.classList.toggle("hi", on);
    const item = document.querySelector(`.mi[data-card="${CSS.escape(id)}"]`);
    if(item) item.classList.toggle("on", on || st.focus === id);
  }

  for(const [evt, on] of [["mouseover", true], ["mouseout", false]]){
    document.addEventListener(evt, e => {
      const src = e.target.closest("[data-card]") || e.target.closest(".mk");
      if(!src) return;
      const id = src.dataset.card || src.dataset.id || src.dataset.goto;
      if(id) hilite(id, on);
    });
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", e => {
    // 清单条目 → 弹详情。以前是把地图飞到该点，但 hover 已经能定位，
    // 而点开卡片想看的其实是「它到底是什么」。
    const card = e.target.closest("[data-card]");
    if(card){ openDetail(card.dataset.card); return; }
    // data-goto 只剩静态兜底图上的 marker 在用
    const go = e.target.closest("[data-goto]");
    if(go){ focus(go.dataset.goto, false); return; }
    const bm = e.target.closest("#basemaps button");
    if(bm && !bm.disabled){ switchBase(bm.dataset.base); return; }
    const tb = e.target.closest("#transit-btn");
    if(tb && !tb.disabled){ setTransitVisible(tb.getAttribute("aria-pressed") !== "true"); return; }
    const lg = e.target.closest("#map-legend");
    if(lg){
      const open = lg.classList.toggle("open");
      const hint = lg.querySelector(".lg-hint");
      if(hint) hint.textContent = open ? "点击收起" : "点击展开线路名";
      return;
    }
    const dm = e.target.closest("#day-mode");
    if(dm){ st.flat = !st.flat; renderDays(); return; }
    const cap = e.target.closest(".caps button");
    if(cap){ setCurDay(+cap.dataset.day); return; }
    const dh = e.target.closest(".dhead");
    if(dh){ setCurDay(+dh.parentElement.dataset.day); return; }
    const mf = e.target.closest(".mfil");
    if(mf){
      const on = mf.getAttribute("aria-pressed") === "true";
      mf.setAttribute("aria-pressed", !on);
      on ? st.show.delete(mf.dataset.c) : st.show.add(mf.dataset.c);
      refresh();
    }
  });

  return { init, refresh, onShow, fitAll,
           exportCSV:() => save(toCSV(), "places.csv", "text/csv;charset=utf-8"),
           exportKML:() => save(toKML(), "places.kml", "application/vnd.google-earth.kml+xml"),
           _st:st };
})();

window.MAP = MAP;
window.initMap = MAP.init;
$("#exp-csv").onclick = () => MAP.exportCSV();
$("#exp-kml").onclick = () => MAP.exportKML();

/* ═══════════════════════════════════════════════════════════════════
   攻略视图

   route.md 由 AI 撰写（正文、路线设计逻辑、逐日节点）；
   下面三块由页面自动生成，保证永远和数据一致：
     · 天气   —— 浏览器端实时拉 Open-Meteo，每次打开都是最新的
     · 费用   —— 从选中景点的 ticket 字段解析
     · 对照表 —— 从 choice 字段生成，不可能和清单对不上
   ═══════════════════════════════════════════════════════════════════ */
const GUIDE = (() => {

  /* ---------- 天气 ----------
     Open-Meteo 免费、无需 key、支持跨域。
     ≤16 天用预报；超出预报范围则退回历史同期均值，并明确标注这不是预报。 */
  const WMO = {
    0:["☀️","晴"],1:["🌤","多云转晴"],2:["⛅","多云"],3:["☁️","阴"],
    45:["🌫","雾"],48:["🌫","雾凇"],
    51:["🌦","毛毛雨"],53:["🌦","小雨"],55:["🌧","中雨"],
    56:["🌧","冻雨"],57:["🌧","冻雨"],
    61:["🌦","小雨"],63:["🌧","中雨"],65:["🌧","大雨"],
    66:["🌧","冻雨"],67:["🌧","冻雨"],
    71:["🌨","小雪"],73:["🌨","中雪"],75:["❄️","大雪"],77:["🌨","雪粒"],
    80:["🌦","阵雨"],81:["🌧","强阵雨"],82:["⛈","暴雨"],
    85:["🌨","阵雪"],86:["❄️","强阵雪"],
    95:["⛈","雷雨"],96:["⛈","雷雨伴冰雹"],99:["⛈","强雷雨伴冰雹"],
  };
  const wmo = c => WMO[c] || ["·","—"];

  function anchor(){
    const b = (TRIP.bases || [])[0];
    if(b && b.coord && typeof b.coord.lon === "number") return b.coord;
    const l = pts0();
    if(l.length) return { lon:l.reduce((s,p)=>s+p.coord.lon,0)/l.length,
                          lat:l.reduce((s,p)=>s+p.coord.lat,0)/l.length };
    const bb = TRIP.bbox;
    return bb ? { lon:(bb[0]+bb[2])/2, lat:(bb[1]+bb[3])/2 } : null;
  }
  const pts0 = () => PLACES.filter(p => p.coord && typeof p.coord.lon === "number");

  async function fetchForecast(c, start, end){
    const u = new URL("https://api.open-meteo.com/v1/forecast");
    u.search = new URLSearchParams({
      latitude:c.lat, longitude:c.lon, timezone:TRIP.timezone || "auto",
      start_date:start, end_date:end,
      daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum",
    });
    const r = await fetch(u);
    if(!r.ok) throw new Error("预报接口返回 " + r.status);
    return r.json();
  }

  /* 超出预报范围：取过去 8 年同期的历史观测求平均。
     这是气候平均值，不是预报——必须在界面上说清楚，否则会误导用户。 */
  async function fetchNormals(c, days){
    const yr = new Date().getFullYear();
    const years = [];
    for(let y = yr - 8; y < yr; y++) years.push(y);
    const md = days.map(d => d.iso.slice(5));
    const out = md.map(() => ({ tmax:[], tmin:[], rain:[], wet:0, n:0 }));
    await Promise.all(years.map(async y => {
      const u = new URL("https://archive-api.open-meteo.com/v1/archive");
      u.search = new URLSearchParams({
        latitude:c.lat, longitude:c.lon, timezone:TRIP.timezone || "auto",
        start_date:`${y}-${md[0]}`, end_date:`${y}-${md[md.length-1]}`,
        daily:"temperature_2m_max,temperature_2m_min,precipitation_sum",
      });
      try{
        const r = await fetch(u);
        if(!r.ok) return;
        const j = await r.json();
        (j.daily?.time || []).forEach((t, i) => {
          const k = md.indexOf(t.slice(5));
          if(k < 0) return;
          const o = out[k];
          if(j.daily.temperature_2m_max[i] != null) o.tmax.push(j.daily.temperature_2m_max[i]);
          if(j.daily.temperature_2m_min[i] != null) o.tmin.push(j.daily.temperature_2m_min[i]);
          const p = j.daily.precipitation_sum[i];
          if(p != null){ o.rain.push(p); if(p >= 1) o.wet++; o.n++; }
        });
      }catch(e){ /* 单年失败不影响整体平均 */ }
    }));
    const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
    return out.map(o => ({
      tmax:avg(o.tmax), tmin:avg(o.tmin),
      wetRate:o.n ? Math.round(o.wet / o.n * 100) : null, samples:o.tmax.length,
    }));
  }

  function card(label, icon, desc, tmax, tmin, rainLine){
    const t = v => v == null ? "—" : Math.round(v);
    return `<div class="wx-d">
      <div class="d">${esc(label)}</div>
      <div class="ic" title="${esc(desc)}">${icon}</div>
      <div class="t">${t(tmax)}°<s> / ${t(tmin)}°</s></div>
      <div class="r">${rainLine}</div>
    </div>`;
  }

  async function renderWeather(){
    const box = $("#wx-box");
    if(!DAYS.length){ box.innerHTML = ""; return; }
    const c = anchor();
    if(!c){ box.innerHTML = ""; return; }

    box.innerHTML = `<div class="wx-src">正在获取天气…</div>`;
    const today = new Date(); today.setHours(0,0,0,0);
    const lead = Math.round((DAYS[DAYS.length-1].date - today) / 864e5);

    try{
      if(lead <= 16 && DAYS[0].date >= new Date(today.getTime() - 864e5)){
        const j = await fetchForecast(c, DAYS[0].iso, DAYS[DAYS.length-1].iso);
        const d = j.daily || {};
        box.innerHTML = `<div class="wx">` + (d.time || []).map((t, i) => {
          const [ic, desc] = wmo(d.weather_code[i]);
          const pp = d.precipitation_probability_max?.[i];
          const ps = d.precipitation_sum?.[i];
          const rain = pp != null && pp >= 30
            ? `降水概率 <b>${pp}%</b>${ps ? ` · ${ps}mm` : ""}`
            : `降水概率 ${pp ?? "—"}%`;
          const wd = ((new Date(t + "T00:00:00").getDay() + 6) % 7) + 1;
          return card(`${t.slice(5)} 周${WD[wd-1]} · ${desc}`, ic, desc, d.temperature_2m_max[i], d.temperature_2m_min[i], rain);
        }).join("") + `</div>
        <div class="wx-src">实时预报 · Open-Meteo · 每次打开本页都会重新获取</div>`;
      }else{
        const n = await fetchNormals(c, DAYS);
        box.innerHTML = `<div class="wx">` + DAYS.map((d, i) => {
          const o = n[i] || {};
          const rain = o.wetRate == null ? "—"
            : `历史降雨日占比 <b>${o.wetRate}%</b>`;
          return card(`${d.iso.slice(5)} 周${WD[d.wd-1]} · 常年`, "📅", "历史同期均值",
                      o.tmax, o.tmin, rain);
        }).join("") + `</div>
        <div class="wx-src est">⚠ 出行日在 ${lead} 天后，超出 16 天预报范围。
          以上是<b>过去 8 年同期的历史平均</b>，只能说明大致气候，<b>不是预报</b>。
          临近出行请重新打开本页查看真实预报。</div>`;
      }
    }catch(e){
      box.innerHTML = `<div class="wx-src est">天气获取失败（${esc(e.message)}）。
        联网后重新打开本页即可重试。</div>`;
    }
  }

  /* ---------- 费用汇总 ----------
     ticket 是自由文本（"¥600"、"常设展 ¥1200 前后，特别展另计"、"免费"），
     无法可靠求和。因此：能解析的求和，解析不了的原样列出并明确标注，
     绝不假装算出了一个精确总额。 */
  /* 必须先找金额，再判断「免费」。
     反例：「天守阁 ¥600（中学生以下免费）」——先匹配「免费」会把 600 算成 0，
     合计直接少算一张票。金额出现过就以金额为准。 */
  function parseMoney(s){
    if(!s) return null;
    const m = String(s).match(/[¥￥$€£]\s*([\d,]+(?:\.\d+)?)|([\d,]+(?:\.\d+)?)\s*(?:日元|円|元|yen|JPY)/i);
    if(m){
      const v = parseFloat((m[1] || m[2]).replace(/,/g, ""));
      if(!isNaN(v)) return v;
    }
    if(/^[^0-9]*(免费|免費|free|無料|无料)[^0-9]*$/i.test(s.trim())) return 0;
    return null;
  }

  function renderCost(){
    const going = PLACES.filter(p => p.choice === "yes");
    if(!going.length) return "";
    let sum = 0, parsed = 0;
    const unparsed = [];
    const rows = going.map(p => {
      const v = parseMoney(p.ticket);
      if(v == null) unparsed.push(p.name);
      else { sum += v; parsed++; }
      return `<div class="ck">
        <span class="m">${v === 0 ? "○" : v == null ? "?" : "●"}</span>
        <span class="n">${esc(p.name)}<s>${esc(p.ticket)}</s></span>
      </div>`;
    }).join("");
    const cur = /[¥￥]|日元|円/.test(going.map(p=>p.ticket).join("")) ? "¥" : "";
    return `<h2>费用汇总</h2>
      <div class="sum">
        <div class="sum-h">门票与入场费<span>${going.length} 个「想去」的地点</span></div>
        ${rows}
        <div class="cost-total">已解析 ${parsed} 项，合计约 <b>${cur}${sum.toLocaleString()}</b></div>
        ${unparsed.length ? `<div class="caveat">以下 ${unparsed.length} 项的票价是文字描述，未计入合计：${esc(unparsed.join("、"))}。
          特别展、体验项目、夜间加价通常另计，实际花费会高于此数。</div>`
          : `<div class="caveat">仅含门票，不含交通、餐饮与特别展加价。</div>`}
      </div>`;
  }

  /* ---------- 全景点对照表 ----------
     直接由 choice 生成，因此不可能与清单视图不一致。
     放弃的景点也全部列出——方便快速判断要不要捡回来。 */
  function renderChecklist(){
    const MARK = { yes:["✅","要去"], maybe:["🔸","待定"], no:["❌","放弃"], none:["⬜","未表态"] };
    const order = ["yes","maybe","none","no"];
    const by = {};
    PLACES.forEach(p => (by[p.choice || "none"] = by[p.choice || "none"] || []).push(p));
    const total = PLACES.length;
    return `<h2>全部景点对照表</h2>
      <p>包含所有候选地点，放弃的也列在这里，方便你回头判断要不要捡回来。</p>
      <div class="sum">
        <div class="sum-h">共 ${total} 个候选<span>${order.map(k => `${MARK[k][1]} ${(by[k]||[]).length}`).join(" · ")}</span></div>
        ${order.flatMap(k => (by[k] || []).map(p => `<div class="ck${k === "no" ? " out" : ""}">
          <span class="m">${MARK[k][0]}</span>
          <span class="n">${esc(p.name)}<s>${esc(p.area)} · ${esc(SCALE_TXT[p.scale] || p.scale)}</s></span>
          ${p.choice_reason ? `<span class="why">${esc(p.choice_reason)}</span>` : ""}
        </div>`)).join("")}
      </div>`;
  }

  /* ---------- 时间轴渐进增强 ----------
     route.md 里以「09:30 」或「09:30–11:00 」开头的列表项，
     自动变成带时间胶囊的时间轴。AI 不用记特殊语法，写自然的时间就行。 */
  function enhanceTimeline(root){
    root.querySelectorAll("li").forEach(li => {
      const m = li.textContent.match(/^\s*(\d{1,2}:\d{2}(?:\s*[–—~-]\s*\d{1,2}:\d{2})?)\s*(?:[·|｜]|\s)\s*/);
      if(!m) return;
      const html = li.innerHTML.replace(/^\s*\d{1,2}:\d{2}(?:\s*[–—~-]\s*\d{1,2}:\d{2})?\s*(?:[·|｜]|\s)\s*/, "");
      li.className = "tl";
      li.innerHTML = `<span class="t">${esc(m[1].replace(/\s+/g, ""))}</span>${html}`;
    });
  }

  function render(){
    const auto = $("#guide-auto");
    auto.innerHTML = renderCost() + renderChecklist();
    enhanceTimeline($("#guide-body"));
  }

  return { render, renderWeather, parseMoney };
})();

// 顶层 const 在普通 script 里不会挂到 window 上，而 switchView 判断的是 window.GUIDE。
// 必须显式赋值，否则攻略视图永远不会渲染。
window.GUIDE = GUIDE;

/* ─────────────────────────────────────────────── 视图切换 */
function switchView(v){
  $$(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v));
  $$(".view").forEach(s => s.hidden = (s.id !== "view-" + v));
  // 导出按钮挪到了顶部标签栏，但它导的是地图视图里筛出来的那批点，
  // 所以只在地图视图出现。
  $("#map-actions").hidden = v !== "map";
  try{ localStorage.setItem(LS_KEY + ":view", v); }catch(e){}
  if(v === "map" && window.MAP){
    MAP.init();      // 懒加载：MapLibre 275KB，不该拖慢首屏
    MAP.onShow();    // 每次切回都 resize + 首次 refit
  }
  if(v === "guide" && window.GUIDE){
    GUIDE.render();                                  // 对照表要反映最新选择
    if(!switchView._wx){ switchView._wx = true; GUIDE.renderWeather(); }
  }
}

/* ─────────────────────────────────────────────── 启动 */
function boot(){
  document.title = `${TRIP.destination || "行程"} · 行程规划`;
  $("#title").textContent = `${TRIP.destination || "行程"}${TRIP.destination_local && TRIP.destination_local !== TRIP.destination ? `（${TRIP.destination_local}）` : ""}`;

  const bits = [];
  if(TRIP.dates && TRIP.dates.start) bits.push(`<b>${TRIP.dates.start} → ${TRIP.dates.end}</b>`);
  if(TRIP.days)  bits.push(`${TRIP.days} 天`);
  if(TRIP.party) bits.push(esc(TRIP.party));
  if(TRIP.pace)  bits.push(esc(TRIP.pace));
  let sub = bits.join(" · ");
  const vd = TRIP.verified_at ? Math.round((Date.now() - new Date(TRIP.verified_at+"T00:00:00")) / 864e5) : null;
  if(vd !== null && vd > 30) sub += ` <span class="stale">数据核验于 ${vd} 天前，开放时间可能已变</span>`;
  $("#subtitle").innerHTML = sub;

  const restored = loadLocal();

  if(ROUTE_HTML){
    $("#guide-body").innerHTML = ROUTE_HTML;
    $("#tab-guide").disabled = false;
  }else{
    $("#guide-body").innerHTML = `<div class="empty-state">
      <div class="big">攻略还没生成</div>
      <div>先在清单里筛完景点，保存后告诉 AI，它会读回你的选择并设计路线。</div></div>`;
  }

  // 不再靠「函数是否存在」下结论——实测函数存在也可能写不了。
  // 只说会怎么尝试，真实结果等点击时告诉用户。
  $("#hint").innerHTML = location.protocol.startsWith("http")
    ? "「保存」优先写回本地服务；服务不可用时自动降级为文件选择或下载。"
    : "当前是本地文件方式打开，「保存」会尝试文件选择，不行则自动降级为下载。";

  renderChips();
  render();

  if(STANDALONE){
    // 独立攻略页：只保留攻略，去掉筛选相关的一切，方便分享/部署
    document.querySelector(".tabs").hidden = true;
    document.querySelector(".actionbar").hidden = true;
    document.querySelector("#view-list").remove();
    document.querySelector("#view-map").remove();
    document.querySelector("main").style.paddingBottom = "60px";
    switchView("guide");
  }else{
    let v = "list";
    try{ v = localStorage.getItem(LS_KEY + ":view") || "list"; }catch(e){}
    if(v === "guide" && !ROUTE_HTML) v = "list";
    switchView(v);
  }

  if(restored) toast(`从浏览器缓存恢复了 ${restored} 个之前的选择`);
}

/* ─────────────────────────────────────────────── 事件 */
document.addEventListener("click", e => {
  const detail = e.target.closest("[data-detail]");
  if(detail){ openDetail(detail.dataset.detail); return; }

  const pick = e.target.closest(".pick button");
  if(pick){
    const id = pick.closest(".pick").dataset.id;
    const v  = pick.dataset.v;
    const p  = PLACES.find(x => x.id === id);
    if(v === "no" && p && p.choice !== "no"){ $("#dlg").close(); askReason(id); }
    else setChoice(id, v);
    return;
  }

  if(e.target.closest("[data-close]")) $("#dlg").close();

  const chip = e.target.closest(".chip");
  if(chip){
    const on = chip.getAttribute("aria-pressed") === "true";
    chip.setAttribute("aria-pressed", !on);
    if(chip.dataset.unv){ ui.unv = !on; render(); return; }
    const set = chip.dataset.cat ? ui.cats : ui.tags;
    const key = chip.dataset.cat || chip.dataset.tag;
    on ? set.delete(key) : set.add(key);
    render();
    return;
  }

  const tab = e.target.closest(".tab");
  if(tab && !tab.disabled){ switchView(tab.dataset.view); return; }
});

$("#q").addEventListener("input", e => { ui.q = e.target.value; render(); });
$("#by-area").onclick = () => { ui.group="area"; $("#by-area").setAttribute("aria-pressed",true); $("#by-tier").setAttribute("aria-pressed",false); render(); };
$("#by-tier").onclick = () => { ui.group="tier"; $("#by-tier").setAttribute("aria-pressed",true); $("#by-area").setAttribute("aria-pressed",false); render(); };
$("#f-all").onclick   = () => { ui.scope="all";  $("#f-all").setAttribute("aria-pressed",true);  $("#f-todo").setAttribute("aria-pressed",false); render(); };
$("#f-todo").onclick  = () => { ui.scope="todo"; $("#f-todo").setAttribute("aria-pressed",true); $("#f-all").setAttribute("aria-pressed",false); render(); };
$("#save").onclick     = doSave;
$("#download").onclick = () => download(false);
$("#copy").onclick     = showCode;

document.addEventListener("keydown", e => {
  if(e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ e.preventDefault(); $("#q").focus(); }
});

boot();
</script>
</body>
