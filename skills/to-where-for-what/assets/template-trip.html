      s: Math.min(Math.max(dr.width / Math.max(er.width, 1), .09), .4),
      rot,
    };
  }

  /* ── drag: Pointer Events, one code path for mouse and touch ── */
  const TH_X = 110, TH_Y = 100;
  function armDock(pile){
    $$(".dk-dock").forEach(d => d.classList.toggle("dk-arm", d.dataset.pile === pile));
  }
  function attachDrag(el){
    let sx = 0, sy = 0, dx = 0, dy = 0, active = false, moved = 0;
    const clearStamps = () => el.querySelectorAll(".dk-stamp").forEach(s => s.style.opacity = 0);
    /* One cleanup for every way a drag can end — including the OS stealing
       the gesture (pointercancel) or capture being lost. Without it a broken
       drag leaves a tilted card and an armed pile behind forever. */
    const reset = spring => {
      active = false;
      el.classList.remove("dk-dragging");
      armDock(null);
      if(spring){
        el.classList.add("dk-settle");
        el.style.transform = "";
        clearStamps();
      }
      dx = dy = 0;
    };
    el.addEventListener("pointerdown", e => {
      if(e.button !== 0) return;   // primary button/touch only
      active = true; moved = 0; sx = e.clientX; sy = e.clientY;
      el.setPointerCapture(e.pointerId);
      el.classList.add("dk-dragging"); el.classList.remove("dk-settle");
    });
    el.addEventListener("pointermove", e => {
      if(!active) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      moved = Math.max(moved, Math.hypot(dx, dy));
      el.style.transform = `translate(${dx}px,${dy}px) rotate(${dx / 18}deg)`;
      el.querySelector(".dk-stamp.yes").style.opacity   = Math.max(0, Math.min(1,  dx / TH_X));
      el.querySelector(".dk-stamp.no").style.opacity    = Math.max(0, Math.min(1, -dx / TH_X));
      el.querySelector(".dk-stamp.maybe").style.opacity = Math.abs(dx) < 60 ? Math.max(0, Math.min(1, dy / TH_Y)) : 0;
      armDock(dx > TH_X ? "yes" : dx < -TH_X ? "no" : (dy > TH_Y && Math.abs(dx) < 60) ? "maybe" : null);
    });
    el.addEventListener("pointerup", () => {
      if(!active) return;
      const cdx = dx, cdy = dy, cmoved = moved;
      reset(false);
      if(cdx > TH_X) commit("yes", true);
      else if(cdx < -TH_X) commit("no", true);
      else if(cdy > TH_Y && Math.abs(cdx) < 60) commit("maybe", true);
      else if(cmoved < 8){   // a click, not a drag
        el.style.transform = ""; clearStamps();
        openDetail(el.dataset.dkId, el);
      }else{
        el.classList.add("dk-settle");
        el.style.transform = ""; clearStamps();
      }
    });
    el.addEventListener("pointercancel", () => { if(active) reset(true); });
    el.addEventListener("lostpointercapture", () => { if(active) reset(true); });
  }

  /* ── the "all sorted" moment: a toast, nothing more. The deck stays put —
     the empty state plus the piles are the natural place to review from,
     and the Cards/Grid switch is right there for whoever wants the grid.
     Still a cancellable timer: an undo inside the window (or an un-rating
     from another view) must silence the stale congratulation. ── */
  function clearDone(){ if(doneTimer){ clearTimeout(doneTimer); doneTimer = 0; } }
  function scheduleDone(){
    if(doneTimer) return;
    doneTimer = setTimeout(() => {
      doneTimer = 0;
      if(shown() && pending() === 0) toast(T.deckDone);
    }, REDUCED.matches ? 400 : 900);
  }

  /* One commit path for drag, keys and buttons: record, hand the choice to
     setChoice, then fly the card onto its pile. Key/button commits get a
     short wind-up first so the motion reads as a throw. */
  function commit(choice, fromDrag){
    const id = queue[0];
    if(id == null) return;
    const p = BY_ID[id];
    if(!p || !eligible(p)){ refresh(); return; }   // top changed under us: resync, never re-rate
    clearDone();
    hist.push({ id, choice });
    suppress = true;
    try{ setChoice(id, choice); }finally{ suppress = false; }
    queue.shift();

    const el = deckEl().querySelector('[data-depth="0"]');
    if(!el || REDUCED.matches){
      if(el) el.remove();
      render(); renderDocks(choice);
      if(!queue.length) scheduleDone();
      return;
    }
    el.classList.add("dk-flying");
    el.removeAttribute("data-depth");
    el.querySelectorAll(".dk-stamp").forEach(s => s.style.opacity = 0);
    el.querySelector(".dk-stamp." + choice).style.opacity = 1;
    const fly = () => {
      const t = dockTarget(choice, id);
      el.classList.remove("dk-windup");
      el.classList.add("dk-fly");
      el.style.transform = `translate(${t.dx}px,${t.dy}px) rotate(${t.rot}deg) scale(${t.s})`;
      setTimeout(() => { el.remove(); renderDocks(choice); }, 430);
    };
    if(fromDrag) fly();
    else{
      el.classList.add("dk-windup");
      el.style.transform = { yes:"translate(70px,-8px) rotate(6deg)",
                             no:"translate(-70px,-8px) rotate(-6deg)",
                             maybe:"translate(0,64px)" }[choice];
      setTimeout(fly, 140);
    }
    render();   // the next card is live while this one is in the air
    if(!queue.length) scheduleDone();
  }

  /* Undo pops until it finds a record that still matches reality — an entry
     whose place was re-rated in another view is no longer undoable and is
     dropped rather than silently eating the keypress. */
  function undo(){
    clearDone();
    let last = null;
    while(hist.length){
      const c = hist.pop();
      const p = BY_ID[c.id];
      if(p && p.choice === c.choice){ last = c; break; }
    }
    if(!last){ updateHud(); return; }
    suppress = true;
    try{ setChoice(last.id, last.choice); }finally{ suppress = false; }   // same value → toggles back to null
    queue = deriveQueue(last.id);
    render(); renderDocks();
    if(REDUCED.matches) return;
    const el = deckEl().querySelector('[data-depth="0"]');
    if(!el || el.dataset.dkId !== String(last.id)) return;
    const t = dockTarget(last.choice, last.id);
    el.style.transition = "none";
    el.style.transform = `translate(${t.dx}px,${t.dy}px) rotate(${t.rot}deg) scale(${t.s})`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = "";
      el.classList.add("dk-flyback");
      el.style.transform = "";
      setTimeout(() => el.classList.remove("dk-flyback"), 400);
    }));
  }

  function deriveQueue(front){
    const q = PLACES.filter(eligible).map(p => p.id);
    if(front != null){
      const i = q.indexOf(front);
      if(i > 0){ q.splice(i, 1); q.unshift(front); }
    }
    return q;
  }
  const pending = () => PLACES.filter(eligible).length;

  /* External-sync entry point, called from setChoice()/render() like
     MAP.refresh(). Invariant: the current top card stays first only while it
     is still eligible; decided elsewhere, it leaves the deck at once — the
     next commit must never fire on an already-rated place. */
  function refresh(){
    if(suppress || !booted) return;
    if(!shown()){ clearDone(); return; }
    const top = queue[0];
    const keep = top != null && eligible(BY_ID[top]) ? top : null;
    queue = deriveQueue(keep);
    if(queue.length) clearDone();
    render(); renderDocks();
    if(openPile) renderPileView(false);
  }

  /* ── pile browse overlay ── */
  function openPileView(pile){
    openPile = pile;
    lastFocus = document.activeElement;
    renderPileView(true);
    const pv = $("#dk-pileview");
    pv.hidden = false; pv.classList.add("show");
    const h = pv.querySelector("h2");
    if(h) h.focus();
  }
  function closePileView(){
    if(!openPile) return;
    flushReason();
    openPile = null;
    const pv = $("#dk-pileview");
    pv.classList.remove("show"); pv.hidden = true;
    if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }
  function renderPileView(animate){
    if(!openPile) return;
    const members = PLACES.filter(p => p.choice === openPile && !isLodging(p));
    const card = $("#dk-pileview .dk-pcard");
    card.className = "dk-pcard " + openPile;
    card.innerHTML = `
      <button type="button" class="dk-pclose" aria-label="${esc(T.close)}">${xmark()}</button>
      <h2 id="dk-pv-title" tabindex="-1">${esc(T[openPile])} · <b>${members.length}</b></h2>
      ${members.length ? `<div class="dk-pgrid">${members.map((p, i) => {
        const im = (p.images || [])[0];
        const s = scatter(p.id, 5);
        const deal = animate ? ` style="--dk-d:${Math.min(i * 25, 300)}ms; --dk-rt:${s.rot.toFixed(1)}deg"` : "";
        return `<div class="dk-gcard${animate ? " dk-deal" : ""}"${deal} data-dk-id="${esc(p.id)}">
          <span class="dk-gphoto"><span class="dk-media-fb">${catIcon(p.category, 30)}</span>
            ${im && im.url ? `<img src="${esc(im.url)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>
          <button type="button" class="bare dk-gname" data-dk-detail="${esc(p.id)}">${esc(p.name)}</button>
          <span class="dk-garea">${esc(p.area || "")}${p.duration_min ? ` · ${esc(tf("aboutMin", { n: p.duration_min }))}` : ""}</span>
          <span class="dk-gchoice">
            ${PILES.map(k => `<button type="button" class="dk-v-${k}${p.choice === k ? " on" : ""}"
              data-dk-id="${esc(p.id)}" data-v="${k}" aria-pressed="${p.choice === k}" title="${esc(T[k])}">${MARK_BTN[k]}</button>`).join("")}
          </span>
          ${openPile === "no" ? `
          <span class="dk-greason">
            ${QUICK.map(r => `<button type="button" data-dk-id="${esc(p.id)}" data-r="${esc(r)}"
              class="${p.choice_reason === r ? "on" : ""}" aria-pressed="${p.choice_reason === r}">${esc(r)}</button>`).join("")}
          </span>
          <input class="dk-ginput" data-dk-id="${esc(p.id)}" placeholder="${esc(T.reasonPh)}" value="${esc(p.choice_reason || "")}">` : ""}
        </div>`;
      }).join("")}</div>` : `<div class="dk-pempty">${esc(T.deckPileEmpty)}</div>`}`;
    wirePileView(card);
  }
  function wirePileView(card){
    card.querySelector(".dk-pclose").onclick = closePileView;
    card.onclick = e => {
      // the content area is transparent — clicks in the gaps close the overlay
      if(e.target === card || e.target.classList.contains("dk-pgrid")){ closePileView(); return; }
      const b = e.target.closest("button");
      if(b && b.dataset.v){
        const p = BY_ID[b.dataset.dkId];
        // Guarded: re-sending the active state would toggle the place back
        // to unrated through setChoice's same-value branch.
        if(p && p.choice !== b.dataset.v){ flushReason(); setChoice(p.id, b.dataset.v); }
        return;
      }
      if(b && b.dataset.r !== undefined){
        const p = BY_ID[b.dataset.dkId];
        if(p) setReason(p.id, p.choice_reason === b.dataset.r ? "" : b.dataset.r);
        renderPileView(false);
        return;
      }
      const g = e.target.closest(".dk-gcard");
      if(g && !e.target.closest("input")) openDetail(g.dataset.dkId, g);
    };
    card.oninput = e => {
      const inp = e.target.closest(".dk-ginput");
      if(!inp) return;
      clearTimeout(reasonTimer);
      reasonTimer = setTimeout(() => { reasonTimer = 0; setReason(inp.dataset.dkId, inp.value); }, 400);
    };
    card.onchange = e => {
      const inp = e.target.closest(".dk-ginput");
      if(!inp) return;
      clearTimeout(reasonTimer); reasonTimer = 0;
      setReason(inp.dataset.dkId, inp.value);
      renderPileView(false);
    };
  }
  /* Closing the overlay must not lose a reason still sitting in its debounce
     window (typed, then Esc within 400ms). */
  function flushReason(){
    clearTimeout(reasonTimer); reasonTimer = 0;
    for(const inp of $$("#dk-pileview .dk-ginput")) setReason(inp.dataset.dkId, inp.value);
  }
  /* Reasons never travel through setChoice (see the module comment). Guarded
     to "no": schema says choice_reason belongs to skipped places only. */
  function setReason(id, reason){
    const p = BY_ID[id];
    if(!p || p.choice !== "no") return;
    const r = String(reason || "").trim();
    if((p.choice_reason || "") === r) return;
    p.choice_reason = r;
    saveLocal();
    scheduleAuto();
    syncChoice(p);   // the list card's "Reason:" strip follows live
  }

  /* ── actions row ── */
  function buildActions(){
    const bar = $("#dk-actions");
    const mk = (cls, inner, kbd, title, small) =>
      `<span class="dk-act"><button type="button" class="${cls}${small ? " dk-sm" : ""}" title="${esc(title)}" aria-label="${esc(title)}">${inner}</button><kbd>${kbd}</kbd></span>`;
    bar.innerHTML =
      mk("dk-b-undo", I_UNDO, "Z", T.deckUndo, true)
      + mk("dk-b-no", MARK_BTN.no, "←", T.no)
      + mk("dk-b-maybe", MARK_BTN.maybe, "↓", T.maybe)
      + mk("dk-b-yes", MARK_BTN.yes, "→", T.yes)
      + mk("dk-b-info", I_INFO, "Enter", T.deckInfo, true);
    bar.querySelector(".dk-b-undo").onclick  = undo;
    bar.querySelector(".dk-b-no").onclick    = () => commit("no", false);
    bar.querySelector(".dk-b-maybe").onclick = () => commit("maybe", false);
    bar.querySelector(".dk-b-yes").onclick   = () => commit("yes", false);
    bar.querySelector(".dk-b-info").onclick  = () => {
      const id = queue[0];
      if(id != null) openDetail(id, deckEl().querySelector('[data-depth="0"]'));
    };
  }

  function onShow(){
    if(!booted){
      booted = true;
      buildActions();
      $$(".dk-dock").forEach(d => d.addEventListener("click", () => openPileView(d.dataset.pile)));
      $("#dk-pileview").addEventListener("click", e => { if(e.target === e.currentTarget) closePileView(); });
      /* Focus stays inside the open overlay: Tab wraps last→first (and
         Shift+Tab first→last, with the initially-focused title counting as
         "before first"). Without this, Tab walks into the blurred page
         behind the aria-modal surface. Registered on the element so the
         document-level guards (which ignore inputs) can't swallow it. */
      $("#dk-pileview").addEventListener("keydown", e => {
        if(e.key !== "Tab" || !openPile) return;
        const items = $$("#dk-pileview button, #dk-pileview input")
          .filter(el => el.offsetParent !== null && !el.disabled);
        if(!items.length) return;
        const first = items[0], last = items[items.length - 1];
        const cur = document.activeElement;
        if(e.shiftKey && (cur === first || cur === $("#dk-pv-title"))){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && cur === last){ e.preventDefault(); first.focus(); }
      });
    }
    clearDone();
    queue = deriveQueue(null);
    render(); renderDocks();
  }

  /* Keyboard. Guards in order: view visible (null-safe for standalone, which
     removes the section) → the tab bar's own arrow handler wins → typing
     surfaces win → native dialogs own their keys (their Esc closes them
     first; a second Esc reaches us and closes the overlay) → IME composition
     / repeats / modifier combos are never ours (plain Backspace is, and is
     preventDefault()ed so it can't navigate the browser back). */
  document.addEventListener("keydown", e => {
    const v = dv();
    if(!v || v.hidden) return;
    if(e.target.closest && e.target.closest(".tab")) return;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    const dlg = $("#dlg"), rdlg = $("#rdlg");
    if((dlg && dlg.open) || (rdlg && rdlg.open)) return;
    if(e.isComposing || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if(openPile){
      if(e.key === "Escape"){ e.preventDefault(); closePileView(); }
      return;   // arrows must not decide the deck card under the overlay
    }
    const map = { ArrowRight:"yes", ArrowLeft:"no", ArrowDown:"maybe" };
    if(map[e.key]){ e.preventDefault(); commit(map[e.key], false); }
    else if(e.key === "z" || e.key === "Z" || e.key === "Backspace"){ e.preventDefault(); undo(); }
    else if(e.key === "Enter"){
      e.preventDefault();
      const id = queue[0];
      if(id != null) openDetail(id, deckEl().querySelector('[data-depth="0"]'));
    }
  });

  return { onShow, refresh, pending, setReason };
})();
window.DECK = DECK;

/* ─────────────────────────────────────────────── View switching */
/* The map view's height used to be hardcoded as calc(100vh - 210px). That
   constant matched no situation at all: measured on a 1440×900 desktop, the
   real overhead is 250px (header 100 + main's 20/130 vertical padding), so
   the page scrolled 40px too far and the three columns' headers ended up 20px
   under the translucent header. And the header itself varies — at 375px the
   subtitle wraps and it stands 150px tall. A constant is guaranteed wrong, so
   measure. */
function layoutMap(){
  const top = $(".top"), bar = $(".actionbar"), main = document.querySelector("main");
  const topH = top && !top.hidden ? top.offsetHeight : 0;
  const barH = bar && !bar.hidden ? bar.offsetHeight : 0;
  document.documentElement.style.setProperty("--ab-h", (barH + 14) + "px");
  const h = innerHeight - topH - 20 - (barH + 14);
  document.documentElement.style.setProperty("--map-h", Math.max(360, Math.round(h)) + "px");
  const mapView = $("#view-map");            // standalone mode removes this view entirely
  const deckView = $("#view-deck");          // the deck sizes itself from --map-h too
  if(main) main.classList.toggle("tight",
    (!!mapView && !mapView.hidden) || (!!deckView && !deckView.hidden));
}

/* The deck is a browse mode of the places tab, not a page: which of the two
   the tab opens is remembered here, and defaults to the deck while unrated
   places exist (sorting is the page's first job). */
function placesMode(){
  let m = null;
  try{ m = localStorage.getItem(LS_KEY + ":pmode"); }catch(e){}
  if(m === "deck" || m === "list") return m;
  return (window.DECK && DECK.pending() > 0) ? "deck" : "list";
}

function switchView(v){
  // Roving tabindex: a tab group occupies one stop in the Tab order, with
  // ←→ moving inside it. Leaving every tab at tabindex=0 would make keyboard
  // users press Tab three times to get past the tab bar.
  // The deck has no tab of its own — it highlights the places tab.
  const tabView = v === "deck" ? "list" : v;
  $$(".tab").forEach(t => {
    const on = t.dataset.view === tabView;
    t.setAttribute("aria-selected", on);
    t.tabIndex = on ? 0 : -1;
  });
  if(v === "deck" || v === "list"){
    try{ localStorage.setItem(LS_KEY + ":pmode", v); }catch(e){}
    for(const b of $$(".mode-seg button"))
      b.setAttribute("aria-pressed", String((b.dataset.mode === "deck") === (v === "deck")));
  }
  $$(".view").forEach(s => s.hidden = (s.id !== "view-" + v));
  // Export sits inside the map, but what it exports is the set of points the
  // map view has filtered, so it only exists while that view is on screen.
  // Guarded, unlike when this button lived in the tab bar: it is now a child of
  // #view-map, and the standalone page removes that view outright — an
  // unguarded write threw here and aborted switchView before it reached the
  // guide, leaving the standalone page unpaginated and its export unreachable.
  const ma = $("#map-actions");
  if(ma) ma.hidden = v !== "map";
  const ga = $("#guide-actions");
  if(ga) ga.hidden = v !== "guide";
  try{ localStorage.setItem(LS_KEY + ":view", v); }catch(e){}
  if(v === "map" && window.MAP){
    MAP.init();      // lazy: MapLibre is 275KB and shouldn't slow the first paint
    MAP.onShow();    // resize on every return + refit on the first
  }
  if(v === "deck" && window.DECK) DECK.onShow();   // re-derives the queue from live choices
  if(v === "guide" && window.GUIDE){
    GUIDE.render();                                  // the checklist must reflect the latest choices
    if(window.PAGER) PAGER.auto();                   // choices just changed under the sheets
    // The forecast arrives over the network, long after the sheets have been
    // laid out from a "fetching weather…" placeholder. Without this the first
    // sheet — and any PDF exported from it — keeps the placeholder.
    if(!switchView._wx){
      switchView._wx = true;
      Promise.resolve(GUIDE.renderWeather()).then(() => window.PAGER && PAGER.auto());
    }
  }
  layoutMap();
}

/* ─────────────────────────────────────────────── Startup */
/* The copy in the static HTML is the English fallback; this pass overwrites
   it from the T table — an identity operation for en, while zh / the ui
   override table are substituted before the first paint. */
function applyStaticI18n(){
  const txt = (sel, v) => { const el = $(sel); if(el) el.textContent = v; };
  const attr = (sel, a, v) => { const el = $(sel); if(el) el.setAttribute(a, v); };
  txt("#tab-list-txt", T.tabList);
  txt("#tab-map", T.tabMap);
  for(const s of $$(".mode-seg")){
    s.setAttribute("aria-label", T.modeAria);
    for(const b of s.querySelectorAll("button"))
      b.textContent = b.dataset.mode === "deck" ? T.modeDeck : T.modeFlat;
  }
  txt("#tab-guide", T.tabGuide);
  attr("#tab-guide", "title", T.guideTabDisabled);
  txt("#pg-print", T.pgPrint);
  txt("#pg-hint", T.pgHint);
  txt("#pg-md", T.pgMd);
  { const b = $("#pg-md"); if(b) b.title = T.pgMdHint; }
  // The standalone build drops the other two views but keeps this rail, so the
  // file it tells you to pass on has to be the file you are actually looking at.
  txt("#pg-share", tf("pgShare", { f: STANDALONE ? "guide.html" : "trip.html" }));
  attr("#pgnav", "aria-label", T.pgNav);
  txt("#exp-csv", T.exportCsv);
  // The hint has no room beside a control floating on the basemap; it rides
  // on the button instead of being dropped.
  { const b = $("#exp-csv"); if(b) b.title = T.csvHint; }
  attr("#q", "placeholder", T.searchPh);
  attr("#q", "aria-label", T.searchAria);
  attr("#seg-group", "aria-label", T.groupAria);
  txt("#by-area", T.byArea);
  txt("#by-tier", T.byTier);
  // The list's four choice pills are the map's filter group in another place,
  // so they share its label. Their own text is baked in by renderTally(),
  // which runs after T is resolved.
  attr("#tally", "aria-label", T.filterAria);
  attr("#seg-mfil", "aria-label", T.filterAria);
  attr("#seg-mgrp", "aria-label", T.groupAria);
  txt("#mgrp-lbl", T.groupLbl);
  for(const b of $$(".mgrp")) b.textContent = b.dataset.g === "area" ? T.byArea : T.byChoice;
  for(const b of $$(".mfil")){
    const c = b.querySelector(".c");
    b.textContent = T[b.dataset.c] ?? b.dataset.c;
    if(c) b.appendChild(c);
  }
  attr("#msq", "placeholder", T.msqPh);
  attr("#msq", "aria-label", T.msqAria);
  txt("#msq-go", T.msqGo);
  txt("#transit-btn", T.transit);
  txt("#save", T.saveBtn);
  txt("#download", T.downloadBtn);
  txt("#copy", T.copyBtn);
  txt("#more", T.moreBtn);
}

function boot(){
  document.title = tf("docTitle", { dest: TRIP.destination || T.trip });
  if(TRIP.output_language) document.documentElement.lang = TRIP.output_language;
  applyStaticI18n();
  // The local name is dropped from the pill: at this size the parenthetical
  // doubled the pill's width for a string the detail dialogs already carry, and
  // a destination is not the thing anyone needs to read off a street sign.
  $(".tname").textContent = TRIP.destination || T.trip;

  /* Two rows, split by meaning rather than by what fits: when on top, who and
     how hard below. See .metas — the rows are fixed, so the band keeps the same
     shape whatever the destination's name length. */
  const dateBits = [];
  if(TRIP.dates && TRIP.dates.start) dateBits.push(`${TRIP.dates.start} › ${TRIP.dates.end}`);
  if(TRIP.days) dateBits.push(tf("nDays", { n: TRIP.days }));
  const rows = [
    [["m-date", dateBits.join("　")]],
    [["m-who", TRIP.party], ["m-pace", TRIP.pace]],
  ];
  const metas = $("#metas");
  metas.textContent = "";
  /* --i is the entrance stagger's position, counted over what actually gets
     built rather than assigned per class — a trip with no party or no pace
     would otherwise leave a hole in the middle of the sequence. Starts at 1:
     .title is step 0 and takes it from band-in's var() fallback. */
  let mi = 1;
  for(const row of rows){
    const pills = row.filter(([, v]) => v);
    if(!pills.length) continue;
    const r = document.createElement("div");
    r.className = "mrow";
    for(const [cls, v] of pills){
      const s = document.createElement("span");
      s.className = "mpill " + cls;
      s.textContent = v;
      s.style.setProperty("--i", mi++);
      r.appendChild(s);
    }
    metas.appendChild(r);
  }
  // Not a fact about the trip but a warning about the data, so it sits with the
  // pills without joining the themed set.
  const vd = TRIP.verified_at ? Math.round((Date.now() - new Date(TRIP.verified_at+"T00:00:00")) / 864e5) : null;
  if(vd !== null && vd > 30){
    const w = document.createElement("span");
    w.className = "stale";
    w.textContent = tf("staleNote", { n: vd });
    w.style.setProperty("--i", mi++);
    (metas.lastElementChild || metas).appendChild(w);
  }
  /* The band is complete — start every element's entrance from here, one style
     recalc, so the stagger reads in order. See band-in for why this cannot be
     left to the elements' own arrival times. */
  $(".brand").classList.add("in");

  const restoredAdded = loadAdded();   // before loadItin: the schedule draft may reference stub ids
  const restored = loadLocal();
  const restoredItin = loadItin();
  // Absent from both the draft and the file → build from trip.dates. Placed
  // after loadItin so a half-finished draft isn't overwritten with empty
  // containers.
  if(window.MAP) MAP.ensureDays();

  if(ROUTE_HTML){
    $("#guide-body").innerHTML = ROUTE_HTML;
    $("#tab-guide").disabled = false;
  }else{
    $("#guide-body").innerHTML = `<div class="empty-state">
      <div class="big">${T.noGuideBig}</div>
      <div>${T.noGuideSub}</div></div>`;
  }

  // No longer concluding anything from "does the function exist" — measured,
  // an existing function may still be unable to write. Only describe what
  // will be attempted; the real outcome is reported on click.
  // Under the local server auto-save runs and its status shows live here;
  // under file:// the text explains what the button will try.
  // The page data's timestamp must be surfaced too: once this file is shared,
  // the recipient sees that moment's snapshot, not the state in your browser
  // now — unstated, both sides assume they're looking at the same thing.
  setSaveState("init");
  $("#save").textContent = SAVE_LABEL;
  layoutActionbar();

  renderChips();
  renderTally();
  render();

  if(STANDALONE){
    // Standalone guide page: keep only the guide, drop everything related to
    // filtering, for easy sharing and deployment
    // .navwrap, not .tabs: hiding the inner pill would leave an empty flex item
    // behind, and .top-in's gap would still reserve space for it.
    document.querySelector(".navwrap").hidden = true;
    document.querySelector(".actionbar").hidden = true;
    document.querySelector("#view-list").remove();
    document.querySelector("#view-map").remove();
    // The deck is a filtering surface too; removing the section also removes
    // its overlay, and the DECK keyboard guard null-checks the view.
    document.querySelector("#view-deck").remove();
    document.querySelector("main").style.paddingBottom = "60px";
    // Export needs no relocation here any more: it lives in the guide's own
    // rail, which this page shows exactly as the trip page does.
    switchView("guide");
  }else{
    // The stored view always wins — but only after validation: switchView
    // with an unknown value would hide every section. With no (valid) record
    // this is a first open, and a trip with unrated places starts on the
    // deck: sorting the cards is the page's first job.
    let v = null;
    try{ v = localStorage.getItem(LS_KEY + ":view"); }catch(e){}
    if(!["list", "map", "guide", "deck"].includes(v)) v = placesMode();
    if(v === "guide" && !ROUTE_HTML) v = "list";
    switchView(v);
  }

  const msg = [restored && tf("restoredChoices", { n: restored }),
               restoredItin && tf("restoredItin", { n: restoredItin }),
               restoredAdded && tf("restoredAdded", { n: restoredAdded })].filter(Boolean);
  if(msg.length) toast(tf("restoredToast", { list: msg.join(T.listSep) }));

  layoutMap();
}

/* The header's height varies with width (the subtitle wraps) and the action
   bar's height varies with the "Manual save…" fold-out, so both need
   re-measuring. layoutMap reads offsetHeight before writing CSS variables, so
   during a window drag every resize event would force a synchronous layout —
   coalesced into the next frame, at most one computation per frame. */
let layoutRaf = 0;
function scheduleLayout(){
  if(layoutRaf) return;
  layoutRaf = requestAnimationFrame(() => { layoutRaf = 0; layoutMap(); layoutChips(); });
}
addEventListener("resize", scheduleLayout);

/* ─────────────────────────────────────────────── Events */
/* Click the backdrop to dismiss. A modal <dialog> does not do this on its own,
   and a click on ::backdrop is dispatched to the dialog element, so the target
   test alone cannot tell a backdrop click from a click on the dialog's own
   border or scrollbar. Comparing against the box does: only a point outside it
   closes, which leaves scrollbar drags — a real way to land target=#dlg —
   working.
   #rdlg is deliberately left out. It asks *why* a place was rejected, and a
   stray click outside a half-typed reason should not throw it away; it keeps
   its explicit buttons. */
$("#dlg").addEventListener("click", e => {
  if(e.target !== e.currentTarget) return;
  const r = e.currentTarget.getBoundingClientRect();
  if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)
    e.currentTarget.close();
});

document.addEventListener("click", e => {
  /* The tri-state is tested before [data-detail], and the whole .pick swallows
     the click rather than only its buttons. The card itself now carries
     data-detail, so a closest() that ran the other way round would find the
     card from inside the pill and open the dialog instead of recording the
     rating — and a click that lands on the 1px seam between two segments would
     do it too. */
  const pickWrap = e.target.closest(".pick");
  if(pickWrap){
    const pick = e.target.closest(".pick button");
    if(pick){
      const id = pickWrap.dataset.id;
      const v  = pick.dataset.v;
      const p  = PLACES.find(x => x.id === id);
      if(v === "no" && p && p.choice !== "no"){ $("#dlg").close(); askReason(id); }
      else setChoice(id, v);
    }
    return;
  }

  const detail = e.target.closest("[data-detail]");
  /* Selecting a line of the pitch ends in a click. Without this the dialog
     would open every time someone tried to copy an address or a price out of
     a card. */
  /* The whole card is the source of the entrance, not whatever inside it was
     clicked — data-detail also sits on the .nm title button and on each .sn
     spot, and growing out of a 20px sub-control reads as a glitch. */
  if(detail && String(getSelection()).trim() === ""){ openDetail(detail.dataset.detail, detail.closest(".card") || detail); return; }
  if(detail) return;

  const sb = e.target.closest("[data-sched]");
  if(sb){
    MAP.toggleDay(sb.dataset.sched);
    /* Repaint the button: once added it should read "remove". No source
       element — the dialog is already open, so showModal() is a no-op here and
       the entrance must not replay. */
    openDetail(sb.dataset.sched);
    return;
  }

  if(e.target.closest("[data-close]")) $("#dlg").close();

  /* Tested before .chip: the disclosure is deliberately not a .chip (it is
     not a filter), but it sits in the same row and the same click path. */
  if(e.target.closest(".chips-more")){ chipsOpen = !chipsOpen; layoutChips(); return; }

  /* The four choice pills. aria-pressed is flipped on the node itself rather
     than repainted from state, same as .chip below and .mfil on the map —
     and since updateProgress() no longer rebuilds this markup, the pill the
     user pressed is still under the cursor and still focused afterwards. */
  const tly = e.target.closest("#tally button");
  if(tly){
    const on = tly.getAttribute("aria-pressed") === "true";
    tly.setAttribute("aria-pressed", !on);
    on ? ui.show.delete(tly.dataset.c) : ui.show.add(tly.dataset.c);
    render();
    layoutChips();   // an active filter must never be folded out of sight
    return;
  }

  const chip = e.target.closest(".chip");
  if(chip){
    const on = chip.getAttribute("aria-pressed") === "true";
    chip.setAttribute("aria-pressed", !on);
    if(chip.dataset.unv){ ui.unv = !on; render(); return; }
    const set = chip.dataset.cat ? ui.cats : ui.tags;
    const key = chip.dataset.cat || chip.dataset.tag;
    on ? set.delete(key) : set.add(key);
    render();
    layoutChips();   // clearing the last filter may let the row fold again
    return;
  }

  const mode = e.target.closest(".mode-seg button");
  if(mode){ switchView(mode.dataset.mode); return; }

  const tab = e.target.closest(".tab");
  if(tab && !tab.disabled){
    switchView(tab.dataset.view === "list" ? placesMode() : tab.dataset.view);
    return;
  }
});

$("#q").addEventListener("input", e => { ui.q = e.target.value; render(); });
$("#by-area").onclick = () => { ui.group="area"; $("#by-area").setAttribute("aria-pressed",true); $("#by-tier").setAttribute("aria-pressed",false); render(); };
$("#by-tier").onclick = () => { ui.group="tier"; $("#by-tier").setAttribute("aria-pressed",true); $("#by-area").setAttribute("aria-pressed",false); render(); };
$("#save").onclick     = doSave;
$("#download").onclick = () => download(false);
$("#copy").onclick     = showCode;

document.addEventListener("keydown", e => {
  if(e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ e.preventDefault(); $("#q").focus(); }

  // ←→ / Home / End within the tab bar. WAI-ARIA's tab pattern requires
  // arrow-key switching; a disabled Guide tab is skipped — it isn't
  // focusable, and landing on it would be a dead end.
  const tab = e.target.closest?.(".tab");
  if(tab && ["ArrowLeft","ArrowRight","Home","End"].includes(e.key)){
    const tabs = $$(".tab").filter(t => !t.disabled);
    if(!tabs.length) return;
    e.preventDefault();
    const i = tabs.indexOf(tab);
    const to = e.key === "Home" ? 0
             : e.key === "End"  ? tabs.length - 1
             : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    const tv = tabs[to].dataset.view;
    switchView(tv === "list" ? placesMode() : tv);
    tabs[to].focus();
  }
});

boot();
</script>
</body>
</html>
