        <button type="button" data-mode="deck" aria-pressed="false">Cards</button>
        <button type="button" data-mode="list" aria-pressed="true">Grid</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search names, highlights, tags…" autocomplete="off"
        aria-label="Search places">
      <!-- By-tier first because it is the default (ui.group starts at "tier"),
           which puts the pressed segment on the left. A default that sits
           second reads as the second option even while it is the one in
           effect. -->
      <div class="seg" role="group" id="seg-group" aria-label="Group by">
        <button id="by-tier" aria-pressed="true">By tier</button>
        <button id="by-area" aria-pressed="false">By area</button>
      </div>
      <!-- Filled by renderTally(); the aria-label is replaced with the map's
           own T.filterAria, because these four are that same control. -->
      <div class="tally" id="tally" role="group" aria-label="Filter by choice"></div>
    </div>
    <div class="chips" id="chips"></div>
    <!-- Sibling of #chips, not a child: #chips is what gets clamped, and a
         disclosure inside the clamped box would be clipped by it. -->
    <button class="chips-more" id="chips-more" aria-controls="chips" aria-expanded="true" hidden></button>
    <div id="groups"></div>
  </section>

  <!-- ══════════════ View ② Map ══════════════ -->
  <section class="view" id="view-map" role="tabpanel" aria-labelledby="tab-map" hidden>
    <div class="map-wrap" id="map-wrap">
      <div class="map-side">
        <div class="ms-head">
          <div class="ms-fil" role="group" id="seg-mfil" aria-label="Filter by choice">
            <button class="mfil" data-c="yes"   aria-pressed="true">Yes<span class="c">0</span></button>
            <button class="mfil" data-c="maybe" aria-pressed="true">Maybe<span class="c">0</span></button>
            <button class="mfil" data-c="none"  aria-pressed="true">Unrated<span class="c">0</span></button>
            <button class="mfil" data-c="no"    aria-pressed="true">No<span class="c">0</span></button>
          </div>
          <!-- Group-by-area is for routing (same area = less walking);
               group-by-choice is for gap-checking: after rating everything,
               confirm "did every Yes make it into the schedule?" — otherwise a
               wanted place can sink to the bottom of some area group and be
               forgotten. Deliberately no "by tier" here — by this stage the
               user's own ratings have replaced the AI's prior scoring. -->
          <div class="ms-grp" role="group" id="seg-mgrp" aria-label="Group by">
            <span class="lbl" id="mgrp-lbl">Group</span>
            <button class="mgrp" data-g="area"   aria-pressed="true">By area</button>
            <button class="mgrp" data-g="choice" aria-pressed="false">By choice</button>
          </div>
        </div>
        <div id="map-list"></div>
      </div>
      <div class="day-col" id="day-col"></div>
      <div class="map-main">
        <div id="map-canvas"></div>
        <div class="map-bar">
          <div class="mgroup msearch">
            <input id="msq" type="search" placeholder="Add a place…" autocomplete="off"
              aria-label="Search for a place and add it to the trip" enterkeyhint="search">
            <button id="msq-go">Search</button>
          </div>
          <div class="mgroup" id="basemaps"></div>
          <div class="mgroup" id="transit-group" hidden>
            <button id="transit-btn" aria-pressed="false">Transit</button>
          </div>
        </div>
        <!-- Basemap lightness. Deliberately outside .map-bar and pinned to the
             top-right, immediately left of the zoom control: it is a property
             of the *basemap*, not one more filter, and the toolbar's left
             cluster is already three capsules deep. .map-bar reserves room for
             room for the whole column via --tgl-w (see measureLightness) so
             the two never overlap when the toolbar wraps on a phone. -->
        <!-- Top-right column: lightness above, export directly beneath it.
             One container so the two share a right edge and one gap, and so
             measureLightness has a single box to measure — it must measure the
             column, not the capsule, now that the wider button sits below. -->
        <div class="map-rt" id="map-rt">
          <div class="mgroup" id="map-lightness" role="group"></div>
          <!-- Export is styled as a map control (.mgroup), not as the list
               view's .btn: it floats on the basemap alongside the lightness and
               basemap switches, and any other shape would make it the one map
               control that doesn't look like one. -->
          <div class="mgroup" id="map-actions" hidden>
            <button id="exp-csv">Export CSV</button>
          </div>
        </div>
        <div id="msq-panel" hidden></div>
        <!-- The result panel is transient, plug-in/plug-out DOM; screen
             readers won't announce its appearance on their own. Announcements
             go through this persistent status region: the empty region exists
             first, then its text changes — that's what gets read reliably. -->
        <span class="sr-only" id="msq-status" role="status"></span>
        <div class="legend" id="map-legend" hidden></div>
        <div class="map-note" id="map-note"></div>
        <div class="attrib" id="attrib"></div>
      </div>
    </div>
  </section>

  <!-- ══════════════ View ③ Guide ══════════════ -->
  <section class="view" id="view-guide" role="tabpanel" aria-labelledby="tab-guide" hidden>
    <!-- The rail holds two things: where to jump (a scrolling list, rebuilt by
         buildNav) and how to take the whole thing away. The action area is
         static markup pinned below the list, so a long list of pages can never
         push export out of view, and buildNav only ever clears .pgnav-list. -->
    <nav class="pgnav" id="pgnav" aria-label="Pages" hidden>
      <div class="pgnav-list" id="pgnav-list"></div>
      <div class="pgnav-act" id="guide-actions">
        <button class="btn sm" id="pg-print">Export PDF</button>
        <span class="hint" id="pg-hint">A4 · choose “Save as PDF”, and turn headers and footers off</span>
        <!-- Markdown's own explanation rides on the button's title rather than
             taking a third hint line: folded into a panel this rail is capped
             at min(58vh,420px), and .pgnav-act is flex:none — every line added
             here comes straight out of the scrollable page list. -->
        <button class="btn sm" id="pg-md">Export Markdown</button>
        <span class="hint" id="pg-share">trip.html is one offline file — send it to whoever you're travelling with. For an AI, use the Markdown above; it's far smaller.</span>
      </div>
    </nav>
    <!-- Below the width where a rail fits in the gutter, the same list folds
         behind this pill. Its label doubles as a position readout, so it earns
         its place on screen even when nobody opens it. -->
    <button class="pgnav-btn" id="pgnav-btn" aria-expanded="false" aria-controls="pgnav" hidden></button>
    <div class="pgnav-scrim" id="pgnav-scrim" hidden></div>
    <!-- .guide stays the source of truth in both modes: the paginator clones
         out of it rather than moving its children, so switching pagination off
         is one removeChild and nothing can be lost on the way back. -->
    <div class="pgwrap" id="pgwrap">
      <div class="guide">
        <div id="wx-box"></div>
        <div id="guide-body"></div>
        <div id="guide-auto"></div>
      </div>
    </div>
  </section>

  <!-- ══════════════ View ④ Swipe deck ══════════════
       A first-pass triage surface: every unrated place is dealt as a card,
       one decision at a time (drag / arrow keys / buttons). Decisions go
       through setChoice() like every other view, so the piles, the list and
       the map can never disagree. All labels are written at runtime from T;
       the DECK module owns everything inside this section. -->
  <section class="view" id="view-deck" role="tabpanel" aria-labelledby="tab-list" hidden>
    <div class="dk-toolbar">
      <div class="seg mode-seg" role="group" aria-label="Browse as">
        <button type="button" data-mode="deck" aria-pressed="true">Cards</button>
        <button type="button" data-mode="list" aria-pressed="false">Grid</button>
      </div>
    </div>
    <div id="dk-progress"><span id="dk-left"></span><span class="dk-vtrack"><i class="dk-vseg dk-vs-yes"></i><i class="dk-vseg dk-vs-maybe"></i><i class="dk-vseg dk-vs-no"></i></span><span id="dk-counter"></span></div>
    <div id="dk-main">
      <div id="dk-row">
        <button type="button" class="dk-dock dk-side dk-no" data-pile="no">
          <span class="dk-ptitle"></span><span class="dk-pstack dk-empty"></span>
        </button>
        <div id="dk-deck"></div>
        <button type="button" class="dk-dock dk-side dk-yes" data-pile="yes">
          <span class="dk-ptitle"></span><span class="dk-pstack dk-empty"></span>
        </button>
      </div>
      <button type="button" class="dk-dock dk-maybe" id="dk-maybedock" data-pile="maybe">
        <span class="dk-ptitle"></span><span class="dk-pstack dk-empty"></span>
      </button>
    </div>
    <div id="dk-actions"></div>
    <div id="dk-pileview" role="dialog" aria-modal="true" aria-labelledby="dk-pv-title" hidden>
      <div class="dk-pcard"></div>
    </div>
  </section>
</main>

<!-- Under the local server none of these three buttons is ever needed
     (changes auto-save), so they fold away by default, leaving the status
     text; under file:// there is no auto-save and Save is the primary button.
     See layoutActionbar. -->
<div class="actionbar">
  <div class="actionbar-in">
    <button class="btn primary" id="save">Save choices &amp; schedule</button>
    <div class="hint" id="hint" aria-live="polite"></div>
    <div class="more-box" id="more-box" hidden>
      <button class="btn" id="download">Download places.json</button>
      <button class="btn" id="copy">Copy for AI…</button>
    </div>
    <button class="lnk" id="more" aria-expanded="false">Manual save…</button>
  </div>
</div>

<dialog id="dlg"><div id="dlg-inner"></div></dialog>
<dialog id="rdlg"><div id="rdlg-inner"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- SortableJS 1.15.7 (MIT), inlined by build.py. See assets/vendor/README.md -->
<script>/*__SORTABLE__*/</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Data is injected by build.py. Inlined rather than fetch()ed, because under
   file:// fetch is killed by CORS.
   ═══════════════════════════════════════════════════════════════════ */
const DATA       = /*__TRIP_DATA__*/null;
const ROUTE_HTML = /*__ROUTE_HTML__*/null;
/* The same body as ROUTE_HTML, but the Markdown it was rendered from. Carried
   so the Markdown export can hand back what the author actually wrote —

catch(e){ _wdFmt = new Intl.DateTimeFormat("en", { weekday:"short" }); }
const wdName = d => _wdFmt.format(d);
const WD_NAMES = [""];
for(let i = 0; i < 7; i++) WD_NAMES.push(_wdFmt.format(new Date(2024, 0, 1 + i)));

/* ═══════════════════════════════════════════════════════════════════
   Schedule index

   itinerary stores only "order = array order"; sequence numbers and day
   colors are computed here on the fly. day/seq are never written back onto a
   place — storing one fact in two places always ends in conflict (deleting a
   point would mean renumbering every seq). Contract: references/data-schema.md.
   ═══════════════════════════════════════════════════════════════════ */
const ITIN = DATA.itinerary || [];
const BY_ID = Object.fromEntries(PLACES.map(p => [p.id, p]));
const isLodging = p => !!p && p.kind === "lodging";
/* Stub: a point the user added via map search that the AI hasn't researched.
   tier is a product of the research pipeline, so its presence IS the
   "completed or not" test (validate.py uses the same rule). */
const isStubP = p => !!p && p.origin === "user" && !p.tier;

/* Eight hues across the full wheel. The old rule "avoid green (yes) / amber
   (maybe) / gray (no), or fill and ring share a family" is retired: it had
   already failed quietly (teal sat 30° from the yes-green, brown next door
   to the maybe-amber) while costing half the wheel — and the white bands
   around the choice ring (see styleDot) now do the layer separation
   geometrically, so a green fill inside a green ring reads as two layers,
   not one blob. What DOES survive is the lightness pin — it locks legibility,
   not taste, and the window is narrow (relative luminance L ≈ 0.150–0.178):
     · white sequence digits stay legible  → L ≤ 0.179 (white text 4.5:1)
     · recognizable on a dark ground       → L ≥ 0.144 (3:1, WCAG 1.4.11)
     · recognizable on a light ground      → L ≤ 0.30
   The dark constraint outlived the dark page palette that produced it: these
   are also the marker colors on the basemap, which still switches light/dark
   (see setMapDark). All eight sit at L≈0.162; measured (WCAG formula): white
   digits 4.91–5.00, dark ground ≥3.33, light ground ≥4.16. Array order is
   "consecutive days get far-apart hues" — day 1 blue never sits next to a
   neighbor hue; red(7) and orange(2) are never adjacent days. Index 0 stays
   the quiet slate: it colors Day 0 (the arrival evening), which should read
   as a prologue, not a headline. */
const DAY_COLORS = ["#597481", "#2A6DD8", "#B0580B", "#8E55C4",
                    "#1E8137", "#D81B65", "#0E7C7D", "#CE3922"];
const dayColor = n => DAY_COLORS[((n % DAY_COLORS.length) + DAY_COLORS.length) % DAY_COLORS.length];
/* A second, non-color channel for the same information, in the same place so
   the pairing stays 1:1 by construction.
   Normalizing lightness above is what makes white digits readable on every
   day color, but it also spends lightness as a channel and leaves hue alone
   to say which day this is. Simulated at severity 1.0, several pairs then
   collapse: OKLab dE under deuteranopia is 0.011 for days 1/4 and 0.031 for
   5/6, under protanopia 0.015 for 1/4 — differences no one can act on. And
   the note above states the stakes itself: "which day is this rides entirely
   on this color code".
   Dashes rather than a text label on the line: a label needs a font from the
   basemap's glyph set, and this file has been burned by that before (see the
   arrow icon's note on "▶" simply not existing in the set we use). A dash
   pattern depends on nothing.
   Twelve patterns against eight colors: the cycles are coprime-ish
   (LCM 24), so the color+dash pair stays unique for 24 days — a 14-day trip
   never shows two identical route lines, even though the colors alone repeat
   from day 9. This is also the second channel for color-vision deficiency:
   green/teal and orange/red collapse under deutan/protan simulation, and the
   dash is what still tells them apart. Index 0 keeps the dash the single
   route layer always used, so short trips look unchanged. Written in
   line-width units, which is how MapLibre reads line-dasharray. */
const DAY_DASH = [
  [2.4, 1.4],                          // medium dash — the original
  [0.6, 1.3],                          // dotted
  [5.5, 1.6],                          // long dash
  [3.4, 1.3, 0.6, 1.3],                // dash-dot
  [1.5, 1.5],                          // even short dash
  [8, 2.4],                            // very long dash
  [3.4, 1.2, 0.6, 1.2, 0.6, 1.2],      // dash-dot-dot
  [5.5, 1.4, 1.5, 1.4],                // long-short alternation
  [0.6, 2.6],                          // sparse dots
  [8, 1.6, 0.6, 1.6],                  // long-dot
  [0.6, 1.2, 0.6, 1.2, 0.6, 3],        // dot triplets with a breath
  [12, 2.2],                           // extra-long dash
];
const dayDash = n => DAY_DASH[((n % DAY_DASH.length) + DAY_DASH.length) % DAY_DASH.length];

let SCHED = new Map();          // placeId -> [{ n, seq, note }], in order of appearance
function buildSched(){
  SCHED = new Map();
  for(const day of ITIN){
    let seq = 0;
    for(const ent of (day.places || [])){
      const p = BY_ID[ent && ent.id];
      if(!p) continue;
      // Lodging is unnumbered; only attractions run 1, 2, 3 consecutively
      const lod = isLodging(p);
      if(!lod) seq++;
      const arr = SCHED.get(ent.id) || [];
      arr.push({ n: day.n, seq: lod ? null : seq, note: ent.note || "" });
      SCHED.set(ent.id, arr);
    }
  }
}
buildSched();

const schedOf = id => SCHED.get(id) || [];
const daysOf  = id => [...new Set(schedOf(id).map(s => s.n))].sort((a, b) => a - b);
const firstSeq = id => (schedOf(id).find(s => s.seq != null) || {}).seq ?? null;

/* Whether the draft is fresher is judged by "has the file's schedule
   changed" — not by build time. Build time changes on every rebuild, and the
   AI may rerun it just to fill in an opening time; keyed on that, half an
   hour of the user's scheduling would silently vanish after an unrelated
   rebuild. */
const itinSig = a => JSON.stringify((a || []).map(d =>
  [d.n, d.date || "", (d.places || []).map(e => (e && e.id) || "")]));
const FILE_SIG = itinSig(DATA.itinerary);   // the file's copy at load time; never changes
let  SAVED_SIG = null;                      // the copy most recently *actually written* to the file

/* Capability check: save ability depends on the browser engine, not on
   file:// vs http://. Measured: showSaveFilePicker works fine under file:// —
   the actual holdouts are Firefox / Safari. */
const CAN_WRITE = typeof window.showSaveFilePicker === "function";
const LS_KEY = `tp:${TRIP.destination || "trip"}:${TRIP.generated_at || ""}`;

/* Small icons like ↑ ↓ × are always SVG, never characters. Measured: the
   three glyphs differ in width inside the same 17px box (↑↓ 9.5px, × 7.7px),
   and the arrows sit high in most fonts — inconsistent visual weight that
   also varies with the system font. SVG geometry is fixed. */
/* One optical stroke weight for the whole icon set, expressed as a function of
   the size the icon is drawn at rather than as a constant per generator.
   Stroke-width is in viewBox units, so a fixed number renders lighter the
   smaller the icon gets: measured, the three generators here carried 1.7, 1.9
   and 1.6 on the same 16 viewBox and rendered at 11, 13 and 14px, landing at
   1.17, 1.54 and 1.40 real pixels. The 54 up/down/× buttons in the schedule
   column were the thinnest of the three and sit directly beside the 1.54
   rating marks, which is what made them read as hairlines.
   Not a flat "constant real pixels" either — that leaves a 44px icon looking
   underdrawn. The gentle exponent keeps ~1.5px at the 13px base size, 1.42 at
   11px, and lets the 44px media placeholder grow to about 2.3px, which is
   where an icon that size wants to be. */
const SW = n => +(1.5 * Math.pow(n / 13, 0.35) * 16 / n).toFixed(2);

const stroke = (d, n = 11, extra = "") =>
  `<svg viewBox="0 0 16 16" width="${n}" height="${n}" fill="none" `
  + `stroke="currentColor" stroke-width="${SW(n)}" stroke-linecap="round" `
  + `stroke-linejoin="round" aria-hidden="true" style="display:block">${extra}<path d="${d}"/></svg>`;

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* In pitch / detail the AI naturally writes **emphasis**. Escape fully
   first, then restore this one marker — emphasis survives without opening an
   XSS hole; the reverse order would be dangerous. */
const rich = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const richP = s => rich(s).split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g, "<br>")}</p>`).join("");

let fileHandle = null;
/* Grouped by tier, not area, by default. Areas are as fine-grained as the
   research made them — this trip has 26 of them for 47 places, 17 holding a
   single place — which in a card grid is 17 headings each followed by one card
   and two empty cells. Tier splits the same 47 into four full groups, and
   "which are the good ones" is the question the list is for anyway. Area is
   still one click away, and is the better view once you're routing a day. */
/* ui.show is the four choice buckets the list is currently showing — all of
   them, until someone switches one off on a tally pill. Deliberately not the
   same Set as the map's st.show: the two views are different jobs, and
   arriving at one to find the other had rewritten its filters is the more

const ui = { group:"tier", q:"", cats:new Set(), tags:new Set(), unv:false,
             show:new Set(["yes","maybe","no","none"]) };

/* ─────────────────────────────────────────────── Trip dates */
/* Local date formatting. Never toISOString() — it converts to UTC, which in
   UTC+8 turns 09-13 into 09-12, and the user believes the wrong day is the
   closure day. */
const isoLocal = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function tripDays(){
  const d = TRIP.dates || {};
  if(!d.start || !d.end) return [];
  const out = [], s = new Date(d.start + "T00:00:00"), e = new Date(d.end + "T00:00:00");
  if(isNaN(s) || isNaN(e) || e < s) return [];
  for(let c = new Date(s); c <= e; c.setDate(c.getDate()+1)){
    out.push({ date:new Date(c), iso:isoLocal(c), wd:((c.getDay()+6)%7)+1 });
  }
  return out;
}
const DAYS = tripDays();

/* ─────────────────────────────────────────────── Warning computation
   This is the list view's core value: the user sees the problems *before*
   pressing "yes", not after a whole filtering round only to find the place
   shut that day. */

/* Hard conflict between a place and one scheduled day — the only mistake
   here that ends in a wasted trip out. A conflict is a property of the
   (place, day) pair, not of the place, so it renders on the schedule row
   (see dayBox) rather than competing with the soft one-slot warnings of the
   pool list. Lodging is exempt: no notion of a closure day (same rule as
   validate.py). Returns the reason text, or null. */
function dayWd(n){
  const day = ITIN.find(d => d.n === n);
  return day && day.date ? ((new Date(day.date + "T00:00:00").getDay() + 6) % 7) + 1 : null;
}
function dayConflict(p, n){
  if(!p || isLodging(p)) return null;
  if(p.status && p.status !== "open")
    return { renovating:T.stRenovating, seasonal_closed:T.stSeasonal, permanently_closed:T.stPermanent }[p.status] || p.status;
  const wd = dayWd(n);
  if(wd && Array.isArray(p.closed_days) && p.closed_days.includes(wd)){
    const day = ITIN.find(d => d.n === n);
    return tf("closedOn", { d: `${day.date.slice(5)}(${WD_NAMES[wd]})` });
  }
  return null;
}

function flags(p){
  const out = [];
  if(p.status && p.status !== "open"){
    const label = { renovating:T.stRenovating, seasonal_closed:T.stSeasonal, permanently_closed:T.stPermanent }[p.status] || p.status;
    out.push({ cls:"f-danger", txt:label + (p.status_note ? ": " + p.status_note : "") });
  }
  const cd = p.closed_days || [];
  if(cd.length && DAYS.length){
    const hit = DAYS.filter(d => cd.includes(d.wd));
    if(hit.length === DAYS.length){
      out.push({ cls:"f-danger", txt:T.closedAllTrip });
    }else if(hit.length){
      out.push({ cls:"f-warn", txt:tf("closedOn",
        { d: hit.map(d => `${d.iso.slice(5)}(${WD_NAMES[d.wd]})`).join(T.listSep) }) });
    }
  }else if(cd.length){
    out.push({ cls:"f-info", txt:tf("closedWeekly", { days: cd.map(d => WD_NAMES[d]).join(T.listSep) }) });
  }
  // Already scheduled onto a closure day: a separate red flag naming the day,
  // not an upgrade of the yellow fact above — the place may sit in two days
  // with only one in conflict, and the flag has to say which.
  if(cd.length){
    const seen = new Set();
    for(const s of schedOf(p.id)){
      if(seen.has(s.n)) continue;
      seen.add(s.n);
      const wd = dayWd(s.n);
      if(wd && cd.includes(wd)){
        const day = ITIN.find(d => d.n === s.n);
        out.push({ cls:"f-danger", txt:tf("confSched", { d: `${day.date.slice(5)}(${WD_NAMES[wd]})` }) });
      }
    }
  }
  if(p.booking === "required") out.push({ cls:"f-warn", txt:T.bookingRequired });
  else if(p.booking === "recommended") out.push({ cls:"f-info", txt:T.bookingRecommended });
  // Verification blocked: must be prominent, or the user treats unverified
  // information as verified
  const v = p.verify;
  if(v && v.state && v.state !== "verified"){
    out.push({ cls:"f-unverified",
      txt: v.state === "blocked" ? T.fUnverified : T.fPartial });
  }
  return out;
}

function verifyBox(p){
  const v = p.verify;
  if(!v || !v.state || v.state === "verified") return "";
  return `<div class="verify-box">
    <b>${v.state === "blocked" ? T.vbBlocked : T.vbPartial}</b><br>
    ${rich(v.note || "")}
    ${(v.check || []).length ? `<ul>${v.check.map(x => `<li>${tf("vbCheck", { x: esc(x) })}</li>`).join("")}</ul>` : ""}
    <div style="margin-top:6px">${T.vbTell}</div>
  </div>`;
}

/* The page has one palette, fixed light (see the design tokens). There is no
   theme state, no corner toggle and no themechange event; the only light/dark
   control left on the page belongs to the basemap and lives inside the map
   (see setMapDark).

   Read .matches each time instead of caching the boolean: toggling "reduce
   motion" in system settings should take effect immediately, without

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");

/* ─────────────────────────────────────────────── Render helpers */
/* Local-language names carry a lang attribute. The page's lang is the body
   language while name_local is, say, Japanese — unmarked, a Chinese screen
   reader would read Japanese kanji in Mandarin, and the CJK font stack would
   pick Simplified glyph forms for characters like 図書館 whose Japanese and
   Chinese shapes differ. And this page exists precisely so you can recognize
   those characters on the street sign. The language comes from the data
   (trip.local_language); no country is hardcoded. */
const LOCAL_LANG = (TRIP.local_language && TRIP.local_language !== TRIP.output_language)
  ? TRIP.local_language : "";
const langAttr = LOCAL_LANG ? ` lang="${esc(LOCAL_LANG)}"` : "";
const SCALE_TXT = { spot:T.scaleSpot, "30min":T.scale30, "1-2h":T.scale12,
                    "2-3h":T.scale23, "half-day":T.scaleHalf, "full-day":T.scaleFull };

/* ticket is free text, and squeezing it into a short label turns into a lie
   easily. Two cases we hit:
     "Keep ¥600 (free under junior-high)" — matching "free" first would
       print free and undercount a ticket
     "public areas free; special exhibition adults ¥3,000, students ¥1,500"
       — matching the amount first would print "from ¥3,000", while the
       building itself can be entered for free
   So both must be examined; whichever comes first sets the tone, and when
   both are present they're shown side by side to say "it depends".

   This lived inside the map module and served only the sidebar rows. The list
   cards need exactly the same thing — 20 of 47 tickets here run past 30
   characters, the longest is 122, and laid out in full they were four to six
   lines at the foot of a card. So it moved up here and both views call it: one
   place now shows one price label wherever you meet it, and the two views
   can't drift into disagreeing about what a ticket costs. The verbatim text
   stays in the detail dialog, which is the surface that has room for it. */
const FREE_RE = /免费|免費|無料|无料|free/i;
const AMT_RE = /[¥￥$€£]\s*[\d,]+/;
function shortPrice(t){
  if(!t) return "";
  const s = String(t);
  const amt = s.match(AMT_RE), free = s.match(FREE_RE);
  if(amt && free){
    const many = (s.match(new RegExp(AMT_RE.source, "g")) || []).length > 1;
    return free.index < amt.index
      ? `${T.free} / ${amt[0].replace(/\s+/g, "")}${many ? T.fromSuffix : ""}`
      : `${amt[0].replace(/\s+/g, "")}${many ? T.fromSuffix : ""}`;
  }
  if(amt){
    const many = (s.match(new RegExp(AMT_RE.source, "g")) || []).length > 1;
    return amt[0].replace(/\s+/g, "") + (many ? T.fromSuffix : "");
  }
  return free ? T.free : "";
}

/* shortPrice returns "" when the ticket text carries no amount and no free
   marker at all — a cafe whose menu the official page never lists, say. On a
   card that blank would read as "we forgot", or worse, as free. Say instead
   that the price is the thing we couldn't establish; the dialog carries the
   verbatim note explaining why. */
const priceLabel = t => shortPrice(t) || (t ? T.priceTBD : "—");

/* ═══════════════ Monochrome icons ═══════════════
   No emoji on this page. Two reasons, both learned the hard way:
     1. We don't control the glyphs. The same ✅ differs in shape, weight and
        baseline across macOS / Windows / Android and won't align with the
        sequence digits next to it (the map's lodging marker moved from emoji
        to SVG for exactly this).
     2. We don't control the color. Emoji are pre-colored and can't inherit
        currentColor, so the "yes" green isn't the page's --ok green — and on
        the map, where the ink follows the basemap's lightness, a baked-in
        color can't follow anything.
   Font symbols (◐ ✕ etc.) fix #2 but gamble that the user's fonts carry the
   code point — this page gets shared, and we don't choose the fonts. So:
   inline SVG throughout. viewBox is uniformly 16; different uses only change
   width/height. */
/* No stroke-width here any more: it lives on the <svg> that icon() builds, so
   one number covers every path in the icon and can be derived from the render
   size. stroke-width is an inherited SVG presentation attribute, so paths that
   do not set it pick up the element's — the sub-paths that deliberately fill
   (the half-circle in "maybe", the dot in "warn") are unaffected, having no
   stroke to weight. */
const SVG_ST = 'fill="none" stroke="currentColor" '
             + 'stroke-linecap="round" stroke-linejoin="round"';
const icon = (body, n = 13) =>
  `<svg viewBox="0 0 16 16" width="${n}" height="${n}" stroke-width="${SW(n)}" `
  + `aria-hidden="true" style="display:block;margin:auto;flex:none">${body}</svg>`;
/* Close. Drawn rather than typed: as the character &times; it is centered by
   its *line box*, and the glyph's ink sits high inside that box (baseline up to
   x-height), so a geometrically centered box left the mark ~2px low — and by
   how much depends on the font, which the theme changes. Two strokes on a
   16×16 viewBox are centered by construction, whatever the font. */
const xmark = (n = 14) => icon(
  `<path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" `
  + `stroke-linecap="round"/>`, n);
/* Lodging. Redrawn as an outline on the 16 viewBox the rest of the set uses.
   It was the one filled glyph among eleven outline category marks and it
   renders in the same slots as them — at 11–13px a solid silhouette reads
   markedly heavier than its neighbours, and by the convention every other
   icon here follows (outline = the thing, fill = the active state) a solid
   house also claims a state that lodging does not have. The old path was on a
   24 viewBox, which is why it could not share the set's stroke either. */
const house = (n = 13) => icon(
  `<path d="M2.4 8.4 8 3.4l5.6 5" ${SVG_ST}/>`
  + `<path d="M4.1 7.5v5.9h7.8V7.5" ${SVG_ST}/>`
  + `<path d="M6.6 13.4v-3.2h2.8v3.2" ${SVG_ST}/>`, n);
/* "Maybe" is drawn as a half-filled circle: it sits between "hollow circle =
   unrated" and "solid check = yes", and the shape says so by itself — no
   color needed to tell them apart. */
const MARK_ICON = {
  yes:   icon(`<path d="M3 8.4 6.3 11.7 13 4.6" ${SVG_ST}/>`),
  maybe: icon(`<circle cx="8" cy="8" r="5.2" ${SVG_ST}/>`
            + `<path d="M8 2.8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor"/>`),
  no:    icon(`<path d="M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4" ${SVG_ST}/>`),
  none:  icon(`<circle cx="8" cy="8" r="5.2" ${SVG_ST}/>`),
  warn:  icon(`<path d="M8 2.4 14.8 13.6H1.2z" ${SVG_ST}/>`
            + `<path d="M8 6.6v2.9" ${SVG_ST}/>`
            + `<circle cx="8" cy="11.7" r=".95" fill="currentColor"/>`),
};

/* Category icons. Half the places have no photo (Wikipedia simply has no lead
   image for a back-alley coffee shop), and a photo-forward grid can't leave 25
   of 47 tiles blank. The category mark fills that slot with something the eye
   can actually sort on — you can tell a shrine from a museum from a market at a
   glance, which a repeated first-character placeholder never gave you.
   Same contract as MARK_ICON: 16 viewBox, currentColor strokes, no emoji. */
const CAT_ICON = {
  /* Castle keep: tiered roofs, the shape every "landmark" in this trip shares */
  landmark:     `<path d="M2.4 13.4h11.2" ${SVG_ST}/>`
              + `<path d="M3.6 13.4V9.6h8.8v3.8" ${SVG_ST}/>`
              + `<path d="M2.6 9.6h10.8L11.4 6.6H4.6z" ${SVG_ST}/>`
              + `<path d="M5.4 6.6 8 3.2l2.6 3.4" ${SVG_ST}/>`,
  /* Neoclassical portico — columns under a pediment */
  museum:       `<path d="M2 6.4 8 2.8l6 3.6" ${SVG_ST}/>`
              + `<path d="M2.6 13.4h10.8" ${SVG_ST}/>`
              + `<path d="M4.6 8.2v4M8 8.2v4M11.4 8.2v4" ${SVG_ST}/>`,
  /* Compass needle: off the beaten track */
  hidden:       `<circle cx="8" cy="8" r="5.6" ${SVG_ST}/>`
              + `<path d="M10.4 5.6 9 9 5.6 10.4 7 7z" ${SVG_ST}/>`,
  /* Film strip with sprocket holes */
  media:        `<rect x="2.2" y="3.6" width="11.6" height="8.8" rx="1.4" ${SVG_ST}/>`
              + `<path d="M5.4 3.6v8.8M10.6 3.6v8.8" ${SVG_ST}/>`,
  /* Two towers of differing height — skyline, not a single building */
  architecture: `<path d="M2.6 13.4h10.8" ${SVG_ST}/>`
              + `<rect x="3" y="6.2" width="4.2" height="7.2" ${SVG_ST}/>`
              + `<rect x="8.8" y="2.8" width="4.2" height="10.6" ${SVG_ST}/>`
              + `<path d="M10.2 5.6h1.4M10.2 8.2h1.4M4.4 8.8h1.4" ${SVG_ST}/>`,
  /* Torii gate */
  shrine:       `<path d="M2 4.2h12" ${SVG_ST}/>`
              + `<path d="M3 6.4h10" ${SVG_ST}/>`
              + `<path d="M4.6 4.2v9.2M11.4 4.2v9.2" ${SVG_ST}/>`,
  /* Conifer over a hill line */
  nature:       `<path d="M8 2.6 5 7.2h6z" ${SVG_ST}/>`
              + `<path d="M8 5.6 4.4 10.8h7.2z" ${SVG_ST}/>`
              + `<path d="M8 10.8v2.6M2.4 13.4h11.2" ${SVG_ST}/>`,
  /* Market awning: scalloped canopy over a stall */
  market:       `<path d="M2.2 6.4h11.6L12.4 3.4H3.6z" ${SVG_ST}/>`
              + `<path d="M3.4 6.4v7h9.2v-7" ${SVG_ST}/>`
              + `<path d="M2.2 6.4h11.6" ${SVG_ST}/>`,
  /* Bowl with steam — a meal you sit down to, not a shop */
  food:         `<path d="M2.6 8.2h10.8a5.4 5.4 0 0 1-10.8 0z" ${SVG_ST}/>`
              + `<path d="M6.4 5.4c0-1 1.2-1 1.2-2M9.4 5.4c0-1 1.2-1 1.2-2" ${SVG_ST}/>`,
  /* Ticket stub with a perforation */
  event:        `<path d="M2.4 5.2h11.2v2.1a1.4 1.4 0 0 0 0 2.8v2.7H2.4v-2.7a1.4 1.4 0 0 0 0-2.8z" ${SVG_ST}/>`
              + `<path d="M8 6.6v.9M8 9.4v.9" ${SVG_ST}/>`,
};
/* Places with no category (user-added stubs, lodging) fall back to the same
   hollow circle the map uses for "unrated" */
const catIcon = (c, n) => icon(CAT_ICON[c] || `<circle cx="8" cy="8" r="5.2" ${SVG_ST}/>`, n);

/* The category mark is rendered *underneath* every tile, image or not, and the
   photo is layered over it. A broken image URL then needs nothing but
   this.remove() — no className rewriting, no SVG markup smuggled through an
   inline onerror attribute (which would have to survive both HTML-attribute
   and JS-string quoting). Costs a few bytes of markup per photo tile. */
function media(p){
  const im = (p.images || [])[0];
  const label = CATMAP[p.category] || "";
  return `<div class="media">
    <div class="media-fb">${catIcon(p.category, 44)}${label ? `<span>${esc(label)}</span>` : ""}</div>
    ${im && im.url ? `<img src="${esc(im.url)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ""}
  </div>`;
}


function pickHTML(p){
  const c = p.choice;
  return `<div class="pick" data-id="${esc(p.id)}">
    <button class="y" data-v="yes"   aria-pressed="${c==="yes"}">${T.yes}</button>
    <button class="m" data-v="maybe" aria-pressed="${c==="maybe"}">${T.maybe}</button>
    <button class="n" data-v="no"    aria-pressed="${c==="no"}">${T.no}</button>
  </div>`;
}

/* The card is a vertical stack, not the old photo-beside-text row: a 3-column
   grid of photo-topped cards is scannable in a way 47 stacked rows never were.
   Everything sits inside the card's own padding — nothing bleeds to the edge —
   and .facts carries margin-top:auto so that whatever the pitch length, the
   fact strip and the pick control land on the same baseline across a row.
   The verify box does NOT come along: it's a 3-line explanation that would
   dwarf a card, and the f-unverified badge in .flags plus the "needs your
   check" chip already point at it. The dialog still renders it in full. */
function cardHTML(p, children){
  const fl = flags(p);
  const stub = isStubP(p);
  // Rendered even when there is no local name. 6 of these 47 places have none
  // (a user-added stub, a place whose local name is identical), and the line
  // they were missing pulled their pitch a line higher than their neighbours'
  // in the same grid row. The empty element holds the line open; .loc's
  // min-height is what gives it size.
  const loc = p.name_local && p.name_local !== p.name
    ? `<div class="loc"${langAttr}>${esc(p.name_local)}</div>` : `<div class="loc"></div>`;
  const unv = p.verify && p.verify.state && p.verify.state !== "verified" ? ` data-verify="${esc(p.verify.state)}"` : "";
  // Stubs lack the research fields (tier/scale/ticket), so they can't use the
  // generic template — esc(undefined) is "", leaving a row of empty cells.
  const facts = stub
    ? `<span>${T.stubFacts}</span>${p.area ? `<span class="tk">${esc(p.area)}</span>` : ""}`
    : `<span>${esc(SCALE_TXT[p.scale] || p.scale)}</span>
          <i class="fdiv"></i>
          <span class="tk">${esc(priceLabel(p.ticket))}</span>
          <i class="fdiv"></i>
          <span>${p.indoor ? T.indoor : T.outdoor}</span>`;
  // data-detail on the article, not only on the name: the whole card opens the
  // dialog. The click handler bails out inside .pick first, so the one control
  // that isn't "tell me more" keeps working.
  return `<article class="card" data-id="${esc(p.id)}" data-detail="${esc(p.id)}"
    data-choice="${esc(p.choice||"")}"${unv}>
    ${media(p)}
    <div class="hd">
      <div class="nmw">
        <div class="nm-box"><button class="bare nm" type="button" data-detail="${esc(p.id)}">${esc(p.name)}</button></div>${loc}
      </div>
      <div class="hd-r">
        ${stub ? `<span class="tier t-stub">${T.stubTier}</span>`
               : `<span class="tier t-${esc(p.tier)}">${esc(p.tier)}</span>`}
      </div>
    </div>
    ${p.pitch ? `<p class="pitch">${rich(p.pitch)}</p>` : ""}
    ${fl.length ? `<div class="flags">${fl.map(f=>`<span class="flag ${f.cls}">${esc(f.txt)}</span>`).join("")}</div>` : ""}
    <div class="why"${p.choice === "no" && p.choice_reason ? "" : " hidden"}>${T.whyNot}<span class="why-t">${esc(p.choice_reason || "")}</span></div>
    <div class="facts">${facts}</div>
    ${pickHTML(p)}
    ${children.length ? spotsHTML(children) : ""}
  </article>`;
}

/* Photo stops fold under their parent place: the parent isn't drowned out,
   and small en-route camera spots don't get lost either */
function spotsHTML(kids){
  return `<div class="spots">
    <div class="spots-h">${tf("spotsHeader", { n: kids.length })}</div>
    ${kids.map(k => `<div class="spot" data-id="${esc(k.id)}">
      <button class="bare sn" type="button" data-detail="${esc(k.id)}">${esc(k.name)}</button>
      <span class="sd">${rich(k.pitch)}</span>
      ${pickHTML(k)}
    </div>`).join("")}
  </div>`;
}

/* ─────────────────────────────────────────────── Filtering & grouping */
function visible(){
  const q = ui.q.trim().toLowerCase();
  return PLACES.filter(p => {
    /* Lodging is exempt, exactly as the map's shown() has it: it is not a
       candidate place, it carries no choice, and updateProgress() already
       leaves it out of the four counts.
       Note this is the inverse of the cats/tags idiom below — an empty
       ui.show means "none of the four", not "no filter". Switching all four
       off leaves the lodging and the empty state, which is the honest answer
       to what was asked. */
    if(p.kind !== "lodging" && !ui.show.has(p.choice || "none")) return false;
    if(ui.unv && !(p.verify && p.verify.state && p.verify.state !== "verified")) return false;
    if(ui.cats.size && !ui.cats.has(p.category)) return false;
    if(ui.tags.size && !(p.tags||[]).some(t => ui.tags.has(t))) return false;
    if(q){
      const hay = [p.name,p.name_local,p.name_en,p.pitch,p.detail,p.area,(p.tags||[]).join(" ")]
        .filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

const TIER_ORDER = { S:0, A:1, B:2, C:3 };

function render(){
  const vis = visible();
  const visIds = new Set(vis.map(p => p.id));
  const kidsOf = {};
  const tops = [];

  for(const p of vis){
    if(p.scale === "spot" && p.parent_id && visIds.has(p.parent_id)){
      (kidsOf[p.parent_id] = kidsOf[p.parent_id] || []).push(p);
    }else{
      tops.push(p);
    }
  }

  /* Group by a raw key and only format the heading at render time. Keying by
     the formatted label and then reading its first character to look up
     TIER_ORDER worked by luck in Chinese ("S 级" → "S") and silently failed in
     English, where tierGroup is "Tier {t}" and every label starts with "T":
     TIER_ORDER["T"] is undefined, all four groups sorted equal, and the order
     fell back to whatever order the data happened to be in. */
  const groups = new Map();
  for(const p of tops){
    const key = ui.group === "area" ? (p.area || "\u0000other") : (p.tier || "\u0000stub");
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }
  const label = k => ui.group === "area"
    ? (k === "\u0000other" ? T.otherArea : k)
    : (k === "\u0000stub" ? T.stubGroup : tf("tierGroup", { t: k }));

  const keys = [...groups.keys()].sort((a,b) => {
    // Tiers must sort S→A→B→C, not alphabetically (that would put S last)
    if(ui.group === "tier") return (TIER_ORDER[a] ?? 9) - (TIER_ORDER[b] ?? 9);
    return groups.get(b).length - groups.get(a).length || label(a).localeCompare(label(b));
  });

  const box = $("#groups");
  if(!vis.length){
    box.innerHTML = `<div class="empty-state"><div class="big">${T.emptyBig}</div>
      <div>${T.emptySub}</div></div>`;
  }else{
    box.innerHTML = keys.map(k => {
      const list = groups.get(k).sort((a,b) =>
        (TIER_ORDER[a.tier]??9) - (TIER_ORDER[b.tier]??9) ||
        (b.photo_index||0) - (a.photo_index||0));
      const kidCount = list.reduce((n,p) => n + (kidsOf[p.id]||[]).length, 0);
      return `<section class="group">
        <div class="group-h">
          <h2>${esc(label(k))}</h2>
          <span class="meta">${tf("groupMeta", { n: list.length })}${kidCount ? tf("plusSpots", { k: kidCount }) : ""}</span>
        </div>
        <div class="cards">${list.map(p => cardHTML(p, kidsOf[p.id]||[])).join("")}</div>
      </section>`;
    }).join("");
  }
  updateProgress();
  // A choice changed in the list must recolor the map markers immediately —
  // that's the whole point of the views living in one page: no AI
  // regeneration step in between. Same for the deck's deal queue and piles.
  if(window.MAP) MAP.refresh();
  if(window.DECK) DECK.refresh();
}

function renderChips(){
  const counts = {};
  for(const p of PLACES) counts[p.category] = (counts[p.category]||0) + 1;
  const tagCount = {};
  for(const p of PLACES) for(const t of p.tags||[]) tagCount[t] = (tagCount[t]||0)+1;
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const nUnv = PLACES.filter(p => p.verify && p.verify.state && p.verify.state !== "verified").length;
  $("#chips").innerHTML =
    (nUnv ? `<button class="chip" data-unv="1" aria-pressed="false" title="${esc(T.unvChipTitle)}">${T.unvChip}<span class="c">${nUnv}</span></button>` : "")
    + CATS.filter(c => counts[c.id]).map(c =>
      `<button class="chip" data-cat="${esc(c.id)}" aria-pressed="false">${esc(c.label)}<span class="c">${counts[c.id]}</span></button>`).join("")
    + topTags.map(([t,n]) =>
      `<button class="chip" data-tag="${esc(t)}" aria-pressed="false">#${esc(t)}<span class="c">${n}</span></button>`).join("");
  layoutChips();
}

/* Fold the chip rows behind a disclosure where the screen cannot afford them.
   Only below 640px — the width at which the grid already drops to one column;
   above it the chips take one or two rows and cost nothing.
   The clamp height is measured off a real chip instead of typed, so it holds
   if the chip's font or padding ever changes.
   chipsOpen is deliberately not persisted: it is a per-visit affordance, and
   a filter row that stayed folded after the user had opened it once would be
   the more surprising behaviour. */
let chipsOpen = false;
function layoutChips(){
  const box = $("#chips"), btn = $("#chips-more");
  if(!box || !btn) return;
  const chips = [...box.querySelectorAll(".chip")];
  const narrow = matchMedia("(max-width:640px)").matches;
  /* An active filter is never allowed to be out of sight: folding one away
     would leave the list mysteriously short with no visible cause. */
  const filtering = ui.cats.size > 0 || ui.tags.size > 0 || ui.unv || ui.show.size < 4;
  box.classList.remove("clamped");
  box.style.maxHeight = "";
  if(!narrow || chips.length < 2){ btn.hidden = true; return; }
  const rowH = chips[0].offsetHeight;
  // Nothing to fold if they already fit on one row.
  const fits = box.scrollHeight <= rowH + 1;
  if(fits){ btn.hidden = true; return; }
  const open = chipsOpen || filtering;
  btn.hidden = false;
  btn.setAttribute("aria-expanded", String(open));
  if(!open){
    box.classList.add("clamped");
    box.style.maxHeight = rowH + "px";
    // How many are out of sight, counted rather than estimated: a chip whose
    // top sits below the first row is folded away.
    const top = chips[0].getBoundingClientRect().top;
    const hidden = chips.filter(c => c.getBoundingClientRect().top > top + 1).length;
    btn.textContent = tf("chipsMore", { n: hidden });
  }else{
    btn.textContent = T.chipsLess;
  }
}

/* This used to be a full-width progress bar + legend in the header. It only
   matters while making choices, yet sat permanently atop every view eating a
   row. Now the same numbers hang on the filter buttons themselves — each
   count lives on the control that filters that bucket, no legend to
   cross-reference. */
/* Order is the list's own, not the map's (which puts "unrated" third, ahead of
   "no"): these four pills have read yes/maybe/no/none since they were a
   readout, and turning them into buttons is no reason to shuffle them. */
const CHOICES = ["yes","maybe","no","none"];

/* Built once, at boot, rather than on every count change. updateProgress()
   used to rewrite this innerHTML wholesale, which was free while these were
   spans and is not now: it would wipe the pressed state on every rating, and
   drop focus off the pill the user had just pressed — the exact failure
   setChoice() goes out of its way to avoid below. So the markup is laid down
   here and only the numbers inside it move afterwards. */
function renderTally(){
  const t = $("#tally");
  if(!t) return;
  /* The label gets its own element rather than riding as a bare text node.
     Deselected strikes both halves through, and a decoration set on the
     button would have to propagate into an *anonymous* flex item to reach a
     bare label — which is exactly the kind of thing engines disagree on.
     A real element takes the rule directly. */
  t.innerHTML = CHOICES.map(k =>
    `<button class="t-${k}" data-c="${k}" aria-pressed="${ui.show.has(k)}"><span class="lb">${T[k]}</span><b class="n">0</b></button>`
  ).join("");
}

function updateProgress(){
  const n = { yes:0, maybe:0, no:0, none:0 };
  // Lodging is excluded from the four buckets — it's not a candidate place,
  // and counting it just inflates "unrated" by one
  for(const p of PLACES){
    if(p.kind === "lodging") continue;
    n[p.choice || "none"]++;
  }
  for(const b of $$(".mfil")){
    const c = b.querySelector(".c");
    if(c) c.textContent = n[b.dataset.c] ?? 0;
  }
  // Same shape as the .mfil loop above: write the number, touch nothing else.
  // The words live in the markup renderTally() laid down — numbers must come
  // with them. The pill's fill alone puts all the meaning on color: a screen
  // reader would hear four bare numbers, color-blind users see four capsules.
  // These stay whole-collection counts, not counts of what the filters let
  // through — they are what you press to *change* the filter, so a count that
  // fell to zero the moment you switched a bucket off would be circular.
  for(const b of $$("#tally button")){
    const c = b.querySelector(".n");
    if(c) c.textContent = n[b.dataset.c] ?? 0;
  }
}

/* ─────────────────────────────────────────────── Choices & stashing */
/* Sync every trace of a place's rating on the page, in place.
   A place can appear twice: as its own card and as someone else's en-route
   photo stop. Both tri-state button groups must update, so we query all
   [data-id] matches instead of only the group that was clicked. */
function syncChoice(p){
  const sel = `[data-id="${CSS.escape(p.id)}"]`;
  for(const card of $$(`.card${sel}`)) card.dataset.choice = p.choice || "";
  for(const g of $$(`.pick${sel}`)){
    for(const b of g.querySelectorAll("button"))
      b.setAttribute("aria-pressed", String(p.choice === b.dataset.v));
  }
  for(const card of $$(`.card${sel}`)){
    const why = card.querySelector(".why");
    if(!why) continue;
    const show = p.choice === "no" && !!p.choice_reason;
    why.hidden = !show;
    const t = why.querySelector(".why-t");
    if(t) t.textContent = p.choice_reason || "";
  }
}

function setChoice(id, v, reason){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  p.choice = (p.choice === v) ? null : v;
  p.choice_reason = (p.choice === "no") ? (reason || p.choice_reason || "") : "";
  saveLocal();
  scheduleAuto();
  // With a choice filter on, a card just rated may no longer belong to any
  // group on screen and has to vanish — that's a structural change, full
  // repaint only. Everything else edits in place: a full innerHTML rebuild
  // removes the just-pressed button from the DOM and focus drops to <body>.
  // Measured: rating place #40, a keyboard user would re-Tab ~200 times from
  // the top of the document.
  if(ui.show.size < 4){ render(); return; }
  syncChoice(p);
  updateProgress();
  if(window.MAP) MAP.refresh();
  if(window.DECK) DECK.refresh();
}

function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(
      PLACES.filter(p => p.choice).map(p => [p.id, p.choice, p.choice_reason || ""])));
    // Half an hour of scheduling vanishing on refresh would be crushing.
    // Stored together with the two fingerprints — see loadItin.
    localStorage.setItem(LS_KEY + ":itin",
      JSON.stringify({ sig: FILE_SIG, savedSig: SAVED_SIG, itinerary: DATA.itinerary || [] }));
    // Stubs the user added via search. Under file:// there is no write-back,
    // so this is their only lifeline; under the local server the disk copy is
    // the truth, and restore dedupes by id (see loadAdded).
    localStorage.setItem(LS_KEY + ":added",
      JSON.stringify(PLACES.filter(p => p.origin === "user")));
  }catch(e){ /* localStorage unavailable in private mode; ignore */ }
}

/* Restore user-added stubs. Must run before loadItin: the schedule draft may
   reference u- prefixed points — points first, schedule second, or buildSched
   treats them as ghost entries. Ids already in the file are skipped — that's
   the saved/completed version, newer than the browser cache. */
function loadAdded(){
  try{
    const raw = localStorage.getItem(LS_KEY + ":added");
    if(!raw) return 0;
    let n = 0;
    for(const s of JSON.parse(raw)){
      if(!s || typeof s.id !== "string" || !s.id || BY_ID[s.id]) continue;
      if(!s.coord || typeof s.coord.lon !== "number" || typeof s.coord.lat !== "number") continue;
      s.origin = "user";
      PLACES.push(s);
      if(DATA.places !== PLACES) (DATA.places = DATA.places || []).push(s);
      BY_ID[s.id] = s;
      n++;
    }
    return n;
  }catch(e){ return 0; }
}

/* Draft vs file — which is newer? Only one case should discard the draft:
   **someone else changed the file's schedule**. The two fingerprints together
   cover exactly four situations:

     file untouched                    → sig matches, draft newer, restore      ✓
     user saved, AI rebuilt afterwards → savedSig matches (we wrote the file), restore ✓
     saved elsewhere / never put back  → sig still matches (file truly unchanged), restore ✓
     AI rewrote the itinerary          → neither matches, file newer, drop draft ✓

   Comparing "does the file have an itinerary" is not enough: the user
   finishes scheduling in the browser while the file still holds the AI's
   earlier version — one refresh would bury half an hour of work. */
function loadItin(){
  try{
    const raw = localStorage.getItem(LS_KEY + ":itin");
    if(!raw) return 0;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.itinerary)) return 0;
    if(d.sig !== FILE_SIG && d.savedSig !== FILE_SIG) return 0;
    SAVED_SIG = d.savedSig ?? null;
    // DATA.itinerary and ITIN must remain **the same array**. Writing
    // DATA.itinerary = d.itinerary forks them: within-day edits still sync
    // via the shared day objects, but operations on the array itself ("add a
    // day") land in only one of the two, and the day count written on save
    // won't match what's on screen.
    DATA.itinerary = ITIN;
    ITIN.length = 0;
    d.itinerary.forEach(x => ITIN.push(x));
    buildSched();
    return ITIN.reduce((n, day) => n + (day.places || []).length, 0);
  }catch(e){ return 0; }
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return 0;
    const map = new Map(JSON.parse(raw).map(([id,c,r]) => [id,[c,r]]));
    let n = 0;
    for(const p of PLACES){
      const hit = map.get(p.id);
      // If the file already has a choice, the file wins: what the AI just
      // wrote back is newer than the browser cache
      if(hit && !p.choice){ p.choice = hit[0]; p.choice_reason = hit[1]; n++; }
    }
    return n;
  }catch(e){ return 0; }
}

/* ─────────────────────────────────────────────── Detail dialog */
/* The dialog opens centred in the viewport, so the offset from the viewport's
   centre to the source card's centre is the direction it should grow out of.
   Written as custom properties the CSS above reads in its @starting-style, so
   it has to land *before* showModal() — that is the frame the before-change
   style is sampled on.

   Damped to .38 and clamped to ±64px rather than used raw. A card in the
   corner is most of a viewport diagonal away, and travelling that in 240ms is
   a swoop, not a hint; all this needs to convey is which way the dialog came
   from. Clearing the properties (no source element) falls back to the 0px
   default and a plain centred zoom. */
function dlgFrom(el){
  const d = $("#dlg");
  if(!el){ d.style.removeProperty("--from-x"); d.style.removeProperty("--from-y"); return; }
  const r = el.getBoundingClientRect();
  const cap = v => Math.max(-64, Math.min(64, v * .38));
  d.style.setProperty("--from-x", cap(r.left + r.width  / 2 - innerWidth  / 2) + "px");
  d.style.setProperty("--from-y", cap(r.top  + r.height / 2 - innerHeight / 2) + "px");
}

function openDetail(id, from){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  const im = (p.images||[])[0];
  const fl = flags(p);
  const kv = [
    [T.kvHours, p.hours],
    [T.kvLastEntry, p.last_entry],
    [T.kvClosed, p.closed],
    [T.kvTicket, p.ticket],
    [T.kvBooking, { required:T.bkRequiredLong, recommended:T.bkRecommendedLong, none:T.bkNone }[p.booking]],
    [T.kvDuration, p.duration_min ? tf("aboutMin", { n: p.duration_min }) : ""],
    [T.kvArea, p.area],
    // Category and "good at night" used to ride along in the card's fact row.
    // The card now shows three facts, so they land here instead of nowhere.
    [T.kvCategory, CATMAP[p.category] || p.category],
    [T.kvNight, p.night ? T.kvNightYes : ""],
    [T.kvPhoto, p.photo_index ? `${p.photo_index}/5` : ""],
  ].filter(([,v]) => v);

  $("#dlg-inner").innerHTML = `
    <div class="dlg-h">
      <h3 tabindex="-1" autofocus>${esc(p.name)}${p.name_local && p.name_local!==p.name ? ` <span class="loc"${langAttr}>${esc(p.name_local)}</span>` : ""}</h3>
      <button class="x" data-close aria-label="${esc(T.close)}">${xmark()}</button>
    </div>
    <div class="dlg-b">
      ${im && im.url ? `<img class="dlg-img" src="${esc(im.url)}" alt="${esc(p.name)}" onerror="this.remove()">
        ${im.credit ? `<div class="credit">${esc(im.credit)}</div>` : ""}` : ""}
      ${fl.length ? `<div class="flags" style="margin-bottom:14px">${fl.map(f=>`<span class="flag ${f.cls}">${esc(f.txt)}</span>`).join("")}</div>` : ""}
      ${verifyBox(p)}
      ${isStubP(p) ? `<p>${T.stubDetail}</p>` : ""}
      ${p.pitch ? `<div class="lede">${richP(p.pitch)}</div>` : ""}
      ${p.detail ? richP(p.detail) : ""}
      ${p.photo_note ? `<h4>${T.photoAdvice}</h4>${richP(p.photo_note)}` : ""}
      <h4>${T.practicalInfo}</h4>
      <dl class="kv">${kv.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${p.booking_url ? `<h4>${T.kvBooking}</h4><ul class="srcs"><li><a href="${esc(p.booking_url)}" target="_blank" rel="noopener">${esc(p.booking_url)}</a></li></ul>` : ""}
      <h4>${T.sources}</h4>
      <ul class="srcs">${(p.sources||[]).map(s =>
        `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></li>`).join("") || "<li>—</li>"}</ul>
      <div class="dlg-f">${schedBtn(p)}${pickHTML(p)}</div>
    </div>`;
  dlgFrom(from);
  const dlg = $("#dlg");
  dlg.showModal();
  // The dialog element itself is the scroll container (sticky header/footer
  // position against it), and it survives across opens — without this, card
  // B opens at wherever card A was scrolled to. After showModal(), not
  // before: writes to a display:none element's scrollTop don't stick.
  dlg.scrollTop = 0;
}

/* Since clicking a map marker now opens this dialog, the map side lost its
   scheduling entry point. It's restored here: see what the place is and
   decide on the spot whether to schedule it, without hunting through the
   list again. */
function schedBtn(p){
  const n = MAP.curDay();
  if(n == null || isLodging(p)) return "";
  const inDay = schedOf(p.id).some(s => s.n === n);
  return `<button class="btn sched" data-sched="${esc(p.id)}">${
    inDay ? tf("schedRemove", { n }) : tf("schedAdd", { n })}</button>`;
}

/* ─────────────────────────────────────────────── Reasons for skipping */
const QUICK = Array.isArray(T.quick) ? T.quick : I18N.en.quick;
function askReason(id){
  const p = PLACES.find(x => x.id === id);
  if(!p) return;
  let picked = "";
  $("#rdlg-inner").innerHTML = `
    <div class="dlg-h"><h3 tabindex="-1" autofocus>${tf("whyNotTitle", { name: esc(p.name) })}</h3>
      <button class="x" data-rclose aria-label="${esc(T.reasonCancel)}" title="${esc(T.reasonCancel)}">${xmark()}</button></div>
    <div class="dlg-b">
      <p style="font-size:13px">${T.reasonHint}</p>
      <div class="reasons">${QUICK.map(r => `<button data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
      <textarea id="rtext" placeholder="${esc(T.reasonPh)}"></textarea>
      <div class="dlg-f">
        <button class="btn" data-rskip>${T.skip}</button>
        <button class="btn primary" data-rok>${T.ok}</button>
      </div>
    </div>`;
  const dlg = $("#rdlg");
  dlg.showModal();
  dlg.scrollTop = 0;   // same carryover as openDetail: the dialog is the scroll container
  $("#rdlg-inner").onclick = e => {
    const b = e.target.closest("button");
    if(!b) return;
    if(b.dataset.r !== undefined){
      picked = b.dataset.r;
      $$("#rdlg-inner .reasons button").forEach(x => x.setAttribute("aria-pressed", x === b));
      $("#rtext").value = picked;
    }
    /* Three exits, three outcomes — and the labels have to carry the
       difference, because nothing else can. Note that the caller opens this
       dialog *before* recording anything (see the pick handler: the "no"
       branch calls askReason instead of setChoice), so the rating genuinely
       does not exist until one of the first two lines runs.
         记下理由 → rated "no", with the reason
         不写理由 → rated "no", no reason
         ✕ / Esc  → nothing recorded at all
       The old labels were 跳过 / 确定, under which the button that read like
       "back out of this" was the one that committed the rating, and the ✕ —
       the one that looks like the dismissal — silently threw away the click
       the user had just made on 不想去. ✕ stays a cancel rather than becoming
       a third commit path because Escape closes a native <dialog> on its own
       and cannot be made to commit; the two have to agree. */
    if(b.hasAttribute("data-rok"))   { setChoice(id,"no",$("#rtext").value.trim()); dlg.close(); }
    if(b.hasAttribute("data-rskip")) { setChoice(id,"no",""); dlg.close(); }
    if(b.hasAttribute("data-rclose")) dlg.close();
  };
}

/* ─────────────────────────────────────────────── Export */

/* Blob → anchor → click, the only way a page with no server behind it can put
   a file on disk. Three callers wanted it (places.json, places.csv, guide.md),
   so it lives here rather than three times over. The revoke is deferred, not
   immediate: Safari reads the URL after the click returns, and revoking in the
   same tick produced an empty file. */
function saveFile(text, name, mime){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type:mime }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function payload(){
  const out = JSON.parse(JSON.stringify(DATA));
  const cm = new Map(PLACES.map(p => [p.id, p]));
  for(const p of out.places){
    const cur = cm.get(p.id);
    p.choice = cur ? cur.choice ?? null : null;
    p.choice_reason = cur ? cur.choice_reason || "" : "";
  }
  // Trailing newline to match what the local save server writes — the manual
  // download and File System Access routes overwrite the same git-tracked
  // places.json, and a file that gains or loses its final newline depending on
  // which save route you happened to use is a diff nobody asked for.
  return JSON.stringify(out, null, 2) + "\n";
}

/* The short code is the last-resort path (when all three file-writing routes
   are dead on Firefox/Safari). The schedule must be encoded in too — sending
   only choices makes the user's day arrangement silently vanish, and neither
   the person pasting it back nor the AI reading it would notice anything
   missing. */
/* What goes back to the local server is only the three fields the page owns,
   not the whole document.

   First, the in-memory DATA is a snapshot from build time; writing it back
   whole would wipe the coordinates and images the AI filled in since (the
   server merges too — this is the second line of defense). Second,
   sendBeacon caps at 64KB, and the full 122KB **returns false instead of
   throwing** — measured; the changes made at tab-close simply vanished.
   Compressed to ~2KB it goes through. Third, auto-save fires every few
   seconds; no reason to haul 122KB each time.

   choice=null entries ride along too: clearing a rating is also a change,
   and dropping them would make it impossible to undo. */
function patch(){
  return JSON.stringify({
    patch: 1,
    choices: PLACES.map(p => [p.id, p.choice || null, p.choice_reason || ""]),
    itinerary: DATA.itinerary || [],
    // Always send the full set, not just "the new ones" — the server dedupes
    // by id, naturally idempotent, so the page needn't track "which ones are
    // already on disk" (get that state wrong once and a point is lost).
    // A few stubs are a few hundred bytes, far from sendBeacon's 64KB cap.
    added_places: PLACES.filter(p => p.origin === "user"),
  });
}

function shortCode(){
  const g = v => PLACES.filter(p => p.choice === v);
  const L = [`#to-where-for-what v1 · ${TRIP.destination || ""} · ${isoLocal(new Date())}`];
  const yes = g("yes"), maybe = g("maybe"), no = g("no");
  if(yes.length)   L.push("+ " + yes.map(p => p.id).join(" "));
  if(maybe.length) L.push("? " + maybe.map(p => p.id).join(" "));
  if(no.length)    L.push("- " + no.map(p => p.id + (p.choice_reason ? `(${p.choice_reason})` : "")).join(" "));
  const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
  let items = 0;
  for(const d of days){
    items += d.places.length;
    L.push(`D${d.n} ${d.date || "-"} ` + d.places
      .map(e => e.id + (e.note ? `(${e.note})` : "")).join(" "));
  }
  L.push(tf("scSummary", { y: yes.length, m: maybe.length, n: no.length,
                           u: PLACES.length - yes.length - maybe.length - no.length })
    + (days.length ? tf("scDays", { d: days.length, i: items }) : T.scNoDays));
  return L.join("\n");
}

/* ── Markdown ──────────────────────────────────────────────────
   The guide, as a document rather than a page: the body exactly as the author
   wrote it, then the schedule and the checklist rebuilt from live state.

   It is not a transcript of the guide view. On screen the costs and the
   checklist are two-column bento boxes; read top to bottom that shape means
   nothing, so ticket prices ride along with the stop they belong to and only
   the total survives as a line of its own — one section fewer than the page,
   and one repetition fewer.

   The grouping deliberately matches renderChecklist(): with a schedule the
   "yes but nowhere" pile comes first and the rest is maybe/unrated/no; without
   one, all four ratings stand on their own. Two different answers to "what did
   I drop" would be worse than either. */
function toMarkdown(){
  // Free text (names, notes, skip reasons) goes inside ** ** and could carry
  // markdown punctuation of its own; a stray * would eat the rest of the line.
  const q = s => String(s ?? "").replace(/([\\`*_[\]])/g, "\\$1");
  const L = [];

  if(ROUTE_MD.trim()){
    // route.md opens with its own `#` title, so nothing is prepended here.
    L.push(ROUTE_MD.trim(), "", "---", "");
  }

  const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
  const scheduled = new Set(days.flatMap(d => d.places.map(e => e.id)));

  if(days.length){
    L.push(`## ${T.mdItinerary}`, "");
    // Deduplicated the same way renderCost does: one place on two days is
    // still one ticket. The two totals have to agree — a guide whose Markdown
    // and whose cost panel quote different numbers is worse than neither.
    const counted = new Set();
    let sum = 0, parsed = 0, n = 0, cur = "";

    for(const d of days){
      const wd = d.date ? WD_NAMES[((new Date(d.date + "T00:00:00").getDay() + 6) % 7) + 1] : "";
      // Date and weekday separated by a space, not wrapped in brackets: the
      // bracket that reads right depends on the language, the space doesn't.
      // Same shape the weather cards use.
      L.push(`### ${tf("dayN", { n: d.n })}` + (d.date ? ` · ${d.date}${wd ? " " + wd : ""}` : ""), "");

      let seq = 0;
      for(const e of d.places){
        const p = BY_ID[e.id];
        if(!p) continue;
        const lod = isLodging(p);
        const head = lod ? T.lodging : String(++seq);
        L.push(`- **${q(head)} · ${q(p.name)}**`
          + [p.area, !lod && p.duration_min ? tf("aboutMin", { n: p.duration_min }) : ""]
              .filter(Boolean).map(x => ` · ${q(x)}`).join(""));

        /* One fact per line, not one line per stop. These are the same fields
           the detail dialog lays out as a definition list, and they run long —
           a single opening-hours string here is 90 characters and a ticket
           string with per-age prices is longer. Strung together they were a
           200-character line that nothing wraps usefully; as separate bullets
           the reader can find the one they came for. */
        const facts = [
          [T.kvHours,  p.hours],
          [T.kvClosed, p.closed],
          [T.kvTicket, p.ticket],
          [T.mdNote,   e.note],
        ].filter(([, v]) => v);
        for(const [k, v] of facts) L.push(`  - ${tf("mdKv", { k, v: q(v) })}`);
        // Booking stands on its own line without a label: the sentences name
        // themselves ("Booking required to enter"), and "Booking: Booking
        // required to enter" says it twice.
        const bk = { required:T.bkRequiredLong, recommended:T.bkRecommendedLong }[p.booking];
        if(bk) L.push(`  - ${q(bk)}`);

        if(!lod && !counted.has(p.id)){
          counted.add(p.id);
          n++;
          if(/[¥￥]|日元|円/.test(p.ticket || "")) cur = "¥";
          const v = GUIDE.parseMoney(p.ticket);
          if(v != null){ sum += v; parsed++; }
        }
      }
      L.push("");
    }
    // Same caveat the cost panel carries. A bare total invites being read as
    // "what the trip costs", which it never was.
    L.push(tf("mdTotal", { n, p: parsed, cur, sum: sum.toLocaleString() })
      + " " + T.costOnly, "");
  }

  L.push(`## ${T.checklistTitle}`, "");
  const row = p => `- **${q(p.name)}**` + (p.area ? ` · ${q(p.area)}` : "")
    + (p.choice_reason ? ` — ${q(p.choice_reason)}` : "");

  const missed = days.length
    ? PLACES.filter(p => p.choice === "yes" && !isLodging(p) && !scheduled.has(p.id))
    : [];
  if(missed.length) L.push(`### ${T.missedTitle}`, "", ...missed.map(row), "");

  const rest = PLACES.filter(p => !isLodging(p) && !scheduled.has(p.id) && !missed.includes(p));
  const by = {};
  rest.forEach(p => (by[p.choice || "none"] = by[p.choice || "none"] || []).push(p));
  const MARK = { yes:T.markYes, maybe:T.markMaybe, no:T.markNo, none:T.markNone };
  for(const k of (days.length ? ["maybe", "none", "no"] : ["yes", "maybe", "none", "no"])){
    const list = by[k];
    if(!list || !list.length) continue;
    L.push(`### ${days.length ? T.unscheduled + " · " : ""}${MARK[k]}`, "", ...list.map(row), "");
  }

  const now = new Date();
  const at = `${isoLocal(now)} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  /* Source and time, nothing else. The rail's advice about passing the page
     itself around does not belong here: read from inside the file, "use the
     Markdown instead" is advice to someone already holding it. */
  L.push("---", "",
    tf("mdFooter", { title: tf("docTitle", { dest: TRIP.destination || T.trip }), at }), "");

  return L.join("\n");
}

/* ── Auto-save ─────────────────────────────────────────────────
   The page is an editor, not a form: changes should land on disk without the
   user remembering a button. Enabled only under the local server — file://'s
   file picker requires a user gesture, and without a handle there is no
   programmatic write, so there the button remains the only path.

   Two rhythms, deliberately split: places.json debounces 3s (the truth the
   AI reads — fresher is better, 125KB), while trip.html is rebuilt by the
   server after 12s of idle (it only serves double-click/sharing; late is
   fine). */
const SERVED = location.protocol === "http:" || location.protocol === "https:";
const SAVE_LABEL = SERVED ? T.saveNow : T.saveBtn;
let autoTimer = null, autoBusy = false, autoDirty = false;

function scheduleAuto(){
  if(!SERVED || STANDALONE) return;
  autoDirty = true;
  // Nothing is actually in flight during the 3s debounce, so no "unsaved
  // changes" message — that phrasing both contradicts the neighboring
  // "auto-saves" promise and manufactures anxiety over a fleeting
  // intermediate state. Keep the last "Saved · HH:MM"; a real failure will
  // overwrite it with err.
  clearTimeout(autoTimer);
  autoTimer = setTimeout(runAuto, 3000);
}

async function runAuto(){
  if(!autoDirty || autoBusy) return;
  autoBusy = true;
  setSaveState("saving");
  try{
    const r = await saveViaServer(false);
    if(r){ autoDirty = false; markSaved(); setSaveState("ok"); }
    else  { setSaveState("err"); revealSaveBtn(); }
  }finally{ autoBusy = false; }
}

/* Changes still inside the 3s debounce when the tab closes: a fetch would be
   killed along with the page. sendBeacon is the only request that reliably
   goes out during unload. */
function flushOnExit(){
  if(!SERVED || STANDALONE || !autoDirty) return;
  try{
    // false means it didn't go out (over limit / blocked) — never clear
    // dirty in that case
    if(navigator.sendBeacon("/__save__?now=1",
        new Blob([patch()], { type:"application/json" }))) autoDirty = false;
  }catch(e){ /* nothing more we can do; localStorage still holds a copy */ }
}
addEventListener("pagehide", flushOnExit);
// pagehide doesn't always fire on iOS Safari; flush again on backgrounding
addEventListener("visibilitychange", () => { if(document.hidden) flushOnExit(); });

/* Under the local server none of these three buttons is needed — changes
   write back automatically; only file:// needs them. "Save now" folds into
   "Manual save…" too: left outside, it permanently prompts the user to do
   something the system already does for them, which only breeds doubt about
   whether saving happened. It's the same #save node, not a copy — so label
   and disabled state can't drift apart in two places. */
function layoutActionbar(){
  const box = $("#more-box"), save = $("#save"), more = $("#more");
  if(SERVED){
    save.classList.remove("primary");
    box.prepend(save);
  }
  more.onclick = () => setMoreOpen(box.hidden);
}

function setMoreOpen(open){
  const box = $("#more-box"), more = $("#more");
  if(!box || !more) return;
  box.hidden = !open;
  more.setAttribute("aria-expanded", String(open));
}

/* On auto-save failure, surface the button itself. A hint teaching the user
   to "click Manual save… → Save now" describes a path — the right move is to
   put the thing to click in front of them. */
function revealSaveBtn(){
  if(!SERVED) return;
  setMoreOpen(true);
  const save = $("#save");
  if(save) save.classList.add("primary");
}

/* Auto-save failure must be visible — server stopped, port taken — or the
   user believes saving is happening while the changes sit only in
   localStorage. */
function setSaveState(kind){
  const el = $("#hint");
  if(!el) return;
  if(!SERVED){
    el.className = "hint";
    el.textContent = tf("fileHint", { btn: SAVE_LABEL })
      + (BUILT_AT ? tf("builtAt", { t: BUILT_AT }) : "");
    return;
  }
  const t = new Date().toTimeString().slice(0, 5);
  el.className = "hint" + (kind === "err" ? " bad" : "");
  el.textContent =
    kind === "saving" ? T.saving :
    kind === "err"    ? tf("saveErr", { btn: SAVE_LABEL }) :
    kind === "ok"     ? tf("savedAt", { t }) :
                        T.autoSaveInfo;
}

/* Saving has three routes, ordered by reliability, each failure falling
   through to the next — the user must never click save and get stuck on an
   error message with an afternoon of filtering they can't take with them.

   Measured (Claude's embedded browser):
     · showSaveFilePicker exists, but createWritable throws NotAllowedError
     · navigator.clipboard.writeText throws NotAllowedError
   In other words "the function exists" proves nothing about "it works" — you
   have to actually try it. */
async function saveViaServer(now){
  if(!SERVED) return null;
  try{
    const r = await fetch("/__save__" + (now ? "?now=1" : ""), {
      method:"POST", headers:{ "Content-Type":"application/json" }, body:patch(),
    });
    const j = await r.json().catch(() => ({}));
    return j && j.ok ? j : null;
  }catch(e){ return null; }
}

async function saveViaPicker(){
  if(typeof window.showSaveFilePicker !== "function") return null;
  try{
    if(!fileHandle){
      fileHandle = await window.showSaveFilePicker({
        suggestedName:"places.json",
        types:[{ description:T.pickerDesc, accept:{ "application/json":[".json"] } }],
      });
    }
    if(fileHandle.queryPermission){
      let st = await fileHandle.queryPermission({ mode:"readwrite" });
      if(st === "prompt" && fileHandle.requestPermission)
        st = await fileHandle.requestPermission({ mode:"readwrite" });
      if(st !== "granted") return null;
    }
    const w = await fileHandle.createWritable();
    await w.write(payload());
    await w.close();
    return { name: fileHandle.name };
  }catch(e){
    if(e.name === "AbortError") return "abort";   // user canceled; don't fall through
    fileHandle = null;
    return null;
  }
}

/* After writing to the file, record this schedule's fingerprint — otherwise
   the next AI rebuild makes loadItin think the file changed and drop the
   draft, when the "draft" it drops is the very copy the user just saved. */
function markSaved(){
  SAVED_SIG = itinSig(DATA.itinerary);
  saveLocal();
  // The button emphasized during the error loses its emphasis once a save
  // succeeds (the fold-out isn't auto-collapsed for the user — too abrupt)
  if(SERVED) $("#save").classList.remove("primary");
}

function savedMsg(where){
  const done = PLACES.filter(p => p.choice).length;
  const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
  const items = days.reduce((a, d) => a + d.places.length, 0);
  return tf("savedTo", { where, n: done })
    + (days.length ? tf("savedDays", { d: days.length, i: items }) : T.savedNoDays)
    + T.savedTail;
}

async function doSave(){
  const btn = $("#save");
  clearTimeout(autoTimer);            // no auto-save should follow a manual one
  btn.disabled = true; btn.textContent = T.saving;
  try{
    const srv = await saveViaServer(true);
    if(srv){
      autoDirty = false;
      markSaved();
      setSaveState("ok");
      // The page itself is a build artifact: without a rebuild, the trip.html
      // people double-click or share still shows the previous build, out of
      // step with the just-written places.json.
      toast(savedMsg("places.json") + (srv.rebuilt ? T.rebuiltToo : ""));
      return;
    }
    const pick = await saveViaPicker();
    if(pick === "abort") return;
    if(pick){
      markSaved();
      toast(savedMsg(pick.name));
      return;
    }
    // Both direct-write routes dead — download instead, and say why
    if(SERVED) setSaveState("err");
    download(true);
  }finally{
    btn.disabled = false; btn.textContent = SAVE_LABEL;
  }
}

function download(isFallback){
  saveFile(payload(), "places.json", "application/json");
  toast(isFallback ? T.dlFallback : T.dlDone);
  if(isFallback) setTimeout(showCode, 900);   // downloads can be blocked too; offer one more fallback
}

function showCode(){
  const code = shortCode();
  $("#dlg-inner").innerHTML = `
    <div class="dlg-h"><h3 tabindex="-1" autofocus>${T.codeTitle}</h3><button class="x" data-close aria-label="${esc(T.close)}">${xmark()}</button></div>
    <div class="dlg-b">
      <p style="font-size:13px">${T.codeHint}</p>
