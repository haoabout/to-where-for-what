  width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  color:var(--ink);padding:9px 11px;font:14px var(--sans);resize:vertical;min-height:66px;
}
.dlg-f{
  display:flex;gap:9px;justify-content:flex-end;align-items:center;flex-wrap:wrap;
  margin-top:15px;padding-bottom:22px;
}
/* The detail dialog's footer only — the reason and export dialogs put two
   ordinary buttons in a .dlg-f and want the plain right-aligned row above.
   :has(.pick) picks out the one footer that carries the tri-state. */
/* Stacked is the base case and the single row is the enhancement, so a browser
   that never applies the container query below still gets the safe layout.

   The single row is what breaks first: its three tracks reserve the schedule
   button's width on *both* sides to keep the pill centred, so one row needs the
   pill plus twice the button — measured 213 + 107×2 = 427px of footer for the
   zh label, against 299px available at 375px. Below that the button was handed
   44px and wrapped to one character per line, 126px tall. */
.dlg-f:has(.pick){
  /* Pinned to the dialog's floor the way .dlg-h is pinned to its ceiling, so
     the rating stays reachable however far down the practical info you have
     scrolled.

     Unfilled at every width: a painted bar here would read as a second piece of
     chrome competing with the header, and the controls already draw themselves
     — the tri-state by its filled track, the schedule button by its outline.
     Body text passing behind them is intended. */
  position:sticky;bottom:0;z-index:2;padding-top:13px;
  display:grid;grid-template-columns:1fr;justify-items:center;gap:9px;align-items:center;
}
.dlg-f .pick{margin:0}
/* Matched to the tri-state: same pill, same type size. min-height is for the
   stacked case only — in the single row the height comes from the stretched
   track instead, which is why it is cleared there. */
.btn.sched{
  justify-self:center;min-height:38px;display:inline-flex;align-items:center;
  border-radius:999px;padding:0 15px;font-size:12.5px;font-weight:400;
}
/* Wide enough for one row. A container query rather than a media query because
   the threshold is set by the button's label, and that is translated — a
   viewport breakpoint tuned to zh would be wrong for a longer language. */
@container dlg (min-width:520px){
  .dlg-f:has(.pick){
    /* Three tracks so the pill is centred on the dialog, not on whatever is
       left after the schedule button — the pill's position must not move when
       that button appears, disappears (no day selected) or changes label
       between "add to day 1" and "remove from day 1". */
    grid-template-columns:1fr auto 1fr;gap:0;
    /* Row items stretch, which is how the schedule button gets the tri-state's
       height without anyone adding up the pill's track inset and button padding
       — a sum that would silently go stale the next time one of them moves. */
    align-items:stretch;
  }
  .dlg-f .pick{grid-column:2}
  .btn.sched{grid-column:1;justify-self:start;min-height:0}
}
pre.code{
  background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
  padding:12px;font:12.5px/1.7 var(--mono);white-space:pre-wrap;word-break:break-all;margin:0 0 12px;
}

/* ═══════════════════════════════════════════════ Map view */
/* The map view breaks out of the body's 1180px cap. That cap exists for line
   length — the list and guide are text read line by line, and wider is worse;
   a map isn't text, and wider is strictly better. It matters even more since
   scheduling added a column: uncapped, the map keeps 794px instead of 668px.
   Widened with a negative margin-left, not transform — transform would change
   the containing block for absolutely positioned descendants.
   The one margin-left left physical while the rest of the sheet moved to
   logical properties: this is a symmetric centring offset, not an inline-flow
   inset, so it computes the same either way and reads clearer paired with the
   physical `width` it exists to re-centre. */
#view-map{
  --vw:min(1640px, calc(100vw - 40px));
  width:var(--vw);margin-left:calc(50% - var(--vw) / 2);
}

/* Three columns: pool | schedule | map. Pool and schedule sit adjacent, so
   dragging from the pool into a day is a ~260px horizontal move; with the map
   between them the same drag becomes ~1160px, the mouse crossing the whole
   map — nearly unusable on touch. */
/* Column widths were originally 232/212, budgeted for 2–4-character Chinese
   words. English and AI-translated languages (German, Russian…) run 2–3×
   longer, so both widened to 248; with the nowrap/wrap rules below, even
   longer languages don't get clipped. */
.map-wrap{display:grid;grid-template-columns:248px 248px 1fr;gap:14px;
  height:var(--map-h,calc(100dvh - 260px));min-height:460px}

.day-col{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  overflow-y:auto;overscroll-behavior:none;display:flex;flex-direction:column;
}
.day-col .dc-head{
  position:sticky;top:0;z-index:2;background:var(--paper-2);
  padding:7px 10px;border-bottom:1px solid var(--line-soft);
  font:600 11px/1 var(--sans);color:var(--ink-3);letter-spacing:.6px;
  display:flex;align-items:center;gap:6px;
}
/* "2 days" is an atomic phrase; flex squeeze once stacked it into two lines —
   nowrap protects it, and when space truly runs out the whole header wraps
   (flex-wrap on .dc-head). */
.day-col .dc-head{flex-wrap:wrap}
.day-col .dc-head .sp{margin-inline-start:auto;font-weight:400;letter-spacing:0;white-space:nowrap}
.lnk{
  background:none;border:0;color:var(--ink-3);font-size:11px;padding:2px 6px;border-radius:4px;letter-spacing:0;
  min-height:24px;min-width:24px;display:inline-flex;align-items:center;justify-content:center;
}
.lnk:hover{background:var(--accent-soft);color:var(--ink)}

/* Date capsules: for long trips — flat listing starts scrolling endlessly by
   day three */
.caps{display:flex;flex-wrap:wrap;gap:4px;padding:8px 9px;border-bottom:1px solid var(--line-soft)}
.caps button{
  border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);
  padding:3px 8px;border-radius:6px;font:600 11.5px/1.5 var(--sans);
  font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:4px;min-height:24px;
}
/* The count needs its own background, or "D1" followed by "7" reads as
   "day 17" */
.caps button .c{
  font-weight:600;font-size:9.5px;line-height:13px;min-width:13px;text-align:center;
  padding:0 3px;border-radius:7px;background:var(--fill);color:var(--ink-3);
}
.caps button[aria-pressed=true]{color:var(--on-day)}
.caps button[aria-pressed=true] .c{background:color-mix(in srgb,var(--on-day) 26%,transparent);color:var(--on-day)}
/* State-shaped mode switch (One day | All days), replacing the old action
   button whose label named the mode you'd land in — readable only after a
   mental flip. A segmented control shows where you are; nothing to decode. */
.dc-head .dmode{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.dc-head .dmode button{border:0;background:none;padding:2px 8px;font:600 10.5px/1.6 var(--sans);color:var(--ink-3);cursor:pointer}
.dc-head .dmode button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* Each day: header + entries. Clicking the header makes it the current day */
.dbox{border-bottom:1px solid var(--line-soft)}
.dbox:last-child{border-bottom:0}
.dhead{
  display:flex;align-items:center;gap:7px;padding:8px 10px;
  background:var(--paper-2);transition:background .12s;
}
/* The whole header row is the "make this the current day" button; deleting
   the day is a separate action, so it's a sibling node, not nested (buttons
   can't nest buttons). */
.dh-btn{
  flex:1;min-width:0;display:flex;align-items:center;gap:7px;cursor:pointer;position:relative;
}
.dh-btn::after{content:"";position:absolute;inset:-8px 0}   /* absorb .dhead's vertical padding */
.dhead:hover{background:var(--accent-soft);color:var(--ink)}
.dbox.cur .dhead{background:color-mix(in srgb,var(--ink) 12%,var(--paper-2))}
.dhead .swatch{width:9px;height:9px;border-radius:50%;flex:none}
/* "Day 1" / "第 1 天" are atomic titles — no internal line break. The
   secondary info (date · count) shrinks to an ellipsis when too long — the
   full text lives in the button's aria-label. */
.dhead b{font:600 12.5px/1 var(--sans);color:var(--ink);white-space:nowrap}
.dhead .sub{margin-inline-start:auto;font-size:10.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dlist{padding:3px 0;min-height:34px}

/* Schedule entries are one line only: number + name. Four or five places
   already fill this column — no room for more */
.ditem{
  display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;
  font:500 12.5px/1.4 var(--sans);color:var(--ink-2);transition:background .12s;
}
.ditem:hover,.ditem.on{background:var(--paper-2)}
.ditem .n{
  flex:none;min-width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font:700 9.5px/1 var(--mono);color:var(--on-day);
}
/* The name uses .dnm, not .nm — a global .nm{font:900 16px/1.35 var(--serif)}
   already exists as view ①'s card title. A rule that directly matches an
   element always beats a font inherited from the parent — nothing to do with
   specificity — so on collision the 12.5px sans set on .ditem did nothing. */
.ditem .dnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit;flex:1;min-width:0;
  display:block;cursor:pointer;position:relative}
/* Grow the hit area vertically only — the ↑↓× buttons sit right against the
   name, and growing sideways would overlap them. The row already has 5px of
   dead vertical padding; reclaiming it moves nothing in the layout. */
.ditem .dnm::after{content:"";position:absolute;inset:-5px 0}
/* ↑↓× stay hidden normally (the narrow column can't afford three permanent
   buttons) and surface on hover. Touch has no hover, so there they're always
   visible. */
/* Hard conflict (scheduled on a closure day / place not operating): always
   visible, unlike the hover-revealed ops — an error mark that only shows on
   hover would be an error mark nobody sees. flex:none so it's the name that
   truncates, never the mark. */
.ditem .conf{flex:none;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;
  background:var(--danger);color:#fff;font:700 10px/1 var(--mono);cursor:help;position:relative}
/* Own tooltip instead of title="": the native one needs a ~1.5s motionless
   hover, which reads as "nothing there". Content comes from aria-label so
   sighted hover and screen reader speak the same words. A larger invisible
   hit area (::before) because 14px is a needle to park a cursor on.
   Centered over the icon. .day-col is an overflow-y:auto scroll container
   (overflow-x computes to auto too), so anything past the column's right
   edge would be clipped — but the ↑↓× ops after the icon reserve ~57px of
   layout even while opacity:0, which keeps half a tooltip's width of room. */
.ditem .conf::before{content:"";position:absolute;inset:-5px}
.ditem .conf::after{
  content:attr(aria-label);position:absolute;bottom:calc(100% + 5px);left:50%;
  transform:translateX(-50%);z-index:6;
  background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:5px;
  font:500 11px/1.5 var(--sans);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s;
}
.ditem .conf:hover::after{opacity:1}
.ditem .dops{display:flex;gap:1px;flex:none;opacity:0;transition:opacity .12s}
.ditem:hover .dops,.ditem:focus-within .dops{opacity:1}
@media (hover:none){ .ditem .dops{opacity:1} }
/* Visual size stays 17px — the schedule column can't fit bigger buttons, and
   this column's density is itself part of the design. A pseudo-element grows
   the hit area to 25px: affects fingers, not layout.
   WCAG 2.2 §2.5.8 wants 24×24. */
.dop{
  background:none;border:0;color:var(--ink-3);width:17px;height:17px;
  border-radius:4px;display:grid;place-items:center;padding:0;position:relative;
}
.dop::after{content:"";position:absolute;inset:-4px}
.dop{transition:background .12s,color .12s,scale .12s}
.dop:hover{background:var(--accent-soft);color:var(--ink)}
.dop:disabled{opacity:.25;cursor:default}
.dop:disabled:hover{background:none;color:var(--ink-3)}

/* Dragging from the pool into the schedule drags the full two-line card,
   which looks jarring inside the one-line-density schedule column. The moment
   it enters .dlist it renders as a schedule entry — pure CSS, no touching the
   drag logic, and the ghost and drop preview both come out right. */
.dlist .mi{
  display:flex;align-items:center;gap:7px;padding:5px 10px;
  border-bottom:0;background:none;
}
.dlist .mi .pin{margin-top:0}
.dlist .mi .t{display:flex;align-items:center;min-width:0;flex:1}
.dlist .mi .t b{
  font:500 12.5px/1.4 var(--sans);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dlist .mi .t .sub{display:none}   /* one schedule line can't fit the meta; details go via the dialog */

/* While dragging */
.ditem.drag-ghost{opacity:.35}
.ditem.drag-chosen{background:var(--fill)}
.mi.drag-ghost{opacity:.35}
.dlist.drag-over{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.ditem.lod .dnm{color:var(--ink-3)}
.dempty{padding:11px;font-size:11.5px;line-height:1.7;color:var(--ink-3);text-align:center}
.dempty b{color:var(--ink-2);font-weight:600}
.addmenu{
  padding:5px;border-bottom:1px solid var(--line-soft);background:var(--paper-2);
  display:flex;flex-direction:column;gap:3px;
}
.addmenu button{
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;font-size:11.5px;color:var(--ink-2);text-align:start;
  transition:background .12s,color .12s,border-color .12s,scale .12s;
}
.addmenu button:hover{border-color:var(--ink);background:var(--accent-soft);color:var(--ink)}
.dhead .d-del-day{opacity:0;margin-inline-start:4px}
/* :focus-within as well as :hover, and it is not optional here. opacity
   composites the focus ring along with the button, so a keyboard user could
   Tab onto this control and see nothing at all — not the button, not the
   outline the global :focus-visible draws. The .dops row two screens up
   already pairs the two selectors for exactly this reason; this rule was
   written from the same pattern and lost the focus half. */
.dhead:hover .d-del-day,.dhead:focus-within .d-del-day{opacity:1}
@media (hover:none){ .dhead .d-del-day{opacity:1} }
.map-side{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  display:flex;flex-direction:column;min-height:0;
}
.map-side>#map-list{overflow-y:auto;overscroll-behavior:none;flex:1;min-height:0}
/* The choice filter merges into the pool column's header: what it filters is
   exactly the list below it — putting it in the page toolbar would separate
   the control from the thing it acts on. */
.ms-head{
  padding:6px 7px;border-bottom:1px solid var(--line-soft);background:var(--paper-2);
  border-radius:var(--r) var(--r) 0 0;
  display:flex;flex-direction:column;gap:4px;
}
/* Deliberately not .seg here: .map-side is already a bordered rounded box and
   .ms-head is its title band — nesting another bordered rounded capsule makes
   three boxes deep. Worse, that capsule's background is --card, so the eye
   walks card → paper-2 → card, dark → light → dark, and it reads as a
   separate control floating on the band rather than part of it.
   Flat toggle instead: the container stays one layer (.ms-head) and the
   buttons carry their own affordance. */
.ms-fil{display:flex;flex-wrap:wrap;gap:2px}
/* flex-wrap: one row when all four words fit, folding to 2×2 for long-word
   languages. This used to lean on .seg's overflow:hidden, which silently
   clipped the overflow — measured in the English build, back when the label
   was "Undecided", the last button lost half its width. */
.ms-fil button{
  flex:1 1 auto;background:none;border:0;border-radius:6px;
  padding:5px 4px;font-size:11px;color:var(--ink-3);white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:3px;
  transition:background .12s,color .12s,box-shadow .12s,scale .12s;
}
/* Hover uses a translucent --card: the selected state is opaque --card, so
   the two share a family but differ in depth — hovering can't be misread as
   "already selected". */
.ms-fil button:hover:not([aria-pressed=true]){background:var(--accent-soft);color:var(--ink)}
/* Selected = a piece of card "lifted" off the paper-2 band. It used to be the
   inverse (paper-2 sunk into a card capsule), which only made sense while
   that capsule existed. The outline originally earned its place on the dark
   palette, where --card and --paper-2 sat four lightness steps apart and the
   background difference alone barely showed which filters were on; that
   palette is gone, but --card(#fffefc) over --paper-2(#f2eee7) is a quiet
   difference too, so it stays. Inset, not border — the outline must not
   change the button's box size, or unselected buttons shrink and all four
   widths jump on every toggle. */
.ms-fil button[aria-pressed=true]{
  background:var(--card);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px var(--sh-1),inset 0 0 0 1px var(--line);
}
/* Hover for the selected state needs its own rule: all four filters default
   to on, so hovering only the unselected state means the most common
   situation (all four lit) gives zero feedback — the very source of the
   "these filters have no hover" impression. Only the outline deepens; the
   background stays, so it can't read as deselecting. */
.ms-fil button[aria-pressed=true]:hover{
  box-shadow:0 1px 2px var(--sh-1),inset 0 0 0 1px var(--ink);
}
/* The count badge uses one color set for both states: --line is legible on
   the band (--paper-2) and on the selected state (--card) alike. The selected
   state used to hardcode rgba(255,255,255,.24) — tuned for dark fills — which
   on a light card meant white on white and the pill vanished entirely. */
.ms-fil .c{
  font:600 9.5px/13px var(--sans);font-variant-numeric:tabular-nums;
  min-width:13px;padding:0 3px;border-radius:7px;
  background:var(--fill);color:var(--ink-3);
}
/* Grouping is a low-frequency mode switch; its visual weight is deliberately
   kept below the filter row: no border, no background, current item marked by
   ink and weight alone. Making both rows outlined controls would leave the
   sidebar top-heavy. */
.ms-grp{display:flex;flex-wrap:wrap;align-items:center;gap:1px;padding:0 1px}
.ms-grp .lbl{
  flex:none;margin-inline-end:4px;letter-spacing:.5px;
  font:600 10px/1 var(--sans);color:var(--ink-3);
}
.ms-grp button{
  background:none;border:0;border-radius:5px;padding:3px 6px;
  font-size:11px;color:var(--ink-3);white-space:nowrap;
  transition:background .12s,color .12s,scale .12s;
}
.ms-grp button:hover:not([aria-pressed=true]){background:var(--accent-soft);color:var(--ink)}
.ms-grp button[aria-pressed=true]{color:var(--ink);font-weight:600}
/* These rules are deliberately NOT scoped as `.map-side .mi` — SortableJS
   moves .mi out of the pool column (into schedule lists, and on touch onto
   <body> as a floating layer). Scope by container and the rules die the
   moment the node leaves it: measured, the dot lost its 17px size, inflated
   to 25px tall under the default 15px font, and the meta line sprouted the
   browser's default strikethrough. A component's styles travel with the
   component, not with wherever it happens to be. */
.mi{
  display:flex;gap:9px;align-items:flex-start;padding:9px 12px;
  border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .12s;
}
.mi:hover{background:var(--accent-soft);color:var(--ink)}
.mi.on{background:var(--accent-soft)}
/* Same size as the schedule column's number circles: the two columns show
   the same places side by side, and mismatched sizes would read as two
   different systems. It's also a button — clicking the dot adds/removes the
   place from the *current day*, clicking the rest of the row opens details.
   Keeping the state control apart from the content area saves the space an
   extra + button would take, and fits the "the dot IS the state" intuition. */
.mi .pin{
  width:17px;height:17px;border-radius:50%;flex:none;margin-top:2px;
  display:grid;place-items:center;font:700 9.5px/1 var(--mono);color:var(--on-day);
  cursor:pointer;transition:transform .12s,scale .12s;position:relative;
}
/* As above: the dot must stay small (matching the schedule column's number
   circles), but it's the most-pressed control in this view, so the hit area
   grows to 27px. To the right it only eats half of .mi's 9px gap. */
.mi .pin::after{content:"";position:absolute;inset:-5px}
.mi .pin:hover{transform:scale(1.22)}
.mi .t{flex:1;min-width:0;display:block;cursor:pointer;position:relative}
.mi .t::after{content:"";position:absolute;inset:-9px -12px -9px 0}  /* fill out .mi's padding */
/* Strictly two lines: name, then meta. The full ticket text used to pour in
   here — one entry could take five or six lines, and in the three-column
   layout this column only has ~230px. */
/* Pool and schedule entries must share font and size — they show the same
   places side by side, and mismatched sizes read as two different things.
   Standardized on the smaller. */
.mi .t b{
  display:block;font:500 12.5px/1.4 var(--sans);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mi .t .sub{
  display:flex;align-items:center;gap:5px;margin-top:2px;
  font-size:11.5px;color:var(--ink-3);
  overflow:hidden;white-space:nowrap;
}
/* When space runs out, duration/price shrink (ellipsis); the warning chip is
   never clipped — everything used to be flex:none, overflow hard-clipped from
   the tail, and "booking req." happened to sit last: the text cut to "bookin"
   was exactly the information that mattered most. */
.mi .t .sub em{font-style:normal;flex:0 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
.mi .t .sub .w{
  flex:none;padding:0 5px;border-radius:4px;font-size:10.5px;line-height:15px;
  background:var(--warn-soft);color:var(--ink);
}
/* Status closures (permanently closed / not operating) in the same colors as
   .f-danger in the list view — one severity, one color, whichever column. */
.mi .t .sub .w.hard{background:var(--danger-soft);color:var(--danger)}
.mi.on{background:var(--paper-2)}
.map-side .grp{
  position:sticky;top:0;background:var(--paper-2);padding:6px 12px;
  font:600 11px/1 var(--sans);color:var(--ink-3);letter-spacing:.6px;
  border-bottom:1px solid var(--line-soft);z-index:1;
}
/* --bar-h is .map-bar's *measured* height (see watchBar). It feeds the top of
   the legend and the search-result panel — both used to hardcode 52px, which
   assumed the toolbar is forever one row. On narrow screens the three
   capsules wrap, the toolbar becomes two rows, and the hardcoded 52px landed
   squarely on the second row's basemap/transit buttons. The 34px default is
   the real single-row height (29px search box plus border padding); both
   consumers start hidden, so there's no visible jump before JS takes over.
   Incidentally that 52px was wrong even on wide screens — a single-row
   toolbar bottoms out at 44px, so 52 left an 8px gap versus the intended
   13px. */
.map-main{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper-2);--bar-h:34px}
#map-canvas{position:absolute;inset:0}
/* right reserves room for the zoom control (29px wide + 10px margin + an 8px
   gap = 57px) plus the top-right column beside it. --tgl-w is that column's
   *measured* width plus the gap, written by measureLightness — hardcoding it
   would mean re-guessing per language ("Light|Dark" vs 「浅色|深色」). Without
   the reserve, a phone-width toolbar wraps and its first row runs straight
   under the capsule. */
.map-bar{
  position:absolute;top:10px;left:10px;right:calc(57px + var(--tgl-w,0px));z-index:20;
  display:flex;gap:7px;flex-wrap:wrap;pointer-events:none;
}
.map-bar>*{pointer-events:auto}
/* right:57px clears the zoom control (29px wide + 10px margin + an 8px gap).
   The column holds the lightness capsule and, under it, the export button. */
.map-rt{position:absolute;top:10px;right:57px;z-index:20;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#map-lightness:empty{display:none}
#map-actions button{font-weight:600;color:var(--ink)}
.mgroup{
  display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);box-shadow:var(--shadow);
}
.mgroup button{
  background:none;border:0;border-inline-end:1px solid var(--line-soft);
  padding:6px 11px;font-size:12px;color:var(--ink-3);white-space:nowrap;
  transition:background .12s,color .12s,scale .12s;
}
.mgroup button:last-child{border-inline-end:0}
.mgroup button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:600}
.mgroup button:hover:not(:disabled):not([aria-pressed=true]){background:var(--accent-soft);color:var(--ink)}
.mgroup button:disabled{opacity:.38;cursor:not-allowed}

/* Place search. The input and the search button share one mgroup capsule,
   matching the basemap switcher's styling.

   min-width:0 on both the capsule and the input is what keeps the button
   inside the capsule. A flex item's min-width defaults to auto — its
   min-content width — so the capsule refused to shrink below input 168px +
   button, and .mgroup's overflow:hidden then clipped whatever stuck out.
   Measured at 375px, where .map-bar is squeezed to 162px by the zoom/toggle
   reserve: the capsule needed 194px, and #msq-go rendered at x 180–226
   against a clip edge at 195 — the button was entirely outside, invisible
   and unclickable, leaving the undiscoverable Enter handler as the only way
   to search.
   The 168px stays as the flex *basis*, so nothing changes at widths where it
   fits; the input is the only item allowed to shrink, and the button keeps
   its natural size. */
.msearch{min-width:0}
.msearch input{
  background:none;border:0;border-inline-end:1px solid var(--line-soft);
  padding:6px 11px;font-size:12px;color:var(--ink);min-height:29px;
  flex:0 1 168px;width:auto;min-width:0;
}
.msearch>button{flex:none}
.msearch input::placeholder{color:var(--ink-3)}
.msearch input:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px 0 0 8px}
/* The result panel overlapping the legend's spot is fine — they never appear
   together: the panel is a transient post-search state, dismissed by picking
   a result or clicking elsewhere on the map */
#msq-panel{
  position:absolute;top:calc(var(--bar-h) + 23px);left:10px;z-index:22;width:min(320px,calc(100% - 20px));
  background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  overflow:hidden auto;max-height:min(46vh,340px);
}
#msq-panel .sr{
  display:block;width:100%;text-align:start;background:none;border:0;
  border-bottom:1px solid var(--line-soft);padding:8px 11px;cursor:pointer;
}
#msq-panel .sr:last-child{border-bottom:0}
#msq-panel .sr:hover,#msq-panel .sr:focus-visible{background:var(--paper-2)}
#msq-panel .sr b{display:block;font:600 12.5px/1.4 var(--sans);color:var(--ink)}
#msq-panel .sr span{
  display:block;font-size:11px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#msq-panel .sr-note{padding:9px 11px;font-size:11.5px;color:var(--ink-3);line-height:1.5}

/* Confirmation card after picking a search result: bottom-left of the map
   (map-note's spot — likewise never shown at the same time) */
#cand-card{
  position:absolute;left:10px;bottom:10px;z-index:22;max-width:320px;
  background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;padding:11px 13px;box-shadow:var(--shadow);
}
#cand-card b{font:600 13.5px/1.4 var(--sans);color:var(--ink)}
#cand-card .addr{font-size:11px;color:var(--ink-3);margin:3px 0 9px;line-height:1.5}
#cand-card .row{display:flex;gap:6px;flex-wrap:wrap}
#cand-card .hint{margin-top:7px;font-size:10.5px;color:var(--ink-3)}
/* The legend defaults to line-number chips only (two rows suffice); a click
   expands the full names. The complete 12-line list needs 210×340px — 14% of
   the map, sitting exactly on the top-left markers — far too much to keep
   permanently visible. */
#map-legend{
  position:absolute;top:calc(var(--bar-h) + 23px);left:10px;z-index:20;max-width:212px;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  box-shadow:var(--shadow);font-size:11.5px;line-height:1.5;
}
/* Expand/collapse is a button: the whole legend is clickable, but the
   clickable part must be keyboard-reachable. The line-name list stays outside
   the button — it scrolls on its own, and scrolling inside a button is
   awkward. */
.lg-toggle{display:block;width:100%;cursor:pointer}
#map-legend .lg-chips{display:flex;flex-wrap:wrap;gap:4px}
/* Ink is not hardcoded white: line colors are OSM's official palette, and on
   a light line (Nagahori Tsurumi-ryokuchi #A9CC51) white text measured only
   1.8:1 — text-shadow can't save that. lineInk() picks black/white per chip
   by background luminance, inlined in style; the #fff here is only the
   fallback when the colour value fails to parse. */
#map-legend .lg-ref{
  min-width:16px;text-align:center;font-weight:700;font-size:10.5px;line-height:16px;
  color:#fff;border-radius:3px;padding:0 4px;
}
#map-legend .lg-list{display:none;margin-top:6px;max-height:min(40vh,300px);overflow:auto}
#map-legend.open .lg-list{display:block}
#map-legend.open .lg-chips{display:none}
#map-legend .lg-row{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
#map-legend .lg-row+.lg-row{margin-top:3px}
#map-legend .lg-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The auto-colored footnote ends with a few line-number chips; flex keeps
   them baseline-aligned with the text and wrapping cleanly when numerous */
#map-legend .lg-foot{
  margin-top:6px;padding-top:5px;border-top:1px solid var(--line-soft);
  color:var(--ink-3);font-size:10.5px;
  display:flex;align-items:center;flex-wrap:wrap;gap:3px;
}
#map-legend .lg-hint{color:var(--ink-3);font-size:10px;margin-top:5px}
#map-legend .lg-op{
  display:flex;align-items:center;gap:7px;margin-top:6px;
  padding-top:6px;border-top:1px solid var(--line-soft);
  color:var(--ink-3);font-size:10.5px;
}
#map-legend .lg-op span{flex:none}
#map-legend .lg-op input{
  flex:1;min-width:0;height:12px;margin:0;
  -webkit-appearance:none;appearance:none;background:none;cursor:pointer;
}
/* Track and thumb need one rule per vendor prefix — never merged into one
   selector list: a browser that doesn't recognize one pseudo-element drops
   the entire rule, and both sides end up unstyled. */
#map-legend .lg-op input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line-2)}
#map-legend .lg-op input::-moz-range-track{height:3px;border-radius:2px;background:var(--line-2)}
#map-legend .lg-op input::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;border:0;
  width:11px;height:11px;margin-top:-4px;border-radius:50%;background:var(--ink-2);
}
#map-legend .lg-op input::-moz-range-thumb{
  border:0;width:11px;height:11px;border-radius:50%;background:var(--ink-2);
}
#map-legend .lg-op input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.map-note{
  position:absolute;left:10px;bottom:10px;right:10px;z-index:20;
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11.5px;
  color:var(--ink-2);box-shadow:var(--shadow);display:none;
}
.map-note.on{display:block}
.map-note b{color:var(--danger)}
/* MapLibre's own controls (zoom buttons) default to z-index:2; markers go up
   to 6 and would cover them */
.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right,
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{z-index:20}
.attrib{
  position:absolute;right:8px;bottom:8px;z-index:18;font-size:10px;color:var(--ink-3);
  background:color-mix(in srgb,var(--paper) 78%,transparent);padding:2px 7px;border-radius:4px;
}
.attrib a{color:inherit}

/* Map markers (HTML elements, so they can carry CJK names and numbers).
   Careful: never set position or transform here — MapLibre adds
   .maplibregl-marker (position:absolute) to the element and positions it via
   an inline transform. Touch either and the marker detaches from the map's
   coordinate system. The static fallback map has its own positioning rules. */
.mk{cursor:pointer}
/* Size, fill, ring and number are all set inline by styleDot() — the
   two-layer encoding must be decided in one place; scattered into CSS it
   becomes "changed the JS, forgot .no:not(.placed)". Only state-independent
   shape and transitions live here. */
.mk i{
  display:grid;place-items:center;border-radius:50%;
  font:700 11px/1 var(--mono);color:var(--on-day);font-style:normal;
  /* Transition transform only. Size changes with "scheduled or not" — a
     data-driven discrete jump that needs no tween; and 47 absolutely
     positioned markers tweening width/height together trigger waves of
     layout recalculation on every refresh. */
  transition:transform .14s;
}
.mk:hover i,.mk.on i,.mk.hi i{transform:scale(1.28)}
/* Stub markers (origin=user, not yet completed): the dashed border is the
   "this hasn't been researched" mark. Color semantics (ring=choice,
   fill=day) match normal markers exactly; this is one extra layer. */
.mk.stub i{border:1.5px dashed color-mix(in srgb,var(--ink) 55%,var(--paper))}
/* Search candidate pin: not yet a data point, styled independently of
   styleDot's two-layer encoding */
.mk.cand i{
  width:19px;height:19px;border-radius:50%;
  background:var(--accent);border:2px dashed #fff;
  box-shadow:0 0 0 2.5px var(--accent),0 1px 6px rgba(0,0,0,.4);
}
/* Name label: centered above the dot (same anchoring as the schedule
   column's conflict tooltip — one tooltip grammar page-wide). */
.mk.on::after,.mk.hi::after{
  content:attr(data-nm);position:absolute;bottom:calc(100% + 6px);left:50%;
  transform:translateX(-50%);white-space:nowrap;
  background:var(--ink);color:var(--paper);font-size:11px;padding:3px 8px;border-radius:5px;
}
/* The active marker must also rise above its siblings, or its name label
   slides *under* neighboring circles in dense clusters. Every marker carries
   an inline z-index from styleDot's importance ladder (Z map: 1–6, and 9 for
   dots on the selected day), which is why this needs !important — a bare
   class rule always loses to an inline style. 12 sits above the whole ladder
   including the day-focus boost, and still below every map overlay (search
   bar, legend, zoom: z-index 18+), per the constraint noted at the Z map:
   markers share a stacking context with those overlays. Setting z-index is
   safe — the "never set position or transform" warning above is about
   MapLibre's inline transform, which z-index doesn't touch. */
.mk:hover,.mk.on,.mk.hi{z-index:12 !important}

/* Static fallback: when every tile source is down, at least the relative
   positions stay readable */
.static-map{position:absolute;inset:0;background:var(--paper-2)}
.static-map .sm-grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:52px 52px}
/* In the static fallback we do the positioning ourselves (left/top
   percentages + centering translate) — the one place where setting
   position/transform on .mk is correct */
.static-map .mk{position:absolute;transform:translate(-50%,-50%)}

/* Narrow-screen degradation. No drawer: a drawer hides columns, and while
   scheduling you specifically need pool, schedule and map visible at once.

   Only two shapes, holding the first as long as possible:
     ① three horizontal columns — the map is the elastic one and absorbs all
        width change. The two side columns take 496px + 28px of gaps, so at an
        890px viewport the map still has ~330px, workable;
     ② narrower switches to "pool | schedule side by side, map full-width
        below".
   The old rule stacked at 1180px — measured in embedded browsers / split
   screens the three columns kept falling apart, surrendering while the map
   still had 600px of slack. The fully vertical (1×3) mode is gone too: side
   by side down to a 375px phone still gives each column ~165px, which name
   ellipses and the 2×2-wrapping filter group absorb, whereas stacking turns
   the "drag into a day" move into a cross-screen scroll. */
@media (max-width:890px){
  /* minmax(0,1fr), not 1fr: the latter is minmax(auto,1fr), so the pool
     column's 271px min-content floor wins the whole track and the schedule
     column gets the remainder. Measured before the fix: 375px → 271/50,
     320px → 271/2 with the day column's clientWidth at 0 — the column this
     view exists for was simply gone, and the ↑↓× buttons rendered off-screen.
     A zero floor lets both tracks shrink evenly: 375px → 161/161,
     320px → 133/133, neither column overflowing internally. */
  .map-wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(180px,34vh) 1fr;height:auto}
  .map-wrap .map-main{grid-column:1 / -1;height:min(56vh,540px)}
}
/* ③ phone — all three stacked.
   The two-column form was held all the way down on the argument that ~165px
   a column is enough, since name ellipses absorb the squeeze. Looked at on a
   phone, that is where it stops being true: the day column spends ~51px of
   its width on the ↑↓× buttons alone, so at 375px the names render as a
   single character plus an ellipsis ("大…", "国…") and the rows are guessing
   games rather than a schedule.
   The reason the 1×3 mode was dropped — that stacking turns "drag into a day"
   into a cross-screen scroll — is real but not disqualifying: tapping a pool
   dot toggles the place into the current day (toggleInCurDay, wired at the
   .pin click), so scheduling never depended on the drag. And dragging across
   a scroll boundary is the awkward gesture on touch anyway.
   Each pane gets its own height rather than sharing one grid track: they are
   three independent scrollers stacked, and a phone screen cannot show all
   three at once regardless, so the view scrolls as a page. */
@media (max-width:560px){
  .map-wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:none;height:auto}
  .map-side{height:min(44vh,340px)}
  .day-col{height:min(44vh,340px)}
  .map-wrap .map-main{grid-column:auto;height:min(52vh,440px)}
}

/* ═══════════════════════════════════════════════ Guide view */
/* A sheet of paper on the canvas. The other two views are already made of
   cards, so the canvas only ever shows through in the gaps; the guide is a
   few thousand words of continuous prose and had nothing under it. Light ink
   on navy is fine for a label and tiring for a document, so the document gets
   its own ground and keeps black-on-white — which is also what makes the page
   print without a second set of rules. */
.guide{
  max-width:800px;margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:30px 38px 38px;
}
@media (max-width:640px){ .guide{padding:22px 18px 26px} }
/* md_to_html emits the guide body demoted one level (see build.py), so h2
   here is route.md's `#` and h3 its `##` — the visual hierarchy is unchanged,
   only the tags shift. The cost summary and checklist are page-generated,
   peers of route.md's `##`, so they use h3 too. */
.guide h2,.guide h3{font-family:var(--serif);font-weight:400;letter-spacing:var(--tracking)}
.guide h2{font-size:29px;margin:34px 0 14px}
.guide h3{
  font-size:23px;margin:38px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line-soft);
}
.guide h4{font:600 16px/1.4 var(--sans);margin:26px 0 9px}
.guide h5{font:600 13.5px/1.4 var(--sans);margin:19px 0 7px;color:var(--ink-2)}
.guide p{margin:0 0 13px;color:var(--ink-2);font-size:15px;line-height:1.78}
.guide ul,.guide ol{margin:0 0 15px;padding-inline-start:23px;color:var(--ink-2)}
.guide li{margin-bottom:6px;line-height:1.72}
.guide blockquote{
  margin:15px 0;padding:11px 16px;border-inline-start:3px solid var(--accent);
  background:var(--accent-soft);border-radius:0 7px 7px 0;color:var(--ink-2);font-size:14px;
}
.guide blockquote p{margin:0}
.guide hr{border:0;border-top:1px solid var(--line-soft);margin:30px 0}
.guide code{
  background:var(--paper-2);padding:1.5px 5px;border-radius:4px;
  font:.88em var(--mono);border:1px solid var(--line);
}
.guide pre{
  background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
  padding:13px 15px;overflow-x:auto;font:12.5px/1.7 var(--mono);
}
.table-wrap{overflow-x:auto;margin:0 0 17px;border:1px solid var(--line);border-radius:8px}
.guide table,.card-table{width:100%;border-collapse:collapse;font-size:13.5px}
.guide th,.guide td,.card-table td,.card-table th{padding:8px 12px;border-bottom:1px solid var(--line-soft);text-align:start}
.guide tbody tr:last-child td,.card-table tr:last-child td{border-bottom:0}
/* Headers are recognized by th, not by "first row" — positional selectors
   fail silently when row order changes */
.guide th{background:var(--paper-2);font-weight:600;color:var(--ink)}

/* Timeline: progressive enhancement for route.md list items that start with
   a time */
.guide li.tl{list-style:none;position:relative;padding-inline-start:16px;margin-bottom:11px}
.guide li.tl::before{
  content:"";position:absolute;left:-9px;top:9px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.guide li.tl .t{
  font:600 12px/1 var(--mono);color:var(--accent);background:var(--accent-soft);
  padding:3px 7px;border-radius:4px;margin-inline-end:8px;white-space:nowrap;
}
.guide ul:has(li.tl){border-inline-start:1px solid var(--line-soft);padding-inline-start:20px;margin-inline-start:5px}

/* Weather strip */
.wx{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.wx-d{
  flex:1;min-width:132px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);padding:11px 13px;
}
/* With the weather icon removed, the breathing room between date line and
   temperature is restored here (used to be 7px + an icon row) */
.wx-d .d{font:600 12px/1.35 var(--sans);color:var(--ink-3);margin-bottom:9px}
.wx-d .t{font:400 19px/1.25 var(--serif);margin-top:3px}
.wx-d .t .sub{font-size:14px;color:var(--ink-3)}
.wx-d .r{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.wx-d .r b{color:var(--accent);font-weight:600}
.wx-src{font-size:11.5px;color:var(--ink-3);margin:0 0 26px}
.wx-src.est{color:var(--warn)}

/* Cost / checklist */
.sum{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:17px}
.sum-h{
  background:var(--paper-2);padding:9px 13px;font:600 12.5px/1 var(--sans);
  border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;
}
.sum-h span{margin-inline-start:auto;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:400}
/* Day separator row. One step lighter than .sum-h — it's a group inside the
   same table, not a new table */
.sum-d{
  display:flex;align-items:center;gap:8px;padding:6px 13px;
  background:color-mix(in srgb,var(--paper-2) 60%,transparent);
  border-bottom:1px solid var(--line-soft);
  font:600 11.5px/1.35 var(--sans);color:var(--ink-2);letter-spacing:.3px;
}
.sum-d span{margin-inline-start:auto;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:400}
.ck{display:flex;align-items:center;gap:9px;padding:7px 13px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
/* This column mixes numbers (per-day sequence) with icons, so it needs
   tabular-nums to column-align the digits and centering for the SVGs. */
.ck .m{
  width:17px;flex:none;text-align:center;
  font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3);
}
.ck:last-child{border-bottom:0}
/* Icons take their color from currentColor, sharing the palette of the list
   view's choice buttons. "Undecided" and "dropped" both stay --ink-3 — one is
   not-yet-considered, the other considered-and-declined, and neither should
   stand out in this column. */
.ck .m.yes{color:var(--ok)}
.ck .m.maybe{color:var(--warn)}
.ck .m.warn{color:var(--warn)}
.ck .m.lod{color:var(--lodging)}
.ck .n{flex:1;min-width:0}
.ck .n .sub{color:var(--ink-3);font-size:11.5px;margin-inline-start:7px}
.ck .why{font-size:11.5px;color:var(--ink-3);font-style:italic}
/* Same fix as the dropped place card, and for a harder reason: this one
   prints. opacity:.55 composited the row's own text down to 2.59:1 for the
   10–11.5px .sub / .why and 4.27:1 for the name — and the guide's own intro
   tells you to re-read exactly these rows ("放弃的也列在这里，方便你回头
   判断要不要捡回来"), so the passage the copy sends you back to was the least
   legible thing on the sheet. On paper there is no hover to recover it.
   A recessed band plus a colour step instead, neither of which costs
   contrast: --ink-3 on --paper-2 is 6.33:1, --ink 16.14:1. Two channels
   rather than one because the band depends on print-color-adjust:exact
   (set on .pg-body, and beforeprint always paginates) while the colour step
   survives even if a printer drops backgrounds — and the ✕ in the .m column
   says it a third time, without colour at all. */
.ck.out{background:var(--paper-2)}
.ck.out .n{color:var(--ink-3)}
.cost-total{
  display:flex;align-items:baseline;gap:10px;padding:11px 13px;
  background:var(--paper-2);border-top:1px solid var(--line-soft);font-size:13.5px;
}
.cost-total b{font:400 21px var(--serif);color:var(--ink)}
.caveat{font-size:11.5px;color:var(--ink-3);padding:9px 13px;border-top:1px dashed var(--line-soft);line-height:1.6}

/* ── Bento checklist ──
   The all-places table used to be one column of ~50 rows: on A4 that is two
   sheets of mostly margin, and nothing about it is a table — a day's places
   and the dropped pile answer different questions and never get compared row
   to row. So each group becomes its own box, and the boxes flow through two
   columns. A 50-place trip then lands on one sheet.

   `columns` rather than grid on purpose: the boxes are uneven by nature (a
   9-place day beside an 18-place drop list) and packing them is exactly what
   the multicol balancer already does. break-inside keeps a box whole; the
   inline-block/width pair is what makes Safari honour it. */
/* Two columns filled by packBento rather than by CSS. Multicol balances by
   splitting content, and a box that has to stay whole defeats it: measured on
   this 47-place trip it left one column 1130px tall and the other 680px.
   Packing the boxes ourselves, always into the shorter column, is both
   shorter to write and better at it. */
.bento{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;align-items:start;margin-bottom:17px;
}
.bento-col{display:flex;flex-direction:column;gap:12px}
.bento .sum{margin:0}
/* Only the flowing guide collapses to one column. A sheet is 210mm wide
   whatever the phone it is being previewed on, and letting the viewport
   restack its boxes made the checklist run to two sheets on mobile and one on
   a laptop — the same document must paginate the same everywhere. */
@media (max-width:640px){ .pgwrap>.guide .bento{grid-template-columns:1fr} }
/* Denser than a standalone .sum, and every row has to hold one line: at half
   the width a row that wraps costs as much as two places. Hence the reason
   sits in its own right-aligned column rather than under the name, and the
   duration comes off entirely — "did I miss anything" is not a question you
   answer with "1–2 hours". */
.bento .sum-h{padding:7px 11px;font-size:11.5px}
.bento .ck{
  display:grid;grid-template-columns:16px 1fr auto;gap:1px 7px;
  padding:3px 10px;font-size:11.5px;align-items:baseline;
}
.bento .ck .m{width:auto;font-size:11px}
.bento .ck .n{line-height:1.45;min-width:0}
.bento .ck .n .sub{margin-inline-start:5px;font-size:10px}
.bento .ck .why{
  grid-column:3;justify-self:end;text-align:end;
  white-space:nowrap;font-size:10px;padding-inline-start:8px;
}
/* In a box that is one rating end to end, the mark repeats down every row and
   says nothing the header hasn't. The day boxes keep theirs — there it is the
   running order, which differs per row. */
.bento .sum.plain .ck{grid-template-columns:1fr auto}
.bento .sum.plain .ck .m{display:none}
.bento .sum.plain .ck .why{grid-column:2}
.bento .caveat{padding:7px 11px;font-size:10.5px}

/* ── A4 pagination ──
   The guide is the one view people print or hand to someone as a PDF. As a
   continuous column it breaks wherever the paper runs out: mid-timeline,
   mid-table, a heading stranded at the foot of a sheet. This lays the same
   content into real A4 sheets from measurements the screen and the printer
   share, so the preview is the export.

   Page count is deliberately not fixed. A section starts on a fresh sheet and
   a long one runs onto a second. Forcing "one section = one sheet" would mean
   a different type size per section, which is the thing that makes an export
   look thrown together. */
.pgwrap{position:relative}
.paged{
  position:absolute;top:0;left:50%;
  transform-origin:top center;                 /* scaled to fit narrow screens */
}
.pg{
  width:210mm;height:297mm;box-sizing:border-box;
  padding:17mm 18mm 8mm;margin:0 auto 18px;
  background:#fff;color:var(--ink);
  display:flex;flex-direction:column;
  box-shadow:var(--shadow);border-radius:2px;
}
/* min-height:0 is what lets the body shrink inside the flex column; without
   it the footer is pushed off the sheet by overlong content instead of the
   content overflowing past it. overflow stays visible — a block too tall to
   split (a lone oversized image, say) should bleed where you can see it, not
   be silently cropped.

   The sheet body carries .guide as well: the document's entire type scale is
   scoped to that class, and duplicating every selector for the paged copy
   would leave two scales to keep in step. What .guide adds on top of type —
   an on-screen sheet of paper — is undone here, the sheet now being real. */
.pg-body{
  flex:1;min-height:0;
  max-width:none;margin:0;padding:0;
  background:none;border:0;box-shadow:none;border-radius:0;
}
/* One scale, every sheet. 15px/1.78 is sized for a column on a monitor at
   arm's length; on paper those settings run this guide to eleven sheets, half
   of them a third empty. 14px is about 10.5pt — an ordinary document body —
   and it is the difference between a day landing on one sheet and spilling
   onto two. Deliberately not tuned per section: type that changes size from
   sheet to sheet is exactly what makes an export look assembled rather than
   typeset. */
.pg-body h2{font-size:25px;margin:0 0 12px}
.pg-body h3{font-size:20px;margin:30px 0 12px;padding-bottom:8px}
.pg-body h4{font-size:15px;margin:22px 0 8px}
.pg-body p{font-size:14px;line-height:1.72;margin:0 0 11px}
.pg-body ul,.pg-body ol{font-size:14px;margin:0 0 12px}
.pg-body li{line-height:1.68;margin-bottom:5px}
.pg-body li.tl{margin-bottom:9px}
.pg-body blockquote{font-size:13px;margin:12px 0;padding:9px 14px}
.pg-body table{font-size:12.5px}
.pg-body th,.pg-body td{padding:6px 10px}
.pg-body .wx-d{padding:9px 11px}
.pg-body .wx-src{margin-bottom:18px}
.pg-foot{
  flex:none;display:flex;align-items:baseline;gap:8px;padding-top:5mm;
  font:11px/1 var(--sans);color:var(--ink-3);
}
.pg-foot .no{margin-inline-start:auto;font-family:var(--mono)}
/* Inside a sheet the document is already on paper; the on-screen sheet
   styling of .guide would be a second sheet drawn on top of this one. */
.pg-body>*:first-child{margin-top:0}
.pg-body h2:first-child,.pg-body h3:first-child{margin-top:0}
/* Scoped to the direct child: the sheet bodies are .guide too */
.pg-toggle-on .pgwrap>.guide{display:none}

/* ── Sheet navigator ──
   Fixed, not sticky: the sheets are absolutely positioned and scaled, so there
   is no in-flow column for a sticky element to ride down. fit() places it from
   the sheet's measured left edge and hides it when the gutter is too narrow —
   the alternative, reserving a lane for it, would push the sheets off centre on
   every window that can't spare one. */
/* display:flex would otherwise beat the [hidden] attribute's UA display:none */
.pgnav[hidden],.pgnav-btn[hidden],.pgnav-scrim[hidden]{display:none}
/* The scroll moved from the rail onto .pgnav-list: the list is what can grow
   past the viewport, and the action area below it has to stay put while it
   does. */
.pgnav{
  position:fixed;width:170px;z-index:20;
  display:flex;flex-direction:column;
  max-height:calc(100vh - 170px);
}
.pgnav-list{
  display:flex;flex-direction:column;gap:1px;
  overflow:auto;overscroll-behavior:none;scrollbar-width:thin;min-height:0;
}
.pgnav-list button{
  appearance:none;border:0;background:none;cursor:pointer;
  display:flex;gap:9px;align-items:baseline;
  padding:5px 9px;border-radius:7px;text-align:start;width:100%;
  font:500 12px/1.45 var(--sans);color:var(--canvas-ink-3);
  transition:background .12s,color .12s,scale .12s;
}
.pgnav-list button:hover{background:rgba(0,0,0,.05);color:var(--canvas-ink-2)}
.pgnav-list button[aria-current="true"]{background:rgba(0,0,0,.075);color:var(--canvas-ink)}
/* A rule separates "where to jump" from "take the whole thing away" — one
   column, two jobs. */
.pgnav-act{margin-top:9px;padding-top:9px;border-top:1px solid var(--canvas-line);flex:none}
.pgnav-act .btn{width:100%;justify-content:center}
.pgnav-act .hint{display:block;margin-top:7px;padding:0 2px;font-size:10.5px;line-height:1.5;color:var(--canvas-ink-3)}
/* The second export button follows a hint rather than the rule, so it needs
   its own breathing room — .btn has no margin of its own. */
.pgnav-act .hint + .btn{margin-top:9px}
.pgnav-h{
  padding:2px 9px 7px;font:600 10.5px/1.4 var(--sans);
  color:var(--canvas-ink-3);letter-spacing:.4px;opacity:.75;
}

/* ── Folded form ──
   From ~1180px down there is no gutter left to stand a rail in, and on a phone
   there are no sheets at all — but "jump to day two" is wanted in both. Same
   list, same markup, folded behind a pill anchored bottom-left: clear of the
   fixed action bar (--ab-h is maintained for exactly this), and covering the
   part of the page you have just finished reading rather than the part you
   are about to. */
.pgnav-btn{
  position:fixed;left:14px;bottom:calc(var(--ab-h,64px) + 14px);z-index:22;
  display:flex;align-items:center;gap:7px;
  padding:8px 14px 8px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:500 12.5px/1 var(--sans);box-shadow:0 3px 12px var(--sh-1);
  transition:scale .12s;
}
.pgnav-btn .lb{font-family:var(--mono);font-size:11.5px}
.pgnav.panel{
  left:14px;top:auto;bottom:calc(var(--ab-h,64px) + 60px);
  width:min(232px,calc(100vw - 28px));
  max-height:min(58vh,420px);
  padding:9px 6px 6px;
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:0 10px 34px var(--sh-2,var(--sh-1));
  z-index:23;
}
.pgnav.panel .pgnav-list button{font-size:12.5px;padding:7px 9px}
.pgnav.panel .pgnav-list button:hover{background:var(--paper-2)}
.pgnav.panel .pgnav-list button[aria-current="true"]{background:var(--paper-2);color:var(--ink)}
.pgnav.panel .pgnav-h{color:var(--ink-3);opacity:1}
.pgnav.panel .pgnav-act{border-top-color:var(--line-soft)}
.pgnav.panel .pgnav-act .hint{color:var(--ink-3)}
.pgnav-scrim{position:fixed;inset:0;z-index:21;background:transparent}
@media (prefers-reduced-motion:no-preference){
  .pgnav.panel{animation:pgnav-in .16s ease-out}
  @keyframes pgnav-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
.pgnav .no{font:400 10.5px/1.6 var(--mono);flex:none;opacity:.65}
/* One line each, or a long day heading pushes the rail wider than its gutter */
.pgnav .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══════════════════════════════════════════════ Deck view
   Ported from dev/swipe-prototype.html. Every class is dk- prefixed and every
   rule is scoped under #view-deck (or the dk- overlay), because the template
   already owns .card/.media/.pitch/.tags with very different rules. The hard
   zero-blur shadow is reserved for hover/drag ("picked up"); resting elements
   lie flat. Deck-local tokens live on the section, not :root. */
#view-deck{
  --dk-r:26px; --dk-pad:12px;
  --dk-hard:5px 6px 0 0 var(--line); --dk-hard-sm:3px 4px 0 0 var(--line);
  /* min-height, not height: on a short window the deck's own minimum
     (HUD + 300px row + actions) exceeds --map-h, and a fixed height would
     make the centred card stack overflow upward through the HUD. Growing
     instead keeps everything in flow; the page scrolls, as the map does. */
  min-height:var(--map-h,560px); position:relative;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  -webkit-user-select:none; user-select:none;
}
/* Same slot as the list toolbar's first row, so the mode switch sits at the
   same spot in both modes and toggling never moves it under the pointer. */
/* Reproduces the list toolbar's row context so the mode switch lands on the
   identical pixel in both modes. The list's .toolbar centres its items
   against the search input, whose height differs by pointer type: 34px on
   desktop, 36.5px under the touch font bump (see the hover:none block that
   raises inputs to 16px). Mirror both numbers, or the switch sits ~1px off
   in one of the modes. */
.dk-toolbar{align-self:stretch; display:flex; align-items:center; min-height:34px; margin-bottom:4px}
@media (hover:none){ .dk-toolbar{min-height:36.5px} }
/* Progress lives on the right edge as a vertical rail — the deck column
   keeps its vertical budget for the cards. Fill grows downward. */
#dk-progress{
  position:absolute; right:18px; top:50%; translate:0 -50%; z-index:4;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
#dk-left{font-size:12px; font-weight:700; white-space:nowrap}
#dk-counter{font-weight:400; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
/* A stacked ratio rail, filling bottom-up like chips piling on the table:
   yes (green) on the bottom, maybe, then no; the pale remainder above is
   what's still undealt. Progress and composition in one glance. */
.dk-vtrack{
  display:flex; flex-direction:column-reverse;
  width:5px; height:min(220px,30vh); background:var(--fill,var(--line-soft));
  border-radius:3px; overflow:hidden;
}
.dk-vseg{width:100%; height:0%; flex:none; transition:height .25s ease}
.dk-vs-yes{background:var(--ok)}
.dk-vs-maybe{background:var(--warn)}
.dk-vs-no{background:var(--danger)}
#dk-main{flex:1; width:100%; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px}
#dk-row{width:100%; flex:1; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center}
/* A definite height, derived from the measured viewport slot rather than a
   percentage: the deck sits in an auto grid track, and height:100% against
   an auto track resolves to 0 — the cards (absolute-positioned) then paint
   as a 0-high jumble. ~250px is the section's own chrome: HUD + maybe pile
   + action row + gaps. The section grows (min-height) when this exceeds the
   slot, so a short window scrolls instead of overlapping. */
#dk-deck{position:relative; width:min(380px,88vw); height:clamp(300px, calc(var(--map-h,560px) - 280px), 560px)}

.dk-card{
  position:absolute; inset:0;
  background:var(--card); border:1.5px solid var(--line); border-radius:var(--dk-r);
  padding:var(--dk-pad);
  display:flex; flex-direction:column; gap:8px;
  cursor:grab; will-change:transform; touch-action:none;
}
@media (hover:hover){ #view-deck .dk-card[data-depth="0"]:hover{box-shadow:var(--dk-hard)} }
.dk-card.dk-dragging{cursor:grabbing; transition:none !important; box-shadow:var(--dk-hard)}
.dk-card.dk-settle{transition:transform .3s cubic-bezier(.2,.9,.3,1.15), box-shadow .3s ease}
.dk-card.dk-windup{transition:transform .13s ease-out}
.dk-card.dk-fly{transition:transform .42s cubic-bezier(.45,.05,.25,1); pointer-events:none; box-shadow:var(--dk-hard)}
.dk-card.dk-flyback{transition:transform .38s cubic-bezier(.3,.7,.3,1); pointer-events:none; box-shadow:var(--dk-hard)}
.dk-card.dk-flying{z-index:10}
.dk-card[data-depth="1"],.dk-card[data-depth="2"]{pointer-events:none}

.dk-media{
  flex:0 0 42%; border-radius:calc(var(--dk-r) - var(--dk-pad));
  background:var(--paper-2,var(--fill)); border:1px solid var(--line-soft);
  overflow:hidden; position:relative;
}
.dk-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
.dk-media-fb{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px; color:var(--ink-3);
  font-size:12px;
}
.dk-media-fb svg{color:color-mix(in srgb,var(--ink-3) 40%,var(--line-2))}
.dk-cat{
  position:absolute; left:10px; top:10px; z-index:2; font-size:11px; font-weight:800;
  background:var(--accent-soft,#FFEF85); color:var(--ink); border:1px solid var(--line);
  padding:3px 8px; border-radius:99px;
}
.dk-body{flex:1; display:flex; flex-direction:column; gap:7px; padding:2px 6px 4px; min-height:0}
.dk-name{font-size:18px; font-weight:800; line-height:1.25}
.dk-name small{display:block; font-size:11.5px; font-weight:400; color:var(--ink-3); margin-top:2px}
.dk-facts{font-size:12px; color:var(--ink-2); display:flex; gap:8px; flex-wrap:wrap}
.dk-facts b{font-weight:700}
.dk-pitch{
  font-size:13px; line-height:1.55; color:var(--ink-2);
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
}
.dk-more{font-size:11.5px; color:var(--ink-3)}
.dk-tags{margin-top:auto; display:flex; gap:6px; flex-wrap:wrap}
.dk-tags span{
  font-size:11px; color:var(--ink-3); background:var(--paper);
  border:1px solid var(--line-soft); padding:2px 8px; border-radius:99px;
}

/* Verdict stamps appear on the side the card travels towards: drag left and
   「不想去」 leads the motion on the left edge. */
.dk-stamp{
  position:absolute; top:24px; font-size:24px; font-weight:900; letter-spacing:.1em;
  padding:5px 13px; border:4px solid; border-radius:10px; opacity:0;
  background:var(--card); pointer-events:none; z-index:2; white-space:nowrap;
}
.dk-stamp.yes{right:18px; color:var(--ok); border-color:var(--ok); transform:rotate(14deg)}
.dk-stamp.no{left:18px; color:var(--danger); border-color:var(--danger); transform:rotate(-14deg)}
.dk-stamp.maybe{left:50%; top:auto; bottom:28px; transform:translateX(-50%) rotate(-4deg); color:var(--warn); border-color:var(--warn)}

/* ── Piles: loose scattered stacks; whole dock is one <button> (browse) ── */
.dk-dock{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  background:none; border:none; padding:0; cursor:pointer; font:inherit;
  color:inherit; transition:transform .15s ease;
}
.dk-dock.dk-arm{transform:translateY(-5px)}
.dk-ptitle{
  display:inline-block; font-size:12px; font-weight:800; white-space:nowrap;
  padding:4px 10px; border-radius:99px; border:1.5px solid transparent;
}
.dk-ptitle b{font-weight:400; color:var(--ink-3); font-variant-numeric:tabular-nums}
.dk-no .dk-ptitle{color:var(--danger)}
.dk-maybe .dk-ptitle{color:var(--warn)}
.dk-yes .dk-ptitle{color:var(--ok)}
.dk-pstack{position:relative; display:block; width:120px; height:86px}
.dk-mini{
  position:absolute; inset:6px; display:block; border-radius:9px; overflow:hidden;
  background:var(--card); border:1px solid var(--line); padding:4px;
}
.dk-mini img{width:100%; height:100%; object-fit:cover; display:block; border-radius:5px; background:var(--paper-2,var(--fill))}
.dk-mname{
  position:absolute; left:4px; right:4px; bottom:4px; font-size:9.5px; font-weight:700;
  color:#fff; background:rgba(14,14,14,.62); padding:2px 5px;
  border-radius:0 0 5px 5px; text-align:left;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dk-mini.dk-pop{animation:dk-pop .3s ease}
@keyframes dk-pop{0%{scale:1.12}100%{scale:1}}
.dk-pstack.dk-empty{border:1.5px dashed var(--line-soft); border-radius:12px}
@media (hover:hover){
  .dk-dock:hover{transform:translateY(-3px)}
  .dk-dock:hover .dk-mini.dk-top{box-shadow:var(--dk-hard-sm)}
  .dk-dock:hover .dk-ptitle{border-color:var(--line); background:var(--card); box-shadow:2px 2px 0 0 var(--line)}
}
.dk-side{translate:0 -16px} /* stack (not title+stack) centres on the deck midline; `translate` stays clear of .dk-arm's transform */
.dk-side.dk-no{justify-self:end; padding-right:clamp(28px,7vw,110px)}
.dk-side.dk-yes{justify-self:start; padding-left:clamp(28px,7vw,110px)}
#dk-maybedock{flex-direction:row; gap:12px}

/* ── Action buttons with their keys printed right underneath ── */
#dk-actions{display:flex; gap:14px; padding:2px 0 6px; align-items:flex-start; flex:none}
.dk-act{display:flex; flex-direction:column; align-items:center; gap:5px}
.dk-act button{
  width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  cursor:pointer; transition:box-shadow .15s ease, transform .15s ease;
}
.dk-act button.dk-sm{width:34px; height:34px; color:var(--ink-3); margin-top:4px}
@media (hover:hover){ .dk-act button:hover{box-shadow:var(--dk-hard-sm); transform:translate(-1px,-2px)} }
.dk-act button:active{transform:translate(1px,2px); box-shadow:none}
.dk-act button:disabled{opacity:.35; cursor:default; box-shadow:none}
.dk-act .dk-b-no{color:var(--danger)} .dk-act .dk-b-maybe{color:var(--warn)} .dk-act .dk-b-yes{color:var(--ok)}
.dk-act kbd{
  font-family:inherit; font-size:11px; color:var(--ink-3);
  background:var(--card); border:1px solid var(--line-2); border-bottom-width:2px;
  border-radius:5px; padding:1px 7px;
}
@media (hover:none), (pointer:coarse){ .dk-act kbd{display:none} }

/* ── Pile browse overlay: cards flat on the dimmed backdrop, no container ── */
#dk-pileview{
  position:fixed; inset:0; z-index:70; display:none;
  background:rgba(14,14,14,.35); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  padding:4vh 16px; align-items:center; justify-content:center;
}
#dk-pileview.show{display:flex; animation:dk-fadein .18s ease}
@keyframes dk-fadein{from{opacity:0}}
.dk-pcard{
  width:min(960px,94vw); max-height:88vh; overflow:auto; touch-action:pan-y;
  padding:8px 8px 24px; position:relative;
  display:flex; flex-direction:column; gap:16px;
  -webkit-user-select:text; user-select:text;
}
.dk-pcard h2{
  font-size:15px; font-weight:800; align-self:flex-start; margin:0;
  background:var(--card); border:1.5px solid var(--line); border-radius:99px;
  padding:7px 16px;
}
.dk-pcard h2 b{font-weight:400; color:var(--ink-3); font-variant-numeric:tabular-nums}
.dk-pcard.no h2{color:var(--danger)} .dk-pcard.maybe h2{color:var(--warn)} .dk-pcard.yes h2{color:var(--ok)}
.dk-pclose{
  position:absolute; right:12px; top:12px; z-index:2;
  width:34px; height:34px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  border:1.5px solid var(--line); background:var(--card); color:var(--ink);
}
.dk-pclose:active{transform:translate(1px,1px)}
.dk-pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:14px}
.dk-gcard{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:6px;
  text-align:left;
  transition:box-shadow .15s ease;
}
@media (hover:hover){ .dk-gcard:hover{box-shadow:var(--dk-hard-sm)} }
.dk-gcard.dk-deal{animation:dk-deal .32s cubic-bezier(.3,.7,.3,1) backwards; animation-delay:var(--dk-d,0ms)}
@keyframes dk-deal{from{opacity:0; transform:translateY(16px) rotate(var(--dk-rt,3deg)) scale(.94)}}
.dk-gphoto{height:86px; border-radius:8px; overflow:hidden; position:relative; background:var(--paper-2,var(--fill)); border:1px solid var(--line-soft)}
.dk-gphoto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.dk-gphoto .dk-media-fb svg{width:30px;height:30px}
.dk-gname{font-size:12px; font-weight:700; line-height:1.3; padding:0 2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dk-garea{font-size:10.5px; color:var(--ink-3); padding:0 2px}
.dk-gchoice{display:flex; gap:6px; padding:2px}
.dk-gchoice button{
  flex:1; height:26px; border-radius:8px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line-soft); background:var(--paper); color:var(--ink-3);
}
.dk-gchoice button.on.dk-v-no{background:var(--danger); border-color:var(--danger); color:#fff}
.dk-gchoice button.on.dk-v-maybe{background:var(--warn); border-color:var(--warn); color:#fff}
.dk-gchoice button.on.dk-v-yes{background:var(--ok); border-color:var(--ok); color:#fff}
.dk-greason{display:flex; flex-wrap:wrap; gap:4px; padding:0 2px}
.dk-greason button{
  font-size:10.5px; padding:2px 8px; border-radius:99px; cursor:pointer;
  border:1px solid var(--line-soft); background:var(--paper); color:var(--ink-3);
}
.dk-greason button.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.dk-ginput{
  width:100%; font-size:11px; padding:4px 8px; border-radius:8px;
  border:1px dashed var(--line-2); background:var(--paper); color:var(--ink);
  font-family:inherit;
}
.dk-ginput:focus{outline:none; border-style:solid; border-color:var(--line)}
.dk-pempty{
  font-size:13px; color:var(--ink-3); padding:14px 18px; align-self:flex-start;
  background:var(--card); border:1px solid var(--line-soft); border-radius:12px;
}
/* The deck's own empty state fills the (position:relative) deck slot */
#dk-deck .empty-state{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:20px}

@media (max-width:920px){
  #view-deck .dk-pstack{width:100px; height:72px}
}
@media (max-width:760px){
  /* No room beside the deck: side piles collapse to text chips floated above
     the deck's top corners. The absolutely-positioned chips leave the grid,
     which would drop the deck into the first 1fr column — recenter with flex.
     The chips sit BELOW the mode-switch row (top:46px), never above it: the
     switch keeps the same first-row spot it has in the grid mode, so
     toggling modes never moves the control. */
  #dk-row{display:flex; justify-content:center}
  .dk-side{position:absolute; top:46px; z-index:5; translate:none}
  /* the rail's labels need sideways room the phone doesn't have — keep just
     the thin track hugging the edge */
  #dk-progress{right:8px}
  #dk-left,#dk-counter{display:none}
  .dk-side .dk-pstack{display:none}
  .dk-side .dk-ptitle{border-color:var(--line); background:var(--card)}
  .dk-side.dk-no{left:10px; padding-right:0} .dk-side.dk-yes{right:10px; padding-left:0}
  #dk-maybedock .dk-pstack{display:none}
  #dk-maybedock .dk-ptitle{border-color:var(--line); background:var(--card)}
}

/* ═══════════════════════════════════════════════ Empty states / toast */
.empty-state{text-align:center;padding:66px 20px;color:var(--ink-3)}
.empty-state .big{font:400 21px var(--serif);color:var(--ink-2);margin-bottom:9px}
/* Stands clear of the action bar by measuring it, not by guessing at it.
   bottom:78px was tuned against a desktop bar of about 40px. The bar's height
   is the status line's height, and that line wraps: measured in the shipping
   Chinese it stands 127px at 375px wide and 147px at 320px — so the toast sat
   entirely inside the bar's band, and at z-index 99 against the bar's 60 it
   painted on top of the Save button and the very status text it was
   reporting on. layoutMap() already measures the bar into --ab-h for exactly
   this purpose; .pgnav-btn above uses the identical expression. */
.toast{
  position:fixed;left:50%;bottom:calc(var(--ab-h,64px) + 14px);transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);padding:10px 19px;border-radius:9px;
  font-size:13.5px;z-index:99;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;box-shadow:0 8px 26px rgba(0,0,0,.25);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .brand h1{font-size:21px}
  /* One card per row. Left to auto-fill, a 600px viewport would still fit two
     288px columns and the photos would be postage stamps. */
  .cards{grid-template-columns:1fr}
  .hint{margin-inline-start:0;text-align:start;max-width:none}
  /* No padding-bottom override here any more — the base rule derives it from
     the measured bar height, which is the thing this breakpoint was standing
     in for. */
}
/* iOS Safari zooms the whole page when focusing an input under 16px, and the
   user has to pinch back manually. Not blocked with maximum-scale (that kills
   real zooming too, against WCAG) — raising touch-device input font size to
   the 16px no-zoom threshold is enough. Detected via hover:none, not width:
   an iPad's viewport is wider than any phone breakpoint and zooms anyway. */
@media (hover:none){
  .search,.msearch input,textarea{font-size:16px}
}
/* ═══════════════════════════════════════════════ Reduced motion
   Deliberately NOT *{transition:none!important}. Most transitions on this
   page are state feedback — which item is selected, which day is current,
   where the drag is — and a blanket kill removes the information too, making
   the page harder for vestibular-sensitive users, not easier.
   Only movement-and-scale animation stops here: states still change, they
   just snap instead of tweening. Color, background and opacity transitions
   all stay — they produce no motion. */
@media (prefers-reduced-motion: reduce){
  /* Markers and sidebar dots: the scale-up still happens (.on/.hi is the only
     visual cue for "which one is selected"); only the scaling *process* goes */
  .mk i,.mi .pin{transition:none}
  /* The toast used to slide up 14px. Drop the movement, keep the fade — it
     should still feel like it appears */
  .toast{transform:translate(-50%,0);transition:opacity .22s}
  .toast.on{transform:translate(-50%,0)}
  /* The card's hover lift is decoration, not state — unlike the markers above,
     nothing is lost by dropping the movement. The shadow and the darkened
     outline stay, so "the pointer is on this card" still reads. */
  .card{transition:border-color .15s,opacity .2s,box-shadow .15s}
  .card:hover{transform:none}
  /* Deck: the fly/windup/deal choreography goes (the DECK module also skips
     its timers under REDUCED.matches, so cards snap straight onto their
     piles); pile counts and stamps still change state. */
  .dk-card.dk-settle,.dk-card.dk-windup,.dk-card.dk-fly,.dk-card.dk-flyback,
  .dk-dock,.dk-vtrack i,.dk-act button{transition:none}
  .dk-mini.dk-pop,.dk-gcard.dk-deal,#dk-pileview.show{animation:none}
}
@media print{
  .top,.actionbar,.toolbar,.chips,.pick,
  .pgnav,.pgnav-btn,.pgnav-scrim{display:none!important}
  .card{break-inside:avoid;box-shadow:none}
  /* On paper there is no scanning to do — one column reads better, and a
     3:2 photo per place across 47 places is most of a toner cartridge.
     The photo shrinks to a strip; the fallback category mark goes entirely. */
  .cards{grid-template-columns:1fr}
  .media{aspect-ratio:auto;height:96px}
  .media:not(:has(img)){display:none}
  /* Three lines was a grid-tidiness constraint; print has no such constraint */
  .pitch{-webkit-line-clamp:none;display:block}
  /* The canvas is a screen surface. Printed it would be a full-bleed navy
     page most printers won't lay down anyway, and the dot lattice would come
     out as stipple. Group headings go back to paper ink for the same reason —
     on white, --canvas-ink is invisible. */
  body{background:#fff none}
  .group-h{border-bottom-color:var(--line-soft)}
  .group-h h2{color:var(--ink)}
  .group-h .meta{color:var(--ink-3)}
  .guide{border:0;box-shadow:none;padding:0}

  /* The guide always prints paginated — beforeprint switches it on if the
     reader didn't. Zero @page margin because .pg carries its own; leaving the
     browser's default 10mm on top of that would shrink every sheet to 96% and
     throw the measured layout away. */
  @page{size:A4;margin:0}
  /* With a zero page margin the sheet *is* the page, so anything the app puts
     around it prints too. Both of the layout's usual paddings did: main's 20px
     top pushed the first sheet 20px down the first page — which is why its
     footer sat lower than every other sheet's — and its 130px of bottom
     breathing room (there for the last card in the list view) spilled past the
     last sheet into an extra, blank page. */
  body{margin:0}
  /* !important because the standalone page sets main's bottom padding inline
     (see the STANDALONE branch in start) — 60px, enough on its own to push a
     ninth, blank page out of an eight-sheet guide. */
  body,main{margin:0!important;padding:0!important}
  main{max-width:none}
  /* height is written inline by fit() and is the *scaled* height; unscaled for
     print it would crop the sheets. */
  .pgwrap{position:static;height:auto!important}
  .paged{position:static;left:auto;transform:none!important}
  .pg{
    margin:0;box-shadow:none;border-radius:0;
    break-after:page;break-inside:avoid;
  }
  .pg:last-child{break-after:auto}
  /* Tints and rules carry meaning here — the time capsules, the table headers,
     the accent bar on a caution block. Without this the printer drops all of
     them and the page loses its structure. */
  .pg-body{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 class="title" id="title"><span class="tname">Trip</span></h1>
      <!-- Filled by boot(): one .mrow for the dates, one for party and pace -->
      <div class="metas" id="metas"></div>
    </div>
    <div class="navwrap">
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-list"  aria-selected="true"  aria-controls="view-list"  tabindex="0"  data-view="list"><span id="tab-list-txt">Places</span></button>
        <button class="tab" role="tab" id="tab-map"   aria-selected="false" aria-controls="view-map"   tabindex="-1" data-view="map">Map</button>
        <button class="tab" role="tab" id="tab-guide" aria-selected="false" aria-controls="view-guide" tabindex="-1" data-view="guide" disabled title="Available once the guide is written">Guide</button>
      </nav>
    </div>
  </div>
</header>

<main>
  <!-- ══════════════ View ① Place list ══════════════ -->
  <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list">
    <div class="toolbar">
      <!-- The deck is not a page of its own but another way of looking at
           this same set of places, so the switch lives here — first in the
           toolbar, before search/group/filter: "how do I want to browse"
           precedes everything else. The deck view carries a twin control at
           the same spot, so toggling never moves the control under the
           pointer. -->
      <div class="seg mode-seg" role="group" aria-label="Browse as">
