    // (dayConflict via dayBox) and in the detail flags. Keeping it here too
    // once meant it lost the one-warning slot to "unverified" exactly when
    // both applied. What remains splits in two: status closures are facts
    // that kill the visit (hard → red, matching .f-danger in the list view),
    // the rest are cautions (default chip).
    if(p.status === "permanently_closed") return { txt:T.wClosed, hard:true };
    if(p.status && p.status !== "open") return { txt:T.wAbnormal, hard:true };
    if(p.verify && p.verify.state && p.verify.state !== "verified") return { txt:T.wUnverified };
    if(p.booking === "required") return { txt:T.wBooking };
    return null;
  }

  function metaLine(p){
    if(isLodging(p)) return `<em>${T.lodging}</em>`;
    if(isStubP(p)) return `<em>${T.stubFacts}</em>`;
    const bits = [SCALE_TXT[p.scale] || p.scale, shortPrice(p.ticket)].filter(Boolean);
    const w = warnOf(p);
    return bits.map(x => `<em>${esc(x)}</em>`).join(" · ")
         + (w ? `<span class="w${w.hard ? " hard" : ""}">${esc(w.txt)}</span>` : "");
  }

  function focus(id, fromMap){
    st.focus = id;
    const p = PLACES.find(x => x.id === id);
    if(!p || !geo(p)) return;
    if(!fromMap && st.map){
      // Locating still happens, just without flying — "where the map jumped
      // to" is itself necessary feedback
      if(st.engine === "maplibre"){
        const to = { center:[p.coord.lon, p.coord.lat], zoom:Math.max(st.map.getZoom(), 14) };
        REDUCED.matches ? st.map.jumpTo(to) : st.map.flyTo({ ...to, duration:620 });
      }
      if(st.engine === "leaflet")  st.map.setView([p.coord.lat, p.coord.lon], Math.max(st.map.getZoom(), 15));
    }
    refresh();
    const item = document.querySelector(`.mi[data-card="${CSS.escape(id)}"]`);
    if(item && fromMap) item.scrollIntoView({ block:"nearest", behavior:REDUCED.matches ? "auto" : "smooth" });
  }

  /* ---------- Static fallback ---------- */
  function renderStatic(){
    const box = $("#map-canvas");
    const list = pts();
    if(!list.length){ box.innerHTML = ""; return; }
    const lons = list.map(p => p.coord.lon), lats = list.map(p => p.coord.lat);
    const x0 = Math.min(...lons), x1 = Math.max(...lons);
    const y0 = Math.min(...lats), y1 = Math.max(...lats);
    const sx = v => 8 + (x1 === x0 ? 50 : (v - x0) / (x1 - x0) * 84);
    const sy = v => 92 - (y1 === y0 ? 50 : (v - y0) / (y1 - y0) * 84);
    // Real elements rather than string concatenation, so styleDot stays the
    // single place that decides appearance — building strings would mean
    // rewriting the two-layer encoding, and the two copies would drift.
    box.innerHTML = `<div class="static-map"><div class="sm-grid"></div></div>`;
    const wrap = box.querySelector(".static-map");
    for(const p of list){
      if(!shown(p)) continue;
      const el = markerEl(p);
      el.style.left = sx(p.coord.lon) + "%";
      el.style.top  = sy(p.coord.lat) + "%";
      el.dataset.goto = p.id;
      wrap.appendChild(el);
    }
  }

  /* ---------- Engine startup ---------- */
  async function startMapLibre(){
    await Promise.all([loadCSS(MAPLIBRE_CSS), loadJS(MAPLIBRE_JS)]);
    if(!window.maplibregl) throw new Error(T.errMapLibre);
    const c = center();
    st.map = new maplibregl.Map({
      container:"map-canvas", style:await styleFor(st.base),
      center:[c.lon, c.lat], zoom:11.5, attributionControl:false,
    });
    await new Promise((res, rej) => {
      // The vector tile sources are free public services with no SLA, and
      // when they're slow they are really slow. 20 seconds is the measured
      // compromise: forgiving enough, without leaving the user waiting.
      //
      // But those 20 seconds may only count time while the page is *visible*.
      // In a background tab the browser suspends requestAnimationFrame, and
      // MapLibre's load event waits for the first render to finish — so it
      // never fires. This misfired twice in testing: the tile source itself
      // responded in 2 seconds, but because the tab was backgrounded, the
      // 20-second mark degraded to Leaflet, and switching back showed an
      // already-degraded map with every basemap button disabled and no way
      // to recover.
      let waited = 0, settled = false;
      const stop = () => { settled = true; clearInterval(tick); };
      const tick = setInterval(() => {
        if(document.hidden || settled) return;
        waited += 500;
        if(waited >= 20000){ stop(); rej(new Error(T.errVector20)); }
      }, 500);
      st.map.once("load", () => { if(!settled){ stop(); res(); } });
      // Only *network-shaped* failures count as "basemap unavailable".
      //
      // Two traps here. The first version rejected on any map error — an
      // exception entirely unrelated to the basemap (measured: a stray
      // queryRenderedFeatures against a nonexistent layer elsewhere) got
      // recorded as "Standard basemap unavailable", permanently disabling the
      // button and showing the user a misleading notice. The second version
      // filtered by keyword but put "style" in the regex, and that very error
      // contained "in the map's style" — matched again.
      //
      // So the test ignores wording and looks only at shape: either it
      // carries an HTTP status (AJAXError) or it says network failure
      // explicitly. Individual tile failures are watchTiles' job after load,
      // not this one's.
      st.map.on("error", e => {
        if(settled) return;
        if(st.map.isStyleLoaded && st.map.isStyleLoaded()) return;   // style is ready; not its problem
        const err = e && e.error;
        const msg = String((err && err.message) || (e && e.message) || "");
        const networkish = (err && typeof err.status === "number")
                        || /Failed to fetch|NetworkError|Load failed|ERR_/.test(msg);
        if(!networkish) return;
        stop(); rej(err || new Error(T.errBasemap));
      });
    });
    // Set after the await: during loading st.engine must not yet be
    // "maplibre", or a basemap button pressed at that moment would operate on
    // a map instance that may be torn down immediately.
    st.engine = "maplibre";
    applyTint(st.map, schemaOf(st.base));
    applyHide(st.map, schemaOf(st.base));
    addPoi(st.map, schemaOf(st.base));
    applyPoi();   // the Standard style ships POI layers all visible by default; narrow them by class
    // The transit layer is a bonus and must never drag the whole basemap down
    // — it happened in testing: addTransit threw, the exception bubbled all
    // the way to init's catch, the Standard basemap was judged "unavailable"
    // and disabled, and the user saw an inexplicable downgrade.
    try{ addTransit(); }
    catch(e){ console.warn("transit layer failed to load (basemap unaffected):", e); st.transitBroken = String(e.message || e); }
    // Route lines are added after the transit layer → drawn on top of it.
    // This is the user's own route; it outranks the reference rail map.
    try{ addRoute(); }catch(e){ console.warn("route lines failed to load (basemap unaffected):", e); }
    // Top-right: the bottom-right is occupied by the attribution, which would
    // cover half the zoom-out button
    st.map.addControl(new maplibregl.NavigationControl({ showCompass:false }), "top-right");
    st.map.resize();          // the container may have just gone from hidden to visible; re-measure
    fitAll();
    st.fitted = true;
  }

  async function startLeaflet(){
    await Promise.all([loadCSS(LEAFLET_CSS), loadJS(LEAFLET_JS)]);
    if(!window.L) throw new Error(T.errLeaflet);
    const c = center();
    // zoomControl defaults to top-left, covering the search/basemap button
    // row; moved to top-right to match maplibre
    st.map = L.map("map-canvas", { attributionControl:false, zoomControl:false }).setView([c.lat, c.lon], 12);
    L.control.zoom({ position:"topright" }).addTo(st.map);
    L.tileLayer(CARTO_RASTER[0], { maxZoom:19, referrerPolicy:"strict-origin-when-cross-origin" }).addTo(st.map);
    st.engine = "leaflet";
    st.base = null;           // CARTO isn't in BASEMAPS; it serves the fallback path only
  }

  function fitAll(){
    const l = pts();
    if(!l.length || !st.map) return;
    const lons = l.map(p => p.coord.lon), lats = l.map(p => p.coord.lat);
    const b = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];
    if(st.engine === "maplibre"){
      st.map.fitBounds(b, { padding:{ top:66, bottom:46, left:46, right:46 }, duration:0, maxZoom:15 });
    }else if(st.engine === "leaflet"){
      st.map.fitBounds([[b[0][1], b[0][0]], [b[1][1], b[1][0]]], { padding:[40,40], maxZoom:15 });
    }
  }

  /* Every return to the map view needs a resize + refit.
     MapLibre computes the camera from the container size at construction time
     and never corrects itself when the container changes — measured:
     initialize at 1200 wide, then stretch to 1280, and the viewport is off by
     0.7 zoom levels. Initializing while hidden (container height 0) is far
     worse. */
  function onShow(){
    measureLightness();   // a rect measured while the view was hidden reads 0
    if(!st.map) return;
    st.map.resize();
    if(!st.fitted){ fitAll(); st.fitted = true; }
  }

  /* Write the toolbar's measured height into --bar-h; the legend and search
     panel use it to clear the bar. A media query can't substitute: whether it
     wraps depends on the three capsules' actual widths, and the search
     placeholder, the number of basemap buttons and whether the Transit button
     exists all vary with language and data — the same breakpoint is one row
     in Chinese and two in German. Only a measurement is correct. */
  function watchBar(){
    const bar = document.querySelector(".map-bar"), main = document.querySelector(".map-main");
    if(!bar || !main) return;
    const sync = () => main.style.setProperty("--bar-h", `${Math.round(bar.getBoundingClientRect().height)}px`);
    sync();
    if(window.ResizeObserver) new ResizeObserver(sync).observe(bar);
  }

  /* Same reasoning as --bar-h, for the horizontal axis: .map-bar has to stop
     short of the lightness capsule, whose width is "Light|Dark" in English and
     「浅色|深色」 in Chinese. Measured, not guessed. The +7 matches .map-bar's
     own gap. Runs whenever the capsule is repainted; the capsule's own text
     never changes after that, so no observer is needed. */
  /* Measures the whole top-right column, not just the lightness capsule: the
     export button below it is the wider of the two, and reserving only the
     capsule's width lets the toolbar's first row run under export once it
     wraps on a phone. */
  function measureLightness(){
    const g = $("#map-rt"), main = document.querySelector(".map-main");
    if(!g || !main) return;
    const w = Math.round(g.getBoundingClientRect().width);
    main.style.setProperty("--tgl-w", w ? `${w + 7}px` : "0px");
  }

  /* ResizeObserver must only resize when the size genuinely changed.
     The trap we hit: rebuilding the sidebar's HTML makes the scrollbar appear
     or disappear, the container width shifts a few pixels and triggers
     resize(), and resize interrupts an in-flight camera animation — presenting
     as "clicking the sidebar doesn't fly the map", intermittently, and
     extremely hard to track down. */
  function watchResize(){
    const el = document.querySelector(".map-main");
    if(!el || !window.ResizeObserver) return;
    let last = `${el.clientWidth}x${el.clientHeight}`, t;
    new ResizeObserver(() => {
      const now = `${el.clientWidth}x${el.clientHeight}`;
      if(now === last) return;
      last = now;
      clearTimeout(t);
      t = setTimeout(() => { if(st.map && st.map.resize) st.map.resize(); }, 180);
    }).observe(el);
  }

  /* styleFor("gb") fetches a style JSON, so it's async. Clicking
     "Standard → Simple" in quick succession can let graybeard's fetch return
     last, and setStyle then overwrites positron — the button reads "Simple"
     while the map is "Standard". An incrementing token discards the stale
     request. */
  let switchSeq = 0;
  async function switchBase(id){
    if(st.engine !== "maplibre" || id === st.base) return;
    const seq = ++switchSeq;
    st.base = id;
    $$("#basemaps button").forEach(b => b.setAttribute("aria-pressed", b.dataset.base === id));
    syncLightness();   // Raster grays out the Dark button; leaving it re-enables
    let style;
    try{
      style = await styleFor(id);
    }catch(e){
      if(seq !== switchSeq) return;
      note(`<b>${esc((BASEMAPS.find(x => x.id === id) || {}).label || id)}</b> ${T.loadFail}${esc(e.message || e)}`);
      return;
    }
    if(seq !== switchSeq) return;        // something else was clicked meanwhile; void this one
    st.map.setStyle(style);
    st.map.once("styledata", () => {
      if(seq !== switchSeq) return;
      applyTint(st.map, schemaOf(id));   // setStyle swaps everything; tint patches and the transit layer must be re-added
      applyHide(st.map, schemaOf(id));
      addPoi(st.map, schemaOf(id));
      applyPoi();
      try{ addTransit(); }catch(e){ console.warn("failed to re-add the transit layer:", e); }
      try{ addRoute(); }catch(e){ console.warn("failed to re-add the route lines:", e); }
      addMarkers();
      setAttrib();
    });
  }

  /* Basemap lightness switch.
     The only writer of st.mapDark, and the page's only light/dark control (see
     storedMapDark).

     Reuses switchBase by nulling st.base first — the style URL for the current
     basemap has changed, so it is a genuine restyle, just one that lands on
     the same id. That also inherits switchBase's sequence token, so
     light→dark→light hammering can't leave the map on a stale style. */
  function setMapDark(dark){
    dark = !!dark;
    if(dark === st.mapDark) return;
    st.mapDark = dark;
    try{ localStorage.setItem(MAPDARK_KEY, dark ? "1" : "0"); }catch(e){}
    const b = BASEMAPS.find(x => x.id === st.base);
    // Raster has no dark half: record the preference for when the user
    // switches back to a vector basemap, but leave the map alone.
    if(st.engine !== "maplibre" || !b || b.noDark){ syncLightness(); return; }
    const id = st.base;
    st.base = null;                 // bypass switchBase's "same basemap, do nothing" guard
    switchBase(id);
    syncLightness();
  }

  /* The same trip open in two tabs (common under --serve): switch in tab A and
     tab B's localStorage changes, but its map and buttons won't follow on
     their own. The storage event only fires in *other* tabs, so no loop. */
  window.addEventListener("storage", e => {
    if(e.key !== MAPDARK_KEY) return;
    setMapDark(storedMapDark());
  });

  /* ---------- Place search (Nominatim) ----------
     A spontaneous urge to visit somewhere outside the list: search → the map
     flies over and drops a candidate pin → on confirmation it enters the data
     as a "stub" (name + coordinates + OSM source only), with research fields
     left for the AI to fill in later.

     Why Nominatim and not Photon: Photon's public instance only indexes the
     default/en/de/fr names, so searching 「大英博物馆」 in Chinese returns
     nothing; Nominatim indexes all of OSM's name:* tags and matches Chinese,
     English and local-language names alike (measured, down to restaurant-level
     long-tail POIs). The cost is that its usage policy forbids autocomplete —
     hence a single Enter-triggered search, no type-ahead. */
  const NOMINATIM = "https://nominatim.openstreetmap.org/search";
  let results = [], cand = null, candMk = null, searching = false, lastSearch = 0;

  function searchPanel(html){
    const el = $("#msq-panel");
    if(!el) return;
    el.hidden = !html;
    el.innerHTML = html || "";
  }

  // The panel is silent to screen readers (asynchronously inserted DOM isn't
  // announced on its own), so each stage also speaks into the persistent
  // #msq-status region.
  const msqSay = txt => {
    const el = $("#msq-status");
    if(el) el.textContent = txt;
  };

  async function doSearch(){
    const q = $("#msq").value.trim();
    if(!q || searching) return;
    searching = true;
    // Policy limit: 1 req/s. Enter-triggered search rarely exceeds it; this
    // only guards against hammering the Enter key
    const wait = 1100 - (Date.now() - lastSearch);
    if(wait > 0) await new Promise(r => setTimeout(r, wait));
    lastSearch = Date.now();
    searchPanel(`<div class="sr-note">${T.searching}</div>`);
    msqSay(T.searching);
    try{
      const u = new URL(NOMINATIM);
      u.search = new URLSearchParams({
        q, format: "jsonv2", limit: "6", addressdetails: "1", namedetails: "1",
        // Display names follow the trip page's language; viewbox only biases,
        // never filters (bounded defaults to 0) — spontaneous additions are
        // often outside the bbox, e.g. adding Nara to an Osaka trip
        "accept-language": TRIP.output_language || "en",
        ...(Array.isArray(TRIP.bbox) && TRIP.bbox.length === 4
            ? { viewbox: TRIP.bbox.join(",") } : {}),
      });
      const r = await fetch(u);
      if(!r.ok) throw new Error("HTTP " + r.status);
      const list = await r.json();
      if(!Array.isArray(list) || !list.length){
        searchPanel(`<div class="sr-note">${tf("notFound", { q: esc(q) })}</div>`);
        msqSay(tf("notFoundSay", { q }));
        return;
      }
      results = list;
      msqSay(tf("foundSay", { n: list.length }));
      searchPanel(list.map((x, i) =>
        `<button class="sr" type="button" data-sr="${i}">
           <b>${esc(x.name || (x.display_name || "").split(",")[0])}</b>
           <span>${esc(x.display_name || "")}</span>
         </button>`).join(""));
    }catch(e){
      searchPanel(`<div class="sr-note">${tf("searchFail", { e: esc(e.message || e) })}</div>`);
      msqSay(T.searchFailSay);
    }finally{ searching = false; }
  }

  function clearCand(){
    cand = null;
    if(candMk){ candMk.remove && candMk.remove(); candMk = null; }
    const c = document.getElementById("cand-card");
    if(c) c.remove();
  }

  function pickResult(i){
    const x = results[i];
    if(!x) return;
    const lon = +x.lon, lat = +x.lat;
    if(!isFinite(lon) || !isFinite(lat)) return;
    const nd = x.namedetails || {}, ad = x.address || {};
    const outLang = (TRIP.output_language || "").split("-")[0];
    clearCand();
    cand = {
      // Prefer the name:xx in the trip page's language — display_name's first
      // segment can be a house number
      name: (outLang && nd["name:" + outLang]) || x.name || (x.display_name || "").split(",")[0].trim(),
      name_local: (LOCAL_LANG && (nd["name:" + LOCAL_LANG] || nd.name)) || null,
      area: ad.suburb || ad.city_district || ad.town || ad.village || ad.city || "",
      lon, lat,
      osm: x.osm_type && x.osm_id ? `https://www.openstreetmap.org/${x.osm_type}/${x.osm_id}` : null,
      addr: x.display_name || "",
    };
    searchPanel("");
    // Candidate pin + fly there. The static fallback engine has no
    // interactive map, so the pin is skipped and only the card is shown
    if(st.map){
      const el = document.createElement("div");
      el.className = "mk cand";
      el.setAttribute("aria-hidden", "true");   // purely visual drop marker; the information lives in the candidate card
      el.innerHTML = "<i></i>";
      if(st.engine === "maplibre"){
        candMk = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(st.map);
        const to = { center: [lon, lat], zoom: Math.max(st.map.getZoom(), 14) };
        REDUCED.matches ? st.map.jumpTo(to) : st.map.flyTo({ ...to, duration: 620 });
      }else if(st.engine === "leaflet"){
        candMk = L.marker([lat, lon],
          { icon: L.divIcon({ className: "", html: el.outerHTML, iconSize: [23, 23] }) }).addTo(st.map);
        st.map.setView([lat, lon], Math.max(st.map.getZoom(), 15));
      }
    }
    const d = curDayObj();
    const div = document.createElement("div");
    div.id = "cand-card";
    div.innerHTML = `<b>${esc(cand.name)}</b>
      <div class="addr">${esc(cand.addr)}</div>
      <div class="row">
        <button class="btn sm primary" data-cand="list">${T.addToList}</button>
        ${d ? `<button class="btn sm" data-cand="day">${esc(tf("addToDay", { day: dayLabel(d) }))}</button>` : ""}
        <button class="btn sm" data-cand="x">${T.cancel}</button>
      </div>
      <div class="hint">${T.candHint}</div>`;
    document.querySelector(".map-main").appendChild(div);
  }

  function addCand(toDay){
    if(!cand) return;
    const stub = {
      id: "u-" + Date.now().toString(36),
      name: cand.name,
      area: cand.area || T.manualArea,
      coord: { lon: cand.lon, lat: cand.lat },
      origin: "user",
      choice: "yes",   // deliberately searched for and added — "yes" goes without saying
      sources: [{ url: cand.osm || "https://www.openstreetmap.org", title: "OpenStreetMap" }],
    };
    if(cand.name_local && cand.name_local !== stub.name) stub.name_local = cand.name_local;
    PLACES.push(stub);   // PLACES *is* the DATA.places array, so payload/patch see it
    if(DATA.places !== PLACES) (DATA.places = DATA.places || []).push(stub);
    BY_ID[stub.id] = stub;
    clearCand();
    $("#msq").value = "";
    addMarkers();                       // refresh only repaints existing markers; the new point must be created first
    if(toDay) toggleInCurDay(stub.id);  // goes through commit internally: repaint all three + trigger save
    else commit();
    render();                           // the list view's cards and progress
    focus(stub.id, false);
    toast(tf("addedToast", { name: stub.name }));
  }

  $("#msq")?.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); doSearch(); }
    if(e.key === "Escape"){ searchPanel(""); clearCand(); }
  });
  const msqGo = $("#msq-go");
  if(msqGo) msqGo.onclick = doSearch;

  document.addEventListener("click", e => {
    const sr = e.target.closest("#msq-panel .sr");
    if(sr){ pickResult(+sr.dataset.sr); return; }
    const cb = e.target.closest("#cand-card [data-cand]");
    if(cb){
      const op = cb.dataset.cand;
      if(op === "x") clearCand();
      else addCand(op === "day");
      return;
    }
    // Click outside the search area → collapse the result panel (the
    // candidate card stays; it waits for an explicit decision)
    if(!e.target.closest(".msearch") && !e.target.closest("#msq-panel")) searchPanel("");
  });

  /* ---------- Entry point ---------- */
  async function init(){
    if(st.ready) return;
    st.ready = true;

    /* The pool and schedule columns depend only on data, not on the basemap —
       so paint them first. They used to sit after await startMapLibre(), and
       since vector tiles are a free service with no SLA, on a slow network
       both columns stayed blank alongside the basemap for up to 20 seconds,
       looking simply "broken".
       The order matters: renderDays runs first (it settles st.curDay), and
       renderSide's dot labels need the current day. Markers still wait for
       the map to be ready. */
    renderDays();
    renderSide();

    if(!pts().length){
      $("#map-canvas").innerHTML = `<div class="empty-state"><div class="big">${T.noCoords}</div>
        <div>${T.noCoordsSub}</div></div>`;
      return;
    }

    paintBaseButtons();
    paintLightness();

    const problems = [];
    const webgl = hasWebGL();
    if(!webgl) problems.push(T.noWebgl);

    try{
      if(!webgl) throw new Error(T.needWebgl);
      try{
        await startMapLibre();
      }catch(eGb){
        // A dead default vector source needn't drop straight to Leaflet —
        // there's a second vector source, run by a different operator on a
        // different schema, that won't fail alongside it.
        if(st.base === "ofm"){
          problems.push(tf("ofmFail", { e: eGb.message || eGb }));
          if(st.map && st.map.remove){ try{ st.map.remove(); }catch(_){} }
          st.map = null;
          $("#map-canvas").innerHTML = "";
          st.base = "gb";
          $$("#basemaps button").forEach(b => b.setAttribute("aria-pressed", b.dataset.base === "gb"));
          const dead = document.querySelector('#basemaps [data-base="ofm"]');
          if(dead){ dead.disabled = true; dead.title = T.bmDead + (eGb.message || eGb); }
          await startMapLibre();
          note(problems.join(T.listSep) + " " + T.unaffected);
        }else throw eGb;
      }
      watchTiles();
      probe("osm");                     // not awaited: a slow probe must not hold up the map
      if(hasTransit() && !st.transitBroken){
        $("#transit-group").hidden = false;
        paintLegend();
      }else if(st.transitBroken){
        note(tf("transitFailNote", { e: esc(st.transitBroken) }));
      }
    }catch(e1){
      problems.push(tf("vectorFail", { e: e1.message || e1 }));
      try{
        if(st.map && st.map.remove) { try{ st.map.remove(); }catch(_){} }
        st.map = null;
        $("#map-canvas").innerHTML = "";
        await startLeaflet();
        st.degraded = true;
        fitAll(); st.fitted = true;
        note(tf("degradedNote", { p: problems.join(T.listSep) }));
        lockBaseButtons(T.degradedLock);
      }catch(e2){
        problems.push(tf("rasterFail", { e: e2.message || e2 }));
        st.degraded = true;
        st.engine = "static";
        st.map = null;
        note(tf("allDead", { p: problems.join(T.listSep) }));
        lockBaseButtons(T.noBasemap);
      }
    }

    setAttrib();
    syncLightness();   // the engine is settled only now: fallbacks lock it, and
                       // the ofm→gb rescue path above changes st.base directly
    addMarkers();
    renderSide();
    renderDays();
    watchBar();
    watchResize();
  }

  /* ---------- Export ---------- */
  function selected(){
    return pts().filter(shown);
  }
  function csvCell(v){
    const s = String(v ?? "").replace(/"/g, '""');
    return /[",\n]/.test(s) ? `"${s}"` : s;
  }
  function toCSV(){
    const rows = [["Name","Latitude","Longitude","Description","Category","Choice","URL"]];
    for(const p of selected()){
      rows.push([
        p.name_en || p.name, p.coord.lat, p.coord.lon,
        [p.name, p.name_local, p.pitch, p.hours && T.kvHours + " " + p.hours, p.ticket].filter(Boolean).join(" | "),
        CATMAP[p.category] || p.category,
        { yes:T.yes, maybe:T.maybe, no:T.no }[p.choice] || T.none,
        (p.sources || [])[0]?.url || "",
      ]);
    }
    return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\n");
  }
  function save(text, name, mime){
    saveFile(text, name, mime);
    toast(tf("exported", { name, n: selected().length }));
  }

  /* ---------- Two-way hover linking ----------
     Mouse over a list entry → the matching map marker enlarges and shows its
     name; mouse over a map marker → the matching entry highlights.
     The reverse direction only highlights, never scrolls — a list that jumps
     around under the mouse is dizzying. */
  function hilite(id, on){
    const mk = st.markers.get(id);
    const el = mk && mk.getElement ? mk.getElement()
             : document.querySelector(`.static-map .mk[data-goto="${CSS.escape(id)}"]`);
    if(el) el.classList.toggle("hi", on);
    const item = document.querySelector(`.mi[data-card="${CSS.escape(id)}"]`);
    if(item) item.classList.toggle("on", on || st.focus === id);
  }

  for(const [evt, on] of [["mouseover", true], ["mouseout", false]]){
    document.addEventListener(evt, e => {
      const src = e.target.closest("[data-card]") || e.target.closest(".mk");
      if(!src) return;
      const id = src.dataset.card || src.dataset.id || src.dataset.goto;
      if(id) hilite(id, on);
    });
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", e => {
    // The dot is a state control: clicking it adds/removes the place from the
    // *current day*. It must come before "click card → open details", or this
    // branch is never reached.
    const pin = e.target.closest(".map-side .mi .pin");
    if(pin){
      const row = pin.closest("[data-card]");
      if(row) toggleInCurDay(row.dataset.card);
      return;
    }
    // Delete a whole day. It reuses the .dop style class, so it must precede
    // the .dop branch below — otherwise that branch matches first, finds no
    // .ditem, returns immediately and swallows the event.
    const dd = e.target.closest("[data-delday]");
    if(dd){ removeDay(+dd.dataset.delday); return; }
    // ↑ ↓ × on a schedule entry
    const dop = e.target.closest(".dop");
    if(dop){
      const row = dop.closest(".ditem");
      if(row) dayItemOp(+row.dataset.day, +row.dataset.i, dop.dataset.op);
      return;
    }
    // List entry → open details. It used to fly the map to the point, but
    // hover already handles locating, and what you actually want on opening a
    // card is "what is this place".
    const card = e.target.closest("[data-card]");
    if(card){ openDetail(card.dataset.card, card); return; }
    // data-goto is now used only by markers on the static fallback map
    const go = e.target.closest("[data-goto]");
    if(go){ focus(go.dataset.goto, false); return; }
    const bm = e.target.closest("#basemaps button");
    if(bm && !bm.disabled){ switchBase(bm.dataset.base); return; }
    const ml = e.target.closest("#map-lightness button");
    if(ml && !ml.disabled){ setMapDark(ml.dataset.mdark === "1"); return; }
    const tb = e.target.closest("#transit-btn");
    if(tb && !tb.disabled){ setTransitVisible(tb.getAttribute("aria-pressed") !== "true"); return; }
    const lg = e.target.closest("#map-legend");
    // The slider is the one thing in the legend that must not toggle
    // expand/collapse: releasing it bubbles a mouseup into a click, and
    // without this exclusion every opacity adjustment would flip the legend.
    if(lg && !e.target.closest(".lg-op")){
      const open = lg.classList.toggle("open");
      st.legendOpen = open;
      const btn = lg.querySelector(".lg-toggle");
      if(btn) btn.setAttribute("aria-expanded", String(open));
      const hint = lg.querySelector(".lg-hint");
      if(hint) hint.textContent = open ? T.legendCollapse : T.legendExpand;
      return;
    }
    const dm = e.target.closest("[data-dmode]");
    if(dm){ st.flat = dm.dataset.dmode === "all"; renderDays(); return; }
    const da = e.target.closest("#day-add");
    if(da){ st.addOpen = !st.addOpen; renderDays(); return; }
    const am = e.target.closest(".addmenu button");
    if(am){ st.addOpen = false; addDay(am.dataset.add); return; }
    if(st.addOpen && !e.target.closest(".addmenu")){ st.addOpen = false; renderDays(); }
    // Clicking the already-selected day deselects it — null (no focus) is a
    // first-class state, not an error.
    const cap = e.target.closest(".caps button");
    if(cap){ const n = +cap.dataset.day; setCurDay(n === st.curDay ? null : n); return; }
    const dh = e.target.closest(".dhead");
    if(dh && !e.target.closest("[data-delday]")){
      const n = +dh.parentElement.dataset.day;
      setCurDay(n === st.curDay ? null : n);
      return;
    }
    const mf = e.target.closest(".mfil");
    if(mf){
      const on = mf.getAttribute("aria-pressed") === "true";
      mf.setAttribute("aria-pressed", !on);
      on ? st.show.delete(mf.dataset.c) : st.show.add(mf.dataset.c);
      refresh();
      return;
    }
    // Repaint the sidebar only: the grouping mode doesn't affect markers, the
    // schedule or the map viewport, and going through refresh() would repaint
    // the map as well, needlessly discarding the current focus state.
    const mg = e.target.closest(".mgrp");
    if(mg && st.grp !== mg.dataset.g){
      st.grp = mg.dataset.g;
      for(const b of $$(".mgrp")) b.setAttribute("aria-pressed", b === mg);
      renderSide();
    }
  });

  /* input rather than change: setPaintProperty is instant, and the transit
     layer should visibly fade *during* the drag — "how faint is right" can
     only be judged by watching, and applying it on release turns it into
     guesswork. */
  document.addEventListener("input", e => {
    const sl = e.target.closest(".lg-op input");
    if(!sl) return;
    st.opacity = +sl.value;
    applyTransitOpacity();
  });

  return { init, refresh, onShow, fitAll, ensureDays:autoItinerary,
           curDay:() => st.curDay, toggleDay:toggleInCurDay,
           exportCSV:() => save(toCSV(), "places.csv", "text/csv;charset=utf-8"),
           _st:st };
})();

window.MAP = MAP;
window.initMap = MAP.init;
/* There is no PDF writer in a single self-contained HTML file, and there does
   not need to be — every browser's print dialog has one. beforeprint puts the
   guide on sheets first, so this exports the same layout at any window size. */
const pgBtn = $("#pg-print");
if(pgBtn) pgBtn.onclick = () => print();
/* The Markdown twin of the PDF: same guide, in the form you can paste, edit
   and hand to an AI. "guide.md" rather than the destination's name, matching
   places.csv / places.json / guide.html — every file this page writes is named
   for what it is. */
const mdBtn = $("#pg-md");
if(mdBtn) mdBtn.onclick = () => {
  saveFile(toMarkdown(), "guide.md", "text/markdown;charset=utf-8");
  toast(tf("exported", { name:"guide.md", n: PLACES.length }));
};
$("#exp-csv").onclick = () => MAP.exportCSV();

/* ═══════════════════════════════════════════════════════════════════
   Guide view

   route.md is written by the AI (body text, route rationale, day-by-day
   stops); the three blocks below are page-generated so they always match the
   data:
     · Weather   — fetched live from Open-Meteo in the browser, current on
                   every open
     · Costs     — ticket totals summed per itinerary day; only an empty
                   schedule falls back to estimating from choice
     · Checklist — the top half lists the itinerary day by day, the bottom
                   half lists the rest by choice; both read the data directly
                   and cannot disagree with the list or the schedule
   ═══════════════════════════════════════════════════════════════════ */
const GUIDE = (() => {

  /* ---------- Weather ----------
     Open-Meteo is free, key-less and CORS-friendly.
     ≤16 days uses the forecast; beyond forecast range it falls back to
     same-period historical averages, explicitly labeled as not a forecast. */
  /* Weather is text only, no icons. Each card used to carry an emoji
     (☀️🌦⛈…); they were removed because the card title already says the same
     thing ("09-12 Sat · light rain"), making the icon a tautology — and
     emoji glyphs and colors are decided by the system, so a row of cards
     looks differently proportioned on different machines.
     The text descriptions come from T.wmo (en/zh built in, other languages
     overridable via ui.wmo), with any missing code falling back to English. */
  const wmo = c => (T.wmo || {})[c] || I18N.en.wmo[c] || "—";

  function anchor(){
    const b = (TRIP.bases || [])[0];
    if(b && b.coord && typeof b.coord.lon === "number") return b.coord;
    const l = pts0();
    if(l.length) return { lon:l.reduce((s,p)=>s+p.coord.lon,0)/l.length,
                          lat:l.reduce((s,p)=>s+p.coord.lat,0)/l.length };
    const bb = TRIP.bbox;
    return bb ? { lon:(bb[0]+bb[2])/2, lat:(bb[1]+bb[3])/2 } : null;
  }
  const pts0 = () => PLACES.filter(p => p.coord && typeof p.coord.lon === "number");

  async function fetchForecast(c, start, end){
    const u = new URL("https://api.open-meteo.com/v1/forecast");
    u.search = new URLSearchParams({
      latitude:c.lat, longitude:c.lon, timezone:TRIP.timezone || "auto",
      start_date:start, end_date:end,
      daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum",
    });
    const r = await fetch(u);
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  /* Beyond forecast range: average the historical observations for the same
     dates over the past 8 years. This is a climate average, not a forecast —
     the UI must say so plainly or it misleads the user. */
  async function fetchNormals(c, days){
    const yr = new Date().getFullYear();
    const years = [];
    for(let y = yr - 8; y < yr; y++) years.push(y);
    const md = days.map(d => d.iso.slice(5));
    const out = md.map(() => ({ tmax:[], tmin:[], rain:[], wet:0, n:0 }));
    await Promise.all(years.map(async y => {
      const u = new URL("https://archive-api.open-meteo.com/v1/archive");
      u.search = new URLSearchParams({
        latitude:c.lat, longitude:c.lon, timezone:TRIP.timezone || "auto",
        start_date:`${y}-${md[0]}`, end_date:`${y}-${md[md.length-1]}`,
        daily:"temperature_2m_max,temperature_2m_min,precipitation_sum",
      });
      try{
        const r = await fetch(u);
        if(!r.ok) return;
        const j = await r.json();
        (j.daily?.time || []).forEach((t, i) => {
          const k = md.indexOf(t.slice(5));
          if(k < 0) return;
          const o = out[k];
          if(j.daily.temperature_2m_max[i] != null) o.tmax.push(j.daily.temperature_2m_max[i]);
          if(j.daily.temperature_2m_min[i] != null) o.tmin.push(j.daily.temperature_2m_min[i]);
          const p = j.daily.precipitation_sum[i];
          if(p != null){ o.rain.push(p); if(p >= 1) o.wet++; o.n++; }
        });
      }catch(e){ /* one failed year doesn't invalidate the overall average */ }
    }));
    const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
    return out.map(o => ({
      tmax:avg(o.tmax), tmin:avg(o.tmin),
      wetRate:o.n ? Math.round(o.wet / o.n * 100) : null, samples:o.tmax.length,
    }));
  }

  function card(label, desc, tmax, tmin, rainLine){
    const t = v => v == null ? "—" : Math.round(v);
    return `<div class="wx-d">
      <div class="d" title="${esc(desc)}">${esc(label)}</div>
      <div class="t">${t(tmax)}°<span class="sub"> / ${t(tmin)}°</span></div>
      <div class="r">${rainLine}</div>
    </div>`;
  }

  async function renderWeather(){
    const box = $("#wx-box");
    if(!DAYS.length){ box.innerHTML = ""; return; }
    const c = anchor();
    if(!c){ box.innerHTML = ""; return; }

    box.innerHTML = `<div class="wx-src">${T.wxLoading}</div>`;
    const today = new Date(); today.setHours(0,0,0,0);
    const lead = Math.round((DAYS[DAYS.length-1].date - today) / 864e5);

    try{
      if(lead <= 16 && DAYS[0].date >= new Date(today.getTime() - 864e5)){
        const j = await fetchForecast(c, DAYS[0].iso, DAYS[DAYS.length-1].iso);
        const d = j.daily || {};
        box.innerHTML = `<div class="wx">` + (d.time || []).map((t, i) => {
          const desc = wmo(d.weather_code[i]);
          const pp = d.precipitation_probability_max?.[i];
          const ps = d.precipitation_sum?.[i];
          const rain = pp != null && pp >= 30
            ? tf("precipProbHi", { p: pp, mm: ps ? ` · ${ps}mm` : "" })
            : tf("precipProb", { p: pp ?? "—" });
          const wd = ((new Date(t + "T00:00:00").getDay() + 6) % 7) + 1;
          return card(`${t.slice(5)} ${WD_NAMES[wd]} · ${desc}`, desc, d.temperature_2m_max[i], d.temperature_2m_min[i], rain);
        }).join("") + `</div>
        <div class="wx-src">${T.wxLive}</div>`;
      }else{
        const n = await fetchNormals(c, DAYS);
        box.innerHTML = `<div class="wx">` + DAYS.map((d, i) => {
          const o = n[i] || {};
          const rain = o.wetRate == null ? "—"
            : tf("wetRate", { p: o.wetRate });
          return card(`${d.iso.slice(5)} ${WD_NAMES[d.wd]} · ${T.climate}`, T.climateDesc,
                      o.tmax, o.tmin, rain);
        }).join("") + `</div>
        <div class="wx-src est">${tf("wxEstWarn", { n: lead })}</div>`;
      }
    }catch(e){
      box.innerHTML = `<div class="wx-src est">${tf("wxFail", { e: esc(e.message) })}</div>`;
    }
  }

  /* ---------- Cost summary ----------
     ticket is free text ("¥600", "permanent collection around ¥1200, special
     exhibitions extra", "free") and cannot be summed reliably. So: sum what
     parses, list what doesn't verbatim with an explicit note, and never
     pretend to have computed an exact total. */
  /* The amount must be searched for before testing "free".
     Counterexample: "Keep ¥600 (free under junior-high)" — matching "free"
     first would count 600 as 0 and undercount a ticket in the total. If an
     amount appears at all, the amount wins. */
  function parseMoney(s){
    if(!s) return null;
    const m = String(s).match(/[¥￥$€£]\s*([\d,]+(?:\.\d+)?)|([\d,]+(?:\.\d+)?)\s*(?:日元|円|元|yen|JPY)/i);
    if(m){
      const v = parseFloat((m[1] || m[2]).replace(/,/g, ""));
      if(!isNaN(v)) return v;
    }
    if(/^[^0-9]*(免费|免費|free|無料|无料)[^0-9]*$/i.test(s.trim())) return 0;
    return null;
  }

  /* Costs are computed from the **schedule**, not from choice.
     Once the user has scheduled, "what you'll actually spend" is the places
     assigned to a day — many of them marked "maybe" but genuinely scheduled,
     while a place marked "yes" that never made it into any day (the one too
     far away, say) costs nothing at all. Computing from choice over- and
     under-counts simultaneously.
     Only an empty schedule (nothing arranged yet) falls back to estimating
     from choice=yes. */
  function costRows(list, dayLabel){
    let sum = 0, parsed = 0;
    const unparsed = [];
    const rows = list.map(p => {
      const v = parseMoney(p.ticket);
      if(v == null) unparsed.push(p.name);
      else { sum += v; parsed++; }
      return `<div class="ck">
        <span class="m">${v === 0 ? "○" : v == null ? "?" : "●"}</span>
        <span class="n">${esc(p.name)}<span class="sub">${esc(p.ticket)}</span></span>
      </div>`;
    }).join("");
    return { html: (dayLabel ? `<div class="sum-d">${esc(dayLabel)}</div>` : "") + rows,
             sum, parsed, unparsed };
  }

  function renderCost(){
    const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
    // A place scheduled on two days (a two-day exhibition, say) is still one
    // ticket, so deduplicate by id
    const seen = new Set();
    const groups = [];
    for(const d of days){
      const list = [];
      for(const e of d.places){
        const p = BY_ID[e.id];
        if(!p || isLodging(p) || seen.has(p.id)) continue;
        seen.add(p.id);
        list.push(p);
      }
      if(list.length) groups.push([tf("dayN", { n: d.n }) + (d.date ? " · " + d.date.slice(5) : ""), list]);
    }
    const byDay = groups.length > 0;
    if(!byDay){
      const going = PLACES.filter(p => p.choice === "yes" && !isLodging(p));
      if(!going.length) return "";
      groups.push([null, going]);
    }

    let sum = 0, parsed = 0, n = 0;
    const unparsed = [];
    const html = groups.map(([label, list]) => {
      const r = costRows(list, label);
      sum += r.sum; parsed += r.parsed; n += list.length;
      unparsed.push(...r.unparsed);
      return r.html;
    }).join("");
    const all = groups.flatMap(([, l]) => l);
    const cur = /[¥￥]|日元|円/.test(all.map(p => p.ticket).join("")) ? "¥" : "";
    return `<h3>${T.costTitle}</h3>
      <div class="sum">
        <div class="sum-h">${T.costHead}<span>${byDay ? tf("costScheduled", { n }) : tf("costWanted", { n })}</span></div>
        ${html}
        <div class="cost-total">${tf("costTotal", { n: parsed, cur, sum: sum.toLocaleString() })}</div>
        ${byDay ? "" : `<div class="caveat">${T.costNoSched}</div>`}
        ${unparsed.length ? `<div class="caveat">${tf("costUnparsed", { n: unparsed.length, list: esc(unparsed.join(T.listSep)) })}</div>`
          : `<div class="caveat">${T.costOnly}</div>`}
      </div>`;
  }

  /* ---------- All-places checklist ----------
     Generated straight from choice, so it cannot disagree with the list view.
     Dropped places are listed too — making it easy to judge whether to bring
     one back. */
  /* One box per group, flowed through two columns (see .bento): a day is one
     box, and each leftover rating is another. The groups answer different
     questions — "which ones on that day" vs "did I miss anything" — so they
     were never rows of one table, and as one long column a 50-place trip ate
     two A4 sheets of margin. Boxed and paired up, it fits on one. */
  function ckBox(title, count, rows, cls, caveat){
    return `<div class="sum${cls ? " " + cls : ""}">
      <div class="sum-h">${title}<span>${count}</span></div>
      ${rows}
      ${caveat ? `<div class="caveat">${caveat}</div>` : ""}
    </div>`;
  }

  function ckRow(p, mark, out, extra, cls, bare){
    // Lodging has no scale, and concatenating directly would leave a lone "·"
    const scale = bare ? "" : SCALE_TXT[p.scale] || p.scale || (isLodging(p) ? T.lodging : "");
    return `<div class="ck${out ? " out" : ""}">
      <span class="m${cls ? " " + cls : ""}">${mark}</span>
      <span class="n">${esc(p.name)}<span class="sub">${esc(p.area)}${scale ? " · " + esc(scale) : ""}</span></span>
      ${extra || (p.choice_reason ? `<span class="why">${esc(p.choice_reason)}</span>` : "")}
    </div>`;
  }

  /* Two columns, tallest box first into whichever column is currently shorter
     — the standard greedy pass, and on this shape it lands on the optimal
     split. Sizes are measured, not counted in rows: a 9-place day and a
     9-place drop list differ by half again in height, and packing by count
     left one column 340px longer than the other. Row count is the fallback
     for when this runs with the view still hidden and every box measures 0. */
  function packBento(b){
    if(!b) return;
    const boxes = [...b.querySelectorAll(".sum")].map((el, i) => ({
      el, i, h: el.getBoundingClientRect().height || 2 + el.querySelectorAll(".ck").length,
    }));
    b.textContent = "";
    const cols = [0, 1].map(() => {
      const c = document.createElement("div");
      c.className = "bento-col";
      b.appendChild(c);
      return c;
    });
    // Assign biggest-first, because that is what balances; then hand each
    // column back its boxes in document order, because that is what reads.
    // Assigning in document order instead costs ~100px of balance; sorting
    // the columns' contents afterwards costs nothing.
    const h = [0, 0], pick = [[], []], rest = boxes.slice();
    // The first box is nailed to column one first, so the sheet opens on day
    // one whatever the balancer would otherwise do with it.
    if(rest.length){ const first = rest.shift(); pick[0].push(first); h[0] = first.h; }
    for(const box of rest.sort((x, y) => y.h - x.h)){
      const i = h[0] <= h[1] ? 0 : 1;
      pick[i].push(box);
      h[i] += box.h;
    }
    pick.forEach((list, i) =>
      list.sort((x, y) => x.i - y.i).forEach(box => cols[i].appendChild(box.el)));
  }

  function renderChecklist(){
    // [icon, text, color class]. Colors share the source of the list view's
    // choice buttons (--ok/--warn/--ink-3); the three emoji colors used
    // before never matched the rest of the page.
    const MARK = {
      yes:  [MARK_ICON.yes,   T.markYes,   "yes"],
      maybe:[MARK_ICON.maybe, T.markMaybe, "maybe"],
      no:   [MARK_ICON.no,    T.markNo,    "no"],
      none: [MARK_ICON.none,  T.markNone,  ""],
    };
    const days = (DATA.itinerary || []).filter(d => (d.places || []).length);
    const scheduled = new Set(days.flatMap(d => d.places.map(e => e.id)));

    let html = "";
    for(const d of days){
      let seq = 0;
      const rows = d.places.map(e => {
        const p = BY_ID[e.id];
        if(!p) return "";
        const lod = isLodging(p);
        if(!lod) seq++;
        return ckRow(p, lod ? house(12) : seq,
          false, e.note ? `<span class="why">${esc(e.note)}</span>` : "", lod ? "lod" : "", true);
      }).join("");
      html += ckBox(tf("dayN", { n: d.n }) + (d.date ? " · " + d.date.slice(5) : ""),
                    tf("nItems", { n: d.places.length }), rows);
    }

    /* Marked "yes" but scheduled nowhere — the easiest thing to miss, so it
       gets its own block. Computed only when a schedule exists: before any
       scheduling, "not scheduled" is the normal state of everything, not an
       omission, and singling it out is meaningless. It must also be gated on
       days.length because rest below excludes whatever is in missed — this
       used to be computed unconditionally, so before scheduling every "yes"
       fell into neither this block (not rendered) nor rest, vanishing from
       the guide entirely. */
    const missed = days.length
      ? PLACES.filter(p => p.choice === "yes" && !isLodging(p) && !scheduled.has(p.id))
      : [];
    if(missed.length){
      html += ckBox(T.missedTitle, tf("nCount", { n: missed.length }),
        missed.map(p => ckRow(p, MARK_ICON.warn, false, "", "warn", true)).join(""),
        "plain", T.missedCaveat);
    }

    const rest = PLACES.filter(p => !isLodging(p) && !scheduled.has(p.id) && !missed.includes(p));
    const by = {};
    rest.forEach(p => (by[p.choice || "none"] = by[p.choice || "none"] || []).push(p));
    // With a schedule, "yes" has already been taken by the two blocks above;
    // without one they all land here and must sort first
    const order = days.length ? ["maybe", "none", "no"] : ["yes", "maybe", "none", "no"];
    // One box per rating rather than one box with three runs inside it. The
    // dropped pile is usually the longest list on the page, and as part of a
    // single box it would drag the two rating groups worth reconsidering down
    // with it into whichever column it landed in.
    for(const k of order){
      const list = by[k];
      if(!list || !list.length) continue;
      html += ckBox((days.length ? T.unscheduled + " · " : "") + MARK[k][1],
        tf("nCount", { n: list.length }),
        list.map(p => ckRow(p, MARK[k][0], k === "no", "", MARK[k][2], true)).join(""),
        "plain");
    }

    return `<h3>${T.checklistTitle}</h3>
      <p>${days.length ? T.checklistIntroDays : T.checklistIntro}</p>
      <div class="bento">${html}</div>`;
  }

  /* ---------- Timeline progressive enhancement ----------
     List items in route.md that start with "09:30 " or "09:30–11:00 "
     automatically become a timeline with time capsules. The AI needs no
     special syntax — writing the time naturally is enough. */
  function enhanceTimeline(root){
    root.querySelectorAll("li").forEach(li => {
      const m = li.textContent.match(/^\s*(\d{1,2}:\d{2}(?:\s*[–—~-]\s*\d{1,2}:\d{2})?)\s*(?:[·|｜]|\s)\s*/);
      if(!m) return;
      const html = li.innerHTML.replace(/^\s*\d{1,2}:\d{2}(?:\s*[–—~-]\s*\d{1,2}:\d{2})?\s*(?:[·|｜]|\s)\s*/, "");
      li.className = "tl";
      li.innerHTML = `<span class="t">${esc(m[1].replace(/\s+/g, ""))}</span>${html}`;
    });
  }

  function render(){
    const auto = $("#guide-auto");
    auto.innerHTML = renderCost() + renderChecklist();
    packBento(auto.querySelector(".bento"));
    enhanceTimeline($("#guide-body"));
  }

  return { render, renderWeather, parseMoney, packBento };
})();

// A top-level const in a classic script isn't attached to window, while
// switchView tests window.GUIDE. The explicit assignment is required, or the
// guide view never renders.
window.GUIDE = GUIDE;

/* ─────────────────────────────────────────────── A4 pagination
   The guide is the one view that gets printed or handed over as a PDF. As a
   continuous column it breaks wherever the paper runs out — mid-timeline,
   mid-table, a heading stranded at the foot of a sheet. This lays the same
   content onto real A4 sheets on screen, from the same measurements the
   printer will use, so the preview *is* the export.

   Page count is not fixed and shouldn't be. Sections start on a fresh sheet
   and a long one runs onto a second; making every section fit exactly one
   sheet would mean a different type size per section, and unequal type is
   what makes an export look thrown together. The author controls the breaks
   from route.md instead: a `---` is a new sheet. */
const PAGER = (() => {
  const A4_W = 210 * 96 / 25.4;              // .pg's width in CSS px
  const NAV_W = 170;                         // must match .pgnav
  let on = false, printAuto = false;

  /* Where a block may be cut. Anything not listed is atomic and moves to the
     next sheet whole — a paragraph straddling two sheets reads worse than a
     sheet that ends early. `host` is the node the pieces actually hang off,
     which for a table is the tbody rather than the scroll wrapper. */
  function parts(el){
    const t = el.tagName;
    if(t === "UL" || t === "OL") return { host: el, kids: [...el.children] };
    // The bento's own children are its two columns; what splits is the boxes
    // inside them. Whatever survives on either side gets re-packed below.
    if(el.classList.contains("bento")) return { host: el, kids: [...el.querySelectorAll(".sum")] };
    if(el.classList.contains("sum"))
      return { host: el, kids: [...el.children].filter(c => !c.classList.contains("sum-h")) };
    const tb = el.querySelector("tbody");
    if(tb && tb.rows.length) return { host: tb, kids: [...tb.rows] };
    return null;
  }

  function newPage(paged){
    const pg = document.createElement("div");
    pg.className = "pg";
    // The footer is filled with a placeholder, not left empty: two empty
    // spans give the footer no line box, so it stands 11px shorter than it
    // will once numbered — and the flow would measure every sheet 11px taller
    // than it ends up, overflowing the last block on sheets that fill up.
    pg.innerHTML = `<div class="pg-body guide"></div>
      <div class="pg-foot"><span class="t">·</span><span class="no">·</span></div>`;
    paged.appendChild(pg);
    return pg.firstElementChild;
  }

  /* Measured off the last child's box rather than scrollHeight: the sheet is
     overflow:visible (a block too tall to cut should bleed where you can see
     it, not vanish), and scrollHeight on a visible-overflow box is the one
     number browsers have never agreed on. */
  function fits(body){
    const last = body.lastElementChild;
    if(!last) return true;
    return last.getBoundingClientRect().bottom - body.getBoundingClientRect().bottom <= 0.5;
  }

  /* Move trailing pieces of `el` onto a continuation node until the sheet
     closes. Returns that continuation, or null when `el` is atomic. The
     continuation is a deep clone emptied of its pieces, so a table keeps its
     thead and a box keeps its header — both of which have to repeat. */
  function split(body, el, minKeep){
    const p = parts(el);
    if(!p || p.kids.length < minKeep + 2) return null;
    const moved = [];
    while(!fits(body) && p.kids.length > minKeep){
      const k = p.kids.pop();
      k.remove();
      moved.unshift(k);
    }
    // Either the sheet still doesn't close within the floor, or closing it
    // took everything but a straggler. Put the pieces back and let the caller
    // move the block whole.
    if(!fits(body) || (minKeep > 1 && moved.length < 2)){
      moved.forEach(k => p.host.appendChild(k));
      return null;
    }
    const cont = el.cloneNode(true);
    const cp = parts(cont);
    cp.kids.forEach(k => k.remove());
    moved.forEach(k => cp.host.appendChild(k));
    // Only when the box itself is what got cut — :scope matters, or a bento
    // continuation labels its first intact box as a continuation.
    const h = cont.querySelector(":scope > .sum-h");
    if(h && h.firstChild && h.firstChild.nodeType === 3) h.firstChild.nodeValue += T.contd;
    // Both halves are now short a few boxes; rebalance each over its columns.
    if(el.classList.contains("bento") && window.GUIDE){
      GUIDE.packBento(el);
      GUIDE.packBento(cont);
    }
    return cont;
  }

  /* Reading order, flattened to the blocks a sheet is filled with. The trip
     title leads: on screen the weather strip sits above it because it's a
     live readout you want at a glance, but a printed document that opens on
     a temperature and only then says what trip it is reads backwards. */
  function blocks(src){
    const out = [];
    for(const sec of src.children){
      for(const el of sec.children){
        // <hr> is route.md's `---` — the author's own sheet break. The
        // page-generated sections (cost, checklist) each open a sheet too.
        out.push({ el, brk: el.tagName === "HR" || (sec.id === "guide-auto" && el.tagName === "H3") });
      }
    }
    const i = out.findIndex(b => b.el.tagName === "H2");
    if(i > 0){
      const head = out.splice(i, out[i + 1] && out[i + 1].el.tagName === "P" ? 2 : 1);
      out.unshift(...head);
    }
    return out;
  }

  function build(){
    const wrap = $("#pgwrap"), src = wrap.querySelector(".guide");
    wrap.querySelectorAll(".paged").forEach(n => n.remove());
    const paged = document.createElement("div");
    paged.className = "paged";
    wrap.appendChild(paged);

    let body = newPage(paged);
    for(const b of blocks(src)){
      if(b.brk){
        if(b.el.tagName === "HR"){ if(body.childElementCount) body = newPage(paged); continue; }
        if(body.childElementCount) body = newPage(paged);
      }
      const node = b.el.cloneNode(true);
      body.appendChild(node);
      // The checklist was packed against the on-screen column, which is
      // narrower than a sheet; at this width the boxes are shorter and pack
      // differently, so it is balanced again where it will actually be read.
      if(node.classList.contains("bento") && window.GUIDE) GUIDE.packBento(node);
      if(fits(body)) continue;

      /* Didn't fit. First choice is to cut it where the sheet ends: pushing a
         12-row table or a day's whole timeline down in one piece leaves a
         half-empty sheet above it. split() refuses when it can't do that and
         still leave two pieces on each side of the break — below that the
         stragglers read worse than the gap would — and then the block moves. */
      let cont = split(body, node, 2);
      if(!cont && body.childElementCount > 1){
        node.remove();
        // A heading — and the paragraph introducing it, if there is one —
        // travels with the block, or it is stranded at the sheet's foot.
        const carry = [];
        for(;;){
          const l = body.lastElementChild;
          if(!l) break;
          const intro = !carry.length && l.tagName === "P"
            && l.previousElementSibling && /^H[2-5]$/.test(l.previousElementSibling.tagName);
          if(!/^H[2-5]$/.test(l.tagName) && !intro) break;
          carry.unshift(body.removeChild(l));
        }
        // If carrying them emptied the sheet, reuse it — moving on would leave
        // a blank one behind.
        if(body.childElementCount) body = newPage(paged);
        carry.forEach(h => body.appendChild(h));
        body.appendChild(node);
        if(fits(body)) continue;
        // Too tall even with a sheet to itself. Now the widow floor gives way:
        // one piece left behind beats content running off the paper.
        cont = split(body, node, 1);
      }
      while(cont){
        body = newPage(paged);
        body.appendChild(cont);
        if(fits(body)) break;
        cont = split(body, cont, 1);
      }
    }

    const pgs = [...paged.children];
    const title = TRIP.title || document.title || "";
    // A sheet is named by the heading it opens with; a sheet that carries on
    // from the one before opens with no heading at all and borrows its name.
    let last = title;
    pgs.forEach((pg, i) => {
      const h = pg.querySelector(".pg-body h2, .pg-body h3");
      const own = h && h === pg.querySelector(".pg-body > *") ? h.textContent.trim() : "";
      pg.dataset.label = own || last + T.contd;
      if(own) last = own;
      pg.querySelector(".pg-foot .t").textContent = title;
      pg.querySelector(".pg-foot .no").textContent = (i + 1) + " / " + pgs.length;
    });
    buildNav();
    return pgs.length;
  }

  /* ---------- Navigator ----------
     One list, two shapes. On sheets it lists sheets; flowing, it lists the
     headings — which are the same divisions, since a section per sheet is the
     whole premise. Numbers only appear where they mean a page. */
  let navOpen = false;

  function navTargets(){
    if(on) return [...document.querySelectorAll(".pg")]
      .map((pg, i) => ({ el: pg, no: String(i + 1), label: pg.dataset.label }));
    const g = document.querySelector("#pgwrap > .guide");
    return g ? [...g.querySelectorAll("h2, h3")]
      .map(h => ({ el: h, no: "", label: h.textContent.trim() })) : [];
  }

  function goTo(el){
    // Land the target's head just below the sticky header, not under it
    const top = $(".top");
    scrollTo({
      top: el.getBoundingClientRect().top + scrollY - (top ? top.offsetHeight : 0) - 14,
      behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
    });
  }

  /* Only the list is rebuilt. #guide-actions is static markup below it and must
     survive, or export would disappear every time the page list is redrawn. */
  function buildNav(){
    const nav = $("#pgnav"), list = $("#pgnav-list");
    if(!nav || !list) return;
    const items = navTargets();
    list.textContent = "";
    // The paper size belongs here rather than in the sheet footer: the footer
    // prints, and "A4" is not something to tell someone holding the sheet.
    const head = document.createElement("div");
    head.className = "pgnav-h";
    head.textContent = on ? tf("pgNavHead", { n: items.length }) : T.pgNavToc;
    list.appendChild(head);
    for(const it of items){
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<span class="no"></span><span class="t"></span>`;
      b.querySelector(".no").textContent = it.no;
      b.querySelector(".t").textContent = it.label;
      b.onclick = () => { goTo(it.el); if(nav.classList.contains("panel")) openNav(false); };
      list.appendChild(b);
    }
    layoutNav();
  }

  function openNav(v){
    const nav = $("#pgnav"), pill = $("#pgnav-btn"), scrim = $("#pgnav-scrim");
    if(!nav || !nav.classList.contains("panel")) return;
    navOpen = v;
    nav.hidden = !v;
    if(scrim) scrim.hidden = !v;
    if(pill) pill.setAttribute("aria-expanded", String(v));
    // A popover menu, not a dialog: focus moves in and comes back, and Escape
    // closes it. Trapping the page behind it would be more machinery than a
    // nine-item list is worth.
    if(v){ const f = nav.querySelector("button"); if(f) f.focus(); }
    else if(pill && document.activeElement && nav.contains(document.activeElement)) pill.focus();
  }

  /* Rail when the gutter can hold one, pill otherwise. Measured, not assumed:
     main is capped at 1180px and centred, so on a wide window most of the
     gutter is outside main and a rule in page coordinates would put the rail
     either on top of the paper or off screen. */
  function layoutNav(){
    const nav = $("#pgnav"), pill = $("#pgnav-btn"), scrim = $("#pgnav-scrim"), wrap = $("#pgwrap");
    if(!nav || !wrap) return;
    // "Empty" now means no page list *and* no actions. Since the action area is
    // always present, the rail always has something to show in the guide view —
    // which is the point: export must not depend on route.md having headings.
    const empty = !nav.querySelector(".pgnav-list button") && !nav.querySelector(".pgnav-act");
    const box = wrap.getBoundingClientRect();
    const gutter = on ? box.left + (box.width - A4_W * scaleFor(wrap)) / 2 : 0;
    const rail = on && gutter >= NAV_W + 24;

    nav.classList.toggle("panel", !rail);
    if(rail){
      navOpen = false;
      nav.hidden = empty;
      nav.style.left = Math.round(gutter - NAV_W - 16) + "px";
      nav.style.top = (($(".top") ? $(".top").offsetHeight : 0) + 34) + "px";
      // aria-expanded has to be cleared with navOpen, or a window that grows
      // and shrinks again leaves the pill claiming an open panel
      if(pill){ pill.hidden = true; pill.setAttribute("aria-expanded", "false"); }
      if(scrim) scrim.hidden = true;
    }else{
      nav.style.left = nav.style.top = "";
      nav.hidden = !navOpen || empty;
      if(scrim) scrim.hidden = !navOpen || empty;
      if(pill) pill.hidden = empty;
    }
    markNav();
  }

  /* The target owning the top of the viewport, not the one most of it shows —
     you scroll to a heading and read down, so the head is what to point at. */
  function markNav(){
    const nav = $("#pgnav"), pill = $("#pgnav-btn");
    if(!nav) return;
    const items = navTargets();
    if(!items.length) return;
    const top = $(".top");
    const line = (top ? top.offsetHeight : 0) + 20;
    let cur = 0;
    items.forEach((it, i) => { if(it.el.getBoundingClientRect().top <= line) cur = i; });
    // Scoped to the list: the export button is a sibling of these, and counting
    // it in would shift every item's index by one.
    nav.querySelectorAll(".pgnav-list button").forEach((b, i) => b.setAttribute("aria-current", String(i === cur)));
    if(pill && !pill.hidden){
      pill.querySelector(".lb").textContent = on ? (cur + 1) + " / " + items.length : T.pgNavToc;
    }
  }

  /* A4 is 794px wide — wider than a phone. The sheets scale down to fit
     rather than scroll sideways, and .pgwrap is given the scaled height back
     because a transform doesn't change layout. */
  // Guarded: a hidden or not-yet-laid-out wrapper measures 0 and would
  // scale the sheets to a couple of pixels, which looks like the feature is
  // broken rather than like a narrow window. Below a phone's width, don't
  // scale — sheets that scroll sideways are recoverable, 1% sheets aren't.
  function scaleFor(wrap){
    return wrap.clientWidth < 240 ? 1 : Math.min(1, (wrap.clientWidth - 8) / A4_W);
  }

  function fit(){
    const wrap = $("#pgwrap"), paged = wrap && wrap.querySelector(".paged");
    if(!paged) return;
    const s = scaleFor(wrap);
    paged.style.transform = `translateX(-50%) scale(${s})`;
    wrap.style.height = Math.ceil(paged.offsetHeight * s) + "px";
    layoutNav();
  }

  function set(v){
    on = v;
    document.body.classList.toggle("pg-toggle-on", on);
    const wrap = $("#pgwrap"), nav = $("#pgnav");
    if(!wrap) return 0;
    if(!on){
      wrap.querySelectorAll(".paged").forEach(n => n.remove());
      wrap.style.height = "";
      buildNav();          // flowing: the list becomes the headings
      return 0;
    }
    const n = build();
    fit();
    return n;
  }

  /* Sheets are the guide's normal state — no switch to find, and what is on
     screen is what prints. The exception is a window too narrow to show a
     sheet at a readable size: below ~0.8 scale, 14px body type lands under
     11px, so there the guide goes back to flowing in one column. Printing is
     unaffected either way; beforeprint paginates regardless. */
  const MIN_W = 640;
  function auto(){
    const wrap = $("#pgwrap");
    if(!wrap) return;
    const want = wrap.clientWidth >= MIN_W;
    if(want !== on) set(want);
    else if(on){ build(); fit(); }        // content changed underneath
    else buildNav();
  }

  addEventListener("resize", () => {
    const wrap = $("#pgwrap");
    if(!wrap || $("#view-guide").hidden) return;
    if((wrap.clientWidth >= MIN_W) !== on) set(!on);
    else if(on) fit();
    else layoutNav();
  });
  addEventListener("scroll", () => {
    if(markNav.raf || $("#view-guide").hidden) return;
    markNav.raf = requestAnimationFrame(() => { markNav.raf = 0; markNav(); });
  }, { passive: true });

  const pill = $("#pgnav-btn"), scrim = $("#pgnav-scrim");
  if(pill){
    pill.innerHTML = `<span class="ic"></span><span class="lb"></span>`;
    pill.querySelector(".ic").innerHTML = icon(
      `<path d="M2.5 4h11M2.5 8h11M2.5 12h7" ${SVG_ST}/>`, 13);
    pill.onclick = () => openNav(!navOpen);
  }
  if(scrim) scrim.onclick = () => openNav(false);
  addEventListener("keydown", e => { if(e.key === "Escape" && navOpen) openNav(false); });
  /* Printing unpaginated would throw away everything above, so the guide
     always prints paginated — switched on here if the reader didn't, and back
     off afterwards so the screen is left as they had it. */
  addEventListener("beforeprint", () => {
    const gv = $("#view-guide");
    if(on || !gv || gv.hidden) return;
    printAuto = true;
    set(true);
  });
  addEventListener("afterprint", () => { if(printAuto){ printAuto = false; set(false); } });

  return { set, auto, fit, get on(){ return on; } };
})();
window.PAGER = PAGER;

/* ═══════════════════════════════════════════════════════════════════
   Deck view — first-pass triage as a swipe deck.
   Interaction ported from dev/swipe-prototype.html; state was not. The deck
   owns no choice state at all: every decision goes through setChoice() (which
   already persists, syncs the list card, recounts the tallies and recolors
   the map), and the deal queue is re-derived from PLACES whenever any other
   view changes a choice (see refresh(), hooked from setChoice/render).

   The one hazard that shapes this module: setChoice(id, v) TOGGLES to null
   when p.choice === v. So commit() must only ever fire on a card that is
   still undecided (the eligible() re-check), undo() exploits the toggle on
   purpose, and reasons go through setReason() — never setChoice — because
   re-sending "no" to an already-"no" place would silently un-rate it.
   ═══════════════════════════════════════════════════════════════════ */
const DECK = (() => {
  /* The single authority on what gets dealt: undecided, not lodging (it is
     not a "go / don't go" kind of place) and not an uncompleted user stub
     (no tier/pitch/photo — the card would be blank and undecidable; stubs
     stay ratable in the list, and once rated they do appear on the piles). */
  const eligible = p => !!p && !p.choice && !isLodging(p) && !isStubP(p);
  const PILES = ["no", "maybe", "yes"];

  let queue = [];        // place ids only — PLACES is the truth, the DOM never is
  let hist = [];         // this session's undo stack: {id, choice}
  let openPile = null;   // which pile the browse overlay shows, or null
  let suppress = false;  // our own setChoice call is in flight; skip refresh()
  let doneTimer = 0;     // the pending "all sorted → list view" transition
  let reasonTimer = 0;   // debounce for the overlay's free-text reason
  let lastFocus = null;  // where focus returns when the overlay closes
  let booted = false;

  const dv = () => $("#view-deck");
  const deckEl = () => $("#dk-deck");
  const shown = () => { const v = dv(); return !!v && !v.hidden; };

  /* Action-row icons: same contract as MARK_ICON (16 viewBox, currentColor),
     drawn at button size. No font symbols — see the icon() comment. */
  const MARK_BTN = {
    yes:   icon(`<path d="M3 8.4 6.3 11.7 13 4.6" ${SVG_ST}/>`, 18),
    maybe: icon(`<circle cx="8" cy="8" r="5.2" ${SVG_ST}/>`
              + `<path d="M8 2.8a5.2 5.2 0 0 1 0 10.4z" fill="currentColor"/>`, 18),
    no:    icon(`<path d="M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4" ${SVG_ST}/>`, 18),
  };
  const I_UNDO = icon(`<path d="M6.6 2.9 3.9 5.5l2.7 2.6" ${SVG_ST}/>`
    + `<path d="M3.9 5.5h5.3a3.9 3.9 0 1 1 0 7.8H6.4" ${SVG_ST}/>`, 15);
  const I_INFO = icon(`<circle cx="8" cy="8" r="5.6" ${SVG_ST}/>`
    + `<path d="M8 7.6v3.2" ${SVG_ST}/>`
    + `<circle cx="8" cy="5.2" r=".9" fill="currentColor"/>`, 15);

  /* Seeded scatter: the same card always lies at the same angle, so a
     re-render never makes a pile twitch. The murmur-style finalizer matters:
     place ids are sequential ("os-ar01", "os-ar02"…), and a plain *31 hash
     maps adjacent ids to nearly identical angles — same-category cards rated
     in a row then stack into an accidentally perfectly-aligned pile. */
  function seed(id){
    let h = 0;
    for(const c of String(id)) h = (h*31 + c.charCodeAt(0)) | 0;
    h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return h >>> 0;
  }
  function scatter(id, maxDeg){
    const h = seed(id);
    return { rot: ((h % 100) / 100 - .5) * 2 * maxDeg,
             ox: (h >> 2) % 9 - 4, oy: (h >> 4) % 7 - 3 };
  }
  /* Even well-mixed seeds cluster now and then (three draws in a ±8° band
     put two of them within a few degrees about a third of the time), so the
     angles that are actually visible together get a deterministic minimum
     separation: each is pushed away from its predecessor along its original
     direction. Pure function of the visible membership — the same trio
     always separates the same way, so re-renders stay twitch-free. */
  function separate(rots, minSep){
    for(let i = 1; i < rots.length; i++){
      const d = rots[i] - rots[i-1];
      if(Math.abs(d) < minSep) rots[i] = rots[i-1] + (d >= 0 ? minSep : -minSep);
    }
    return rots;
  }
  /* One computation for "how does this pile lie": renderDocks paints from it
     and dockTarget lands flying cards at the same angles, so a card touches
     down exactly as it will be drawn. */
  function pileRots(members){
    const top3 = members.slice(-3);
    return { top3, rots: separate(top3.map(p => scatter(p.id, 8).rot), 4) };
  }

  /* Deliberately not media(): that emits .media/.media-fb, which the list's
     cards, the print styles and the narrow-viewport rules all address. The
     deck card renders the same content under dk- classes instead. */
  function dkMedia(p){
    const im = (p.images || [])[0];
    const label = CATMAP[p.category] || "";
    return `<span class="dk-media">
      <span class="dk-media-fb">${catIcon(p.category, 44)}</span>
      ${im && im.url ? `<img src="${esc(im.url)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      ${label ? `<span class="dk-cat">${esc(label)}</span>` : ""}
    </span>`;
  }

  function cardEl(p, depth, rot){
    const el = document.createElement("article");
    el.className = "dk-card";
    el.dataset.depth = depth;
    el.dataset.dkId = p.id;
    const loc = p.name_local && p.name_local !== p.name
      ? `<small${langAttr}>${esc(p.name_local)}</small>` : "";
    const facts = [
      p.area ? `<b>${esc(p.area)}</b>` : "",
      SCALE_TXT[p.scale] ? `<span>${esc(SCALE_TXT[p.scale])}</span>` : "",
      `<span>${esc(priceLabel(p.ticket))}</span>`,
    ].filter(Boolean).join("");
    el.innerHTML = `
      <span class="dk-stamp yes">${esc(T.yes)}</span>
      <span class="dk-stamp no">${esc(T.no)}</span>
      <span class="dk-stamp maybe">${esc(T.maybe)}</span>
      ${dkMedia(p)}
      <div class="dk-body">
        <div class="dk-name">${esc(p.name)}${loc}</div>
        <div class="dk-facts">${facts}</div>
        ${p.pitch ? `<p class="dk-pitch">${rich(p.pitch)}</p>` : ""}
        <div class="dk-more">${esc(T.deckTapDetail)}</div>
        <div class="dk-tags">${(p.tags || []).slice(0, 4).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      </div>`;
    if(depth > 0){   // the loose-pile look; the top card always lies straight
      const s = scatter(p.id, 6);
      el.style.transform = `translate(${s.ox}px,${s.oy + depth*7}px) rotate(${(rot != null ? rot : s.rot).toFixed(1)}deg)`;
    }
    return el;
  }

  /* Rebuild the stack; cards mid-flight (.dk-flying) are left alone so their
     animation continues over the new stack. */
  function render(){
    const dk = deckEl();
    if(!dk) return;
    dk.querySelectorAll(".dk-card:not(.dk-flying)").forEach(c => c.remove());
    // The two cards behind get the same minimum-separation treatment as the
    // piles, anchored on the top card's 0° — consecutive ids would otherwise
    // hide one behind the other.
    const rots = separate([0,
      queue[1] != null ? scatter(queue[1], 6).rot : 0,
      queue[2] != null ? scatter(queue[2], 6).rot : 0], 3);
    for(let d = Math.min(2, queue.length - 1); d >= 0; d--){
      const p = BY_ID[queue[d]];
      if(p) dk.appendChild(cardEl(p, d, d > 0 ? rots[d] : null));
    }
    const top = dk.querySelector('[data-depth="0"]');
    if(top) attachDrag(top);
    let es = dk.querySelector(".empty-state");
    if(!queue.length && !es){
      es = document.createElement("div");
      es.className = "empty-state";
      es.innerHTML = `<div class="big">${esc(T.deckEmpty)}</div><div>${esc(T.deckEmptySub)}</div>`;
      dk.appendChild(es);
    }else if(queue.length && es) es.remove();
    updateHud();
  }

  /* Global progress, not session progress: decided ÷ all dealable places.
     Stable across resumed sessions, undo, and choices made in other views. */
  function updateHud(){
    const base = PLACES.filter(p => !isLodging(p) && !isStubP(p));
    const done = base.filter(p => p.choice).length;
    $("#dk-left").textContent = tf("deckLeft", { n: base.length - done });
    $("#dk-counter").textContent = `${done} / ${base.length}`;
    const pct = n => (base.length ? n / base.length * 100 : 0).toFixed(2) + "%";
    for(const k of PILES){
      const seg = $(".dk-vs-" + k);
      if(seg) seg.style.height = pct(base.filter(p => p.choice === k).length);
    }
    const u = $("#dk-actions .dk-b-undo");
    if(u) u.disabled = !hist.length;
  }

  /* Piles hold every decided place (not just this session's), so resuming a
     half-sorted trip starts with populated piles. */
  function renderDocks(popPile){
    for(const k of PILES){
      const dock = $(`.dk-dock[data-pile="${k}"]`);
      if(!dock) continue;
      const members = PLACES.filter(p => p.choice === k && !isLodging(p));
      dock.querySelector(".dk-ptitle").innerHTML = `${esc(T[k])} · <b>${members.length}</b>`;
      dock.setAttribute("aria-label", tf("deckPileAria", { c: T[k] }));
      const stack = dock.querySelector(".dk-pstack");
      const { top3, rots } = pileRots(members);
      stack.classList.toggle("dk-empty", !top3.length);
      stack.innerHTML = top3.map((p, i) => {
        const s = scatter(p.id, 8);
        const im = (p.images || [])[0];
        return `<span class="dk-mini${i === top3.length - 1 ? " dk-top" : ""}"
          style="transform:translate(${s.ox}px,${s.oy}px) rotate(${rots[i].toFixed(1)}deg); z-index:${i}">
          ${im && im.url ? `<img src="${esc(im.url)}" alt="" onerror="this.remove()">` : ""}
          <span class="dk-mname">${esc(p.name)}</span></span>`;
      }).join("");
      if(popPile === k && top3.length){
        const m = stack.querySelector(".dk-mini.dk-top");
        m.classList.remove("dk-pop"); void m.offsetWidth; m.classList.add("dk-pop");
      }
    }
  }

  /* Where a committed card flies to, in deck-local translate terms. When a
     pile has collapsed to its text chip (narrow viewports), the chip is the
     target and the card lands straight. */
  function dockTarget(choice, id){
    const dock = $(`.dk-dock[data-pile="${choice}"]`);
    const stack = dock.querySelector(".dk-pstack");
    const vis = stack.offsetParent !== null && getComputedStyle(stack).display !== "none";
    const dr = (vis ? stack : dock.querySelector(".dk-ptitle")).getBoundingClientRect();
    const er = deckEl().getBoundingClientRect();
    // Land at the angle the pile will actually draw this card at (the
    // committed choice is already on the place, so it is in members here).
    let rot = 0;
    if(vis){
      const { top3, rots } = pileRots(PLACES.filter(p => p.choice === choice && !isLodging(p)));
      const i = top3.findIndex(p => p.id === id);
      rot = i >= 0 ? rots[i] : scatter(id, 8).rot;
    }
    return {
      dx: dr.left + dr.width / 2 - (er.left + er.width / 2),
      dy: dr.top + dr.height / 2 - (er.top + er.height / 2),
