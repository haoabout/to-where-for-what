<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip</title>
<style>
/* ═══════════════════════════════════════════════ Design tokens
   One palette, light, fixed. The page used to carry both and a three-state
   corner toggle; that is gone. The trip page is read outdoors and printed as
   often as it is read at night, and the thing that genuinely needed a dark
   option — the basemap, the largest surface in view ② — now has its own
   switch inside the map (see setMapDark). Two independent light/dark controls
   on one screen was the confusing part, not the dark map.

   color-scheme:light is not vestigial: it is what keeps the browser's *own*
   painting — scrollbars, the search input, focus rings — light on a machine
   whose OS is set to dark. Drop it and those come back dark against a paper
   page. */
:root{
  color-scheme:light;

  /* ---- tweakcn "OpenProfile.me" (saas / brutalist / playful) ----
     https://tweakcn.com/themes/cmnn98cgf000304l76gib2grt
     The theme ships OKLCH; every value below is that theme's own number
     converted to sRGB hex, so the file keeps one color notation throughout and
     does not depend on oklch() support to render correctly years from now.
     Where a line says "derived", the theme had no token for that slot and the
     value is interpolated on the theme's own hue. */
  --paper:#F4F4F0;    /* --background, warm off-white */
  --paper-2:#EFEAE4;  /* --muted */
  --card:#FEFEFE;     /* --card */
  /* --ink-3 carries all the site's 11.5–12.5px small text (.hint/.facts/.sub/
     .caveat…) — the smallest text on the lowest contrast, so it sets the floor
     for the whole scale. The theme's --muted-foreground lands at 6.33:1 on
     --paper-2, comfortably clear of the 4.5 floor, so it is taken as-is.
     --ink-2 has no counterpart in the theme and is interpolated. The three
     steps measure 16.14 / 10.56 / 6.33. */
  --ink:#0E0E0E;      /* --foreground */
  --ink-2:#333333;    /* derived */
  --ink-3:#545454;    /* --muted-foreground */
  /* --line was doing two unrelated jobs under one name: it was the hairline
     color *and* the subtle fill color (7 rules used it as a background — hover
     states, the count badge, the drag-chosen row). That overload, not the
     theme, is what blocked the heavy rule: #4A4A4A as a fill under --ink text
     is unreadable. Splitting the token by role is what lets --line simply be
     the theme's --border, on all 31 outlines, at the 1px the source uses.
     Two tiers, because the source has two: bounded things (cards, inputs,
     chips, segmented controls) take the near-black outline, while rules
     *inside* a bounded thing stay light — the same distinction the reference
     draws between a card's edge and its internal separators. */
  --line:#4A4A4A;      /* --border — 31 outlines */
  --line-soft:#DDD8D2; /* derived — 25 internal dividers + the map grid */
  --line-2:#C2BDB7;    /* derived — the dim tier: disabled, stub border, tracks */
  --fill:#E7E2DB;      /* derived — the 7 former background:var(--line) uses */
  /* The theme's emphasis pair, used exactly as it ships it: --primary is
     near-black with a near-white foreground (its filled buttons), and its
     --accent is the yellow highlight that takes --ink on top. Note the name
     collision — shadcn's --accent is a *background*, not a brand color, so it
     maps to --accent-soft here and --primary maps to --accent. */
  --accent:#0E0E0E;         /* --primary */
  --accent-soft:#FFEF85;    /* --accent, the yellow */

  /* ---- The title band's pills: one palette per trip ----
     A trip declares a single number, trip.theme_hue in places.json, and build.py
     derives these four from it — L and C frozen, only the hue rotates. Freezing
     L is what freezes the contrast, so rotating the hue never requires
     re-checking that black type stays readable or that a pill still separates
     from the paper (the second one is load-bearing: these pills carry no
     outline). The offsets 0 / +152 / +327 / +45 were not designed, they were
     recovered from the palette that came before: at hue 334 the four resolve
     back to exactly the values below, so the original Osaka set is simply this
     system's hue=334 instance.

     Only --pill-name is high-chroma (.116 against .057–.082), which is why it
     was once the pill under a hue restriction: back when the nav was a
     saturated cyan at C .135, the destination pill had to avoid hue 198–258 to
     keep from reading as a tab. The rebuilt band ended that — --pill-nav is
     #E7E2DB and --pill-nav-on #F6F6F6, chroma .011 and .000, so all four pills
     are safe anywhere and the full 360° is usable.

     Measured across all 360 anchors: name ≥10.30 on ink / ≥1.49 on paper,
     date ≥7.88 / ≥2.04, who ≥10.03 / ≥1.63, pace ≥8.24 / ≥2.00. The name's
     1.49 sits below today's 1.65 on a few hues, so build.py steps its L down
     until it clears 1.60 — a check CSS cannot make, which is the other reason
     these are computed at build time rather than written as oklch() here.
     Hex, not oklch(), for the same reason as every other colour in this file:
     one notation throughout, and no dependency on oklch() support.

     The four below are the hue=334 defaults and they are what a trip without a
     theme_hue keeps; build.py overwrites them by substituting the marker that
     follows — after them, so the generated set wins, and the template stays
     valid CSS on its own. */
  --pill-name:#F3A8E4; --pill-date:#9CB37A;
  --pill-who:#C6B4E6;  --pill-pace:#CE9E9E;
  /*__THEME__*/
  /* Navigation. Deliberately *not* themed: it is the one constant surface on
     the page, and "different trip, same tool" is the sentence it gets to say.
     Both are near-paper neutrals, which puts all the weight on two numbers that
     are *not* about text: the group separates from the canvas by 1.17:1 and the
     selected tab from the group by 1.19:1. With no outline and no shadow left on
     either, the 700 weight and .tabs' padding ring are the whole signal for
     which view is current. (Type itself is comfortable: 14.98:1 / 17.86:1.) */
  --pill-nav:#E7E2DB; --pill-nav-on:#F6F6F6;
  /* Gold. Two jobs: the S badge's fill and the pitch lede's margin rule — an
     ornament in both, never a status, which is why it isn't in the block below.
     It cannot be --accent-soft: that lemon is already the caution fill
     (.f-warn, .verify-box, .f-unverified), so an S badge in it reads as a
     warning, and at 1.16:1 against the card it barely separates from the paper
     at all. This sits at 1.84:1 on the card and carries --ink at 10.43:1.
     Not pushed darker than this — the note under --warn applies here too: drop
     the lightness much further and the hue turns olive rather than gold. */
  --gold:#E9B824;
  /* Status. The theme carries only --destructive, so success and caution are
     built here — and the *hue* matters more than it looks.
     --warn was first derived on the accent yellow's own hue (100.84) dropped
     to a legible weight. That does not work: yellow has no dark form. At
     L 0.50 hue 100 is #726400, an olive that shares no family resemblance with
     the bright yellow it came from and simply reads as mud. Caution therefore
     moves to amber (hue 70), which does darken cleanly — the same drop gives
     #955E00, a true ochre. The theme's yellow is not abandoned, it is used
     where it actually looks like itself: at full lightness as a *fill*, on the
     badges below, which is exactly what the source does with it.
     --ok was inherited from this template's original warm-paper palette and
     had never been re-derived — a cool forest green (hue ~160) sitting in a
     warm, high-chroma theme, which is why it read as foreign. Rebuilt at
     hue 145 to sit in the same family as the rest.
     --danger is the theme's --destructive darkened: #EF4444 as shipped is a
     *fill* color and measures only 3.41:1 as text on --paper, and this template
     uses --danger for text (.hint.bad, .map-note b).
     Filled with white on top: --ok 5.70, --warn 5.41. As standalone text on a
     card: 5.65 / 5.37. */
  --ok:#38733C;
  --warn:#955E00;
  --warn-soft:#FFEF85;   /* the theme's --accent, at the lightness it works at */
  --danger:#BE2229;
  --danger-soft:#FBE9E9;

  /* Foreground on filled controls. Anywhere a semantic color is used as a
     background, the foreground takes the matching --on-*, rather than a
     hardcoded #fff scattered through the rules. Measured: --on-ok 6.29,
     --on-warn 5.93, --on-accent 19.14. */
  --on-accent:#FEFEFE;   /* --primary-foreground */
  --on-ok:#fff;
  --on-warn:#fff;
  --on-day:#fff;
  /* Lodging dot. It has no "which day", so a neutral color keeps it distinct
     from the day palette. The one on the map doesn't use this — it sits on the
     basemap and follows the basemap's lightness (see MAP_INK), which is still
     switchable. */
  --lodging:#545454;

  /* Three of the four choice rings on the map (see COLOR). Deliberately not
     aliases of --ink-3 / --accent: a ring is drawn over both a light and a dark
     basemap and has to clear ~3:1 against each, which pins its lightness into a
     narrow band and leaves hue as the only way the four states can differ.
     Both of those tokens sit outside the band — --accent (#0E0E0E) measured
     1.03:1 on the dark basemap, a ring that is simply not there.
     The theme's --chart-1..5 cannot serve here either: all five are pastels at
     L 0.37–0.77, and every one of them fails against the light basemap (worst
     1.16:1). Same reason DAY_COLORS is left alone further down.
     Measured dark / light:
       yes   --ok      2.84 / 5.71     no    this   3.40 / 4.77
       maybe this      3.53 / 4.59     none  this   2.82 / 5.75 */
  --ring-maybe:#8A6A12;   /* the accent yellow's hue, dropped into the band */
  --ring-no:#6C6C6C;
  --ring-none:#964A2F;

  /* ---- The canvas ----
     No longer a second, dark zone. This template shipped with light sheets laid
     on a deep navy board; the source theme has no such board — it is one light
     ground with white cards sitting on it, and the *outline* is what separates
     them. So the canvas is now the theme's --background, the same value as
     --paper, and the theme's .dark block is not used at all.
     The consequence is that this whole scale had to inverted. The header, the
     action bar and the group headings between cards are the three things that
     sit directly on the canvas, and they take --canvas-ink*, which was a light
     ink built for a dark ground — left as it was, all three would have gone
     light-on-light and vanished. It is now the same dark ink scale as the rest
     of the page (16.14 / 10.56 / 6.33 against this ground).
     --canvas-accent is the active tab's underline. The theme's yellow reads at
     1.16:1 here and cannot carry it on a light ground, so the underline takes
     --accent — near-black, which is also how the source marks the active tab.
     The tokens are kept distinct from --paper / --ink rather than collapsed
     into them, because they are the seam where a different ground would be
     reintroduced, and because --paper doubles as a *foreground* wherever
     --ink is used as a fill. */
  --canvas:#F4F4F0;       /* --background, same ground as --paper */
  --canvas-ink:#0E0E0E;
  --canvas-ink-2:#333333;
  --canvas-ink-3:#545454;
  --canvas-line:#DDD8D2;
  --canvas-accent:#0E0E0E;
  /* The dot matrix. Two knobs deliberately exposed: --dot-gap is the lattice
     pitch, --dot is its color. The two are coupled — widening the pitch thins
     the field, so the dot has to carry more weight to read as the same
     texture. At this pitch a single dot is still quiet on its own; the texture
     exists as a field, which is the point.
     Flipped to a dark dot now that the ground is light — a white dot on
     #F4F4F0 is nothing at all. Kept very quiet at .05: this texture is the one
     thing here the source theme does not have (its page ground is flat), so it
     is the first thing to drop if the page should read as purely the theme —
     set --dot to transparent and the lattice is gone. */
  --dot:rgba(14,14,14,.05);
  --dot-gap:28px;

  /* The theme's three families, each with this template's CJK stack appended.
     That part is not optional: DM Sans, Source Serif 4 and Roboto Mono carry no
     CJK glyphs at all, and this page is written in Chinese — named alone they
     would drop every Han character onto whatever the browser happens to pick.
     The theme fonts therefore take the Latin and the digits, and the existing
     stack takes the rest.
     Named, not embedded: the fonts are not loaded from Google here, because a
     network request would break the one property this file is built around —
     opening months later, offline, as a single attachment. On a machine
     without them the stack falls through to the previous system fonts. */
  --serif:"Source Serif 4",Georgia,"Songti SC","Hiragino Mincho ProN","Noto Serif CJK SC",serif;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  /* Japanese faces for Japanese text. The two stacks above are correct for
     the UI language and must stay that way — every CJK family in them is a
     Simplified-Chinese cut ("Hiragino Sans GB" included: the GB is 国标), and
     --serif deliberately puts Songti SC ahead of Hiragino Mincho because for
     Chinese that is the right order. Font matching runs per character and
     first family wins, and the Chinese cuts cover kanji, so Japanese
     name_local values were resolving to Chinese glyph shapes — 梅田スカイビル,
     千日前道具屋筋, 自由軒, 司馬遼太郎記念館 all contain kanji whose CN and JP
     forms differ at the same codepoint, and 13 of this trip's 47 local names
     also carry kana, which a Chinese font draws at Chinese kana proportions.
     Swapping the base stacks would only move the problem onto the Chinese UI,
     since a Japanese font covers those kanji too. So: a parallel pair, opted
     into by language rather than globally. */
  --serif-ja:"Source Serif 4",Georgia,"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans-ja:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* The theme's --tracking-normal is -0.025em applied to body. Here it is a
     token used only on the display headings: negative tracking tightens Latin
     nicely but crowds Han glyphs, which are drawn to a fixed em box, and this
     page's body copy is almost entirely Han.
     That reasoning was applied to the body copy and then not to the two places
     the token actually reaches — .title, the destination name, and the guide's
     h2/h3 route headings, which on a Chinese trip are the largest runs of Han
     on the page. Held to zero by output language just below rather than
     deleted outright: the tightening is genuinely right for a Latin
     destination, and this template builds those too. */
  --tracking:-0.025em;
  --r:20px;               /* --radius, 1.25rem */
  /* Place cards run rounder than the rest of the chrome. They are the one
     surface you look at as an object rather than as a panel, and at 371px wide
     with a photo inset in them the theme radius read as a slightly softened
     rectangle. Kept as its own token rather than raising --r: the segmented
     controls, the map frame and the summary boxes are chrome and should stay
     at the theme value.
     --card-pad is a token for one reason — the photo's radius is derived from
     it (see .media), and the two corners only stay concentric if the padding
     and the radius are read from the same place. */
  --r-card:34px;
  --card-pad:12px;
  /* The place name's type, as tokens rather than only inside the .nm rule:
     two other things are measured off it — the two-line floor that keeps the
     header a fixed height, and the tier-badge row, which has to be exactly one
     name-line tall to sit centred on the name's first line however the name
     wraps. Typing 21.6px in those two places would silently come undone the
     first time this size changes. */
  --nm-size:16px;
  --nm-lh:1.35;
  /* Hard shadows, for the place cards only — the brutalist kind: zero blur, a
     solid opaque colour, offset on the diagonal. What it draws is a second
     silhouette of the card rather than a haze under it, which is why it only
     works on a shape that already has a heavy outline to be the silhouette of.
     Both are drawn in the card's *own* outline colours, so the hover reads as
     that outline thickening and sliding out from under the card rather than as
     a light source appearing. --line-2 at rest keeps the resting state as quiet
     as the soft version it replaces; the jump to --line is the whole event.
     Scoped to .card: --shadow stays soft for the eight other things that use it
     (dialogs, map capsules, the A4 sheets), where a hard edge would read as a
     misprint rather than as depth. */
  --shadow-lift:7px 7px 0 var(--line);
  /* The theme ships eight shadow steps, 2xs through 2xl. Measured on the source
     page, only one of them is ever applied: --shadow-xs, at alpha .08, on 30 of
     327 elements — 83% carry no shadow at all. --shadow / --shadow-sm (alpha
     .16) appear nowhere. This was mapped to --shadow at first, which put twice
     the intended weight on 47 of 47 cards and is why they sat heavier than the
     source's. Depth here is the outline's job; the shadow is only a hint that
     the sheet is off the ground. */
  --sh-1:rgba(0,0,0,.08);
  --sh-2:rgba(0,0,0,.08);
  --shadow:0 2px 3px var(--sh-1);
}
*{box-sizing:border-box}
/* Any explicit display rule overrides the browser default for [hidden].
   .tabs{display:flex} once made hidden a no-op in standalone mode — the page
   kept showing tabs pointing at views that had been removed. This rule must
   precede every layout rule. */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
/* No rubber band at either end of the page. The header and the tab bar are
   sticky, so an elastic overscroll drags the whole content slab out from under
   them and exposes the canvas — the page looks like it came unglued rather than
   like it reached its end. Set on both elements because the scrolling box is
   the viewport: which of the two propagates its overscroll-behavior varies by
   engine, and the pair covers both. The dialog already does this for itself. */
html,body{overscroll-behavior:none}
/* The canvas and its dot matrix.
   One radial-gradient tile repeated on a square lattice — no image asset, so
   it survives being emailed as a single file, which is how this page travels.
   The dot is drawn at 1px with a 1.5px stop so it lands as a soft point rather
   than an aliased square; on a 2× screen the half-pixel is what keeps it from
   looking like grit.
   color, not background shorthand, and the gradient before the color: the
   shorthand would need re-listing every layer at every override site.
   Deliberately *not* background-attachment:fixed — that pins the lattice to
   the viewport, so the texture slides under the cards as you scroll and reads
   as a moving moiré. Attached to the page, it scrolls with the content and
   behaves like paper. */
body{
  background-color:var(--canvas);
  background-image:radial-gradient(circle at center, var(--dot) 1px, transparent 1.5px);
  background-size:var(--dot-gap) var(--dot-gap);
  color:var(--ink);
  font:15px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Press feedback, in one place because it is one idea.
   There was no :active rule anywhere in this file — measured, zero — on a
   page whose main gesture is tapping a rating pill 47 times. Hover carries
   the "this is pressable" half, but hover does not exist on touch, so
   between the tap and the state flip there was nothing at all saying the tap
   had landed. Every control here already changes colour on commit, so this
   is the second channel, not the only one.
   The independent `scale` property rather than transform:scale(), because
   several of these already carry a transform (.spot .pick is scaled to .88,
   the cards translate on hover) and a transform here would clobber it.
   .96 exactly: below about .95 a press reads as the control flinching.
   Gated on no-preference like the dialog's zoom and the rail's entrance
   above, per the reduce block's stated policy — states still change, only
   the movement stops. */
@media (prefers-reduced-motion:no-preference){
  .tab:active:not(:disabled),
  .chip:active,.seg button:active,.tally button:active,.pick button:active,.btn:active:not(:disabled),
  .ms-fil button:active,.ms-grp button:active,.mgroup button:active:not(:disabled),
  .dop:active:not(:disabled),.addmenu button:active,
  .pgnav-list button:active,.pgnav-btn:active,.mi .pin:active{
    scale:.96;
  }
}

/* "Buttons that don't look like buttons."
   These spots (place names, list entries, schedule entries, day headers, dots)
   used to be span/div with cursor:pointer — visually fine, completely
   unreachable by keyboard: measured, 47 places in the map view offered zero
   focusable elements, so no keyboard path could schedule a place into a day.
   Switching to <button> is the minimal fix: every event already goes through
   closest() delegation, so not one line of JS changes. This rule only strips
   the browser's default button chrome so they look like they used to. */
.bare{
  background:none;border:0;padding:0;margin:0;
  font:inherit;color:inherit;text-align:start;
  -webkit-appearance:none;appearance:none;
}

/* Screen-reader-only persistent text (place-search result announcements live
   here). display:none would remove it from the accessibility tree too, so it
   hides by clipping instead. */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ═══════════════════════════════════════════════ Header */
/* The header is a canvas zone: it floats over the navy, so it takes the navy's
   ink scale. Setting the color here rather than on each child means anything
   added later inherits legible ink by default; the light-surfaced controls
   inside it (.btn, .stale) already assert their own color and are unaffected.
   Solid, not frosted, and deliberately without the dot lattice: this bar is
   sticky while the texture is painted on the page, so a lattice here would
   stay put while the page's slid underneath — two grids drifting out of
   phase, which is worse than an honest flat band. Same for .actionbar. */
.top{
  position:sticky;top:0;z-index:50;
  background:var(--canvas);
  border-bottom:1px solid var(--canvas-line);
  color:var(--canvas-ink);
  /* Backstop for band-in's 25px slide (see below). Nothing overflows today —
     measured at 375/620/900/1280 with every element frozen at full rightward
     displacement, the closest any of them comes to the viewport edge is 12px,
     at 375 where .metas' pills wrap and run furthest right. That is the whole
     remaining margin: .top-in's 20px of inline padding, minus the 25px slide,
     plus the few px .metas stops short of the content edge. Widen the slide
     much further and it does overflow, so the clip stops being insurance and
     starts being the thing holding the layout together.
     clip, not hidden: hidden would make this a scroll container. Applied to the
     sticky element itself, which is safe — it is an ancestor's overflow that
     breaks stickiness, not your own. Nothing in the header is meant to escape
     it (there is no menu or popover in here, only .brand and .navwrap). */
  overflow-x:clip;
}
.top a{color:var(--canvas-accent)}
/* stretch, not center: the nav pill on the left and the destination pill on the
   right are the band's two end-caps and were visibly different heights —
   measured 43.4 against 58.7 at 1280, the nav sitting 15px short and floating
   in the middle. Stretch hands .navwrap the row's height and .tabs fills it, so
   both caps share a top and a bottom edge the way .title and .metas already do
   inside .brand.
   It also works in the other direction: on a trip with no dates, party or pace
   .metas is empty and the nav is the taller of the two, and .brand — already
   stretch — grows .title to meet it. Neither side is pinned to the other. */
.top-in{max-width:1180px;margin:0 auto;padding:11px 20px;display:flex;align-items:stretch;gap:16px}

/* The title band is mirrored on desktop: navigation is pinned left; the trip's
   facts are a fixed two-row block beside the destination, which is pinned at
   the far right. The DOM still starts with the heading — the semantic reading
   order stays title then navigation — and flex direction/order supply only the
   visual mirror.

   align-items:stretch is what makes the destination pill tall: it no longer
   sizes to its own type, it grows to the height of the two rows next to it, so
   the two share a top and a bottom edge.

   flex-wrap is the safety valve, not decoration: once .metas no longer fits
   beside the title, the whole block drops to the next line, still aligned to
   the right — a breakpoint that is computed rather than written as a media
   query. Without wrap, .metas neither wraps nor shrinks and pushes the band
   past the viewport (measured).

   row-reverse does three jobs as one mirror: it puts the source-first title at
   the far right, lays the facts to its left, and makes flex-start the right
   edge. --band-in-x follows that geometry: desktop facts enter towards the
   right; the narrow breakpoint restores both layout and motion. */
.brand{
  --band-in-x:-25px;
  flex:1;min-width:0;display:flex;flex-direction:row-reverse;
  align-items:stretch;gap:8px 10px;flex-wrap:wrap;
}
/* The title never shrinks: the meta block wraps first, and the title only
   narrows through its own clamped type size. Reverse that priority and the
   first thing a narrowing window squeezes is the largest type on the page. */
.title{
  margin:0;max-width:100%;flex:none;
  background:var(--pill-name);border-radius:999px;
  padding:6px 22px;font:900 clamp(22px,2.6vw,30px)/1.2 var(--sans);
  letter-spacing:var(--tracking);overflow-wrap:anywhere;
  display:flex;align-items:center;
  /* 900 states an intent, not a guarantee. Measured on macOS the CJK stack
     tops out at Semibold — 600/700/800/900 rasterise to identical pixels,
     because PingFang SC has no heavier cut and the fonts here are named, never
     loaded. Environments that do have a heavy face (Microsoft YaHei Bold, an
     installed variable DM Sans) pick it up; the rest render Semibold. */
}
/* The line cap lives on the inner span: the outer box has to stretch to the
   band's height, and -webkit-box would take that job away from align-items.
   Two lines is a ceiling, not a target — without it a long destination on a
   375px screen wraps to five lines and grows a 300px-tall pill in a sticky
   region (measured). */
.tname{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}

/* Trip facts: a fixed two-row block to the left of the destination, wrapping
   inside itself rather than starting a new full-width line. The split is by
   meaning — when above, who and how hard below — so it stays two rows even
   when there is width to spare. Its rows and their contents align from the
   destination outwards, mirroring the old left-edge alignment.
   flex:0 1 auto sizes it to content; when it genuinely cannot fit, .brand's
   wrap drops the whole block below the title. */
.metas{
  flex:0 1 auto;min-width:0;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;
}
.mrow{display:flex;flex-direction:row-reverse;gap:7px;flex-wrap:wrap;min-width:0}
/* The pills scale with the viewport like the title, but far less: the title is
   the page's headline and these are its footnotes; footnotes that grow in step
   with the headline stop reading as footnotes. Both ends are pinned — 11px is
   the floor this CJK weight stays legible at, 12.5px is full size. */
.mpill{
  border-radius:999px;white-space:nowrap;
  padding:clamp(3px,1.5px + .18vw,4px) clamp(9px,4px + .63vw,13px);
  font-size:clamp(11px,7.5px + .39vw,12.5px);
  font-weight:600;line-height:1.5;
}
.m-date{background:var(--pill-date)} .m-who{background:var(--pill-who)} .m-pace{background:var(--pill-pace)}
/* Not one of the trip's facts — a warning about the data — so it keeps the
   caution fill instead of joining the themed set. */
.stale{
  background:var(--warn-soft);color:var(--ink);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  padding:1px 8px;border-radius:20px;font-size:11.5px;white-space:nowrap;
}

/* The band's entrance mirrors its layout. On desktop the rightmost destination
   arrives first, followed by the facts from right to left; every piece slides
   a short way rightward as it fades up. At <=900px both the visual order and
   movement return to their original left-to-right / leftward arrangement.
   Runs once per load and never again — see boot(), which builds this band
   exactly once and is the only writer of #metas.

   The transparent start exists ONLY as a keyframe, never as a resting style on
   the element. Write opacity:0 on .title and a reduced-motion visitor — for
   whom this whole block does not exist — gets a permanently blank header. Same
   reason the reduce policy below is a list of specific rules rather than a
   blanket kill: what stops has to be the movement, not the content.

   The gate is .brand.in rather than the bare selectors because these elements
   do not enter the document together. The h1 is in the HTML from
   parse; the pills are createElement'd in boot(), after ~5000 more lines of
   markup and the inlined Sortable. Their animations would start tens of
   milliseconds apart — a large fraction of a 70ms stagger step, enough to
   scramble the order. The class lands once, after the band is complete, so
   every element starts on the same style recalc.

   --i is written by boot() in DOM order instead of being hardcoded per class.
   The reversed flex rows turn that same title/date/who/pace sequence into a
   right-to-left spatial sequence on desktop, without duplicating animation
   logic. The sequence is not fixed: boot() drops any pill whose value is empty,
   and .stale appears only on data older than 30 days. Per-class delays would
   leave a hole in the middle of the stagger for a trip with no party.

   backwards, not both: the delay needs the start state held, but nothing needs
   holding afterwards — and a lingering transform would make .title a
   containing block for fixed descendants. */
@media (prefers-reduced-motion:no-preference){
  .brand.in > .title,
  .brand.in .mpill,
  .brand.in .stale{
    animation:band-in .5s cubic-bezier(.2,.8,.25,1) backwards;
    animation-delay:calc(var(--i,0) * 70ms);
  }
  @keyframes band-in{from{opacity:0;transform:translateX(var(--band-in-x,25px))}}
}

/* Navigation. flex:none and order:-1 pin it visually left on desktop while the
   heading remains first in the DOM. .navwrap exists so the group can return
   after the title band and take a full-width row of its own on narrow screens
   without the nav pill itself stretching. */
.navwrap{order:-1;flex:none;display:flex}
/* padding is the ring of group colour left visible around the selected tab, so
   it is the only thing that still draws the outer pill as a shape once the
   selected tab is inside it. At 3px that ring was thinner than the gap between
   tabs and the two pills read as one smudge; 5px is what separates them. */
/* align-items:stretch follows from .top-in's: once the outer pill is as tall as
   the destination's, centring the tabs inside it would leave a 10px ring above
   and below against 5px at the ends. The ring is the only thing drawing the
   outer pill as a shape (see below), and a ring that thickness-varies stops
   reading as one. Stretching the tabs keeps it 5px the whole way round; the
   labels stay centred on .tab's own align-items. */
.tabs{
  display:flex;gap:2px;align-items:stretch;
  background:var(--pill-nav);border-radius:999px;padding:5px;
}
.tab{
  background:none;border:0;border-radius:999px;white-space:nowrap;
  padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;transition:background .14s,color .14s,scale .14s;
}
.tab:hover:not(:disabled):not([aria-selected=true]){background:rgba(255,255,255,.45)}
/* --pill-nav and --pill-nav-on both carry --ink safely (14.98:1 / 17.86:1) but
   differ from each other by only 1.19:1, and neither pill has an outline or a
   shadow.

   The 600 → 700 step between an unselected and a selected tab looks like a
   second cue but is not one everywhere: measured on macOS the two rasterise to
   *identical pixels*, because this CJK stack has no cut above Semibold. So on
   that platform which view you are in is said by two things only — the 1.19:1
   fill, and the ring of group colour that .tabs' padding holds open around the
   selected tab. That padding is therefore load-bearing, not decorative: thin it
   and the two pills merge into one smudge. */
.tab[aria-selected=true]{background:var(--pill-nav-on);color:var(--ink);font-weight:700}
.tab:disabled{color:color-mix(in srgb,var(--ink) 35%,transparent);cursor:not-allowed}

/* First breakpoint: undo the desktop mirror, then let navigation drop below.
   The destination and facts return to their semantic/source order on the first
   row; the nav returns after them (full width, three equal segments, better for
   a thumb). The entrance direction returns with the layout too. */
@media (max-width:900px){
  /* Block padding tightens, inline padding does not. main keeps its 20px
     inline padding at every width, so dropping this to 14 put the header on
     an edge nothing else on the page shares: measured at 375px the title and
     the full-width tab bar spanned 14→361 while the toolbar, chips, group
     headings, every card and the action bar all spanned 20→355 — a tab bar
     visibly 12px wider than the cards under it, on the page's most-scanned
     vertical edge. */
  .top-in{flex-wrap:wrap;gap:8px;padding:9px 20px}
  .brand{--band-in-x:25px;flex-basis:100%;flex-direction:row}
  .metas{align-items:flex-start}
  .mrow{flex-direction:row}
  .navwrap{order:0;width:100%}
  .tabs{width:100%}
  .tab{flex:1;justify-content:center;padding:7px 10px}
}
/* Second breakpoint: the facts follow. Below this the destination's right side
   cannot hold even one pill, and .mrow hands over its box (display:contents) so
   all three pills become direct children of .metas and flow freely — with a
   short name the date still rides up onto the destination's row.

   flex-basis 160px rather than auto: auto makes .metas ask for the width of all
   three pills on one line and wrap the whole block when it can't get it, which
   is exactly how the date loses its place on that row. 160 is smaller than any
   single pill, so the block stays put and wraps internally instead.

   justify-content has to be flipped along with flex-direction: in a column it
   centres vertically, in a row it centres horizontally — which clipped both
   ends of the pill strip and left a gap at the start (measured). */
@media (max-width:620px){
  .title{font-size:20px;padding:5px 16px}
  .tname{-webkit-line-clamp:1;line-clamp:1}
  .metas{
    flex:1 1 160px;flex-direction:row;flex-wrap:wrap;
    justify-content:flex-start;align-items:center;gap:6px 7px;
  }
  .mrow{display:contents}
  /* Backstop for ~320px: the date pill ellipsises rather than pushing the band
     past the viewport. Does not trigger at normal phone widths. */
  .mpill{min-width:0;overflow:hidden;text-overflow:ellipsis}
}

/* Export lives in the view it belongs to (see .map-rt and .pgnav-act), never in
   the tab bar. It is view-specific, it is a once-per-session closing action,
   and keeping it out means one position at every width — which is why the old
   layoutMapActions, which shuttled these buttons between the tab bar and the
   map depending on viewport, could be deleted outright. */
.btn.sm{padding:5px 11px;font-size:12.5px}

/* ═══════════════════════════════════════════════ Progress */

/* The small counts on the right of view ①'s toolbar. The list view is where
   choices get made, so a live count of the four buckets is most useful here;
   the map view hangs the same numbers on its filter buttons instead. */
/* No auto inline-start margin here, and it turns out there never should have
   been one. It was there to push the tally to the toolbar's trailing edge,
   but .search is flex:1 and eats every pixel of free space on that row, so on
   a shared row the auto margin resolves to zero and the tally sits flush
   after the segmented controls — measured identical at 1100px and 1400px with
   and without it. The only time it ever resolved to anything was once the row
   wrapped, where it did the opposite of what anyone wanted: at 380px it came
   out as 45.6px, starting the tally at x=66 while the search field, both
   segmented groups, the chips and every card started at 20. A rule that is
   inert where it was aimed and harmful where it was not. */
.tally{display:flex;gap:6px;white-space:nowrap}
/* Four solid pills rather than dot-plus-label. The colour now *is* the pill, so
   an 8px swatch alongside it was saying the same thing twice, and four hairline
   dots on the paper read as debris at this size. Labels stay: the fill carries
   the meaning for anyone who can see it, the words carry it for everyone else.
   They are buttons, not readouts: each one filters its own bucket out of the
   list, the way the map's .mfil group does. All four start on, so the resting
   state is exactly the four pills that were here before.
   The box is .seg button's, to the pixel: 8 + 16 + 8 + 2 = 34px, the height of
   the search field and the segmented control beside it.
   The border is 1px at all times and merely goes transparent when selected.
   Adding it only in the deselected state would resize the pill on every
   toggle and shove its three neighbours sideways — the same trap .ms-fil
   documents below, and its reason for using an inset shadow there.
   font-size moved off .tally and onto the button, matching .chip's 12.5px. */
.tally button{
  display:flex;align-items:center;gap:5px;
  padding:8px 13px;font-size:12.5px;line-height:16px;font-weight:500;
  border:1px solid transparent;border-radius:999px;
  transition:background .15s,color .15s,border-color .15s,box-shadow .12s,scale .12s;
}
/* tabular-nums rather than --mono. Even figure widths were the only thing mono
   was here for, and this is the cheaper way to get them: --mono names fonts it
   does not embed (see the stack), so in practice it resolves to Menlo on macOS
   and Consolas on Windows — both of which draw a slashed zero by default, and
   neither exposes it as a toggleable feature. A slashed zero is a disambiguator
   for code; next to a Han label in a 12px pill it is just noise.
   Full opacity, not dimmed: on these solid fills, fading the number is contrast
   the small type cannot spare. */
/* Two digits' worth of slot, so a count crossing 9↔10 does not resize its pill
   and shove the rest of the row sideways — the same reason .ms-fil .c carries
   a min-width. tabular-nums above is what makes the slot honest: every digit
   already has the same advance, so 2ch is exactly two digits rather than an
   approximation from the "0" glyph.
   Centred, not aligned to an edge: these four counts sit in four separate
   pills with a label in front of each, so there is no column for them to line
   up in, and a single digit pushed to one side just reads as a typo.
   Past 99 the pill grows again. A trip with 100+ places in one bucket is not
   what this page is for, and reserving a third digit would put a visible hole
   next to every label in every trip that isn't. */
.tally .n{font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
/* The tri-state's own three fills, reused verbatim — same four buckets, so
   there is one place to change a choice colour, not two. Measured pairs are
   documented at --on-ok / --on-warn above.
   Undecided has no counterpart there (it is the *unpressed* state), so it takes
   the tri-state's track colour: filled, but the quietest thing in the row —
   which is what "nobody has decided this yet" should look like. --ink-3 on
   --fill measures 5.88:1. */
.tally button[aria-pressed=true].t-yes{background:var(--ok);color:var(--on-ok)}
.tally button[aria-pressed=true].t-maybe{background:var(--warn);color:var(--on-warn)}
.tally button[aria-pressed=true].t-no{background:var(--ink-3);color:var(--paper)}
.tally button[aria-pressed=true].t-none{background:var(--fill);color:var(--ink-3)}
/* Deselected drains rather than recolours, and one rule covers all four.
   A grey *fill* was the obvious alternative and is unusable here: undecided's
   selected state is already a --fill grey, so its two states would be the same
   pill. Hollow works for all four because it is the absence of the fill, and
   every one of them has a fill to lose. The strikethrough is on the count
   alone — the number is the thing being excluded from the list below. */
/* No opacity on top of this. Fading the whole button to .55 read well and
   measured 2.6:1 for the label against the paper — under the 3:1 floor, on a
   control you still have to read and press. Losing a saturated fill for an
   empty shell is already about the largest state change available here; the
   strikethrough says the rest. --ink-3 on --paper is 7.4:1. */
.tally button[aria-pressed=false]{
  background:none;border-color:var(--line-soft);color:var(--ink-3);
}
/* Label and count both, and set on the two children rather than on the button
   they share. The button is a flex container, so a decoration declared there
   would have to be propagated into its flex items to land — and into an
   anonymous one for the label, which is engine-dependent. Declaring it where
   the text actually is costs one selector and no guesswork. */
.tally button[aria-pressed=false] .lb,
.tally button[aria-pressed=false] .n{text-decoration:line-through}
/* Deselected hover: "click and it comes back", in the page's shared yellow. */
.tally button[aria-pressed=false]:hover{border-color:var(--ink);background:var(--accent-soft);color:var(--ink)}
/* Selected hover deepens the outline and leaves the fill alone. All four
   default to on, so the common case is four lit pills; touching the
   background there would read as "this one just switched off". Same call as
   .ms-fil's, and inset means the box never changes size. */
.tally button[aria-pressed=true]:hover{box-shadow:inset 0 0 0 1px var(--ink)}

/* ═══════════════════════════════════════════════ Main */
/* The bottom padding clears the fixed action bar, so it is derived from the
   bar's measured height rather than typed. It used to be 130px, with a 150px
   override below 640px — both guesses at a bar whose height is the status
   line's, and that line wraps: measured 127px at 375px wide and 147px at
   320px in the shipping Chinese, and a longer language (the file's own
   comments plan for German and Russian) pushes it further. At 320px the
   typed 150px was already down to its last few px of margin over a 147px
   bar. --ab-h is written by layoutMap() from a real offsetHeight and is
   already what .tight and .pgnav-btn size against; +32px is the list view's
   breathing room under the last card, which is what the old 130 was for. */
main{max-width:1180px;margin:0 auto;padding:20px 20px calc(var(--ab-h,64px) + 32px)}
/* The map view is a single-screen workbench and shouldn't scroll. The bottom
   only needs to clear the fixed action bar — without the breathing room the
   list view adds under its last card. */
main.tight{padding-bottom:var(--ab-h,64px)}
.view[hidden]{display:none}

/* Toolbar */
/* The toolbar and the chips are two rows of one thing — the filter apparatus
   — so the gap between them has to read as smaller than the gap from that
   apparatus to the places it filters. It did not: measured 20px between the
   two rows and 22px from the chips to the first card, a ratio of 1.1, so
   there was no boundary for the eye to find and the filters read as the top
   of the list rather than as a control strip above it. .group-h a little
   further down already does this properly, at 15px inside and 34px between.
   10 / 26 puts the ratio at 2.6, and pulls 6px out of the block on the way
   (36 against the old 42) — which the entry point can use. */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{
  flex:1;min-width:190px;padding:8px 13px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);color:var(--ink);font-size:14px;
}
.search::placeholder{color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
/* line-height is pinned rather than inherited. .search and .seg sit side by
   side and already share padding (8px 13px) and a 1px border, so the only
   thing that made .seg 39px against the input's 34px was the body's 1.65
   line-height landing at 21.45px on 13px text where the input's `normal`
   gives ~16px. 8 + 16 + 8 + 2 = 34, the same box as the field beside it.
   The mismatch predates the theme; at the old 10px radius these read as
   small rounded rectangles and 5px did not show. At a 20px radius they are
   full pills, and a pill that overshoots the field next to it looks oversized. */
.seg button{background:none;border:0;padding:8px 13px;font-size:13px;line-height:16px;color:var(--ink-3);transition:background .12s,color .12s,scale .12s}
.seg button[aria-pressed=true]{background:var(--paper-2);color:var(--ink);font-weight:600}
/* Hover on an unselected item only deepens the ink, never adds a background —
   a background would be the selected state's --paper-2, and hovering would
   read as "already switched". Hover on the selected item goes one shade
   deeper, signaling it can be pressed again. */
.seg button:hover:not([aria-pressed=true]){background:var(--accent-soft);color:var(--ink)}
.seg button[aria-pressed=true]:hover{background:var(--fill)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:26px}
/* Collapsed to one row on a phone. Measured at 390×844: the header (123px)
   and the fixed action bar (127px) already take 30% of the screen before
   anything else, then the toolbar takes 118 and these chips 231 — so the
   first card started 579px down and the opening screen of the app's main
   view contained no places at all. It was a table of contents for the
   filters, not for the trip.
   max-height is written by layoutChips() from the first chip's measured
   height rather than typed here, because it has to survive the chip's font
   and padding changing. The margin moves to the disclosure while collapsed,
   so the two never both apply. */
.chips.clamped{overflow:hidden;margin-bottom:8px}
.chips-more{
  border:1px dashed var(--line);background:none;color:var(--ink-3);
  padding:5px 12px;border-radius:20px;font-size:12.5px;margin-bottom:26px;
  transition:border-color .15s,color .15s,background .15s,scale .15s;
}
.chips-more:hover{border-color:var(--ink);color:var(--ink);background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){ .chips-more:active{scale:.96} }
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:5px 12px;border-radius:20px;font-size:12.5px;
  transition:background .15s,color .15s,border-color .15s,scale .15s;
}
.chip:hover:not([aria-pressed=true]){border-color:var(--ink);background:var(--accent-soft);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* The one count on the page that had neither mono nor tabular figures, and it
   is rewritten on every filter change. */
.chip .c{opacity:.55;font-size:11px;margin-inline-start:3px;font-variant-numeric:tabular-nums}

/* Groups */
.group{margin-bottom:34px}
.group-h{
  display:flex;align-items:baseline;gap:10px;
  padding-bottom:9px;margin-bottom:15px;border-bottom:1px solid var(--canvas-line);
}
/* Group headings live in the gaps between cards — canvas, not paper. */
.group-h h2{font:600 15px/1 var(--sans);margin:0;letter-spacing:.3px;color:var(--canvas-ink)}
/* Same call as .tally's: a count that sits against a Han heading gets tabular
   figures in the page's own sans, not --mono. --mono resolves to Menlo on
   macOS and Consolas on Windows and both draw a slashed zero, which beside
   Han reads as a mark rather than a digit. tabular-nums buys the column
   alignment that was the only reason to reach for mono here. */
.group-h .meta{font-size:12px;color:var(--canvas-ink-3);margin-inline-start:auto;font-variant-numeric:tabular-nums}

/* ═══════════════════════════════════════════════ Cards */
/* Photo-topped tiles in an auto-fitting grid. auto-fill + minmax gives 3
   columns inside the 1180px main, 2 around 900px, and the 640px block below
   drops it to 1 — no column count is hardcoded anywhere. */
.cards{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}
/* The heavy rule goes here and on the two other full-width containers
   (.map-main, .sum) rather than on every bordered thing. In the source theme
   it is the card outline that carries the brutalist weight; putting #4A4A4A on
   the chips and segmented controls as well turned the filter rows into a grid
   of black boxes and buried the cards it was supposed to emphasise. */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;
  transition:border-color .15s,opacity .2s,transform .15s ease-out,box-shadow .15s ease-out;
  display:flex;flex-direction:column;padding:var(--card-pad);
  /* The whole card opens the detail dialog (see the click handler), so the
     whole card has to say so. */
  cursor:pointer;
}
/* Lifts on hover. Cards rest flat — no shadow at all; depth on this page is
   the outline's job — so the lift is what carries "this is a thing you can
   pick up", and it needs a real shadow under it or the card just appears to
   have jumped.

   The travel is diagonal, up *and* left, against a shadow that grows down
   and right: with a hard shadow the gap between the card and its silhouette is
   the entire depth cue, so moving along the same axis the shadow grows on is
   what opens that gap. 3px of travel against 7px of offset reads as 10px
   of lift while the card itself barely moves. */
.card:hover{
  border-color:var(--ink);transform:translate(-3px,-3px);box-shadow:var(--shadow-lift);
}
/* Dropped cards recede without their text being composited away.
   This was opacity:.5 on the whole card. Group opacity dims the text along
   with everything else, and measured on this palette the 11.5px --ink-3 line
   (.facts / .loc / .why) needs alpha >= .80 before it clears 4.5:1 — at which
   point the card is barely dimmed at all. So one value cannot both signal
   "dropped" and stay readable; at .5 the measured ratios were 2.33:1 for that
   line and 2.84:1 for .pitch. The .82 hover bought them back, but hover does
   not exist on touch, and .why is where the "why not" reason lives — the
   least readable text on the card was the one explaining why it is in this
   state, on the card you are most likely to be re-reading.
   Two channels that cost no contrast instead: the photo dims (it is the loud
   part of the tile, and dimming it is most of the visual effect), and the
   card drops to the sunken surface tone so it sits back as a surface.
   --ink-3 on --paper-2 measures 6.33:1, --ink 16.14:1. */
.card[data-choice=no]{background:var(--paper-2)}
.card[data-choice=no] .media{opacity:.45}
/* Choice state is already expressed by the tri-state buttons and the dots —
   no colored left border on top: saying the same thing three times is
   redundant, and a 3px colored side strip is the most recognizable
   template-y tell there is. */

/* Photo inset inside the card's own padding rather than bled to the edge.
   Its radius is the card's minus that padding, which is the condition for two
   nested corners to stay concentric — anything else and the curves run
   parallel at different speeds, which reads as a mistake without the eye
   being able to say why. Derived, not typed, so raising --r-card keeps it. */
.media{
  aspect-ratio:3/2;background:var(--fill);position:relative;
  border-radius:calc(var(--r-card) - var(--card-pad));overflow:hidden;
}
.media img,.media-fb{position:absolute;inset:0;width:100%;height:100%}
/* cover, never contain: a letterboxed tile in a grid reads as a broken image */
.media img{object-fit:cover;display:block}
.media-fb{
  display:grid;place-items:center;align-content:center;gap:7px;
  color:var(--ink-3);text-align:center;padding:0 10px;
}
.media-fb span{font-size:11.5px;line-height:1.3}
/* Between --line-2 and --ink-3: at --line-2 the mark all but vanished in a
   347px-wide tile, at --ink-3 it read as an active control rather than a
   stand-in for a photo we don't have. */
.media-fb svg{color:color-mix(in srgb,var(--ink-3) 40%,var(--line-2))}

.hd{display:flex;align-items:flex-start;gap:8px;margin-top:12px}
.nmw{flex:1;min-width:0}
/* The name and the local name reserve a fixed two-line / one-line block, so
   the pitch below them starts at the same height on every card in a row.
   Left to flow, this header ran anywhere from one to four lines (42 of 47
   names fit one line and 5 wrap; 40 local names fit one, 1 wraps, 6 don't
   exist) and the pitch started at four different heights across the grid.
   Both are em-based, so they follow the font size rather than restating it.

   .nm gets a floor, not a clamp: reserving two lines is what aligns the 42
   short names with the 5 that wrap, but a name long enough to need a third
   line — narrow viewports, a longer language — grows into it rather than
   being cut. Below 640px there is one card per row anyway, so nothing is
   left to align and only that card gets taller.
   .loc does get clamped: a local name is a recognition aid for the street
   sign, the dialog title carries it in full, and one place here has one long
   enough to wrap. */
.nm{
  font:900 var(--nm-size)/var(--nm-lh) var(--serif);
  cursor:pointer;letter-spacing:.2px;display:block;
}
/* The two-line floor sits on this plain div, never on .nm — .nm is a <button>,
   and a button taller than its text centres that text vertically. With the
   min-height on the button, a one-line name dropped by half the reserved
   slack (measured: the baseline moved from 16px below the box top to 26.8px)
   and hung 11px under the tier badge, which was aligned to the top of the same
   box. Button internals also differ across engines, so nothing about this
   layout should depend on them. */
.nm-box{min-height:calc(2 * var(--nm-size) * var(--nm-lh))}
/* The two place-name hovers, together, because they were the same no-op.
   Both said color:var(--accent) on an element that inherits --ink, and on
   this palette --accent and --ink are both #0E0E0E — 1.00:1, a hover that
   changed nothing. Plain <a> gets away with the same declaration because the
   browser still underlines it; these are <button class="bare">, which gets no
   default decoration, so the page's primary "this name opens the details"
   affordance had no pointer feedback at all.
   An underline rather than a colour: there is no darker ink to move to, and
   moving lighter would read as disabled. Offset far enough to clear the
   descenders on the Latin in a mixed name, and kept at 1px so it does not
   thicken under the 900-weight serif the card title is set in. */
.nm:hover,.spot .sn:hover{
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;
}
/* The tier badge belongs to the name's first line, so it gets a box exactly one
   name-line tall and centres inside it. Aligned to the top of .nm instead, it
   hung off the cap height of a 21.6px line box while its own box is 19.5px —
   two different tops, which is what the stray margin-top:3px on it had been
   approximating. Now the box does it, and it stays right when the name wraps to
   a second line or the name's size changes. */
.hd-r{
  display:flex;align-items:center;gap:8px;flex:none;
  height:calc(var(--nm-size) * var(--nm-lh));
}
.loc{font-size:11.5px;color:var(--ink-3);line-height:1.35}
/* What makes lang="ja" (written by langAttr onto every name_local) actually
   change anything. On its own the attribute steers hyphenation and screen
   reader pronunciation but not font selection — an explicit font-family list
   wins over it — so the mechanism the langAttr comment describes at length
   was inert until these rules existed.
   Two rules rather than one because the same .loc lands in two type contexts:
   in a card it sits under the name in the sans stack, and in the detail
   dialog it trails the title inside an h3 set in --serif. A single :lang(ja)
   rule would put a sans local name inside a serif heading. Any further place
   a local name is rendered in serif needs adding to the second selector. */
:lang(ja){font-family:var(--sans-ja)}
.dlg-h h3 :lang(ja){font-family:var(--serif-ja)}

/* Display tracking, off for the languages it hurts. boot() writes the trip's
   output language onto <html>, so this reads the same value the rest of the
   page is rendered in — zh-CN matches :lang(zh), and so on. Only the two
   display headings take var(--tracking) at all, but on a Chinese trip those
   are the destination name and every route heading in the guide, and Han is
   drawn to a fixed em box that negative tracking simply crowds.
   Kept as a token override rather than a per-rule one so a third heading
   picking up --tracking later inherits the right answer. */
:root:lang(zh),:root:lang(ja),:root:lang(ko){--tracking:normal}
/* Scoped to the card header: .loc is also the detail dialog's h3, where it
   trails the name inline and must stay inline. */
.hd .loc{
  margin-top:2px;min-height:1.35em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;
}
.tier{
  font:700 10.5px/1 var(--mono);padding:3.5px 6px;border-radius:4px;flex:none;
  border:1px solid transparent;letter-spacing:.5px;
}
/* Four weights for four tiers: gold fill, black fill, outlined, ghost. S used to
   take the black and A the lemon — but the lemon is the caution fill everywhere
   else on the card, so A and "closed Sundays" wore the same color. Gold pulls
   the top tier out of that family, and black moves down one step to A, where it
   is still emphatic without competing. */
.t-S{background:var(--gold);color:var(--ink)} .t-A{background:var(--accent);color:var(--on-accent)}
.t-B{background:var(--paper-2);color:var(--ink-2);border-color:var(--line)}
.t-C{background:transparent;color:var(--ink-3);border-color:var(--line)}
/* User-added stub not yet researched by the AI. The dashed border echoes the
   same mark on its map marker */
.t-stub{background:transparent;color:var(--ink-3);border:1px dashed var(--line-2);font-weight:600}

/* Three lines, not two: the median pitch here is 83 characters, which at this
   width is ~3.2 lines — two lines would cut half the places mid-sentence.
   Three still isn't enough for 40% of them, so the clamp only works because the
   dialog carries the whole pitch as a lede (see openDetail). It used to render
   `detail || pitch`, which dropped the pitch entirely whenever detail existed —
   and the tail cut off here was then readable nowhere at all. */
.pitch{
  color:var(--ink-2);font-size:12.5px;line-height:1.6;margin:8px 0 0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
/* Centred cluster, no leading glyphs. The ◷ ◎ ▢ △ marks in front of each
   fact were decoration, not information — the values already say what they
   are, and three tiny symbols on every one of 47 cards read as noise.
   margin-top:auto is what keeps the grid tidy: however long the pitch, the
   flags and the ticket run, the fact strip and the pick control below it are
   pushed to the card's floor, so they line up across every card in a row. */
/* Top-aligned, not centred: when a long ticket makes the middle column six
   lines tall, centring leaves "1-2 hours" and "outdoor" floating at its
   midpoint with nothing to line up against. Top-aligned, all three start on
   the same line and the strip reads as a table row. */
.facts{
  display:flex;align-items:flex-start;justify-content:center;gap:10px;
  margin-top:auto;padding-top:11px;font-size:11.5px;color:var(--ink-3);
}
/* block, not flex: as a flex container the ticket's text formed one anonymous
   item that sized to its own content instead of reflowing to the cell, and the
   longest tickets bled a few px past the column rule. */
.facts span{display:block;white-space:nowrap;flex:none;line-height:1.5}
/* Stretches to the row's height so it still reads as a column rule when the
   ticket in the middle wraps to several lines */
.fdiv{width:1px;align-self:stretch;min-height:13px;background:var(--line-soft);flex:none}
/* Ticket price is the only fact whose source text can run a whole paragraph
   ("grounds free to enter; Central Garan adults ¥500 / Treasure Hall ¥500 /
   Honbō Garden ¥300, three separate tickets, not interchangeable…"). It isn't
   laid out here — shortPrice() condenses it to a label ("free / from ¥500")
   and the dialog keeps the text verbatim, so this cell is one line in
   practice. It stays wrappable anyway: nothing guarantees a label is short in
   a currency or language we haven't seen, and wrapping beats spilling past
   the column rule. */
.facts .tk{
  flex:0 1 auto;min-width:0;white-space:normal;text-align:center;line-height:1.5;
}

.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.flag{
  font-size:11.5px;padding:3px 9px;border-radius:5px;display:flex;align-items:center;gap:4px;
  border:1px solid transparent;
}
.f-danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 22%,transparent)}
.f-warn{background:var(--warn-soft);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.f-info{background:var(--paper-2);color:var(--ink-3);border-color:var(--line)}
.f-unverified{
  background:repeating-linear-gradient(-45deg,var(--warn-soft),var(--warn-soft) 5px,transparent 5px,transparent 10px);
  color:var(--ink);border-color:color-mix(in srgb,var(--warn) 34%,transparent);font-weight:600;
}
/* Verification-blocked places: the card carries a full .verify-box
   explanation, and the top filter bar has a "⚠ needs your check" chip that
   picks them all out at once — more useful than a border, so no border. */
.verify-box{
  margin-top:10px;padding:9px 12px;border-radius:7px;font-size:12.5px;line-height:1.6;
  background:var(--warn-soft);border:1px dashed color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink-2);
}
.verify-box b{color:var(--ink)}
.verify-box ul{margin:6px 0 0;padding-inline-start:18px}
.verify-box li{margin:2px 0}

/* Tri-state. A centred pill sized to its own labels, not stretched to the
   card: three short words spread across 347px put the buttons further apart
   than the choice between them warrants, and it fought the centred fact strip
   above it.
   Grid rather than flex, and fit-content rather than a fixed width, so the
   three segments come out equal without any measurement of our own: under
   max-content sizing every 1fr column resolves to the widest label, and the
   pill grows with it. Nothing here assumes the labels are two Chinese
   characters — "Not interested", or a German compound, widens the pill on its
   own; max-width caps it at the card and the labels wrap rather than
   overflowing.

   The selected segment is a pill floating on a track, inset by the container's
   padding, rather than a slab that fills its column and gets sliced flat where
   it meets the neighbour — the middle one came out a plain rectangle and the
   two ends came out half-round, so the same control had three different
   shapes depending on which answer you gave. One padding value sets the inset
   on all four sides; the radius is 999px on both the track and the segment, so
   neither has to know the control's height.
   The dividers went with it: a full-height hairline next to a floating pill
   reads as a seam the pill is failing to line up with. What separates the
   three now is the track itself. */
/* Same segmented pill as the tab bar, and now built from the same parts: the
   tab bar's own track colour, its 5px padding ring, no outline. The heavy rule
   came off for the reason it came off the title band — an outline here while the
   bar above has none makes two instances of one pattern read as two components.
   Nothing is lost by dropping it: --fill on a card measures 1.28:1, slightly
   *stronger* than the tab bar against the canvas (1.17:1), so the track still
   draws itself. */
.pick{
  display:grid;grid-template-columns:repeat(3,1fr);
  margin:11px auto 0;width:fit-content;max-width:100%;
  border-radius:999px;
  padding:5px;background:var(--fill);
}
.pick button{
  background:transparent;border:0;border-radius:999px;
  padding:7px 15px;font-size:12.5px;color:var(--ink-3);
  transition:background .12s,color .12s,scale .12s;
}
/* The tab bar's hover, literally: a wash of white over the track rather than the
   theme's yellow, so two instances of one pattern behave the same way under the
   pointer. It cannot be --fill any more — that is the track's own colour now,
   and hovering would show nothing. At 1.12:1 over the track this is deliberately
   faint; the segment that matters is the pressed one, and it is filled solid.
   The other twelve --accent-soft hovers are left alone: they belong to chips,
   menus and list rows, which are not this pattern. */
.pick button:hover:not([aria-pressed=true]){background:rgba(255,255,255,.45);color:var(--ink)}
/* font-weight is deliberately not in the transition list above, though the
   duration-only shorthand that used to be there did animate it. Tweening a
   weight re-lays-out the text on every frame, and on the CJK fallbacks 500
   and 600 usually resolve to the same face anyway — so it was paying for a
   reflow to render nothing. It snaps now. */
.pick button[aria-pressed=true]{font-weight:600}
.pick button.y[aria-pressed=true]{background:var(--ok);color:var(--on-ok)}
.pick button.m[aria-pressed=true]{background:var(--warn);color:var(--on-warn)}
.pick button.n[aria-pressed=true]{background:var(--ink-3);color:var(--paper)}
/* Reads as a note about the place, so it sits with the flags rather than
   under the buttons — where, being present on some cards and not others, it
   would push the pick control off the shared floor and break the row's
   alignment, which is the one thing the grid layout has to get right. */
.why{font-size:11.5px;color:var(--ink-3);margin-top:8px;font-style:italic;line-height:1.5}

/* Folded photo stops */
.spots{margin:11px 0 0;padding:9px 0 0;border-top:1px dashed var(--line-soft);}
.spots-h{font-size:11.5px;color:var(--ink-3);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.spot{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;flex-wrap:wrap}
.spot .sn{cursor:pointer;font-weight:500}
.spot .sn:focus-visible{outline-offset:1px}
.spot .sd{color:var(--ink-3);font-size:11.5px}
/* A photo stop is one line inside a card, so its copy sits at the line's
   right end rather than centred, and runs a size smaller. */
.spot .pick{
  margin:0 0 0 auto;transform:scale(.88);transform-origin:right center;
}
.spot .pick button{padding:6px 13px}

/* ═══════════════════════════════════════════════ Bottom action bar */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--canvas);
  border-top:1px solid var(--canvas-line);
  color:var(--canvas-ink);
}
.actionbar a{color:var(--canvas-accent)}
.actionbar .hint{color:var(--canvas-ink-3)}
/* .lnk is the quiet text button ("Manual save…", day-column actions). Its
   --ink-3 was tuned for paper and lands at 3.8:1 down here. */
.actionbar .lnk{color:var(--canvas-ink-3)}
.actionbar .lnk:hover{background:var(--accent-soft);color:var(--ink)}
/* Under the local server this bar is just a status line and shouldn't cost a
   button's height. With buttons present (file://) the buttons stretch it
   naturally; without them it's a single line of small text. */
.actionbar-in{
  max-width:1180px;margin:0 auto;padding:5px 20px;min-height:30px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.actionbar-in .btn{padding:5px 13px;font-size:12.5px}
/* The status text fills the remaining width, pushing the fold-out area and
   "Manual save…" all the way right. When expanded, the buttons land on the
   same row and the bar keeps its height — placed right of the link they'd
   wrap and double it. */
.actionbar-in .hint{margin-inline-start:0;text-align:start;flex:1 1 auto}
.more-box{display:flex;gap:8px}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:500;
  transition:background .15s,color .15s,border-color .15s,opacity .15s,scale .15s;
}
.btn:hover{border-color:var(--ink);background:var(--paper-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.87;background:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--ink-3);margin-inline-start:auto;text-align:end;max-width:52ch}
/* Auto-save failure is the one moment the user can lose data — it must not
   look like ordinary explanatory text */
.hint.bad{color:var(--danger);font-weight:500}

/* ═══════════════════════════════════════════════ Dialogs */
/* The <dialog> is the scroll container itself (.dlg-h sticks to it, .dlg-b
   never overflows), so the rubber-band at either end was this element's, and
   it both chained to the page behind and let the bounce show past the painted
   box. overscroll-behavior:none stops both at once — no chaining out, no
   bounce in. */
dialog{
  border:1px solid var(--line);border-radius:var(--r-card);background:var(--card);color:var(--ink);
  padding:0;max-width:660px;width:calc(100vw - 34px);max-height:86vh;box-shadow:0 24px 70px rgba(0,0,0,.28);
  overscroll-behavior:none;
  /* Query container for the footer below. It has to be the dialog rather than
     the footer itself — a container query cannot style its own container, and
     the footer is the thing whose layout changes. Safe here because the width
     is declared, not derived from content, so inline-size containment changes
     nothing about how the dialog sizes. */
  container-type:inline-size;container-name:dlg;
  /* Same corner as a place card. The sticky header and footer paint to the
     dialog's edges, so the scroll container has to clip them to the radius or
     their square corners sit outside the curve. */
  overflow:auto;
}
dialog::backdrop{background:rgba(20,16,12,.5);backdrop-filter:blur(3px)}

/* Scoped to #dlg rather than dialog. #rdlg asks *why* a place was rejected —
   it follows a negative judgement, and arriving quietly suits it better than
   floating in, so it keeps its instant appearance.

   The asymmetric 240ms-in / 180ms-out needs no class toggle: on close the
   transition that runs is the one on the base #dlg rule (the properties fall
   back to the closed state), on open it is the one on #dlg[open]. Each rule
   carries its own duration and that is the whole mechanism.

   allow-discrete on display and overlay is what lets the closing animation
   finish at all — the first keeps the element displayed through the exit, the
   second keeps it in the top layer. A browser that does not know overlay still
   runs the exit off display; it only drops out of the top layer early.

   Nothing here moves or scales, so this half needs no reduced-motion opt-out.
   The half that does is gated separately below. */
#dlg{
  opacity:0;
  transition:opacity .16s ease-in, overlay .18s allow-discrete, display .18s allow-discrete;
}
#dlg[open]{
  opacity:1;
  transition:opacity .18s ease-out, overlay .24s allow-discrete, display .24s allow-discrete;
}
@starting-style{ #dlg[open]{opacity:0} }
#dlg::backdrop{opacity:0;transition:opacity .16s, overlay .18s allow-discrete, display .18s allow-discrete}
#dlg[open]::backdrop{opacity:1;transition:opacity .2s}
@starting-style{ #dlg[open]::backdrop{opacity:0} }

/* The movement half, gated the way .pgnav's entrance is rather than exempted
   down in the reduce block — same result, and it keeps the opt-out impossible
   to forget when someone edits these three rules later.

   --from-x/--from-y are written by dlgFrom() from the card that was clicked,
   so the dialog scales in from that card's direction. They default to 0px, so
   any open with no source element (the export dialog, the schedule-button
   repaint) degrades to a plain centred zoom.

   The resting transform is none, not scale(1): an element with a transform
   becomes the containing block for fixed descendants, and none avoids the
   whole class of surprise. Interpolating to none is well defined.

   Only transform and opacity move here. The dialog is its own scroll container
   with sticky header and footer (see above), so animating height or clip-path
   instead would fight both. */
@media (prefers-reduced-motion:no-preference){
  #dlg{
    transform:translate(var(--from-x,0px),var(--from-y,0px)) scale(.92);
    transition:opacity .16s ease-in, transform .18s ease-in,
               overlay .18s allow-discrete, display .18s allow-discrete;
  }
  #dlg[open]{
    transform:none;
    transition:opacity .18s ease-out, transform .24s cubic-bezier(.2,.8,.25,1),
               overlay .24s allow-discrete, display .24s allow-discrete;
  }
  @starting-style{
    #dlg[open]{transform:translate(var(--from-x,0px),var(--from-y,0px)) scale(.92)}
  }
}

.dlg-h{
  position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line-soft);
  padding:17px 20px 13px;display:flex;align-items:flex-start;gap:12px;z-index:2;
}
/* The heading takes tabindex="-1" + autofocus so that showModal() lands the
   initial focus here instead of on the ✕. Left to the spec's default, focus
   goes to the dialog's first focusable element, which is the close button —
   and Chrome's :focus-visible heuristic then draws a ring on it the first time
   a dialog is opened after a page load (before that first open, no click has
   yet landed on a focusable element, so the browser can't attribute the focus
   move to a pointer and treats it as keyboard-ish). Every later open looked
   clean, so the ✕ appeared to be pre-pressed exactly once per session.
   The ring is suppressed here because the heading is a reading anchor, not a
   control — the dialog's own frame is what says "you are in a dialog". Focus
   still enters the dialog, so Esc and the focus trap keep working, and Tab
   walks the content from the top in document order. */
/* Same weight as the card title it was opened from — the two are the same
   label at two sizes. Both were 500, which on the CJK fallbacks resolves to
   the regular face: a Han glyph is a fixed em width, so nothing in the layout
   showed that the weight had not taken. Measured on this stack, the serif
   resolves four distinct weights (≤300 / 400-500 / 600-700 / ≥800), so 900
   lands on the heaviest face available. On a system whose CJK serif ships
   only regular and bold, 900 is synthesised — acceptable here, and 400/700
   remain the only two weights any system is guaranteed to draw for real. */
.dlg-h h3{font:900 21px/1.3 var(--serif);margin:0;flex:1}
.dlg-h h3:focus,.dlg-h h3:focus-visible{outline:none}
.dlg-h .x{
  background:none;border:0;font-size:22px;color:var(--ink-3);line-height:1;border-radius:6px;
  width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;
}
.dlg-h .x:hover{background:var(--accent-soft);color:var(--ink)}
/* The bottom inset lives on .dlg-f, not here: that footer is sticky, and a
   padding below it on this element would leave a gap the buttons drop into at
   the end of the scroll. Every dialog body ends with a .dlg-f.
   No overflow-y:auto either. The block comment above says this element never
   overflows — the <dialog> is the scroll container — so the rule was inert for
   scrolling, but it still made this a scroll container in its own right, and
   that is what a sticky child positions against. The footer stuck to a box
   that never scrolls, i.e. it didn't stick at all (measured 260px below the
   dialog's floor mid-scroll). Dropping it hands .dlg-f the same scrollport
   .dlg-h already sticks to. */
.dlg-b{padding:17px 20px 0}
.dlg-b h4{font:600 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);margin:20px 0 8px}
.dlg-b h4:first-child{margin-top:0}
.dlg-b p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
/* The card clamps .pitch to three lines and — measured on the Osaka trip — 40%
   of them overflow it, so the dialog has to carry the pitch as well: it is the
   only place that tail can be read. It has to look like the verdict rather than
   one more body paragraph, and the axis for that is deliberately *not* type:
   the first attempt set it 15px in --ink against the body's 14px --ink-2, and a
   7% size step doesn't read as intent, it reads as a styling bug. A rule in the
   margin says "different kind of text" without touching the type at all. */
.dlg-b .lede{border-inline-start:2px solid var(--gold);padding-inline-start:12px;margin-bottom:15px}
.dlg-b .lede p:last-child{margin-bottom:0}
/* Height cap without cropping: the photo always shows whole; whatever the
   cap bites, the image shrinks preserving ratio and centers, side gaps
   accepted (explicitly chosen over .media's cover-crop — a dialog hero is
   for *looking at* the photo, unlike a grid tile). Without the cap a 3:4
   photo at full width runs ~880px tall and the whole first screen of the
   dialog is image. 48vh keeps the cap meaningful on short viewports where
   420px would already be most of the dialog. width:auto + max-width makes
   the element box hug the image, so the border-radius rounds the photo
   itself, not a letterbox around it. */
.dlg-img{max-width:100%;width:auto;max-height:min(48vh,420px);
  border-radius:9px;margin:0 auto 14px;display:block}
.credit{font-size:11px;color:var(--ink-3);margin:-9px 0 15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 15px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink-2)}
.srcs{list-style:none;padding:0;margin:0;font-size:13.5px}
.srcs li{margin-bottom:5px}
.srcs a{word-break:break-all}

.reasons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.reasons button{
  border:1px solid var(--line);background:var(--card);padding:6px 13px;
  border-radius:20px;font-size:13px;color:var(--ink-2);
}
.reasons button:hover,.reasons button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea{
