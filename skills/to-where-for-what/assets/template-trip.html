      <pre class="code" id="code">${esc(code)}</pre>
      <div class="dlg-f">
        <button class="btn" data-close>${T.close}</button>
        <button class="btn primary" id="cp">${T.copy}</button>
      </div>
    </div>`;
  dlgFrom(null);   // no source card — open centred, and don't inherit the last card's offset
  $("#dlg").showModal();
  $("#dlg").scrollTop = 0;   // same carryover as openDetail: the dialog is the scroll container
  $("#cp").onclick = async () => {
    // Measured: the embedded browser's navigator.clipboard throws
    // NotAllowedError — a text-selection fallback is mandatory
    try{ await navigator.clipboard.writeText(code); toast(T.copied); }
    catch(e){
      const r = document.createRange(); r.selectNode($("#code"));
      getSelection().removeAllRanges(); getSelection().addRange(r);
      toast(T.copyFail);
    }
  };
}

let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 3200);
}

/* ═══════════════════════════════════════════════════════════════════
   Map view

   Basemap tiers and fallback chain (every step verified by testing):
     ① Simple   OpenFreeMap positron. The default — the basemap must yield to
                markers and route lines; graybeard's road/sign/label density
                would drown dozens of markers
     ② Standard graybeard style + OSM's official Shortbread vector tiles.
                Richer detail, and doubles as the vector backup: different
                operator, different schema, won't die together with ①.
                Renders under file:// too (the OSM vector endpoint doesn't
                require a Referer)
     ③ Raster   OSM's official raster, unlocked only over http — file:// sends
                no Referer and OSM returns an image reading "Access blocked",
                with HTTP status 200, invisible to onerror
     ④ No WebGL → Leaflet + CARTO raster
     ⑤ Everything dead → static scatter plot; relative positions stay readable

   Why ① is the default (measured evidence):
     · OSM's official vector tiles **need no Referer** and return 200 under
       file:// — while the official raster set gets blocked. Double-click
       opening still gets a decent basemap.
     · OFM's park source layer measured empty (Osaka Castle / Nakanoshima /
       Expo site: 0 features each); greenery only via a landcover.grass
       workaround. OSM Shortbread's land layer carries park/garden/forest/
       grass classes directly.
     · Officially operated, not a one-person donation project.
     · Global-coverage spot check across 9 cities (including Lhasa and
       Reykjavík): data everywhere.

   ① and ③ are both OSM-official, ② is OpenFreeMap; the two vector sources
   differ in schema and operator and won't fail together.

   Crossed with that is lightness: ① and ② each exist as a light/dark pair of
   styles over the *same* tiles (positron ⇄ dark, graybeard ⇄ shadow), so the
   pair is one setting on top of the tier, not two more tiers. ③ is raster and
   has no dark half — there the Dark button disables itself rather than
   pretending. It is the only light/dark control on the page — the page
   itself is fixed light.
   ═══════════════════════════════════════════════════════════════════ */
const MAP = (() => {
  const MAPLIBRE_JS  = "https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js";
  const MAPLIBRE_CSS = "https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css";
  const LEAFLET_JS   = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  const LEAFLET_CSS  = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";

  /* graybeard binds to the Shortbread **schema**, not to VersaTiles the
     vendor. Point its sources at OSM's official Shortbread endpoint and the
     other 324 layers work untouched. (The reverse doesn't hold: graybeard
     and positron share zero source-layers, so running graybeard on
     OpenFreeMap would mean rewriting every layer.) */
  /* graybeard ⇄ shadow are the light and dark halves of one style: same 324
     layers, identical layer ids (verified: the diff is empty both ways), same
     `versatiles-shortbread` source key — so the repointing below, HIDE and the
     tint table all apply to either, only the URL changes. shadow is a genuine
     luminance inversion, not a dimmed copy: its roads (rgb 51) sit *darker*
     than the ground (rgb 60), keeping graybeard's figure/ground relation
     rather than flipping it. */
  const SHORTBREAD_STYLE = {
    light:"https://tiles.versatiles.org/assets/styles/graybeard/style.json",
    dark: "https://tiles.versatiles.org/assets/styles/shadow/style.json",
  };
  const OSM_VECTOR = "https://vector.openstreetmap.org/shortbread_v1/{z}/{x}/{y}.mvt";
  const OSM_ATTRIB = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
  // For the Leaflet fallback: CARTO has CORS, needs no Referer, renders under file://
  const CARTO_RASTER = ["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                        "https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"];
  // Each style JSON is fetched once; switching back and forth doesn't re-request.
  // Keyed by lightness — the two are different documents.
  const sbStyle = { light:null, dark:null };

  /* The dark halves of the two vector basemaps.
     The map is view ②'s largest surface; a light basemap embedded in a
     near-black page is one big bright patch. OpenFreeMap's dark and positron
     come from the same openmaptiles schema with identical layer ids, so the
     tint patch, hide rules and POI layer all carry over — only the URL
     changes; graybeard/shadow are the same deal on the shortbread side.
     Raster is the one that can't follow: the tiles are baked images and OSM
     ships no dark set. So "is the basemap dark" is a question about the
     basemap in use; the page around it does not switch. See baseIsDark, MI. */
  const ofmStyle = dark =>
    "https://tiles.openfreemap.org/styles/" + (dark ? "dark" : "positron");

  /* Fetch a shortbread style and repoint its source at OSM's official
     endpoint. Never caches a failure — that would leave no room to retry. */
  const shortbreadStyle = dark => {
    const k = dark ? "dark" : "light";
    return (sbStyle[k] ||= fetch(SHORTBREAD_STYLE[k], { cache:"force-cache" })
      .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(s => {
        const src = s.sources["versatiles-shortbread"];
        src.tiles = [OSM_VECTOR];
        src.maxzoom = 14;      // matches vector.openstreetmap.org's tilejson
        src.attribution = "";
        return s;
      })
      .catch(e => { sbStyle[k] = null; throw e; }));
  };

  const BASEMAPS = [
    { id:"ofm", label:T.bmSimple, kind:"vector", schema:"openmaptiles",
      style:() => ofmStyle(st.mapDark),
      attrib:'OpenFreeMap © OpenMapTiles Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' },
    { id:"gb", label:T.bmStandard, kind:"vector", schema:"shortbread",
      style:() => shortbreadStyle(st.mapDark),
      attrib:() => OSM_ATTRIB + ' · Vector tiles <a href="https://vector.openstreetmap.org/" target="_blank" rel="noopener">vector.openstreetmap.org</a> · Style: VersaTiles '
        + (st.mapDark ? "shadow" : "graybeard") },
    // noDark: raster tiles are pre-rendered images; there is no dark set to
    // switch to. The lightness buttons disable themselves here rather than
    // silently doing nothing.
    { id:"osm", label:T.bmRaster, kind:"raster", httpOnly:true, noDark:true,
      tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
      attrib: OSM_ATTRIB },
  ];

  /* ---------- Ink drawn on the basemap ----------
     (hollow markers, white rings, halos on transit stations and labels…)
     These were all hardcoded light, on the premise "all three basemaps are
     light" — a premise now true only when the basemap in use happens to be
     light. So they're gathered in one place and flip with the *current
     basemap*, not with the page: switching to Raster always lands on a
     light basemap whatever the lightness button says, and these inks must come
     back with it. */
  const MAP_INK = {
    light:{ hollow:"#fff", ring:"#fff", halo:"#fff",
            lodging:"#545454", onLodging:"#fff",
            station:"#fff", stationEdge:"#4A4A4A", stationLabel:"#4A4A4A",
            poi:"#6C6C6C", poiHalo:"rgba(255,255,255,.9)",
            water:"rgb(190,221,243)", grass:"rgb(211,228,186)", wood:"rgb(186,214,180)" },
    // Note: flipped *by role*, not by color. A hollow dot is white on a light
    // basemap because white = the least conspicuous shade there, and it means
    // "not scheduled yet"; on a dark basemap the least conspicuous shade is
    // near-black — flipping it to light would make unscheduled dots louder
    // than scheduled ones, inverting the hierarchy. Station dots likewise:
    // the real figure is the stroke, the fill must recede into the basemap.
    dark: { hollow:"#2A2A2A", ring:"#1F1F1F", halo:"#1F1F1F",
            lodging:"#D5D0CA", onLodging:"#1F1F1F",
            station:"#1F1F1F", stationEdge:"#D5D0CA", stationLabel:"#D5D0CA",
            poi:"#A3A3A3", poiHalo:"rgba(31,31,31,.9)",
            water:"rgb(28,46,66)", grass:"rgb(38,50,34)", wood:"rgb(34,52,38)" },
  };
  /* Deliberately computed, not stored. Stored, every place that touches
     st.base would have to remember to sync it — and init()'s fallback path
     writes st.base = "gb" directly without going through switchBase. Missed
     once in practice: the basemap was light but the inks were still the dark
     set.
     Both fallback engines are light and say so outright: Leaflet paints
     CARTO's light raster, and the static path draws no basemap at all — it's a
     sketch on --paper-2, a page surface, and the page is fixed light. */
  const baseIsDark = () => {
    if(st.engine === "leaflet" || st.engine === "static") return false;
    const b = BASEMAPS.find(x => x.id === st.base);
    return !!(b && !b.noDark && st.mapDark);
  };
  const MI = () => MAP_INK[baseIsDark() ? "dark" : "light"];

  /* ---------- Tinting water and greenery ----------
     Both styles paint water and greenery gray (graybeard is colorful with
     saturation crushed to 0 — the hue is still in there; positron is plain
     light gray). Only these two classes are restored to color; roads,
     buildings and labels all stay gray — so the only color left in the frame
     is three things: markers, transit lines, water & greenery.

     The shortbread values used to be hardcoded on the premise that graybeard
     exists in light only. Now that shadow is the dark half, they come in two
     sets keyed the same way as MAP_INK. The dark set is not the light set
     dimmed: shadow's ground is a mid gray (rgb 60), so the tints have to be
     *darker* than that ground to read as water and greenery rather than as
     bright patches — the same figure/ground inversion shadow itself applies to
     its roads. */
  const SB_TINT = {
    light:{ water:"rgb(190,221,243)", park:"rgb(217,217,165)",
            forest:"rgb(150,196,124)", grass:"rgb(216,232,200)",
            leisure:"rgb(231,237,222)", wetland:"rgb(211,230,219)" },
    dark: { water:"rgb(38,58,80)", park:"rgb(56,58,38)",
            forest:"rgb(42,62,44)", grass:"rgb(48,58,42)",
            leisure:"rgb(54,58,50)", wetland:"rgb(44,60,56)" },
  };
  const SB = () => SB_TINT[baseIsDark() ? "dark" : "light"];
  const tintFor = schema => schema === "shortbread" ? (t => ({
      "water-ocean":t.water, "water-area":t.water, "water-area-river":t.water,
      "water-area-small":t.water, "water-river":t.water, "water-canal":t.water,
      "water-stream":t.water, "water-ditch":t.water, "water-dam":t.water,
      "land-park":t.park, "land-garden":t.park,
      "land-vegetation":t.park, "land-forest":t.forest,
      "land-grass":t.grass, "land-leisure":t.leisure,
      "land-wetland":t.wetland,
    }))(SB()) : schema === "openmaptiles" ? {
      "water":MI().water, "waterway":MI().water, "landcover_wood":MI().wood,
    } : {};

  /* Basemap layers to hide.
     Road-number shields are black-digits-on-white squares — while our day
     sequence numbers are white digits in dots. Two kinds of numbers crowding
     one map, and at first glance you can't tell which is "today's stop #N".
     The basemap's job is to make the location recognizable; once recognized,
     what gets read is what we draw on top. */
  const HIDE = {
    openmaptiles: ["highway-shield-non-us", "highway-shield-us-interstate", "road_shield_us"],
    shortbread:   ["label-motorway-shield"],
  };

  function applyHide(map, schema){
    for(const id of HIDE[schema] || []){
      if(map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none");
    }
  }

  /* POI layers. The two styles differ completely:
       Simple (positron)   has zero POI layers, yet the tiles hold 30k+ POI
                           features — data present, just unpainted; we add a
                           layer ourselves
       Standard (graybeard) ships 9 layers (poi-amenity / poi-shop /
                           poi-tourism …) — only visibility to toggle
     Off by default: POI density varies by city, and central Osaka turns to
     mush with it on. No class whitelist — MapLibre's label collision thins
     them out, and zooming out naturally leaves only a few. */
  const POI_LAYER = "x-poi";
  const GB_POI = ["poi-amenity", "poi-leisure", "poi-tourism", "poi-shop",
                  "poi-man_made", "poi-historic", "poi-emergency", "poi-office"];

  /* All-on is useless: measured at Dōtonbori z16, 90 labels per screen, most
     of them convenience stores (FamilyMart ×7, Lawson ×4) and chains, with
     only 4 real attractions — and our own numbered dots got squeezed out. So
     grouped by class, with only the three groups useful for trip planning on
     by default. class values come from OpenMapTiles' poi layer; anything
     unlisted falls into "other". */
  const POI_GROUPS = [
    { id:"sight", label:"sights & culture", on:true,
      cls:["attraction","museum","art_gallery","artwork","monument","castle",
           "viewpoint","zoo","aquarium","theme_park","information","historic"] },
    { id:"worship", label:"temples & shrines", on:true,
      cls:["place_of_worship","cemetery"] },
    { id:"transit", label:"stations & entrances", on:true,
      cls:["railway","bus","subway","entrance","ferry_terminal","aerialway","harbor"] },
    { id:"park", label:"parks & leisure", on:false,
      cls:["park","playground","stadium","swimming","golf","picnic_site","campsite"] },
    { id:"food", label:"food & drink", on:false,
      cls:["restaurant","fast_food","cafe","bar","beer","pub","ice_cream"] },
    { id:"shop", label:"shopping", on:false,
      cls:["shop","clothing_store","alcohol_shop","grocery","department_store","bakery"] },
    { id:"stay", label:"lodging", on:false, cls:["lodging"] },
    { id:"life", label:"daily services", on:false,
      cls:["pharmacy","hospital","police","post","atm","bank","toilets","parking",
           "laundry","fire_station","school","college","library","town_hall"] },
  ];
  const poiClasses = () => POI_GROUPS.filter(g => g.on).flatMap(g => g.cls);

  function addPoi(map, schema){
    if(schema !== "openmaptiles" || map.getLayer(POI_LAYER)) return;
    if(!map.getSource("openmaptiles")) return;
    map.addLayer({
      id: POI_LAYER, type:"symbol", source:"openmaptiles", "source-layer":"poi",
      minzoom: 14,
      filter: poiFilter(),
      layout:{
        "text-field": ["get", "name"],
        "text-font": pickFont(map, false),   // already an array; don't wrap it again
        "text-size": 10.5,
        "text-anchor": "top",
        "text-offset": [0, 0.45],
        "text-max-width": 7,
        // lower rank = more important; let it claim space first, the rest
        // get eaten by collision naturally
        "symbol-sort-key": ["coalesce", ["get", "rank"], 99],
        "text-optional": false,
        visibility: "none",
      },
      paint:{ "text-color":MI().poi, "text-halo-color":MI().poiHalo, "text-halo-width":1.1 },
    });
  }

  const poiFilter = () =>
    ["all", ["has", "name"], ["in", ["get", "class"], ["literal", poiClasses()]]];

  /* No UI toggle: the classes are fixed to the on:true groups in POI_GROUPS.
     A class panel existed once, eating a chunk of the map's top-right — but
     whether these groups fit isn't something to adjust on every map use; if
     it truly needs tuning, edit the table above.

     graybeard's 9 layers are cut by OSM top-level category (poi-shop /
     poi-tourism…), which doesn't map onto OpenMapTiles' class values — no
     shared filter possible; over there it's all-on or all-off. */
  function applyPoi(){
    if(st.engine !== "maplibre" || !st.map) return;
    const on = poiClasses().length > 0;
    const ids = schemaOf(st.base) === "openmaptiles" ? [POI_LAYER] : GB_POI;
    for(const id of ids){
      if(st.map.getLayer(id)) st.map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
    }
    if(st.map.getLayer(POI_LAYER)) st.map.setFilter(POI_LAYER, poiFilter());
  }

  function applyTint(map, schema){
    for(const [id, color] of Object.entries(tintFor(schema))){
      const l = map.getLayer(id);
      if(l) map.setPaintProperty(id, l.type === "line" ? "line-color" : "fill-color", color);
    }
    if(schema !== "openmaptiles") return;
    // positron has no grass-painting layer at all, while the Osaka Castle
    // tile holds 200 grass features. Add one, inserted below water so it
    // doesn't cover the canals.
    if(!map.getLayer("x-grass") && map.getLayer("water")){
      map.addLayer({
        id:"x-grass", type:"fill", source:"openmaptiles", "source-layer":"landcover",
        filter:["in", ["get","class"], ["literal",["grass","farmland","wetland"]]],
        paint:{ "fill-color":MI().grass,
                "fill-opacity":["interpolate",["linear"],["zoom"], 9,0, 12,1] },
      }, "water");
    }
    // landcover_wood originally appears only from z10; zoomed out, whole
    // green areas vanished
    if(map.getLayer("landcover_wood")){
      map.setPaintProperty("landcover_wood","fill-opacity",
        ["interpolate",["linear"],["zoom"], 6,0, 9,1]);
    }
  }

  /* ---------- Basemap lightness preference ----------
     The one light/dark control on the page, and it governs the basemap only.
     The page around it is fixed light, so the default is light too: a
     near-black rectangle inside a paper page is a worse first impression than
     an all-light page, and anyone who wants the dark map is one click and one
     stored value away from keeping it forever.

     Nothing else moves this. There is no page theme to follow and no
     themechange listener — the button is the only writer. */
  const MAPDARK_KEY = LS_KEY + ":mapdark";
  function storedMapDark(){
    try{
      return localStorage.getItem(MAPDARK_KEY) === "1";
    }catch(e){ return false; }
  }

  const st = { ready:false, engine:null, map:null, markers:new Map(),
               base:"ofm", mapDark:storedMapDark(),
               transit:false, focus:null, show:new Set(["yes","maybe","none","no"]),
               grp:"area",   // sidebar grouping: area | choice — tracked separately from the list view's ui.group
               opacity:1,    // transit layer opacity 0.15–1; like st.transit, lives only for this session
               curDay:null, flat:null, addOpen:false, legendOpen:false };

  const geo = p => p && p.coord && typeof p.coord.lon === "number" && typeof p.coord.lat === "number";
  const pts = () => PLACES.filter(geo);
  const kind = p => p.choice || "none";

  /* Lodging is exempt from the yes / maybe / no filter. Those three words are
     trade-offs over **candidate places**, and the hotel is the trip's anchor,
     not a candidate — nobody marks their already-booked hotel "maybe". With
     choice=null it used to fall into the "unrated" bucket: semantically
     wrong, and it inflated the count. Now always shown and counted in no
     bucket. */
  const shown = p => isLodging(p) || st.show.has(kind(p));
  const COLOR = { yes:"var(--ok)", maybe:"var(--ring-maybe)", no:"var(--ring-no)", none:"var(--ring-none)" };

  function center(){
    const l = pts();
    if(!l.length) return { lon:0, lat:0 };
    return { lon:l.reduce((s,p)=>s+p.coord.lon,0)/l.length,
             lat:l.reduce((s,p)=>s+p.coord.lat,0)/l.length };
  }

  /* ---------- Resource loading ---------- */
  const loaded = new Set();
  function inject(tag, attrs){
    const key = attrs.src || attrs.href;
    if(loaded.has(key)) return Promise.resolve();
    return new Promise((res, rej) => {
      const el = document.createElement(tag);
      Object.assign(el, attrs);
      el.onload  = () => { loaded.add(key); res(); };
      el.onerror = () => rej(new Error(T.loadFail + key));
      document.head.appendChild(el);
    });
  }
  const loadJS  = src  => inject("script", { src });
  const loadCSS = href => inject("link", { rel:"stylesheet", href });

  function hasWebGL(){
    try{
      const c = document.createElement("canvas");
      return !!(c.getContext("webgl2") || c.getContext("webgl"));
    }catch(e){ return false; }
  }

  /* Which tile the trip's center falls on — the availability probe uses it
     to fetch a tile guaranteed to have content; probing a blank ocean tile
     would make the "how many KB is normal" judgment meaningless. */
  function centerTile(z){
    const c = center();
    const rad = c.lat * Math.PI / 180;
    return {
      z,
      x: Math.floor((c.lon + 180) / 360 * 2 ** z),
      y: Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * 2 ** z),
    };
  }

  /* ---------- OSM blocked-tile probe ----------
     The block response is a 256×256 PNG reading "Access blocked 403", about
     6987 bytes — with HTTP status 200. Watching status codes or onerror will
     never catch it; you have to look at the byte count. */
  async function osmUsable(){
    if(!location.protocol.startsWith("http")) return false;
    const { z, x, y } = centerTile(12);
    try{
      const r = await fetch(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`, { cache:"no-store" });
      if(!r.ok) return false;
      const b = await r.blob();
      return b.size > 12000;   // real city tiles run 20–50KB; the blocked tile ~7KB
    }catch(e){ return false; }
  }


  function note(html){
    const n = $("#map-note");
    n.innerHTML = html || "";
    n.classList.toggle("on", !!html);
  }

  /* ---------- Basemap switch buttons ----------
     The OSM probe is async. st.degraded must be rechecked when the probe
     returns, or it re-enables buttons that degraded mode just disabled
     (stepped on this in testing). */
  function paintBaseButtons(){
    $("#basemaps").innerHTML = BASEMAPS.map(b =>
      `<button data-base="${b.id}" aria-pressed="${b.id === st.base}">${b.label}</button>`).join("");
  }

  /* ---------- Basemap lightness buttons ----------
     Left = light, right = dark, matching how the two read as a spectrum.
     aria-pressed shows what is actually on screen (baseIsDark), not the stored
     preference: under Raster the preference may say dark while the basemap is
     unavoidably light, and a pressed "Dark" button over a light map would be a
     plain lie to both sighted and screen-reader users. The preference is kept
     intact underneath, so switching back to Simple restores it. */
  function paintLightness(){
    const g = $("#map-lightness");
    if(!g) return;
    g.setAttribute("aria-label", T.bmLightness);
    const eff = baseIsDark();
    g.innerHTML =
        `<button data-mdark="0" aria-pressed="${!eff}" title="${esc(T.bmLightOn)}">${T.bmLight}</button>`
      + `<button data-mdark="1" aria-pressed="${eff}" title="${esc(T.bmDarkOn)}">${T.bmDark}</button>`;
    syncLightness();
    measureLightness();
  }

  /* Enable/disable without repainting, so a basemap switch doesn't rebuild the
     capsule under the user's cursor. */
  function syncLightness(){
    const g = $("#map-lightness");
    if(!g) return;
    const b = BASEMAPS.find(x => x.id === st.base);
    const locked = st.degraded || st.engine === "leaflet" || st.engine === "static";
    const noDark = !!(b && b.noDark);
    const eff = baseIsDark();
    for(const btn of $$("#map-lightness button")){
      const wantDark = btn.dataset.mdark === "1";
      btn.disabled = locked || (noDark && wantDark);
      btn.setAttribute("aria-pressed", String(wantDark === eff));
      btn.title = locked ? T.bmLightnessLock
        : (noDark && wantDark) ? tf("bmNoDark", { label: (b && b.label) || "" })
        : (wantDark ? T.bmDarkOn : T.bmLightOn);
    }
  }

  function lockBaseButtons(reason){
    $$("#basemaps button").forEach(b => {
      b.disabled = true;
      b.title = reason;
      b.setAttribute("aria-pressed", b.dataset.base === st.base);
    });
    syncLightness();   // the fallback engines have no style to swap either
  }

  const PROBES = {
    osm: {
      test: osmUsable,
      offline: T.osmOffline,
      ok:   T.osmOk,
      fail: T.osmFail,
    },
  };

  async function probe(id){
    const sel = `#basemaps [data-base="${id}"]`;
    const btn = document.querySelector(sel);
    const cfg = PROBES[id];
    if(!btn || !cfg) return;
    if(!location.protocol.startsWith("http")){
      btn.disabled = true; btn.title = cfg.offline; return;
    }
    btn.disabled = true;
    btn.title = T.probing;
    const ok = await cfg.test();
    if(st.degraded) return;                       // don't resurrect buttons after degrading
    const b2 = document.querySelector(sel);       // the button may have been repainted during the probe
    if(!b2) return;
    b2.disabled = !ok;
    b2.title = ok ? cfg.ok : cfg.fail;
  }

  /* ---------- Watching for sustained tile failures ----------
     Tested lesson: the once("error") in startMapLibre only covers startup;
     when a later basemap switch or overlay fails, the error is nothing but an
     AJAXError in the console with zero reaction on the page — button lit,
     layer added, no tiles, and the user just thinks "clicking does nothing". */
  const deadBases = new Set();
  function watchTiles(){
    let hits = 0, watching = st.base, timer = null;
    st.map.on("error", ev => {
      const msg = String((ev && ev.error && ev.error.message) || (ev && ev.message) || "");
      if(!/AJAX|Failed to fetch|NetworkError|Load failed/i.test(msg)) return;
      if(watching !== st.base){ watching = st.base; hits = 0; }
      if(deadBases.has(watching)) return;
      hits++;
      clearTimeout(timer);
      timer = setTimeout(() => { hits = 0; }, 8000);   // sporadic single-tile failures don't count
      if(hits < 5) return;

      deadBases.add(watching);
      const b = BASEMAPS.find(x => x.id === watching);
      const btn = document.querySelector(`#basemaps [data-base="${watching}"]`);
      if(btn){ btn.disabled = true; btn.title = T.tilesDead + msg; }
      note(tf("tilesDeadNote", { label: b ? b.label : watching, msg: esc(msg) }));
      if(watching !== "gb") switchBase("gb");
    });
  }

  /* ---------- Style construction ----------
     Async: graybeard's style must be fetched, its sources repointed at OSM's
     official endpoint, then handed to MapLibre. The other two are constants,
     and awaiting a non-Promise costs nothing. */
  async function styleFor(id){
    const b = BASEMAPS.find(x => x.id === id) || BASEMAPS[0];
    if(b.kind === "vector") return typeof b.style === "function" ? await b.style() : b.style;
    // The raster style needs glyphs too — not for the basemap itself (the
    // text is baked into the images), but the transit layer's line numbers
    // and station names are our own symbol layers, and without a font
    // service they silently render no text: layer present, features placed,
    // not a single character visible.
    return {
      version:8,
      glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
      sources:{ base:{ type:"raster", tiles:b.tiles, tileSize:256,
                       maxzoom:b.maxZoom || 19, attribution:"" } },
      layers:[{ id:"base", type:"raster", source:"base" }],
    };
  }

  const schemaOf = id => (BASEMAPS.find(x => x.id === id) || {}).schema;

  function setAttrib(){
    const b = BASEMAPS.find(x => x.id === st.base);
    // Standard's attribution names the style by its actual file (graybeard or
    // shadow), so it's a function there — credit has to match what's rendered.
    $("#attrib").innerHTML = b ? (typeof b.attrib === "function" ? b.attrib() : b.attrib)
      : (st.engine === "leaflet" ? OSM_ATTRIB + " © CARTO" : "");
  }

  /* ═══════════════ Rail transit overlay ═══════════════
     Data fetched from OSM by enrich.py --transit and inlined by build.py —
     zero network requests at runtime. Independent of the basemap: works on
     all three, and under file:// too.

     Why not a ready-made transit tile layer (tried ÖPNVKarte, abandoned):
       it's one opaque raster sheet, so overlaying it means replacing the
       basemap; and it colors by *transport mode* — eight metro lines all the
       same blue, with masses of bus routes mixed in.
     Drawing our own means lines use OSM's colour tag, i.e. the official
     colors, one per line. */
  const TRANSIT_SRC = "transit-lines", STATION_SRC = "transit-stations";
  const T_LAYERS = ["transit-line", "transit-line-label", "transit-station", "transit-station-label"];
  /* Opacity must move all four layers together; miss one and it shows: dim
     the lines but not the station labels and at full transparency the lines
     are nearly gone while the labels remain a black mass — worse than not
     adjusting at all. A circle's fill and stroke are two properties; a
     symbol's text-opacity covers the halo too. */
  const T_OPACITY = {
    "transit-line":          ["line-opacity"],
    "transit-line-label":    ["text-opacity"],
    "transit-station":       ["circle-opacity", "circle-stroke-opacity"],
    "transit-station-label": ["text-opacity"],
  };
  /* The lines' own baseline is 0.9 (see line-opacity in addTransit); the
     slider multiplies onto the baseline rather than assigning directly —
     otherwise full-right would be more solid than the default and no longer
     match "how it originally looks". */
  const T_OPACITY_BASE = { "transit-line": 0.9 };

  function applyTransitOpacity(){
    if(st.engine !== "maplibre" || !st.map) return;
    for(const id of T_LAYERS){
      if(!st.map.getLayer(id)) continue;
      const v = st.opacity * (T_OPACITY_BASE[id] ?? 1);
      for(const prop of T_OPACITY[id]) st.map.setPaintProperty(id, prop, v);
    }
  }

  const hasTransit = () => !!(TRANSIT && (TRANSIT.lines?.features || []).length);

  /* Font names must come from the current style, never hardcoded.
     Measured: graybeard's glyph service accepts "noto_sans_bold" while
     positron accepts "Noto Sans Bold" — hardcode either and switching to the
     other basemap renders zero labels; MapLibre fails silently on missing
     fonts, the layer looking fine with no text. */
  function pickFont(map, bold){
    const fonts = [];
    for(const l of map.getStyle().layers){
      const f = (l.layout || {})["text-font"];
      if(Array.isArray(f)) for(const x of f) if(typeof x === "string" && !fonts.includes(x)) fonts.push(x);
    }
    const want = bold ? /bold/i : /regular|book|normal/i;
    return [fonts.find(f => want.test(f)) || fonts[0] || "Noto Sans Regular"];
  }

  function addTransit(){
    if(!hasTransit() || st.engine !== "maplibre" || !st.map) return;
    const m = st.map;
    const FONT_B = pickFont(m, true), FONT_R = pickFont(m, false);
    if(!m.getSource(TRANSIT_SRC)) m.addSource(TRANSIT_SRC, { type:"geojson", data:TRANSIT.lines });
    if(!m.getSource(STATION_SRC)) m.addSource(STATION_SRC, { type:"geojson", data:TRANSIT.stations || { type:"FeatureCollection", features:[] } });

    if(!m.getLayer("transit-line")) m.addLayer({
      id:"transit-line", type:"line", source:TRANSIT_SRC,
      layout:{ "line-cap":"round", "line-join":"round" },
      paint:{
        "line-color":["get","colour"],
        "line-width":["interpolate",["linear"],["zoom"], 9,1.6, 12,2.8, 15,4.6, 17,6.5],
        "line-opacity":0.9,
      },
    });
    // Line numbers repeat along the line. symbol-placement:line makes the
    // text follow the geometry — exactly how a paper metro map is read:
    // follow one color and always know which line you're on.
    if(!m.getLayer("transit-line-label")) m.addLayer({
      id:"transit-line-label", type:"symbol", source:TRANSIT_SRC, minzoom:11,
      layout:{
        "symbol-placement":"line", "symbol-spacing":190,
        "text-field":["get","ref"], "text-size":11, "text-font":FONT_B,
        "text-allow-overlap":false, "text-padding":3,
      },
      paint:{ "text-color":["get","colour"], "text-halo-color":MI().halo, "text-halo-width":1.8 },
    });
    if(!m.getLayer("transit-station")) m.addLayer({
      id:"transit-station", type:"circle", source:STATION_SRC, minzoom:12,
      paint:{
        "circle-radius":["interpolate",["linear"],["zoom"], 12,1.8, 15,3.4, 17,4.6],
        "circle-color":MI().station, "circle-stroke-color":MI().stationEdge, "circle-stroke-width":1.2,
      },
    });
    // Station names appear only from z13 — 129 stations turn to mush when
    // zoomed out
    if(!m.getLayer("transit-station-label")) m.addLayer({
      id:"transit-station-label", type:"symbol", source:STATION_SRC, minzoom:13,
      layout:{
        // coalesce alone won't do — it treats "" as a valid value. The data
        // may have been hand-edited, so test length > 0 here; enrich.py has
        // also stopped writing empty strings.
        "text-field":["case",
          [">", ["length", ["coalesce", ["get","name_zh"], ""]], 0], ["get","name_zh"],
          ["get","name"]],
        "text-size":["interpolate",["linear"],["zoom"], 13,9.5, 16,12],
        "text-font":FONT_R, "text-offset":[0,0.95],
        "text-anchor":"top", "text-optional":true, "text-padding":2,
      },
      paint:{ "text-color":MI().stationLabel, "text-halo-color":MI().halo, "text-halo-width":1.6 },
    });
    setTransitVisible(st.transit);
    applyTransitOpacity();   // switching basemaps re-adds all layers; opacity must be reapplied
  }

  function setTransitVisible(on){
    st.transit = !!on;
    const btn = $("#transit-btn");
    if(btn) btn.setAttribute("aria-pressed", String(st.transit));
    $("#map-legend").hidden = !st.transit;
    if(st.engine !== "maplibre" || !st.map) return;
    for(const id of T_LAYERS){
      if(st.map.getLayer(id)) st.map.setLayoutProperty(id, "visibility", st.transit ? "visible" : "none");
    }
  }

  /* Ink for line-number chips. Line colors are OSM's official palette, out
     of our control — Osaka's Nagahori Tsurumi-ryokuchi line is #A9CC51, and
     white on it measures 1.8:1. Same criterion as DAY_COLORS: pick black or
     white by WCAG relative luminance, with 0.179 exactly the "white text
     reaches 4.5:1" threshold. Unparseable values fall back to white (the CSS
     default). */
  function lineInk(colour){
    const m = /^#?([0-9a-f]{6})$/i.exec(String(colour || "").trim());
    if(!m) return "#fff";
    const [r, g, b] = [0, 2, 4].map(i => {
      const v = parseInt(m[1].slice(i, i + 2), 16) / 255;
      return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
    });
    return (.2126 * r + .7152 * g + .0722 * b) > .179 ? "#1a1a1a" : "#fff";
  }

  function paintLegend(){
    if(!hasTransit()) return;
    const feats = [...TRANSIT.lines.features].sort((a, b) =>
      String(a.properties.ref).localeCompare(String(b.properties.ref), "en"));
    const guessed = feats.filter(f => f.properties.guessed);
    const chip = p => `<span class="lg-ref" style="background:${esc(p.colour)};color:${lineInk(p.colour)}" `
                    + `title="${esc(p.name || p.ref)}">${esc(p.ref)}</span>`;
    $("#map-legend").innerHTML =
      `<button class="bare lg-toggle" type="button" aria-expanded="${st.legendOpen ? "true" : "false"}">`
    + `<span class="lg-chips">${feats.map(f => chip(f.properties)).join("")}</span>`
    + `<span class="lg-hint">${st.legendOpen ? T.legendCollapse : (feats.length > 0 ? T.legendExpand : "")}</span>`
    + `</button>`
    /* The slider stays visible, not tucked in the expandable area: fading the
       transit layer is for seeing your own markers and routes — precisely
       when the legend is collapsed and the map is in full view. Hidden away,
       every use becomes "expand → adjust → collapse". It must live outside
       .lg-toggle — a slider inside a button gets its drag swallowed as a
       click. */
    /* Direction: left = more transparent, right = opaque, defaulting to full
       right (identical to life before the slider). The floor is 0.15, not
       0 — fully transparent is "turn the transit layer off", which the
       Transit button already does; offering it again on the slider would
       just look like a broken layer. */
    + `<div class="lg-op">`
    + `<span>${T.transitOpacity}</span>`
    + `<input type="range" min="0.15" max="1" step="0.05" value="${st.opacity}" `
    + `aria-label="${esc(T.transitOpacityAria)}">`
    + `</div>`
    + `<div class="lg-list">`
    + feats.map(f => {
        const p = f.properties, nm = p.name || p.ref;
        return `<div class="lg-row">${chip(p)}<span class="lg-nm" title="${esc(nm)}">${esc(nm)}</span></div>`;
      }).join("")
    /* List the line numbers directly. The old footnote said "N lines lack an
       official colour in OSM; auto-assigned" — after reading it you knew how
       many but still had to guess which, and "why auto-assigned" helps a map
       reader not at all. With the numbers listed, one glance shows which
       colors not to trust. */
    + (guessed.length
        ? `<div class="lg-foot">${T.legendGuessed}`
          + guessed.map(f => chip(f.properties)).join("") + `</div>`
        : `<div class="lg-foot">${T.legendOfficial}</div>`)
    + `</div>`;
  }

  /* ═══════════════ Route lines ═══════════════
     Connect each day's points in array order, in that day's color. Detours
     become visible at a glance — a zigzag like "Nakanoshima → Nanko → Umeda
     → Tempozan" is invisible in a list and instantly jarring as a line. This
     is the handle for "schedule, look, adjust".

     Lodging is threaded in too: a day departs from the hotel and returns to
     it — that's the real route. Points without coordinates are skipped
     (connecting through them drags the line to null island). A place
     appearing twice in one day folds the line back to it — correct, since
     you really do go back. */
  const ROUTE_SRC = "route-src";
  const R_LAYERS = [...DAY_DASH.map((_, i) => "route-line-" + i), "route-dir"];

  function routeData(){
    const feats = [];
    for(const d of ITIN){
      const pts = (d.places || [])
        .map(e => BY_ID[e && e.id])
        .filter(p => geo(p))
        .map(p => [p.coord.lon, p.coord.lat]);
      if(pts.length < 2) continue;      // one point can't form a line
      const colour = dayColor(d.n);
      feats.push({ type:"Feature",
        // No selection (curDay null) = no focus: every line is "current",
        // i.e. full strength. Selecting a day is what dims the rest.
        properties:{ n:d.n, colour, arrow:arrowId(colour), cur:(st.curDay == null || d.n === st.curDay) ? 1 : 0 },
        geometry:{ type:"LineString", coordinates:pts } });
    }
    return { type:"FeatureCollection", features:feats };
  }

  function addRoute(){
    if(st.engine !== "maplibre" || !st.map) return;
    const m = st.map;
    // Register images first, then source and layers — reversed, the first
    // frame shows no arrows at all
    let fresh = false;
    for(const d of ITIN) fresh = ensureArrow(m, dayColor(d.n)) || fresh;
    if(!m.getSource(ROUTE_SRC)) m.addSource(ROUTE_SRC, { type:"geojson", data:routeData() });

    /* One line layer per dash pattern rather than one for all days.
       line-dasharray is the one paint property here that cannot be
       data-driven — MapLibre takes no ["get", …] for it — so the pattern has
       to come from the layer, and the day is selected with a filter instead.
       Six layers, not one per day: the filter matches on n modulo six, which
       is the same wrap dayColor/dayDash use, so a ten-day trip still adds no
       layers and colour and dash stay paired. Everything else is copied
       unchanged from the single layer this replaces. */
    for(let i = 0; i < DAY_DASH.length; i++){
      const id = "route-line-" + i;
      if(m.getLayer(id)) continue;
      m.addLayer({
        id, type:"line", source:ROUTE_SRC,
        // Double modulo, matching dayColor/dayDash: a "day 0 / arrival night"
        // exists, and nothing stops a future one going negative — a bare %
        // would return a negative index and the feature would match no layer
        // at all, i.e. silently draw no route.
        filter:["==",["%",["+",["%",["get","n"],DAY_DASH.length],DAY_DASH.length],DAY_DASH.length], i],
        layout:{ "line-cap":"round", "line-join":"round" },
        paint:{
          "line-color":["get","colour"],
          "line-width":["interpolate",["linear"],["zoom"], 10,2, 14,3.4, 17,4.6],
          // Non-current days drop to 30%, or several days on screen become a
          // tangle of noodles
          "line-opacity":["case",["==",["get","cur"],1], 0.85, 0.3],
          // dashed throughout: distinct from the transit layer's solid lines
          // — this is "my route", not "tracks". Which dash says which day.
          "line-dasharray":DAY_DASH[i],
        },
      });
    }

    // Direction arrows. Lines alone show whether you're detouring, not which
    // way you're going — and order is exactly what this step decides.
    //
    // Self-drawn icons, not the "▶" character: measured, that glyph simply
    // doesn't exist in the Noto Sans set we use, MapLibre silently doesn't
    // render it, and not one arrow appears (same root cause as the old emoji
    // trap — depending on glyphs we don't control). Canvas-drawn depends on
    // no font.
    if(!m.getLayer("route-dir")) m.addLayer({
      id:"route-dir", type:"symbol", source:ROUTE_SRC, minzoom:11,
      layout:{
        "symbol-placement":"line", "symbol-spacing":78,
        "icon-image":["get","arrow"],      // each line references its own day-colored image
        "icon-size":1,
        "icon-allow-overlap":false, "icon-rotation-alignment":"map",
        "icon-keep-upright":false, "icon-padding":2,
      },
      paint:{ "icon-opacity":["case",["==",["get","cur"],1], 0.95, 0.3] },
    });
    if(fresh) relayoutArrows(m);
  }

  /* Arrow icon: canvas draws a white-outlined triangle, **one registered per
     day color**. No SDF (SDF would allow icon-color tinting, but it needs a
     real distance field; faking it with a plain alpha mask hard-clips at the
     threshold with rough edges). There are at most a handful of day colors —
     one image per color is simpler and clearer.

     The sizing was miscalculated once: a 28px canvas at pixelRatio:2 is a
     14px image, then × icon-size for the final size — the earlier
     24px/2×0.5 came to 6px, nearly invisible on screen. Note setStyle wipes
     registered images, so every addRoute must re-confirm them. */
  const arrowId = colour => "route-arrow-" + colour.replace(/[^a-z0-9]/gi, "");

  /* Returns true when an image was genuinely newly registered — the caller
     uses it to decide whether to trigger a relayout. */
  function ensureArrow(m, colour){
    const id = arrowId(colour);
    if(m.hasImage && m.hasImage(id)) return false;
    const S = 28, c = document.createElement("canvas");
    c.width = c.height = S;
    const g = c.getContext("2d");
    g.beginPath();
    g.moveTo(S * 0.26, S * 0.14);
    g.lineTo(S * 0.82, S * 0.50);
    g.lineTo(S * 0.26, S * 0.86);
    g.closePath();
    g.lineJoin = "round";
    g.lineWidth = S * 0.22;
    g.strokeStyle = "rgba(255,255,255,.95)";   // white outline stays visible on dark basemaps too
    g.stroke();
    g.fillStyle = colour;
    g.fill();
    try{ m.addImage(id, g.getImageData(0, 0, S, S), { pixelRatio:2 }); }
    catch(e){ console.warn("failed to register the direction arrow:", e); return false; }
    return true;
  }

  /* After addImage, already-laid-out symbols don't relayout on their own —
     measured: the image registered one step later than the layer's layout
     and not a single arrow appeared until a layout property was re-set. So:
     whenever a new image was registered, re-set icon-image to its own value
     to force the relayout. */
  function relayoutArrows(m){
    if(m.getLayer("route-dir")) m.setLayoutProperty("route-dir", "icon-image", ["get", "arrow"]);
  }

  function refreshRoute(){
    if(st.engine !== "maplibre" || !st.map) return;
    let fresh = false;
    for(const d of ITIN) fresh = ensureArrow(st.map, dayColor(d.n)) || fresh;   // the day count may have changed
    const src = st.map.getSource(ROUTE_SRC);
    if(src && src.setData) src.setData(routeData());
    else addRoute();
    if(fresh) relayoutArrows(st.map);

    // The selected day's line must also win the layer stacking, matching its
    // markers' Z.focus — dimmed lines drawing over the focused one reads
    // wrong the same way dimmed dots covering focused dots did. Line layers
    // are split by dash pattern, and MapLibre's only cross-layer ordering is
    // moveLayer (line-sort-key sorts within one layer only). First restore
    // the base 0..11 order so repeated selections don't accumulate shuffles,
    // then lift the selected day's layer to the top, just under the arrows.
    const m = st.map;
    if(m.getLayer("route-dir")){
      for(let i = 0; i < DAY_DASH.length; i++)
        if(m.getLayer("route-line-" + i)) m.moveLayer("route-line-" + i, "route-dir");
      if(st.curDay != null){
        const i = ((st.curDay % DAY_DASH.length) + DAY_DASH.length) % DAY_DASH.length;
        if(m.getLayer("route-line-" + i)) m.moveLayer("route-line-" + i, "route-dir");
      }
    }
  }

  /* ---------- marker ---------- */
  /* ---------- The dots' two-layer encoding ----------
     Fill = which day, ring = yes/maybe/no, number = position within the day.
     The mental model "hollow = not scheduled, solid = scheduled" needs no
     teaching.

     No full cross-product of 3 choices × N days: that's 12+ point symbols,
     beyond what the eye can reliably tell apart. The two layers are made
     unequal — hue goes to the day (the only channel that clusters at a
     glance), choice retreats to the ring.

     All geometry is computed in JS; CSS handles only shape and transitions.
     Otherwise combinations like `.no:not(.placed)` scatter across two places
     and one edit forgets the other. */
  /* The lodging icon house() was hoisted to the top level — the guide view's
     checklist uses the same one, and two hand-drawn SVGs would eventually
     diverge. */
  const ICON = {
    up:   stroke("M8 12.5V4M4.2 7.8 8 4l3.8 3.8"),
    down: stroke("M8 3.5V12M4.2 8.2 8 12l3.8-3.8"),
    del:  stroke("M4.5 4.5l7 7M11.5 4.5l-7 7"),
  };

  /* Unscheduled dots are uniformly 14px. Yes/maybe used to be 22px, making
     "not yet decided" louder than "already scheduled into a day" — while what
     the map must surface at a glance is today's stops. Now only scheduled
     dots enlarge, so size itself signals "decided or not". */
  /* Only 1–6: markers need ordering among themselves but must all stay
     **below** the map overlays (basemap buttons, legend, zoom control,
     attribution). The first version used 60–500 and numbered dots covered the
     POI button — markers share a stacking context with those overlays. */
  // focus: dots on the *selected* day. With others dimmed to 30%, a covered
  // full-strength dot under a translucent pile reads worse than either alone
  // — the focused day must also win the stacking, not just the opacity.
  // Still below the hover/label boost (12) and the map overlays (18+).
  const Z = { focus: 9, placed: 6, lodging: 5, yes: 4, maybe: 3, none: 2, no: 1 };

  function dotSpec(p){
    const lod = isLodging(p);
    const days = daysOf(p.id);
    const placed = days.length > 0;
    const k = kind(p);
    return {
      lod, days, placed, k,
      // Scheduled dots grow to 26px: a 3px ring only separates green/amber/
      // gray at that size
      dim: lod ? 24 : placed ? 26 : 14,
      // An unscheduled "no" is a deliberately quiet dot; a 3px ring would
      // swallow it whole
      ring: (k === "no" && !placed && !lod) ? 1.5 : 3,
      // Downtown, dozens of dots overlap, and whatever sits at the bottom
      // effectively doesn't exist. Scheduled always on top, the rest ordered
      // yes > maybe > unrated > no.
      z: placed ? Z.placed : lod ? Z.lodging : (Z[k] ?? Z.none),
    };
  }

  function styleDot(el, p){
    const dot = el.querySelector("i");
    if(!dot) return;
    const s = dotSpec(p);

    dot.style.width = dot.style.height = s.dim + "px";
    dot.style.borderRadius = s.lod ? "7px" : "50%";
    // z-index goes on the outer marker element — MapLibre's DOM markers stack
    // by document order, so without it whoever was created first sits at the
    // bottom, with no relation to importance. Dots on the selected day take
    // Z.focus, above the whole ladder (see the dim note below the ring code).
    el.style.zIndex = (st.curDay != null && s.placed && s.days.includes(st.curDay)) ? Z.focus : s.z;

    // Fill.
    // Unscheduled uses MI().hollow, not var(--paper): markers are drawn on the
    // basemap, and the basemap's lightness is its own setting — a light map
    // under a dark page is a normal combination, and --paper at #16130f would
    // then produce a dark solid dot on it, the exact opposite of the intended
    // meaning. The sidebar's small dots are a different matter: they sit on a
    // card, a UI surface, where --paper is the right choice.
    if(s.lod){
      dot.style.background = MI().lodging;
    }else if(!s.placed){
      dot.style.background = MI().hollow;
    }else if(s.days.length === 1){
      dot.style.background = dayColor(s.days[0]);
    }else{
      // Multiple days: split into color wedges. Markers are DOM elements
      // rather than canvas symbols, so conic-gradient just works — the
      // practical advantage of DOM markers.
      const step = 100 / s.days.length;
      dot.style.background = "conic-gradient("
        + s.days.map((n, i) => `${dayColor(n)} ${i * step}% ${(i + 1) * step}%`).join(",") + ")";
    }

    // Ring. Two white bands, one on each side of the choice color, doing the
    // same job from opposite directions: the inner band (2px, scheduled dots
    // only) keeps the day fill from smearing into the ring — it is also what
    // freed DAY_COLORS to use the full hue wheel, green fill inside a green
    // ring included (see that comment) — and the outer halo (1.25px, every
    // ringed dot) keeps the ring's hue readable where it crosses parks and
    // water instead of blending into the basemap.
    //
    // Lodging gets no choice color: it has no yes/maybe/no semantics, and
    // since its choice is always null, applying them would scatter "unrated"
    // amber rings everywhere — purely misleading.
    const shadow = "0 1px 5px rgba(0,0,0,.34)";
    const halo = 1.25;
    if(s.lod){
      dot.style.boxShadow = `0 0 0 2px ${MI().ring}, ${shadow}`;
    }else{
      const c = COLOR[s.k];
      dot.style.boxShadow = s.placed
        ? `0 0 0 2px ${MI().ring}, 0 0 0 ${2 + s.ring}px ${c}, 0 0 0 ${2 + s.ring + halo}px ${MI().ring}, ${shadow}`
        : `0 0 0 ${s.ring}px ${c}, 0 0 0 ${s.ring + halo}px ${MI().ring}, ${shadow}`;
    }

    // Day focus: with a day selected, dots scheduled only on *other* days
    // fade to 15% — deliberately deeper than their route lines' 30%: markers
    // are DOM elements and always paint over the map canvas, so a dimmed dot
    // sitting on the focused day's line cannot be layered under it, it can
    // only be made transparent enough for the line to read through. The
    // selected day's stops stay full — and so does the unscheduled pool,
    // deliberately: the selected day is also the add-target, and the pool is
    // what it's composed from. Opacity goes on the inner dot so fill, rings
    // and number fade as one.
    dot.style.opacity = (st.curDay != null && s.placed && !s.days.includes(st.curDay)) ? ".15" : "";

    // The number appears only once scheduled into a day; lodging is never numbered
    if(s.lod){
      dot.innerHTML = house(13);
      dot.style.color = MI().onLodging;
    }else{
      const seq = firstSeq(p.id);
      dot.textContent = seq == null ? "" : String(seq);
      dot.style.color = "var(--on-day)";
      dot.style.fontSize = (seq == null ? 0 : 11) + "px";
    }
  }

  function markerEl(p){
    const el = document.createElement("div");
    // Assigning className directly is safe here: the element was just
    // created and hasn't been handed to MapLibre, whose .maplibregl-marker
    // class is only added by new Marker(). After that point, only classList
    // add/remove is allowed (see paintMarker).
    el.className = "mk " + kind(p) + (isStubP(p) ? " stub" : "");
    el.dataset.id = p.id;
    el.dataset.nm = p.name;
    // MapLibre stamps role="button" + aria-label="Map marker" onto marker
    // elements, so 47 places become 47 identically named buttons to a screen
    // reader. Set the real name here (Leaflet's outerHTML and the static
    // fallback use it directly); MapLibre overwrites it during addTo, so it
    // has to be set again there.
    el.setAttribute("aria-label", p.name);
    el.innerHTML = "<i></i>";
    styleDot(el, p);
    /* Clicking a map marker = see what it is. It was once "add to / remove
       from the current day", which felt wrong in practice: on a map you
       recognize a point by its position, and the first reaction after
       recognizing it is "what is this place?", not "schedule it for today" —
       the latter is a decision made *after* looking. Scheduling still runs
       through the pool column's dots, drag and drop, and the button at the
       bottom of the detail dialog. */
    el.onclick = e => { e.stopPropagation(); openDetail(p.id, el); };
    return el;
  }

  function addMarkers(){
    st.markers.forEach(m => m.remove && m.remove());
    st.markers.clear();
    pts().forEach((p, i) => {
      const el = markerEl(p);
      if(st.engine === "maplibre"){
        const m = new maplibregl.Marker({ element:el }).setLngLat([p.coord.lon, p.coord.lat]).addTo(st.map);
        el.setAttribute("aria-label", p.name);   // addTo overwrites it with "Map marker"; put it back
        st.markers.set(p.id, m);
      }else if(st.engine === "leaflet"){
        const m = L.marker([p.coord.lat, p.coord.lon],
          { icon: L.divIcon({ className:"", html:el.outerHTML, iconSize:[22,22] }) }).addTo(st.map);
        m.on("click", () => focus(p.id, true));
        st.markers.set(p.id, m);
      }
      applyVis(p, el);
    });
    if(st.engine === "static") renderStatic();
  }

  function applyVis(p, el){
    const on = shown(p);
    const node = st.engine === "maplibre" ? (st.markers.get(p.id)?.getElement?.() || el) : el;
    if(node) node.style.display = on ? "" : "none";
  }

  /* Only add and remove our own classes; never overwrite className wholesale.
     The trap we hit: `el.className = "mk " + kind(p)` also wipes MapLibre's
     own .maplibregl-marker (which carries position:absolute), dropping the
     marker into normal document flow, its position shoved off by the summed
     heights of every preceding marker — measured maximum drift 828px, with
     markers and basemap drifting apart on zoom. It presents as "click one
     point and suddenly every point jumps". */
  const MK_STATE = ["yes", "maybe", "no", "none"];

  function paintMarker(el, p){
    el.classList.remove(...MK_STATE, "on");
    el.classList.add(kind(p));
    if(st.focus === p.id) el.classList.add("on");
    styleDot(el, p);
    el.style.display = shown(p) ? "" : "none";
  }

  /* Focus has to survive refresh(). Both columns are repainted by assigning
     innerHTML, which destroys the button that was just pressed and drops
     focus to <body> — so ↑ ↓ × and the pool dot each ejected a keyboard user
     to the top of the document, and dragging is pointer-only, meaning these
     buttons are the *entire* keyboard path for scheduling. The list view hit
     this exact wall and solved it in place (see setChoice's note about
     re-Tabbing ~200 times); here the row order genuinely changes, so a full
     repaint is right and the focus has to be carried across it instead.
     Nothing is stolen: mark() returns null unless focus was already inside
     one of the two rebuilt columns. */
  function focusMark(){
    const el = document.activeElement;
    if(!el || el === document.body) return null;
    const item = el.closest && el.closest(".ditem");
    if(item) return { kind:"sched", card:item.dataset.card, day:item.dataset.day,
                      i:+item.dataset.i, op: el.classList.contains("dop") ? el.dataset.op : null };
    const mi = el.closest && el.closest(".mi");
    if(mi) return { kind:"pool", card:mi.dataset.card, pin: el.classList.contains("pin") };
    return null;
  }
  function focusRestore(m){
    if(!m) return;
    if(m.kind === "pool"){
      const row = [...$$(".mi")].find(r => r.dataset.card === m.card);
      const el = row && (m.pin ? row.querySelector(".pin") : row.querySelector(".t"));
      if(el) el.focus();
      return;
    }
    const rows = [...$$(`.ditem[data-day="${m.day}"]`)];
    if(!rows.length) return;
    /* Follow the row's identity first, not its index: after ↑ the item you
       moved is one slot higher, and holding ↑ should keep walking *it* up
       rather than sliding focus onto whatever took its old place. One place
       may sit in a day more than once, so among the copies take the one
       nearest to where it was. Falling back to the index covers ×, where the
       card is gone and the right landing spot is the row that moved up into
       the gap — which is what makes deleting several in a row work. */
    const same = rows.filter(r => r.dataset.card === m.card);
    const row = same.length
      ? same.reduce((a, b) => Math.abs(+b.dataset.i - m.i) < Math.abs(+a.dataset.i - m.i) ? b : a)
      : rows[Math.min(m.i, rows.length - 1)];
    const el = (m.op && row.querySelector(`.dop[data-op="${m.op}"]`)) || row.querySelector(".dnm");
    if(el) el.focus();
  }

  function refresh(){
    const fm = focusMark();
    renderDays();
    if(!st.ready){ focusRestore(fm); return; }
    pts().forEach(p => {
      const m = st.markers.get(p.id);
      const el = st.engine === "maplibre" ? m?.getElement?.() : null;
      if(el) paintMarker(el, p);
    });
    if(st.engine === "static") renderStatic();
    if(st.engine === "leaflet"){ addMarkers(); }
    renderSide();
    focusRestore(fm);
  }

  /* The sidebar's small dots follow the same semantics as map markers:
     fill = day, ring = choice, number = position within the day. Both places
     show the same data, and inconsistent rules would read as a bug. */
  function pinStyle(p){
    const s = dotSpec(p);
    const bg = s.lod ? "var(--lodging)"
             : !s.placed ? "var(--paper)"
             : s.days.length === 1 ? dayColor(s.days[0])
             : "conic-gradient(" + s.days.map((n, i) => {
                 const step = 100 / s.days.length;
                 return `${dayColor(n)} ${i * step}% ${(i + 1) * step}%`;
               }).join(",") + ")";
    const ring = s.lod ? "0 0 0 1.5px var(--card)"
               : s.placed ? `0 0 0 1.5px var(--card),0 0 0 3.5px ${COLOR[s.k]}`
               : `0 0 0 2px ${COLOR[s.k]}`;
    return `background:${bg};box-shadow:${ring}`;
  }
  function pinText(p){
    if(isLodging(p)) return house(11);
    const seq = firstSeq(p.id);
    return seq == null ? "" : String(seq);
  }

  /* ═══════════════ Schedule column ═══════════════
     Few days lay out flat (drag straight into any day); more days switch to
     date capsules with only the current day expanded. The threshold is 5: the
     column runs 600–700px tall, four or five places per day take 200–260px,
     so a flat layout starts scrolling by day three and past five days
     degenerates into an endlessly scrolling list. */
  const FLAT_MAX = 5;

  // All constructed at noon, so time zones can't shift the whole date a day
  // forward or back
  const parseISO = v => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ""));
    return m ? new Date(+m[1], +m[2] - 1, +m[3], 12) : null;
  };
  const toISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`
                   + `-${String(d.getDate()).padStart(2, "0")}`;
  const shiftISO = (v, k) => {
    const d = parseISO(v);
    if(!d) return null;
    d.setDate(d.getDate() + k);
    return toISO(d);
  };

  /* How many days to create and what date each one carries is already in
     trip.dates — making the user press a button to generate something we
     already know is pure ceremony. So the page builds them automatically:
     the user does nothing and finds ready empty containers on arrival.
     Stage-A AI must not pre-fill itinerary, or two places produce the same
     data and they will eventually disagree. */
  function autoItinerary(){
    if(ITIN.length) return false;
    const start = parseISO((TRIP.dates || {}).start);
    const end   = parseISO((TRIP.dates || {}).end);
    if(start && end && end >= start){
      let cur = start, n = 1;
      // label is never written into the data — it's display text computed
      // per UI language (see dayLabel); writing it to the file would bake one
      // particular language into the data.
      while(cur <= end && n <= 60){
        ITIN.push({ n, date:toISO(cur), places:[] });
        cur = new Date(cur); cur.setDate(cur.getDate() + 1); n++;
      }
    }else{
      // Dates missing or malformed: fall back to building by day count with
      // date left null. Closure validation is impossible then, but the
      // containers still work.
      const k = Math.max(1, Math.min(30, parseInt(TRIP.days, 10) || 1));
      for(let n = 1; n <= k; n++) ITIN.push({ n, date:null, places:[] });
    }
    DATA.itinerary = ITIN;
    buildSched();
    return true;
  }

  function addDay(where){
    if(where === "zero"){
      if(ITIN.some(d => d.n === 0)) return;
      const first = ITIN.find(d => d.date);
      ITIN.unshift({ n:0, date:first ? shiftISO(first.date, -1) : null, places:[] });
    }else{
      const maxN = ITIN.reduce((a, d) => Math.max(a, d.n), 0);
      const last = [...ITIN].reverse().find(d => d.date);
      ITIN.push({ n:maxN + 1, date:last ? shiftISO(last.date, 1) : null, places:[] });
    }
    st.curDay = where === "zero" ? 0 : ITIN[ITIN.length - 1].n;
    commit();
  }

  function removeDay(n){
    const i = ITIN.findIndex(d => d.n === n);
    if(i < 0) return;
    if((ITIN[i].places || []).length){ toast(T.removeDayBlocked); return; }
    ITIN.splice(i, 1);
    if(st.curDay === n) st.curDay = null;   // deleting the focused day drops focus, it doesn't move it
    commit();
  }

  const dayLabel = d => d.label || (d.n === 0 ? T.day0Label : tf("dayN", { n: d.n }));
  // Lodging isn't counted in "how many places" — it bookends every day, and
  // counting it would drain the number of meaning
  const dayCount = d => (d.places || []).filter(e => !isLodging(BY_ID[e.id])).length;

  function dayDateTxt(d){
    if(!d.date) return "";
    const t = new Date(d.date + "T12:00:00");   // noon, so time zones can't shift the date back a day
    return isNaN(t) ? d.date : `${d.date.slice(5)}(${wdName(t)})`;
  }

  /* An empty container shouldn't merely say "no places yet" — faced with an
     empty box, the user doesn't know what to do. And the current day and
     other days must say different things: clicking a dot only adds to the
     *current* day, so telling a non-current day to "click the dot" is wrong. */
  function emptyHint(d){
    return d.n === st.curDay ? T.emptyHintCur : T.emptyHintOther;
  }

  function dayBox(d){
    let seq = 0;
    const rows = (d.places || []).map((e, i) => {
      const p = BY_ID[e && e.id];
      if(!p) return "";
      const lod = isLodging(p);
      if(!lod) seq++;
      const note = (e.note || "").trim();
      /* The conflict mark is a span with a title, not a button: the row
         itself already opens the detail dialog, which carries the same
         reason in full — hover is the shortcut, the dialog is the path that
         also works on touch. It sits outside .dops so it never hides. */
      const conf = dayConflict(p, d.n);
      return `<div class="ditem${lod ? " lod" : ""}" data-card="${esc(p.id)}" data-day="${d.n}" data-i="${i}">
          <span class="n" style="background:${lod ? "var(--lodging)" : dayColor(d.n)}">${lod ? house(11) : seq}</span>
          <button class="bare dnm" type="button" title="${esc(p.name)}${note ? " — " + esc(note) : ""}">${esc(p.name)}</button>
          ${conf ? `<span class="conf" role="img" aria-label="${esc(conf)}">!</span>` : ""}
          <span class="dops">
            <button class="dop" data-op="up"   title="${esc(T.moveUp)}" aria-label="${esc(T.moveUp)}">${ICON.up}</button>
            <button class="dop" data-op="down" title="${esc(T.moveDown)}" aria-label="${esc(T.moveDown)}">${ICON.down}</button>
            <button class="dop" data-op="del"  title="${esc(T.removeFromDay)}" aria-label="${esc(T.removeFromDay)}">${ICON.del}</button>
          </span>
        </div>`;
    }).join("");
    return `<div class="dbox${d.n === st.curDay ? " cur" : ""}" data-day="${d.n}">
        <div class="dhead">
          <button class="bare dh-btn" type="button" aria-pressed="${d.n === st.curDay}"
            aria-label="${esc(tf("dayAria", { label: dayLabel(d), date: d.date ? ", " + dayDateTxt(d) : "", n: dayCount(d) }))}">
            <span class="swatch" style="background:${dayColor(d.n)}"></span>
            <b>${esc(dayLabel(d))}</b>
            <span class="sub">${esc(dayDateTxt(d))}${d.date ? " · " : ""}${esc(tf("nPlaces", { n: dayCount(d) }))}</span>
          </button>
          ${(d.places || []).length ? "" :
            `<button class="dop d-del-day" data-delday="${d.n}" title="${esc(T.deleteDay)}" aria-label="${esc(T.deleteDay)}">${ICON.del}</button>`}
        </div>
        <div class="dlist">${rows || `<div class="dempty">${emptyHint(d)}</div>`}</div>
      </div>`;
  }

  /* ═══════════════ Drag and drop ═══════════════
     Uses SortableJS (inlined, see assets/vendor/README.md). Hand-rolling this
     on Pointer Events means handling drag thresholds, touch-action on touch
     devices, placeholders, hit testing, edge auto-scroll, Escape to cancel
     and cross-container clones — precisely what the library provides.

     The pool column uses pull:"clone" + put:false: the original card stays in
     the pool after being dragged out, which is exactly our "don't remove,
     just gray out" semantics. What lands in the schedule is a copy, not a
     move.

     Every renderDays() rebuilds the DOM, so the instances must be rebuilt too
     or they stay bound to stale nodes. */
  const sortables = [];
  function wireSortable(){
    while(sortables.length){ try{ sortables.pop().destroy(); }catch(e){} }
    if(typeof Sortable === "undefined") return;   // without the library only ↑↓ remain — no capability lost

    const common = {
      // The drag tween explains "this item moved there", but it is itself a
      // movement animation
      animation: REDUCED.matches ? 0 : 130,
      // Cards must stay clickable too (open details / assign), and too small
      // a threshold misreads clicks as drags
      fallbackTolerance: 4,
      delayOnTouchOnly: true, delay: 140,
      scroll: true, scrollSensitivity: 60, scrollSpeed: 12,
      ghostClass: "drag-ghost", chosenClass: "drag-chosen", dragClass: "drag-active",
      filter: ".dop",           // ↑↓× are buttons; they shouldn't drag the whole row
      preventOnFilter: false,
    };

    // Pool column → out only, never in
    const pool = document.querySelector("#map-list");
    if(pool) sortables.push(new Sortable(pool, Object.assign({}, common, {
      group: { name: "trip", pull: "clone", put: false },
      sort: false,
      draggable: ".mi",
      onEnd(){ /* the drop is handled by the target container's onAdd */ },
    })));

    // Each day
    for(const list of document.querySelectorAll(".dlist")){
      sortables.push(new Sortable(list, Object.assign({}, common, {
        group: { name: "trip", pull: true, put: true },
        draggable: ".ditem",
        /* Both callbacks must defer the array mutation to the next tick.
           applyDrop → commit → renderDays rebuilds the whole column's
           innerHTML, while SortableJS keeps operating on the node it just
           moved after the callback returns — rebuild the DOM synchronously
           inside the callback and it reaches for a batch of elements that no
           longer exist. This is the classic "controlled list + drag library"
           trap: the library owns the DOM, we own the array, and since both
           want to be the source of truth, the library has to finish first. */
        onAdd(evt){
          const toBox = evt.to.closest(".dbox"), fromBox = evt.from.closest(".dbox");
          if(!toBox) return;
          const toDay = +toBox.dataset.day;
          const fromDay = fromBox ? +fromBox.dataset.day : null;
          const { oldIndex, newIndex, item } = evt;
          const id = item.dataset.card;
          item.remove();          // the array is the truth; withdraw the node the library inserted
          setTimeout(() => applyDrop({ fromDay, toDay, oldIndex, newIndex, id }), 0);
        },
        onUpdate(evt){
          const box = evt.to.closest(".dbox");
          if(!box) return;
          const dayN = +box.dataset.day;
          const { oldIndex, newIndex } = evt, id = evt.item.dataset.card;
          setTimeout(() => applyDrop({ fromDay: dayN, toDay: dayN, oldIndex, newIndex, id }), 0);
        },
      })));
    }
  }

  function renderDays(){
    const col = $("#day-col");
    if(!ITIN.length){
      // The normal flow never reaches here (autoItinerary builds from
      // trip.dates). Only a document missing both dates and days lands on
      // this fallback.
      col.innerHTML = `<div class="dc-head">${T.schedule}
          <button id="day-add" class="lnk" title="${esc(T.addDayTitle)}" aria-label="${esc(T.addDayTitle)}">+</button></div>`
        + (st.addOpen ? `<div class="addmenu"><button data-add="tail">${T.addFirst}</button></div>` : "")
        + `<div class="dempty">${T.noDatesMsg}</div>`;
      return;
    }
    // No day is forced anymore: null is a legal state meaning "no focus" —
    // everything renders at full strength. Only an orphaned selection (its
    // day was deleted) falls back, and it falls back to null, not to day 1.
    if(st.curDay != null && !ITIN.some(d => d.n === st.curDay)) st.curDay = null;
    if(st.flat == null) st.flat = ITIN.length <= FLAT_MAX;

    const caps = st.flat ? "" : `<div class="caps">` + ITIN.map(d => {
      const cur = d.n === st.curDay;
      // The count badge always wears the day's route color (inverted on the
      // selected tab, whose body already is that color) — with the tabs
      // collapsed this is the only place that says which color day 7 is.
      const cBadge = cur ? `background:var(--on-day);color:${dayColor(d.n)}`
                         : `background:${dayColor(d.n)};color:var(--on-day)`;
      return `<button data-day="${d.n}" aria-pressed="${cur}"
        style="${cur ? `background:${dayColor(d.n)};border-color:${dayColor(d.n)}` : ""}"
        >D${d.n}<span class="c" style="${cBadge}">${dayCount(d)}</span></button>`;
    }).join("") + `</div>`;

    col.innerHTML =
      `<div class="dc-head">${T.schedule}<span class="sp">${tf("nDays", { n: ITIN.length })}</span>
         <span class="dmode" role="group">
           <button data-dmode="one" aria-pressed="${!st.flat}">${T.modeOne}</button><button data-dmode="all" aria-pressed="${st.flat}">${T.modeAll}</button>
         </span>
         <button id="day-add" class="lnk" title="${esc(T.addDayTitle)}" aria-label="${esc(T.addDayTitle)}">+</button></div>`
      + (st.addOpen ? `<div class="addmenu">`
          + (ITIN.some(d => d.n === 0) ? "" :
             `<button data-add="zero">${T.addZero}</button>`)
          + `<button data-add="tail">${T.addTail}</button></div>` : "")
      + caps
      + (st.flat ? ITIN.map(dayBox).join("")
         : st.curDay != null ? ITIN.filter(d => d.n === st.curDay).map(dayBox).join("")
         : `<div class="dempty">${T.noCurHint}</div>`);
    wireSortable();
  }

  function setCurDay(n){
    st.curDay = n;
    // refresh(), not renderDays(): the selection now also dims markers (see
    // styleDot), so the dots must repaint along with the column.
    refresh();
    refreshRoute();   // the current day decides which line is solid and which drop to 30%
  }

  /* ═══════════════ Assign / remove / reorder ═══════════════
     Every mutation funnels through commit(): rebuild the index → repaint all
     three places (schedule column, pool column, markers) → stash. Miss any
     one and the UI stops matching the data. */
  function commit(){
    buildSched();     // sequence numbers and day colors are computed live; any array change rebuilds them
    refresh();        // repaint markers + pool column + schedule column
    refreshRoute();   // order changed, so the map's connecting lines must follow
    saveLocal();
    scheduleAuto();   // write back to places.json after 3 idle seconds
  }

  const curDayObj = () => ITIN.find(d => d.n === st.curDay) || null;

  /* Clicking a pool dot: not in the current day → add it; already there →
     remove it (removing the last occurrence when it appears several times in
     one day). Clicking the rest of the row still opens details — the state
     control and the content area each mind their own business. */
  /* The dot is a toggle, so it must announce both "is it pressed" and "what
     will pressing do". Both track the *current day*: the same dot means "add"
     on day 1 and may mean "remove" after switching to day 2 — a hardcoded
     label like "add to schedule" would be a lie. */
  const inCurDay = id => {
    const d = curDayObj();
    return !!d && (d.places || []).some(e => e && e.id === id);
  };
  function pinLabel(p){
    const d = curDayObj();
    if(!d) return tf(ITIN.length ? "pinSelectDay" : "pinNoSchedule", { name: p.name });
    return tf(inCurDay(p.id) ? "pinRemove" : "pinAdd", { day: dayLabel(d), name: p.name });
  }

  function toggleInCurDay(id){
    const d = curDayObj();
    // Two different absences: no days exist at all vs. days exist but none
    // is selected (the new null state) — each gets its own instruction.
    if(!d){ toast(ITIN.length ? T.selectDayToast : T.noScheduleToast); return; }
    d.places = d.places || [];
    const at = d.places.map(e => e.id).lastIndexOf(id);
    if(at >= 0){
      d.places.splice(at, 1);
    }else{
      d.places.push({ id });
    }
    commit();
  }

  function dayItemOp(dayN, idx, op){
    const d = ITIN.find(x => x.n === dayN);
    if(!d || !Array.isArray(d.places) || !d.places[idx]) return;
    if(op === "del"){
      d.places.splice(idx, 1);
    }else{
      const to = idx + (op === "up" ? -1 : 1);
      if(to < 0 || to >= d.places.length) return;
      const [it] = d.places.splice(idx, 1);
      d.places.splice(to, 0, it);
    }
    commit();
  }

  /* SortableJS's callbacks only give indices; moving the data back into the
     array is on us. from/to may be different days, or the drag may come from
     the pool column (a clone, with no source entry to delete). */
  function applyDrop({ fromDay, toDay, oldIndex, newIndex, id }){
    const to = ITIN.find(d => d.n === toDay);
    if(!to) return;
    to.places = to.places || [];
    if(fromDay == null){                       // from the pool column: a new entry
      to.places.splice(newIndex, 0, { id });
    }else{
      const from = ITIN.find(d => d.n === fromDay);
      if(!from || !from.places || !from.places[oldIndex]) return;
      const [it] = from.places.splice(oldIndex, 1);
      to.places.splice(newIndex, 0, it);
    }
    commit();
  }

  /* ---------- Sidebar ---------- */
  /* "No" sorts last rather than next to "maybe": this grouping exists for
     gap-checking (did every yes make it into the schedule?), and things
     already rejected shouldn't occupy the top of the view. */
  const CHOICE_ORDER = ["yes", "maybe", "none", "no"];

  function groupSide(list){
    const g = new Map();
    if(st.grp !== "choice"){
      list.forEach(p => {
        const k = p.area || T.otherArea;
        if(!g.has(k)) g.set(k, []);
        g.get(k).push(p);
      });
      return g;
    }
    // Create the empty buckets in fixed order first, then fill them —
    // creating buckets on first encounter would make the group order follow
    // the PLACES array, so one changed choice would reshuffle the sidebar's
    // whole section order. Lodging gets its own group at the top: it takes
    // part in none of the four ratings (see the note above shown), and being
    // the day's anchor it belongs at the top of the view while gap-checking.
    g.set(T.lodging, []);
    for(const c of CHOICE_ORDER) g.set(T[c], []);
    list.forEach(p => g.get(isLodging(p) ? T.lodging : T[kind(p)]).push(p));
    for(const [k, v] of g){
      if(!v.length){ g.delete(k); continue; }
      // Sort within a group by tier. Once the grouping dimension becomes the
      // rating itself, nothing else orders the group, and keeping PLACES'
      // original order would be effectively random.
      v.sort((a, b) => (TIER_ORDER[a.tier] ?? 9) - (TIER_ORDER[b.tier] ?? 9));
    }
    return g;
  }

  function renderSide(){
    const box = $("#map-list");
    const list = pts().filter(shown);
    box.innerHTML = [...groupSide(list).entries()].map(([area, ps]) =>
      `<div class="grp">${esc(area)} · ${ps.length}</div>` + ps.map(p =>
        `<div class="mi${st.focus === p.id ? " on" : ""}" data-card="${esc(p.id)}">
           <button class="bare pin" type="button" style="${pinStyle(p)}"
             aria-pressed="${inCurDay(p.id)}" aria-label="${esc(pinLabel(p))}">${pinText(p)}</button>
           <button class="bare t" type="button"><b>${esc(p.name)}</b><span class="sub">${metaLine(p)}</span></button>
         </div>`).join("")).join("") ||
      `<div class="empty-state" style="padding:34px 16px"><div>${T.sideEmpty}</div></div>`;
    wireSortable();
  }

  /* Meta compressed to one line: duration · price · at most one warning.
     The full ticket text used to be laid out here ("public areas free; the
     exhibition running during your trip… adults ¥3,000, students ¥1,500,
     children ¥500"), taking five or six lines per entry. Complete information
     lives in the detail dialog; this line only has to make the place
     recognizable and flag whether there's a catch. */
  function warnOf(p){
    // The hard conflict — scheduled on a day it's closed — belongs to a
    // (place, day) pair, not to the place, so it lives on the schedule row
