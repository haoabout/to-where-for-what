<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>滑牌抉择 · 原型</title>
<style>
/* Tokens lifted from assets/template-trip.html so the prototype reads as the
   same product. Near-black outlines, warm paper; the hard zero-blur shadow
   is reserved for hover/drag — resting elements lie flat. */
:root{
  --paper:#F4F4F0; --paper-2:#EFEAE4; --card:#FEFEFE;
  --ink:#0E0E0E; --ink-2:#333333; --ink-3:#545454;
  --line:#4A4A4A; --line-soft:#DDD8D2; --fill:#E7E2DB;
  --accent:#0E0E0E; --accent-soft:#FFEF85; --on-accent:#FEFEFE;
  --ok:#38733C; --danger:#BE2229; --warn:#955E00;
  --r-card:28px; --card-pad:12px;
  --hard:5px 6px 0 0 var(--line);
  --hard-sm:3px 4px 0 0 var(--line);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  overflow:hidden; touch-action:none;
  -webkit-user-select:none; user-select:none;
}

/* ---- header: progress ---- */
header{
  width:min(440px,92vw); padding:14px 4px 8px;
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
}
header h1{font-size:15px; font-weight:800; letter-spacing:.02em}
#counter{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
#bar{width:min(440px,92vw); height:4px; background:var(--fill); border-radius:2px; overflow:hidden}
#bar i{display:block; height:100%; width:100%; transform:scaleX(0); transform-origin:0 0; background:var(--ink); transition:transform .25s ease}

/* ---- three-column main: side piles flex, the deck never shrinks ---- */
#main{
  flex:1; width:100%; min-height:0;
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
}
#center{display:flex; flex-direction:column; align-items:center; gap:28px; padding:14px 0 6px}
#deck{position:relative; width:min(380px,88vw); height:clamp(320px, calc(100vh - 380px), 500px)}

.card{
  position:absolute; inset:0;
  background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-card);
  padding:var(--card-pad);
  display:flex; flex-direction:column; gap:10px;
  cursor:grab; will-change:transform;
}
@media (hover:hover){ .card[data-depth="0"]:hover{box-shadow:var(--hard)} }
.card.dragging{cursor:grabbing; transition:none !important; box-shadow:var(--hard)}
.card.settle{transition:transform .3s cubic-bezier(.2,.9,.3,1.15), box-shadow .3s ease}
.card.windup{transition:transform .13s ease-out}
.card.fly{transition:transform .42s cubic-bezier(.45,.05,.25,1); pointer-events:none; box-shadow:var(--hard)}
.card.flying{z-index:10}
.card[data-depth="1"],.card[data-depth="2"]{pointer-events:none}

.photo{
  flex:0 0 42%; border-radius:calc(var(--r-card) - var(--card-pad));
  background:var(--paper-2); border:1px solid var(--line-soft);
  overflow:hidden; position:relative;
}
.photo img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
.photo .cat{
  position:absolute; left:10px; top:10px; font-size:11px; font-weight:800;
  background:var(--accent-soft); color:var(--ink); border:1px solid var(--line);
  padding:3px 8px; border-radius:99px;
}
.body{flex:1; display:flex; flex-direction:column; gap:8px; padding:2px 6px 6px; min-height:0}
.name{font-size:19px; font-weight:800; line-height:1.25}
.name small{display:block; font-size:11.5px; font-weight:400; color:var(--ink-3); margin-top:2px}
.facts{font-size:12px; color:var(--ink-2); display:flex; gap:8px; flex-wrap:wrap}
.facts b{font-weight:700}
.pitch{
  font-size:13px; line-height:1.55; color:var(--ink-2);
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
}
.more{font-size:11.5px; color:var(--ink-3)}
.tags{margin-top:auto; display:flex; gap:6px; flex-wrap:wrap}
.tags span{
  font-size:11px; color:var(--ink-3); background:var(--paper);
  border:1px solid var(--line-soft); padding:2px 8px; border-radius:99px;
}

/* verdict stamps: they appear on the side the card is travelling towards. */
.stamp{
  position:absolute; top:26px; font-size:26px; font-weight:900; letter-spacing:.1em;
  padding:6px 14px; border:4px solid; border-radius:10px; opacity:0;
  background:var(--card); pointer-events:none; z-index:2;
}
.stamp.yes{right:20px; color:var(--ok); border-color:var(--ok); transform:rotate(14deg)}
.stamp.no{left:20px; color:var(--danger); border-color:var(--danger); transform:rotate(-14deg)}
.stamp.maybe{left:50%; top:auto; bottom:30px; transform:translateX(-50%) rotate(-4deg); color:var(--warn); border-color:var(--warn)}

/* ---- piles: loose scattered stacks; also legal fly-to / click targets ---- */
.dock{cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:transform .15s ease}
.dock.arm{transform:translateY(-5px)}
.dock .ptitle{
  font-size:12px; font-weight:800; white-space:nowrap;
  padding:4px 10px; border-radius:99px; border:1.5px solid transparent;
}
.dock .ptitle b{font-weight:400; color:var(--ink-3); font-variant-numeric:tabular-nums}
.dock.no .ptitle{color:var(--danger)}
.dock.maybe .ptitle{color:var(--warn)}
.dock.yes .ptitle{color:var(--ok)}
.pstack{position:relative; width:128px; height:92px}
.pstack .mini{
  position:absolute; inset:6px; border-radius:9px; overflow:hidden;
  background:var(--card); border:1px solid var(--line); padding:4px;
}
.pstack .mini img{width:100%; height:100%; object-fit:cover; display:block; border-radius:5px; background:var(--paper-2)}
.pstack .mini .mname{
  position:absolute; left:4px; right:4px; bottom:4px; font-size:9.5px; font-weight:700;
  color:#fff; background:rgba(14,14,14,.62); padding:2px 5px;
  border-radius:0 0 5px 5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pstack .mini.pop{animation:pop .3s ease}
@keyframes pop{0%{scale:1.12}100%{scale:1}}
.pstack.empty{border:1.5px dashed var(--line-soft); border-radius:12px}
@media (hover:hover){
  .dock:hover{transform:translateY(-3px)}
  .dock:hover .pstack .mini.top{box-shadow:var(--hard-sm)}
  .dock:hover .ptitle{border-color:var(--line); background:var(--card); box-shadow:2px 2px 0 0 var(--line)}
}
.side.no{justify-self:end; padding-right:26px}
.side.yes{justify-self:start; padding-left:26px}
/* the maybe pile sits under the deck and runs horizontal + smaller */
#maybeDock{flex-direction:row; gap:10px}
#maybeDock .pstack{width:104px; height:64px}
#maybeDock .pstack .mini{inset:4px}

/* stage 2: side stacks give way, title text remains as the fly target */
@media (max-width:920px){
  .pstack{width:96px; height:70px}
  #maybeDock .pstack{width:96px; height:58px}
}
@media (max-width:760px){
  /* the grid has no room left beside the deck: the side piles collapse to
     text chips floated above the deck's top corners instead */
  #main{display:block; position:relative; padding-top:38px}
  #center{margin:0 auto; width:fit-content}
  .side{position:absolute; top:4px; z-index:5}
  .side .pstack{display:none}
  .side .ptitle{border-color:var(--line); background:var(--card)}
  .side.no{left:10px; padding-right:0} .side.yes{right:10px; padding-left:0}
}

/* ---- action buttons with their keys printed right underneath ---- */
#actions{display:flex; gap:14px; padding:8px 0 12px; align-items:flex-start}
.act{display:flex; flex-direction:column; align-items:center; gap:5px}
.act button{
  width:42px; height:42px; border-radius:50%;
  border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  font-size:17px; cursor:pointer;
  transition:box-shadow .15s ease, transform .15s ease;
}
.act button.small{width:34px; height:34px; font-size:13px; color:var(--ink-3); margin-top:4px}
@media (hover:hover){ .act button:hover{box-shadow:var(--hard-sm); transform:translate(-1px,-2px)} }
.act button:active{transform:translate(1px,2px); box-shadow:none}
.act button:disabled{opacity:.35; cursor:default; box-shadow:none}
.act .no{color:var(--danger)} .act .maybe{color:var(--warn)} .act .yes{color:var(--ok)}
.act kbd{
  font-family:inherit; font-size:11px; color:var(--ink-3);
  background:var(--card); border:1px solid #C2BDB7; border-bottom-width:2px;
  border-radius:5px; padding:1px 7px;
}
@media (hover:none), (pointer:coarse){ .act kbd{display:none} }

/* ---- detail overlay ---- */
#detail{
  position:fixed; inset:0; z-index:20; display:none;
  background:rgba(14,14,14,.35); padding:4vh 16px;
  align-items:center; justify-content:center;
}
#detail.show{display:flex}
.dcard{
  width:min(520px,94vw); max-height:92vh; overflow:auto; touch-action:pan-y;
  background:var(--card); border:1.5px solid var(--line); border-radius:22px;
  box-shadow:6px 7px 0 0 var(--line); padding:16px; position:relative;
  display:flex; flex-direction:column; gap:12px;
  -webkit-user-select:text; user-select:text;
}
.dclose{
  position:absolute; right:12px; top:12px; z-index:2;
  width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer;
  border:1.5px solid var(--line); background:var(--card);
}
.dclose:active{transform:translate(1px,1px)}
.dphoto{height:220px; flex:none; border-radius:12px; overflow:hidden; background:var(--paper-2); border:1px solid var(--line-soft)}
.dphoto img{width:100%; height:100%; object-fit:cover; display:block}
.dcard h2{font-size:20px; line-height:1.3}
.dcard h2 small{display:block; font-size:12px; font-weight:400; color:var(--ink-3); margin-top:2px}
.dmeta{font-size:12.5px; line-height:1.7; color:var(--ink-2); border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); padding:8px 0}
.dmeta b{font-weight:700; margin-right:4px}
.dtext{font-size:13.5px; line-height:1.65; color:var(--ink-2)}
.dnote{font-size:12.5px; line-height:1.6; color:var(--ink-3); background:var(--paper); border:1px solid var(--line-soft); border-radius:10px; padding:8px 10px}
.dactions{display:flex; gap:10px; margin-top:2px}
.dactions button{
  flex:1; font-size:14px; font-weight:800; padding:11px 0; border-radius:12px; cursor:pointer;
  border:1.5px solid var(--line); background:var(--card);
  transition:box-shadow .15s ease;
}
@media (hover:hover){ .dactions button:hover{box-shadow:var(--hard-sm)} }
.dactions button:active{transform:translate(2px,2px); box-shadow:none}
.dactions .no{color:var(--danger)} .dactions .maybe{color:var(--warn)} .dactions .yes{color:var(--ok)}

/* ---- summary ---- */
#summary{display:none; flex:1; width:min(560px,92vw); overflow:auto; padding:10px 0 30px}
#summary.show{display:block}
#summary h2{font-size:18px; font-weight:800; margin:14px 0 10px}
.pile{background:var(--card); border:1.5px solid var(--line); border-radius:16px;
  padding:14px 16px; margin-bottom:14px}
.pile h3{font-size:14px; display:flex; gap:8px; align-items:center; margin-bottom:8px}
.pile ul{list-style:none; font-size:13px; color:var(--ink-2); line-height:1.9}
.pile.yes h3{color:var(--ok)} .pile.no h3{color:var(--danger)} .pile.maybe h3{color:var(--warn)}
#summary .row{display:flex; gap:10px; margin-top:6px}
#summary .row button{
  font-size:13px; font-weight:700; padding:9px 16px; border-radius:10px; cursor:pointer;
  border:1.5px solid var(--line); background:var(--card);
}
#summary .row button:active{transform:translate(1px,1px)}
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--accent); color:var(--on-accent); font-size:13px;
  padding:9px 18px; border-radius:99px; transition:transform .3s ease; z-index:30;
}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){
  .card.settle,.card.windup,.card.fly,.dock,#bar i,.act button{transition:none}
  .pstack .mini.pop{animation:none}
}
</style>
</head>
<body>
<header><h1>这次想去哪？</h1><span id="counter"></span></header>
<div id="bar"><i></i></div>

<div id="main">
  <div class="dock side no" data-pile="no" title="不想去 (←)">
    <div class="ptitle">✕ 不去 · <b>0</b></div>
    <div class="pstack empty"></div>
  </div>
  <div id="center">
    <div id="deck"></div>
    <div class="dock" id="maybeDock" data-pile="maybe" title="待定 (↓)">
      <div class="ptitle">〜 待定 · <b>0</b></div>
      <div class="pstack empty"></div>
    </div>
  </div>
  <div class="dock side yes" data-pile="yes" title="想去 (→)">
    <div class="ptitle">♥ 想去 · <b>0</b></div>
    <div class="pstack empty"></div>
  </div>
</div>

<div id="actions">
  <div class="act"><button class="undo small" title="撤销">↺</button><kbd>Z</kbd></div>
  <div class="act"><button class="no" title="不想去">✕</button><kbd>←</kbd></div>
  <div class="act"><button class="maybe" title="待定">〜</button><kbd>↓</kbd></div>
  <div class="act"><button class="yes" title="想去">♥</button><kbd>→</kbd></div>
  <div class="act"><button class="info small" title="详情">ⓘ</button><kbd>↵</kbd></div>
</div>

<div id="detail"><div class="dcard"></div></div>
<div id="summary"></div>
<div id="toast"></div>

<script>
'use strict';
let CAT = {};          // category id -> Chinese label, read from the data itself
let places = [], idx = 0, history = [];
const deck = document.getElementById('deck');
const summaryEl = document.getElementById('summary');
const detailEl = document.getElementById('detail');

/* Fallback so the file still demos when opened via file:// */
const SAMPLE = [
  {id:'a',name:'大阪府立中之岛图书馆',name_local:'大阪府立中之島図書館',category:'hidden',
   area:'中之岛',duration_min:40,ticket:'免费',pitch:'还在正常运作的公共图书馆，可以真的推门进去看书、在旋转楼梯拍照。',
   detail:'建于 1904 年，关西现存最完整的明治后期新巴洛克公共建筑之一。',
   tags:['近代建筑','免费','冷门'],images:[]},
  {id:'b',name:'大阪城天守阁',name_local:'大阪城天守閣',category:'landmark',
   area:'大阪城',duration_min:120,ticket:'600円',pitch:'丰臣秀吉的居城，关西最著名的地标之一。',
   tags:['地标','历史'],images:[]},
  {id:'c',name:'黑门市场',name_local:'黒門市場',category:'market',
   area:'日本桥',duration_min:60,ticket:'免费',pitch:'大阪的厨房，边走边吃的海鲜与和牛串。',
   tags:['美食','市集'],images:[]},
];
const SAMPLE_CAT = [{id:'hidden',label:'冷门秘境'},{id:'landmark',label:'地标经典'},{id:'market',label:'市场·商店街'}];

async function load(){
  try{
    const r = await fetch('../trips/2026-09-osaka-full/places.json');
    const data = await r.json();
    places = data.places;
    places.forEach(p => delete p.choice); // start every session from scratch
    (data.categories||[]).forEach(c => CAT[c.id] = c.label);
  }catch(e){
    places = SAMPLE;
    SAMPLE_CAT.forEach(c => CAT[c.id] = c.label);
  }
  render(); renderDocks();
}

function catLabel(p){ return CAT[p.category] || p.category || ''; }

/* Stable per-place scatter: the same card always lies at the same angle, so
   re-renders never make a pile twitch. */
function seed(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function scatter(p, maxDeg){
  const h = seed(p.id);
  return {
    rot: ((h%100)/100 - .5) * 2 * maxDeg,
    ox: (h>>2)%9 - 4,
    oy: (h>>4)%7 - 3,
  };
}

function cardEl(p, depth){
  const el = document.createElement('article');
  el.className = 'card'; el.dataset.depth = depth;
  const img = (p.images && p.images[0]) ? `<img src="${p.images[0].url}" alt="" loading="lazy">` : '';
  el.innerHTML = `
    <div class="stamp yes">想去</div>
    <div class="stamp no">不去</div>
    <div class="stamp maybe">待定</div>
    <div class="photo">${img}<span class="cat">${catLabel(p)}</span></div>
    <div class="body">
      <div class="name">${p.name}<small>${p.name_local||''}</small></div>
      <div class="facts"><b>${p.area||''}</b><span>约${p.duration_min}分钟</span><span>${p.ticket||''}</span></div>
      <div class="pitch">${p.pitch||''}</div>
      <div class="more">点击卡片看详情</div>
      <div class="tags">${(p.tags||[]).slice(0,4).map(t=>`<span>${t}</span>`).join('')}</div>
    </div>`;
  if(depth > 0){ // the loose pile look; the top card always lies straight
    const s = scatter(p, 4.5);
    el.style.transform = `translate(${s.ox}px,${s.oy + depth*7}px) rotate(${s.rot}deg)`;
  }
  return el;
}

/* Re-render the stack; cards mid-flight (.flying) are left alone so their
   animation continues over the new stack. */
function render(){
  deck.querySelectorAll('.card:not(.flying)').forEach(c=>c.remove());
  for(let d = Math.min(2, places.length-1-idx); d >= 0; d--){
    if(places[idx+d]) deck.appendChild(cardEl(places[idx+d], d));
  }
  const top = deck.querySelector('[data-depth="0"]');
  if(top) attachDrag(top);
  updateHud();
  if(idx >= places.length && places.length) showSummary();
}

function updateHud(){
  document.getElementById('counter').textContent = `${Math.min(idx+1,places.length)} / ${places.length}`;
  document.querySelector('#bar i').style.transform = `scaleX(${places.length ? idx/places.length : 0})`;
  document.querySelector('#actions .undo').disabled = history.length===0;
}

/* ---- piles ---- */
function renderDocks(popPile){
  ['yes','maybe','no'].forEach(k=>{
    const members = places.filter(p=>p.choice===k);
    const dock = document.querySelector(`.dock[data-pile="${k}"]`);
    dock.querySelector('.ptitle b').textContent = members.length;
    const stack = dock.querySelector('.pstack');
    const top3 = members.slice(-3);
    stack.classList.toggle('empty', top3.length===0);
    stack.innerHTML = top3.map((p,i)=>{
      const s = scatter(p, 8);
      const img = (p.images && p.images[0]) ? `<img src="${p.images[0].url}" alt="">` : '';
      return `<div class="mini ${i===top3.length-1?'top':''}"
        style="transform:translate(${s.ox}px,${s.oy}px) rotate(${s.rot}deg); z-index:${i}">
        ${img}<span class="mname">${p.name}</span></div>`;
    }).join('');
    if(popPile===k && top3.length){
      const m = stack.querySelector('.mini.top');
      m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop');
    }
  });
}

/* Where a card must fly to land on its pile, in deck-local translate terms.
   When a pile has collapsed to its text title, the title is the target. */
function dockTarget(choice, p){
  const dock = document.querySelector(`.dock[data-pile="${choice}"]`);
  const stack = dock.querySelector('.pstack');
  const visible = stack.offsetParent !== null && getComputedStyle(stack).display !== 'none';
  const dr = (visible ? stack : dock.querySelector('.ptitle')).getBoundingClientRect();
  const er = deck.getBoundingClientRect();
  return {
    dx: dr.left + dr.width/2 - (er.left + er.width/2),
    dy: dr.top + dr.height/2 - (er.top + er.height/2),
    s: Math.min(Math.max(dr.width / er.width, .09), .4),
    rot: visible ? scatter(p, 8).rot : 0,
  };
}

/* ---- drag (Pointer Events: one code path for mouse and touch) ---- */
const TH_X = 110, TH_Y = 100;
function armDock(pile){
  document.querySelectorAll('.dock').forEach(d=>
    d.classList.toggle('arm', d.dataset.pile===pile));
}
function attachDrag(el){
  let sx=0, sy=0, dx=0, dy=0, active=false, moved=0;
  el.addEventListener('pointerdown', e=>{
    active=true; moved=0; sx=e.clientX; sy=e.clientY;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging'); el.classList.remove('settle');
  });
  el.addEventListener('pointermove', e=>{
    if(!active) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    moved=Math.max(moved, Math.hypot(dx,dy));
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    el.querySelector('.stamp.yes').style.opacity   = Math.max(0, Math.min(1, dx/TH_X));
    el.querySelector('.stamp.no').style.opacity    = Math.max(0, Math.min(1,-dx/TH_X));
    el.querySelector('.stamp.maybe').style.opacity = Math.abs(dx)<60 ? Math.max(0,Math.min(1,dy/TH_Y)) : 0;
    armDock(dx>TH_X ? 'yes' : dx<-TH_X ? 'no' : (dy>TH_Y && Math.abs(dx)<60) ? 'maybe' : null);
  });
  el.addEventListener('pointerup', e=>{
    if(!active) return; active=false;
    el.classList.remove('dragging');
    armDock(null);
    if(dx > TH_X) commit('yes', true);
    else if(dx < -TH_X) commit('no', true);
    else if(dy > TH_Y && Math.abs(dx) < 60) commit('maybe', true);
    else if(moved < 8){ // a click, not a drag
      el.style.transform='';
      openDetail(places[idx]);
    }
    else{ // spring back
      el.classList.add('settle');
      el.style.transform='';
      el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);
    }
    dx=dy=0;
  });
}

/* One commit path for drag, keys and pile clicks, so the card always flies
   to its pile — and lands already lying at its final scattered angle. */
function commit(choice, fromDrag){
  const p = places[idx];
  if(!p || idx >= places.length) return;
  history.push({idx, choice});
  p.choice = choice;
  idx++;

  const el = deck.querySelector('[data-depth="0"]');
  if(!el){ render(); renderDocks(choice); return; }
  el.classList.add('flying');
  el.removeAttribute('data-depth');
  el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);
  el.querySelector('.stamp.'+choice).style.opacity = 1;

  const fly = ()=>{
    const t = dockTarget(choice, p);
    el.classList.remove('windup');
    el.classList.add('fly');
    el.style.transform = `translate(${t.dx}px,${t.dy}px) rotate(${t.rot}deg) scale(${t.s})`;
    setTimeout(()=>{ el.remove(); renderDocks(choice); }, 430);
  };

  if(fromDrag){
    fly();
  }else{
    const wind = {yes:'translate(70px,-8px) rotate(6deg)',
                  no:'translate(-70px,-8px) rotate(-6deg)',
                  maybe:'translate(0,64px)'}[choice];
    el.classList.add('windup');
    el.style.transform = wind;
    setTimeout(fly, 140);
  }
  render(); // next card becomes active while this one is in the air
}

function undo(){
  const last = history.pop();
  if(!last) return;
  idx = last.idx;
  delete places[idx].choice;
  closeDetail();
  summaryEl.classList.remove('show');
  document.getElementById('main').style.display='';
  document.getElementById('actions').style.display='';
  render(); renderDocks();
}

/* ---- buttons; the piles stay clickable too ---- */
document.querySelectorAll('.dock').forEach(d=>
  d.addEventListener('click', ()=>commit(d.dataset.pile, false)));
document.querySelector('#actions .undo').onclick  = undo;
document.querySelector('#actions .no').onclick    = ()=>commit('no', false);
document.querySelector('#actions .maybe').onclick = ()=>commit('maybe', false);
document.querySelector('#actions .yes').onclick   = ()=>commit('yes', false);
document.querySelector('#actions .info').onclick  = ()=>openDetail(places[idx]);

/* ---- detail overlay ---- */
function openDetail(p){
  if(!p) return;
  const img = (p.images && p.images[0]) ? `<img src="${p.images[0].url}" alt="">` : '';
  const meta = [
    p.area ? `<div><b>区域</b>${p.area} · 约${p.duration_min}分钟</div>` : '',
    p.ticket ? `<div><b>门票</b>${p.ticket}</div>` : '',
    p.hours ? `<div><b>开放</b>${p.hours}</div>` : '',
    p.closed ? `<div><b>休息</b>${p.closed}</div>` : '',
  ].join('');
  detailEl.querySelector('.dcard').innerHTML = `
    <button class="dclose" title="关闭 (Esc)">✕</button>
    ${img ? `<div class="dphoto">${img}</div>` : ''}
    <h2>${p.name}<small>${p.name_local||''}</small></h2>
    <div class="dmeta">${meta}</div>
    <p class="dtext">${p.pitch||''}</p>
    ${p.detail ? `<p class="dtext">${p.detail}</p>` : ''}
    ${p.photo_note ? `<div class="dnote">📷 ${p.photo_note}</div>` : ''}
    <div class="tags">${(p.tags||[]).map(t=>`<span>${t}</span>`).join('')}</div>
    <div class="dactions">
      <button class="no">✕ 不去</button>
      <button class="maybe">〜 待定</button>
      <button class="yes">♥ 想去</button>
    </div>`;
  detailEl.classList.add('show');
  detailEl.querySelector('.dclose').onclick = closeDetail;
  detailEl.querySelector('.dactions .no').onclick    = ()=>{ closeDetail(); commit('no', false); };
  detailEl.querySelector('.dactions .maybe').onclick = ()=>{ closeDetail(); commit('maybe', false); };
  detailEl.querySelector('.dactions .yes').onclick   = ()=>{ closeDetail(); commit('yes', false); };
}
function closeDetail(){ detailEl.classList.remove('show'); }
detailEl.addEventListener('click', e=>{ if(e.target===detailEl) closeDetail(); });

/* ---- keyboard: the primary desktop path. Decisions made with the detail
   open close it first, then the deck card animates to its pile. ---- */
addEventListener('keydown', e=>{
  if(e.repeat) return;
  const map = {ArrowRight:'yes', ArrowLeft:'no', ArrowDown:'maybe'};
  if(map[e.key]){ e.preventDefault(); closeDetail(); commit(map[e.key], false); }
  else if(e.key==='z' || e.key==='Z' || e.key==='Backspace'){ e.preventDefault(); undo(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(!detailEl.classList.contains('show')) openDetail(places[idx]); }
  else if(e.key==='Escape'){ closeDetail(); }
});

/* ---- summary ---- */
function showSummary(){
  document.getElementById('main').style.display='none';
  document.getElementById('actions').style.display='none';
  const piles = {yes:[], maybe:[], no:[]};
  places.forEach(p=>{ if(p.choice) piles[p.choice].push(p); });
  const label = {yes:'♥ 想去', maybe:'〜 待定', no:'✕ 不去'};
  summaryEl.innerHTML = '<h2>分完了！</h2>' +
    ['yes','maybe','no'].map(k=>`
      <div class="pile ${k}">
        <h3>${label[k]}<span style="color:var(--ink-3);font-weight:400">${piles[k].length}</span></h3>
        <ul>${piles[k].map(p=>`<li>${p.name} <span style="color:var(--ink-3)">· ${p.area||''}</span></li>`).join('')||'<li style="color:var(--ink-3)">（空）</li>'}</ul>
      </div>`).join('') +
    `<div class="row"><button id="copyBtn">复制结果 JSON</button><button id="againBtn">重来一遍</button></div>`;
  summaryEl.classList.add('show');
  document.getElementById('copyBtn').onclick = ()=>{
    const out = places.map(p=>({id:p.id, choice:p.choice||'maybe'}));
    navigator.clipboard.writeText(JSON.stringify(out,null,2)).then(()=>toast('已复制到剪贴板'));
  };
  document.getElementById('againBtn').onclick = ()=>{
    places.forEach(p=>delete p.choice); idx=0; history=[];
    summaryEl.classList.remove('show');
    document.getElementById('main').style.display='';
    document.getElementById('actions').style.display='';
    render(); renderDocks();
  };
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
load();
</script>
</body>
</html>
